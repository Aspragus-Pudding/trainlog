  go.style.marginTop='13px';
  if(day.slots.length) go.onclick=()=>{ startSession(day); PENDING=null; savePending(); }; else go.disabled=true;
  head.appendChild(go);
  if(day.slots.length){
    const pv=el('button','btn ghost wide','Preview workout');
    pv.style.marginTop='8px'; pv.onclick=()=>openWorkoutPreview(rawDay); head.appendChild(pv);
  }
  const wk=el('button','btn ghost wide','See the whole week');
  wk.style.marginTop='8px'; wk.onclick=openWeekPreview; head.appendChild(wk);
  const alt=el('button','btn ghost wide','Train a different day');
  alt.style.marginTop='8px';
  alt.onclick=()=>{
    sheet(`<h2 style="font-size:20px;margin-bottom:13px">Pick a session</h2><div class="stack" id="pk2"></div>`);
    generatedDays().forEach(d=>{ const b=el('button','btn wide',
      `${esc(d.name)} <span class="dim tiny">· ${d.slots.length} exercises</span>`);
      b.onclick=()=>{$('#dlg').close(); startSession(d);}; $('#pk2').appendChild(b); });
  };
  head.appendChild(alt);
  v.appendChild(head);

  const lab=el('div','row between'); lab.style.cssText='padding:4px 4px 2px';
  lab.innerHTML=`<span class="muted tiny">Planned work${day.edited?' · edited':''}</span>`;
  if(day.edited){
    const rs=el('button','btn s','Reset');
    rs.onclick=()=>{ PENDING=null; savePending(); render(); toast('Back to the generated plan'); };
    lab.appendChild(rs);
  }
  v.appendChild(lab);
  day.slots.forEach(slot=>v.appendChild(planCard(slot,'p')));
  v.appendChild(el('div','dim tiny','Loads come from your logged history. The check-in adjusts them if it needs to.'))
   .style.padding='4px 4px 10px';
  if(day.slots.some(sl=>nextPrescription(sl).lb==null)){
    const seed=el('button','btn ghost wide','Set starting estimates');
    seed.onclick=openEstimates; v.appendChild(seed);
  }

  const recent=LOG.filter(e=>e.type==='session_end').slice(-4).reverse();
  if(recent.length){
    const r=el('div','card pad'); r.appendChild(el('div','field','Recent'));
    recent.forEach(x=>r.appendChild(el('div','row between sm',
      `<span>${esc(x.day_name||'Session')}</span><span class="dim tiny">${new Date(x.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}${x.session_rpe?' · RPE '+x.session_rpe:''}</span>`)));
    v.appendChild(r);
  }
}

/* The full numbers behind the plan — warmup ramp, every working set,
   editing — one tap away from the lean pre-training screen rather than
   shown unconditionally every time that screen renders. */
function openWorkoutPreview(rawDay){
  const day=planFor(rawDay), p=currentPhase();
  let html=`<h2 style="font-size:20px;margin-bottom:2px">${esc(day.name)}</h2>
    <div class="muted tiny" style="margin-bottom:2px">${esc(p.label)} · ${day.slots.length} exercises · ${day.slots.reduce((a,s)=>a+s.sets,0)} working sets${day.slots.length?' · ~'+estSessionLength(day)+' min (estimate)':''}</div>
    <div class="dim tiny" style="margin-bottom:13px">Based on how things stand now — the check-in may adjust this.</div>`;
  if((CFG.dayOverrides||{})[rawDay.id]){
    html+=`<div class="qblock"><span class="dim tiny">This day has a saved preset. </span>
      <button class="btn s" id="wpreset">Reset to generated plan</button></div>`;
  }
  html+=`<div class="qblock">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="savePreset"${SAVE_TO_PRESET?' checked':''}>
        <span class="dim tiny">Also save changes below to my preset</span></label>
    </div>
    <div id="wpbody"></div>
    <button class="btn ghost wide" id="wpadd" style="margin-top:4px">Add an exercise</button>
    <div class="dim tiny" style="margin:10px 0">Loads come from your logged history. The check-in adjusts them if it needs to.</div>
    <button class="btn ghost wide" id="wpclose">Close</button>`;
  sheet(html);
  if($('#wpreset')) $('#wpreset').onclick=()=>{
    delete CFG.dayOverrides[rawDay.id]; saveCfg(); render(); openWorkoutPreview(rawDay); toast('Preset reset');
  };
  $('#savePreset').onchange=e=>{ SAVE_TO_PRESET=e.target.checked; };
  const body=$('#wpbody');
  day.slots.forEach((slot,i)=>{
    const ctl=el('div','row'); ctl.style.cssText='gap:6px;margin-top:8px;flex-wrap:wrap';
    const mk=(label,aria,fn)=>{ const b=el('button','btn s',label); b.setAttribute('aria-label',aria); b.onclick=fn; return b; };
    ctl.appendChild(mk('−','One set fewer',()=>{ editPlan(rawDay,d=>{ if(d.slots[i].sets>1) d.slots[i].sets--; }); openWorkoutPreview(rawDay); }));
    ctl.appendChild(mk('+','One set more',()=>{ editPlan(rawDay,d=>{ d.slots[i].sets++; }); openWorkoutPreview(rawDay); }));
    ctl.appendChild(mk('Swap','Swap exercise',()=>openPlanSwap(rawDay,i)));
    const rm=mk('✕','Remove exercise',()=>{ editPlan(rawDay,d=>{ d.slots.splice(i,1); }); openWorkoutPreview(rawDay); });
    rm.style.color='var(--skip)'; ctl.appendChild(rm);
    body.appendChild(planCard(slot,'w',ctl));
  });
  $('#wpadd').onclick=()=>openPlanAdd(rawDay);
  $('#wpclose').onclick=()=>{ $('#dlg').close(); render(); };
}

/* Stated starting maxes, so the first session isn't a row of dashes.
   Logged as their own event type — never as fake sets. */
function openEstimates(){
  const ids=[...new Set((CFG.goals||[]).concat(
    generatedDays().flatMap(d=>d.slots.map(s=>s.ex))))].filter(id=>exById[id]);
  const vals={};
  sheet(`<h2 style="font-size:21px;margin-bottom:3px">Starting estimates</h2>
    <div class="muted tiny" style="margin-bottom:15px">Roughly what you could do for one all-out rep today. Skip anything you're unsure of — the app will learn it from your first few sessions either way.</div>
    <div id="es"></div>
    <div class="row" style="gap:8px">
      <button class="btn ghost grow" id="esskip">Done</button>
      <button class="btn pri grow" id="essave">Save</button></div>`);
  const host=$('#es');
  ids.forEach(id=>{
    const ex=exById[id], cur=bestE1RM(id);
    let val=cur?Math.round(Math.max(0,cur.v-bwOffset(ex))):(isBW(ex)?0:100);
    vals[id]=null;
    const blk=el('div','qblock');
    blk.innerHTML=`<div class="qlab">${esc(ex.name)}</div>`;
    const h=el('div','');
    const drawS=()=>{ h.innerHTML=''; h.appendChild(stepper(
      isBW(ex)?'added lb':'lb', val, ex.inc, nv=>{val=Math.max(0,nv);vals[id]=val;drawS();})); };
    drawS(); blk.appendChild(h);
    if(cur&&!cur.stated) blk.appendChild(el('div','anchor',`Already estimated at ${fmt(cur.v,0)} lb from your logs`));
    host.appendChild(blk);
  });
  $('#esskip').onclick=()=>$('#dlg').close();
  $('#essave').onclick=()=>{
    let n=0;
    Object.entries(vals).forEach(([id,v])=>{ if(v!=null&&v>0){ append({type:'e1rm_estimate',exercise_id:id,lb:v}); n++; } });
    $('#dlg').close(); render(); toast(n?`${n} estimate${n>1?'s':''} saved`:'Nothing changed');
  };
}

/* Create an exercise. Two required fields; everything else has a sane default
   so this stays a 20-second job when a machine isn't in the list. */
/* Browse, search, inspect and manage the whole library. */
function openLibrary(){
  let q='', only=null;
  const draw=()=>{
    const list=EX.filter(e=>!q||e.name.toLowerCase().includes(q.toLowerCase())||e.pattern.includes(q.toLowerCase().replace(/ /g,'_')))
      .filter(e=>only==='custom'?e.custom:only==='rehab'?e.rehab:only==='flagged'?flagFor(e.id):true)
      .sort((a,b)=>a.pattern===b.pattern?a.name.localeCompare(b.name):a.pattern.localeCompare(b.pattern));
    sheet(`<h2 style="font-size:21px;margin-bottom:3px">Exercise library</h2>
      <div class="muted tiny" style="margin-bottom:11px">${EX.length} exercises · ${list.length} shown</div>
      <input type="text" id="lq" value="${esc(q)}" placeholder="Search name or movement pattern"
       style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit;margin-bottom:10px">
      <div class="chips" id="lf" style="margin-bottom:11px"></div>
      <div id="ll" style="max-height:46vh;overflow-y:auto"></div>
      <button class="btn pri wide" id="lnew" style="margin-top:11px">Add a custom exercise</button>
      <button class="btn ghost wide" id="lc" style="margin-top:8px">Close</button>`);
    $('#lq').oninput=e=>{ q=e.target.value; draw(); setTimeout(()=>{const n=$('#lq'); if(n) n.focus();},0); };
    [['All',null],['Mine','custom'],['Rehab','rehab'],['Flagged','flagged']].forEach(([label,k])=>{
      const c=el('button','chip',label); c.style.cssText='font-size:12.5px;padding:6px 11px';
      c.setAttribute('aria-pressed',only===k?'true':'false');
      c.onclick=()=>{ only=k; draw(); }; $('#lf').appendChild(c);
    });
    let lastPat=null;
    list.forEach(e=>{
      if(e.pattern!==lastPat){ lastPat=e.pattern;
        $('#ll').appendChild(el('div','srowlab',e.pattern.replace(/_/g,' '))); }
      const f=flagFor(e.id), b=el('button','row between sm');
      b.style.cssText='width:100%;text-align:left;padding:9px 2px;border-top:1px solid var(--line)';
      b.innerHTML=`<span class="grow"><div style="font-weight:600">${esc(e.name)}${
          f?`<span style="color:${f.level==='red'?'var(--danger)':'var(--warn)'}"> ${f.level==='red'?'▲':'●'}</span>`:''}</div>
        <div class="dim tiny">${esc(loadName(e.load))}${e.custom?' · yours':''}${e.rehab?' · rehab':''} · ${
          Object.entries(e.vol).filter(([,w])=>w>=1).map(([m])=>ML[m]||m).join(', ')||'support'}</div></span>
        <span class="dim">›</span>`;
      b.onclick=()=>{ $('#dlg').close(); openInfo(e.id); };
      $('#ll').appendChild(b);
    });
    if(!list.length) $('#ll').appendChild(el('div','empty','Nothing matches that.'));
    $('#lnew').onclick=()=>openCustomEx(()=>openLibrary());
    $('#lc').onclick=()=>$('#dlg').close();
  };
  draw();
}

/* Case-insensitive exact-name collision check, used as a plain warning on
   create/rename — never a block, per the app's flag-don't-refuse ethos. */
function exerciseNameTaken(name, excludeId){
  const n=name.trim().toLowerCase();
  return EX.some(e=>e.id!==excludeId&&e.name.trim().toLowerCase()===n);
}
/* How an exercise is loaded decides three things: whether the plate solver runs,
   whether its e1RM can be compared across equipment, and which progression
   model applies. Chosen explicitly rather than guessed. */
const LOADING_TYPES=[
  {load:'barbell',label:'Barbell',prog:'percentage',plate:true,comparable:true,inc:5,bar:45,
    hint:'Plate solver applies. Comparable across gyms.'},
  {load:'machine',label:'Plate-loaded machine',prog:'double',comparable:false,inc:10,
    hint:'Not comparable across machines — valid against itself only.'},
  {load:'stack',label:'Pin/stack machine',prog:'double',comparable:false,inc:10,
    hint:'Not comparable across machines — valid against itself only.'},
  {load:'cable',label:'Cable',prog:'double',comparable:false,inc:5,
    hint:'Not comparable — pulley ratios and stacks differ between stations.'},
  {load:'dumbbell',label:'Dumbbell',prog:'double',comparable:true,inc:5,
    hint:'Comparable across gyms.'},
  {load:'bodyweight',label:'Bodyweight',prog:'rep',comparable:true,inc:5,
    hint:'Progresses by reps. No added load.'},
  {load:'bodyweight_plus',label:'Bodyweight + added weight',prog:'double',comparable:true,inc:2.5,
    hint:'Log the weight you add, not the total. Estimated 1RM uses your latest logged bodyweight plus the added weight.'}
];
const loadingType=load=>LOADING_TYPES.find(t=>t.load===load)||LOADING_TYPES[1];
function openCustomEx(onCreate, editingEx){
  const st=editingEx?{name:editingEx.name,pattern:editingEx.pattern,load:editingEx.load,
      primary:Object.entries(editingEx.vol).find(([,w])=>w===1)?.[0]||'chest',
      secondary:Object.entries(editingEx.vol).filter(([,w])=>w<1).map(([m])=>m),
      inc:editingEx.inc,bar:editingEx.bar||0,unitPref:editingEx.unitPref||'both',unilateral:!!editingEx.unilateral}
    :{name:'',pattern:'horizontal_press',load:'machine',primary:'chest',  // horizontal_press = 'Chest press' in the picker above
      secondary:[],inc:10,bar:0,unitPref:'both',unilateral:false};
  /* Plain-English movement types, shown instead of raw pattern ids. Order
   roughly matches how someone would describe the exercise out loud. */
const MOVEMENT_TYPES=[
  {label:'Chest press (bench, machine press, push-up)', pattern:'horizontal_press'},
  {label:'Shoulder press (overhead, landmine)', pattern:'vertical_press'},
  {label:'Squat (any bar, machine, or bodyweight)', pattern:'squat'},
  {label:'Hip hinge / deadlift-style', pattern:'hinge'},
  {label:'Pull-down or pull-up (vertical pulling)', pattern:'vertical_pull'},
  {label:'Row or rear-delt fly (horizontal pulling)', pattern:'horizontal_pull'},
  {label:'Bicep curl', pattern:'elbow_flexion'},
  {label:'Tricep extension / pushdown', pattern:'elbow_extension'},
  {label:'Lateral raise (shoulder, arm out to the side)', pattern:'abduction'},
  {label:'Leg extension (knee, quad-focused)', pattern:'knee_extension'},
  {label:'Leg curl (hamstring-focused)', pattern:'knee_flexion'},
  {label:'Calf raise', pattern:'calf_raise'},
  {label:'Hip abduction (outer thigh machine)', pattern:'hip_abduction'},
  {label:'Hip adduction (inner thigh machine)', pattern:'hip_adduction'},
  {label:'Shrug', pattern:'shrug'},
  {label:'Ab / core', pattern:'trunk'},
  {label:'Wrist', pattern:'wrist'},
  {label:'Grip / carry', pattern:'grip'},
  {label:"Something else / not sure", pattern:'other'},
];
  sheet(`<h2 style="font-size:21px;margin-bottom:3px">${editingEx?'Edit exercise':'New exercise'}</h2>
    <div class="muted tiny" style="margin-bottom:15px">Saved to your library permanently and included in every backup.</div>
    <div id="cx"></div>
    <div class="row" style="gap:8px">
      <button class="btn ghost grow" id="cxcancel">Cancel</button>
      <button class="btn pri grow" id="cxsave">${editingEx?'Save changes':'Add to library'}</button></div>`);
  const host=$('#cx');
  const draw=()=>{
    host.innerHTML='';
    const nm=el('div','qblock');
    nm.innerHTML=`<div class="qlab">Name</div>
      <input type="text" id="cxn" value="${esc(st.name)}" placeholder="e.g. Hammer Strength incline press"
       style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit">
      <div class="tiny" id="cxdupe" style="color:var(--warn);margin-top:5px"></div>`;
    host.appendChild(nm);
    const dupe=()=>{ $('#cxdupe').textContent=
      (st.name.trim()&&exerciseNameTaken(st.name,editingEx?editingEx.id:null))
        ?'An exercise named "'+st.name.trim()+'" already exists.':''; };
    $('#cxn').oninput=e=>{st.name=e.target.value; dupe();};
    dupe();

    const mk=(label,opts,cur,set,fmtL)=>{
      const b=el('div','qblock'); b.innerHTML=`<div class="qlab">${esc(label)}</div>`;
      const c=el('div','chips');
      opts.forEach(o=>{ const x=el('button','chip',esc(fmtL?fmtL(o):o));
        x.style.cssText='font-size:12.5px;padding:6px 10px';
        x.setAttribute('aria-pressed',cur===o?'true':'false');
        x.onclick=()=>{set(o);draw();}; c.appendChild(x); });
      b.appendChild(c); host.appendChild(b);
    };
    const mtBlock=el('div','qblock');
    mtBlock.innerHTML='<div class="qlab">What kind of movement is it?</div>';
    const mtc=el('div','chips');
    MOVEMENT_TYPES.forEach(mt=>{
      const c=el('button','chip',esc(mt.label)); c.style.cssText='font-size:12.5px;padding:6px 10px';
      c.setAttribute('aria-pressed',st.pattern===mt.pattern?'true':'false');
      c.onclick=()=>{ st.pattern=mt.pattern; draw(); };
      mtc.appendChild(c);
    });
    mtBlock.appendChild(mtc);
    if(st.pattern==='other') mtBlock.appendChild(el('div','anchor',
      "Fine to pick this — it just means the app won't be able to suggest swap alternatives for it later."));
    host.appendChild(mtBlock);

    mk('How is it loaded?',LOADING_TYPES.map(t=>t.load),st.load,v=>{
      const t=loadingType(v); st.load=v; st.inc=t.inc; st.bar=t.bar||0; },v=>loadingType(v).label);
    host.lastChild.appendChild(el('div','anchor',esc(loadingType(st.load).hint)));
    if(st.load==='machine'){
      const lab=el('label',''); lab.style.cssText='display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:8px';
      lab.innerHTML='<input type="checkbox"'+(st.unilateral?' checked':'')+'><span class="sm">Loads one arm or side at a time</span>';
      lab.querySelector('input').onchange=e=>{ st.unilateral=e.target.checked; };
      host.lastChild.appendChild(lab);
      host.lastChild.appendChild(el('div','anchor','Shows a plate diagram — plates per side, or per arm if this is ticked. Never a total: empty machines differ.'));
    }
    mk('Main muscle',MUSCLE_ORDER,st.primary,v=>{ st.primary=v; st.secondary=st.secondary.filter(m=>m!==v); },v=>ML[v]);

    const sec=el('div','qblock');
    sec.innerHTML='<div class="qlab">Also works <span class="dim tiny" style="font-weight:400">· counts at half a set</span></div>';
    const sc=el('div','chips');
    MUSCLE_ORDER.filter(m=>m!==st.primary).forEach(m=>{
      const on=st.secondary.includes(m);
      const x=el('button','chip',esc(ML[m])); x.style.cssText='font-size:12.5px;padding:6px 10px';
      x.setAttribute('aria-pressed',on?'true':'false');
      x.onclick=()=>{ st.secondary=on?st.secondary.filter(y=>y!==m):st.secondary.concat(m); draw(); };
      sc.appendChild(x);
    });
    sec.appendChild(sc); host.appendChild(sec);

    const nums=el('div','qblock');
    nums.innerHTML='<div class="qlab">Smallest jump'+(st.load==='barbell'?' and bar weight':'')+'</div>';
    const nh=el('div',''); nh.style.cssText='display:grid;grid-template-columns:minmax(0,1fr)'+(st.load==='barbell'?' minmax(0,1fr)':'')+';gap:8px';
    nh.appendChild(stepper('increment lb',st.inc,2.5,v=>{st.inc=Math.max(1,v);draw();}));
    if(st.load==='barbell') nh.appendChild(stepper('bar lb',st.bar,5,v=>{st.bar=Math.max(0,v);draw();}));
    nums.appendChild(nh); host.appendChild(nums);

    mk('Display in',['lb','kg','both'],st.unitPref,v=>st.unitPref=v);
  };
  draw();
  $('#cxcancel').onclick=()=>$('#dlg').close();
  $('#cxsave').onclick=()=>{
    const name=(st.name||'').trim();
    if(name.length<2){ toast('Give it a name first'); return; }
    const vol={[st.primary]:1}; st.secondary.forEach(m=>vol[m]=0.5);
    if(editingEx){
      const lt=loadingType(st.load);
      Object.assign(editingEx,{name,pattern:st.pattern,load:st.load,bar:st.bar||0,
        plateSet:lt.plate?'main_lb':null,inc:st.inc,prog:lt.prog,
        comparable:lt.comparable,unitPref:st.unitPref,vol,
        plateLoaded:st.load==='machine',unilateral:st.load==='machine'&&!!st.unilateral});
      CFG.customEx=(CFG.customEx||[]).map(c=>c.id===editingEx.id?editingEx:c); saveCfg();
      $('#dlg').close(); toast(name+' updated');
      if(onCreate) onCreate(editingEx); else render();
      return;
    }
    const id='cx_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,28)+'_'+Math.random().toString(36).slice(2,5);
    const lt=loadingType(st.load);
    const ex={id,name,pattern:st.pattern,load:st.load,bar:st.bar||0,
      plateSet:lt.plate?'main_lb':null,inc:st.inc,prog:lt.prog,
      comparable:lt.comparable,custom:true,unitPref:st.unitPref,vol,
      plateLoaded:st.load==='machine',unilateral:st.load==='machine'&&!!st.unilateral};
    CFG.customEx=(CFG.customEx||[]).concat(ex); saveCfg(); mergeCustom();
    $('#dlg').close(); toast(name+' added');
    if(onCreate) onCreate(ex); else render();
  };
}
/* Renaming works for any exercise, built-in or custom — built-ins never
   persist their own object, so the new name lives in CFG.nameOverrides and
   is reapplied at load (see applyNameOverrides()); ids never change, so
   EXERCISE_TIPS/FLAGS/split templates (all id-keyed) are unaffected. */
function openRenameEx(ex){
  sheet(`<h2 style="font-size:20px;margin-bottom:12px">Rename exercise</h2>
    <div class="qblock">
      <input type="text" id="rnn" value="${esc(ex.name)}"
       style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit">
      <div class="tiny" id="rndupe" style="color:var(--warn);margin-top:5px"></div>
    </div>
    <div class="row" style="gap:8px">
      <button class="btn ghost grow" id="rncancel">Cancel</button>
      <button class="btn pri grow" id="rnsave">Save</button></div>`);
  const inp=$('#rnn');
  const dupe=()=>{ $('#rndupe').textContent=
    (inp.value.trim()&&exerciseNameTaken(inp.value,ex.id))
      ?'An exercise named "'+inp.value.trim()+'" already exists.':''; };
  inp.oninput=dupe; dupe();
  setTimeout(()=>{ try{inp.focus(); inp.select();}catch{} },100);
  $('#rncancel').onclick=()=>$('#dlg').close();
  $('#rnsave').onclick=()=>{
    const name=inp.value.trim();
    if(name.length<2){ toast('Give it a name first'); return; }
    if(ex.custom){
      ex.name=name;
      CFG.customEx=(CFG.customEx||[]).map(c=>c.id===ex.id?{...c,name}:c);
    }else{
      CFG.nameOverrides=CFG.nameOverrides||{}; CFG.nameOverrides[ex.id]=name;
      ex.name=name;
    }
    saveCfg(); $('#dlg').close(); render(); toast('Renamed');
  };
}

/* Quick note capture. Notes are ordinary log events, so they export, sync and
   restore with everything else. Tagged by what you were doing when you wrote
   them, which is what makes them actionable later. */
const NOTE_TAGS=[
  {id:'bug',   label:'Something broke'},
  {id:'ux',    label:'Annoying / confusing'},
  {id:'idea',  label:'Idea'},
  {id:'train', label:'Training note'}
];
const TAB_LABEL={dash:'Dashboard',work:'Workout',lifts:'Lifts',hist:'Progress'};
function openNote(prefillTag){
  let tag=prefillTag||'bug';
  /* Auto-context is WHERE YOU WERE when you wrote this, which is not always
     what you're writing about. So it's shown plainly and can be detached —
     silently-wrong metadata is worse than none. */
  const exOpen=session?exById[session.slots[session.openIdx]?.ex]:null;
  const auto={
    screen: TAB_LABEL[TAB]||TAB,
    context: session?[session.dayName, exOpen?exOpen.name:null].filter(Boolean).join(' · '):null
  };
  let attach=true;
  const fb=!!(CFG.feedbackUrl||'').trim();
  sheet(`<h2 style="font-size:21px;margin-bottom:3px">Quick note</h2>
    <div class="muted tiny" style="margin-bottom:14px">Saved to your log${(CFG.syncUrl||'').trim()?' and your backup sheet':''}.${fb
      ?' Also sent to the person who gave you this app — just the note, its kind, the app version and the time'+(CFG.testerName?', signed '+esc(CFG.testerName):'')+'. Nothing from your training log.':''}</div>
    ${fb&&!CFG.testerName?'<div class="qblock"><div class="qlab">What should they call you?</div><input type="text" id="nname" placeholder="First name is fine" style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit"></div>':''}
    <div class="qblock"><div class="qlab">What kind?</div><div class="chips" id="ntag"></div></div>
    <div class="qblock">
      <textarea id="ntext" rows="4" placeholder="What happened? Be specific — what you tapped and what it did."
        style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit;font-size:15px;resize:vertical"></textarea>
    </div>
    <div class="qblock" id="nctx"></div>
    <div class="row" style="gap:8px">
      <button class="btn ghost grow" id="ncancel">Cancel</button>
      <button class="btn pri grow" id="nsave">Save note</button>
    </div>`);
  const drawCtx=()=>{
    const bits=[auto.screen+' tab', auto.context, 'v'+APP_VERSION].filter(Boolean);
    $('#nctx').innerHTML=`<div class="qlab">Attach where you are now?</div>
      <div class="muted sm" style="opacity:${attach?1:.4};line-height:1.5">${esc(bits.join(' · '))}</div>
      <div class="dim tiny" style="margin-top:6px">${attach
        ? 'Turn this off if the note is about something else.'
        : 'Only the app version will be saved.'}</div>`;
    const t=el('button','btn s',attach?'Don\'t attach':'Attach');
    t.style.marginTop='9px'; t.onclick=()=>{ attach=!attach; drawCtx(); };
    $('#nctx').appendChild(t);
  };
  drawCtx();
  NOTE_TAGS.forEach(t=>{
    const b=el('button','chip',t.label); b.style.cssText='font-size:12.5px;padding:6px 11px';
    b.setAttribute('aria-pressed',tag===t.id?'true':'false');
    b.onclick=()=>{ tag=t.id; openNoteRetag(tag); };
    $('#ntag').appendChild(b);
  });
  function openNoteRetag(t){
    $('#ntag').querySelectorAll('.chip').forEach((b,i)=>
      b.setAttribute('aria-pressed',NOTE_TAGS[i].id===t?'true':'false'));
  }
  const ta=$('#ntext');
  setTimeout(()=>{ try{ta.focus();}catch{} },100);
  $('#ncancel').onclick=()=>$('#dlg').close();
  $('#nsave').onclick=()=>{
    const v=(ta.value||'').trim();
    if(v.length<2){ toast('Write something first'); return; }
    const nm=$('#nname'); if(nm&&nm.value.trim()){ CFG.testerName=nm.value.trim().slice(0,40); saveCfg(); }
    const ev=append({type:'note', tag, text:v, app_version:APP_VERSION,
      context: attach?auto.context:null, screen: attach?auto.screen:null, resolved:false});
    $('#dlg').close(); render(); toast(ev&&fb?'Note saved and sent':'Note saved');
    if((CFG.syncUrl||'').trim()) syncNow(true);
    if(ev&&fb) sendFeedback(ev);
  };
}

/* Sends one note to the shared feedback sheet (CFG.feedbackUrl). Exactly
   these fields and nothing else — never context, never anything from the
   log. no-cors, so delivery can't be confirmed; the note is in the local
   log either way. */
function feedbackPayload(note){
  return {kind:'trainlog_feedback', name:CFG.testerName||'', tag:note.tag,
    text:note.text, app_version:note.app_version, ts:note.ts};
}
function sendFeedback(note){
  const url=(CFG.feedbackUrl||'').trim(); if(!url) return;
  fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(feedbackPayload(note))}).catch(()=>{});
}
/* The open feedback notes, oldest first — the ONE definition of "open". The
   Progress list and the copy-for-Claude-Code report both read this. They used
   to filter separately, and the list only showed the newest 8, so older open
   notes went into the copy without ever appearing on screen. */
function openFeedbackNotes(){
  const resolvedIds=new Set(LOG.filter(e=>e.type==='note_resolved').map(e=>e.target_id));
  return LOG.filter(e=>e.type==='note'&&!e.resolved&&!resolvedIds.has(e.id));
}
let NOTES_SHOW_ALL=false;
/* Everything still open, formatted for pasting straight into Claude Code. */
function notesReport(){
  const open=openFeedbackNotes();
  if(!open.length) return null;
  const byTag={};
  open.forEach(n=>{ (byTag[n.tag]=byTag[n.tag]||[]).push(n); });
  // a tag this build doesn't know still gets reported, never silently dropped
  const groups=NOTE_TAGS.map(t=>({id:t.id,label:t.label}))
    .concat(Object.keys(byTag).filter(k=>!NOTE_TAGS.some(t=>t.id===k)).map(k=>({id:k,label:k})));
  let out='Feedback from the last few sessions.\n\n';
  groups.forEach(t=>{
    const list=byTag[t.id]; if(!list||!list.length) return;
    out+=`## ${t.label}\n`;
    list.forEach(n=>{
      const d=new Date(n.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
      out+=`- ${n.text}`;
      const meta=[d, n.app_version?'v'+n.app_version:null,
        n.screen?n.screen+' tab':null, n.context||null].filter(Boolean).join(' · ');
      out+=`  (${meta})\n`;
    });
    out+='\n';
  });
  out+='Work through these. Plan first, ask if anything is ambiguous, syntax-check index.html, bump APP_VERSION, then commit and push.';
  return {text:out, count:open.length, ids:open.map(n=>n.id)};
}

    <div class="qblock" id="irr"></div>

    <div class="qblock"><div class="qlab">Progression</div>
      <div class="muted sm">${esc(mode)}</div>
      <div class="anchor">Smallest jump ${ex.inc} lb${ex.bar?` · bar ${ex.bar} lb`:''}</div></div>
    <div class="qblock"><div class="qlab">Your history</div>
      <div class="row between sm"><span class="muted">Best estimated 1RM</span><span>${b?fmt(b.v,0)+' lb':'—'}</span></div>
      <div class="row between sm"><span class="muted">Last logged</span><span>${last?`${fmt(last.weight.value)} ${last.weight.unit} × ${last.reps}`:'—'}</span></div>
      <div class="row between sm"><span class="muted">Sessions performed</span><span>${exposureCount(exId)}</span></div></div>
    <button class="btn ghost wide" id="irename" style="margin-bottom:8px">Rename</button>
    ${ex.custom?'<button class="btn ghost wide" id="iedit" style="margin-bottom:8px">Edit this custom exercise</button>':''}
    ${ex.custom?'<button class="btn ghost wide" id="idel" style="margin-bottom:8px;color:var(--skip)">Delete this custom exercise</button>':''}
    <button class="btn ghost wide" id="iclose">Close</button>`);
  $('#iclose').onclick=()=>$('#dlg').close();

    const i=EX.findIndex(e=>e.id===exId); if(i>-1) EX.splice(i,1); delete exById[exId];

/* The exercise's stored rep range — every future session, every slot. The
   per-session edit lives in the set panel and never touches this. */
function drawRepRangeEditor(host, ex){
  const saved=(CFG.repRanges||{})[ex.id]||ex.repRange, d=defaultRepRange(ex);
  const cur=saved||d.reps, why=saved?'set by you':d.src==='muscle'?(ML[d.muscle]||d.muscle).toLowerCase()+' default'+(d.capped?', capped for this machine\'s steps':''):'follows the '+d.block+' block';
  let lo=cur[0], hi=cur[1], editing=false;
  const draw=()=>{
    host.innerHTML=`<div class="qlab">Rep range · default for this exercise</div>
      <div class="row between sm"><span>${fmtRange(cur)} reps</span><span class="dim tiny">${esc(why)}</span></div>
      <div class="anchor">Used in every future session, including when it's your lead lift. To change it just for today, use the set panel during the session.</div>`;
    if(!editing){
      const b=el('button','btn s','Change default'); b.style.marginTop='8px';
      b.onclick=()=>{ editing=true; draw(); }; host.appendChild(b);
      if(saved){ const r=el('button','btn s','Reset to default'); r.style.cssText='margin:8px 0 0 6px';
        r.onclick=()=>{ delete CFG.repRanges[ex.id]; if(ex.custom&&ex.repRange){ delete ex.repRange; CFG.customEx=(CFG.customEx||[]).map(c=>c.id===ex.id?ex:c); }
          saveCfg(); render(); openInfo(ex.id); toast('Back to the default range'); };
        host.appendChild(r); }
      return;
    }
    const g=el('div',''); g.style.cssText='display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px';
    g.appendChild(stepper('lowest',lo,1,v=>{lo=Math.max(1,Math.min(v,hi));draw();}));
    g.appendChild(stepper('highest',hi,1,v=>{hi=Math.max(lo,Math.min(v,30));draw();}));
    host.appendChild(g);
    const sv=el('button','btn pri s','Save as this exercise\'s default'); sv.style.marginTop='8px';
    sv.onclick=()=>{ CFG.repRanges=CFG.repRanges||{}; CFG.repRanges[ex.id]=[lo,hi]; saveCfg(); render(); openInfo(ex.id); toast('Default range saved'); };
    host.appendChild(sv);
  };
  draw();
}
/* Swap: same movement pattern, ranked by your own ratings where you have
   at least 3, then unrated options, then one reserved wildcard. */
/* Rating snapshot for one exercise: mean stimulus once it has enough data to
   mean anything (the 3-rating floor matches the rest of the app). */
function ratingSnapshot(id){
  const rs=LOG.filter(x=>x.type==='exercise_rating'&&x.exercise_id===id);
  if(rs.length<3) return null;
  return { st: rs.reduce((a,r)=>a+r.stimulus,0)/rs.length,
           en: rs.reduce((a,r)=>a+r.enjoyment,0)/rs.length, n: rs.length };
}

/* Muscles in the order a lifter thinks about them — the picker's chips, the
   custom-exercise muscle lists and the block editor all use this one list. */
const MUSCLE_ORDER=['chest','upper_back','lats','lower_back','traps','front_delts','side_delts','rear_delts',
  'biceps','triceps','forearms','quads','hamstrings','glutes','calves','abs','abductors','adductors'];
/* Shared exercise picker: search box + category bar + create-new, used for
   swapping (mid-session and in the preview), adding an accessory, and
   choosing goal lifts — one implementation, so a fix here fixes it everywhere. */
function exPicker(title, filterFn, onPick){
  // muscle is the main way in — a chip lists every exercise that trains it
  // directly (counts a full set), so a deadlift shows under hamstrings, glutes
  // and lower back alike. Rehab and Yours cover what a
  // muscle can't. Rehab movements only appear when asked for — never by default.
  let q='', mus=null, grp=null;
  const draw=()=>{
    const base=EX.filter(filterFn);
    let list=base.filter(e=>grp==='rehab'?e.rehab:!e.rehab);
    if(grp==='custom') list=list.filter(e=>e.custom);
    if(mus) list=list.filter(e=>(e.vol||{})[mus]===1);
    if(q) list=list.filter(e=>e.name.toLowerCase().includes(q.toLowerCase())||e.pattern.includes(q.toLowerCase().replace(/ /g,'_')));
    if(q){
      list=list.sort((a,b)=>a.name.localeCompare(b.name));
    }else{
      // no search yet — surface what's worked for you before, same idea as
      // the substitution ranking: rated-and-liked first, then what you've
      // actually used, then everything else alphabetically
      list=list.sort((a,b)=>{
        const ra=ratingSnapshot(a.id), rb=ratingSnapshot(b.id);
        const sa = ra ? 100+ra.st*2+ra.en : exposureCount(a.id);
        const sb = rb ? 100+rb.st*2+rb.en : exposureCount(b.id);
        return sb-sa || a.name.localeCompare(b.name);
      });
    }
    const muscles=MUSCLE_ORDER.filter(m=>base.some(e=>!e.rehab&&(e.vol||{})[m]===1));

    sheet(`<h2 style="font-size:20px;margin-bottom:10px">${esc(title)}</h2>
      <div class="chips" id="exmus" style="margin-bottom:8px"></div>
      <div class="chips" id="excat" style="margin-bottom:10px"></div>
      <input type="text" id="exq" value="${esc(q)}" placeholder="Search by name or pattern"
       style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit;margin-bottom:10px">
      <div class="stack" id="exl" style="max-height:40vh;overflow-y:auto"></div>
      <button class="btn ghost wide" id="exnew" style="margin-top:10px">Create a new exercise</button>
      <button class="btn ghost wide" id="exc" style="margin-top:8px">Cancel</button>`);
    const inp=$('#exq'); inp.oninput=e=>{ q=e.target.value; draw(); setTimeout(()=>{const n=$('#exq'); if(n){n.focus();}},0); };

    const chip=(host,label,on,fn)=>{ const b=el('button','chip',esc(label)); b.style.cssText='font-size:12.5px;padding:6px 10px';
      b.setAttribute('aria-pressed',on?'true':'false'); b.onclick=fn; $(host).appendChild(b); };
    chip('#exmus','All',!mus&&!grp,()=>{mus=null;grp=null;draw();});
    muscles.forEach(m=>chip('#exmus',ML[m],mus===m,()=>{mus=mus===m?null:m;if(grp==='rehab')grp=null;draw();}));
    if(base.some(e=>e.rehab)) chip('#excat','Rehab',grp==='rehab',()=>{grp=grp==='rehab'?null:'rehab';mus=null;draw();});
    if(base.some(e=>e.custom)) chip('#excat','Yours',grp==='custom',()=>{grp=grp==='custom'?null:'custom';draw();});

    list.slice(0,60).forEach(e=>{
      const f=flagFor(e.id), rt=ratingSnapshot(e.id);
      const b=el('button','btn wide'); b.style.cssText='text-align:left';
      b.innerHTML=`<div>${esc(e.name)}${e.custom?' <span class="dim tiny">· custom</span>':''}${
        f?`<span style="color:${f.level==='red'?'var(--danger)':'var(--warn)'};font-size:12px"> ${f.level==='red'?'▲':'●'}</span>`:''}</div>
        <div class="dim tiny" style="font-weight:400">${esc(e.pattern.replace(/_/g,' '))} · ${esc(loadName(e.load))}${
          rt?` · stimulus ${rt.st.toFixed(1)}/5 across ${rt.n}`:''}${
          f?` · ${esc(f.why)}`:''}</div>`;
      b.onclick=()=>{ $('#dlg').close(); onPick(e); };
      $('#exl').appendChild(b);
    });
    if(!list.length) $('#exl').appendChild(el('div','empty','Nothing matches. Create one below.'));
    $('#exnew').onclick=()=>openCustomEx(ex=>{ $('#dlg').close(); onPick(ex); });
    $('#exc').onclick=()=>$('#dlg').close();
  };
  draw();
}

function entryPanel(slot,idx){
  const ex=exById[slot.ex], p=el('div',''); p.style.marginTop='11px';
  p.appendChild(el('div','hr'));
  if(!lastPerformance(slot.ex))
    p.appendChild(el('div','muted sm','First time on this lift — pick something you can hit for the target reps.'))
      .style.marginBottom='9px';
  p.appendChild(stepper('Weight',draft.weight,weightStep(draft.unit),
    v=>{draft.weight=v;draft.alt=null;draft.suggested=false;renderWork()},
    draft.unit,{wide:true,typeable:true,min:0,suggested:draft.suggested}));
  const g=el('div','stepgrid'); g.style.marginTop='8px';
  g.appendChild(stepper('Reps',draft.reps,1,v=>{draft.reps=v;draft.suggested=false;renderWork()},
    null,{typeable:true,min:1,max:100,suggested:draft.suggested}));
  g.appendChild(stepper('RPE',draft.rpe,.5,v=>{draft.rpe=v;renderWork()},
    null,{typeable:true,min:5,max:10}));
  p.appendChild(g);
  p.appendChild(sessionRangeEl(slot)).style.marginTop='4px';
  if(draft.suggested){
    p.appendChild(el('div','sugnote','Suggested — tap any value to change it.'));
    if(draft.why) p.appendChild(whyEl(draft.why,'e:'+slot.ex));
  }

  if(ex.load==='barbell'&&ex.plateSet){
    // use whichever plate set matches what's on screen, so the diagram works
    // in kg too rather than silently disappearing
    const setId = draft.unit==='kg' ? 'main_kg' : 'main_lb';
    const barIn = draft.unit==='kg' ? Math.round(ex.bar/LB*2)/2 : ex.bar;
    const sol=solvePlates(draft.weight,barIn,setId);
    p.appendChild(barSVG(sol));
    if(sol&&!sol.exact) p.appendChild(el('div','warnline',`Nearest loadable: ${fmt(sol.achieved)} ${draft.unit}`));
    p.appendChild(el('div','plates', sol&&sol.plates.length
      ?`${sol.plates.join(' + ')} per side · ${ex.bar} ${draft.unit} bar`
      :`Bar only · ${ex.bar} ${draft.unit}`));
  }
  if(ex.plateLoaded){
    // Plates only. The empty machine's own resistance varies by model and
    // isn't on the label, so no total is ever shown. Assumes the logged
    // weight is all the plates loaded (both sides together; one horn for a
    // single-arm machine).
    const setId=draft.unit==='kg'?'main_kg':'main_lb', side=ex.unilateral?'arm':'side';
    const per=ex.unilateral?draft.weight:draft.weight/2;
    const sol=solvePlates(per*2,0,setId);
    p.appendChild(barSVG(sol));
    if(sol&&!sol.exact) p.appendChild(el('div','warnline',`Closest your plates make: ${fmt(sol.achieved/2)} ${draft.unit} per ${side}`));
    p.appendChild(el('div','plates', sol&&sol.plates.length?`${sol.plates.join(' + ')} per ${side}`:'No plates'));
    p.appendChild(el('div','dim tiny','Plates only — the machine\'s own resistance isn\'t counted.'));
  }
  const est=e1rm((draft.unit==='kg'?draft.weight*LB:draft.weight)+bwOffset(ex),draft.reps);
  if(est){
    const c=conf(draft.reps), d=el('div','sm',
      `<span style="font-size:27px;font-weight:760;letter-spacing:-.03em">${fmt(est,0)}</span>
       <span class="muted tiny"> est. 1RM lb${ex.load==='bodyweight_plus'?(bwMissing(ex)?' · added weight only, no bodyweight logged':' · incl. bodyweight'):''}</span>${c!=='high'?`<span class="dim tiny"> · ${c} confidence at ${draft.reps} reps</span>`:''}`);
    d.style.margin='9px 0 2px'; p.appendChild(d);
  }
  // technique picker
  const tp=el('div','chips'); tp.style.margin='11px 0 0';
  Object.entries(TECHNIQUES).forEach(([k,t])=>{
    const c=el('button','chip',t.name);
    c.style.cssText='font-size:12.5px;padding:6px 11px';
    c.setAttribute('aria-pressed',draft.tech===k?'true':'false');
    c.onclick=()=>{ draft.tech=k; draft.group=null; renderWork(); };
    tp.appendChild(c);
  });
  p.appendChild(tp);

  const T=TECHNIQUES[draft.tech];
  if(draft.group&&T.extend){
    const g=slot.sets.filter(x=>x.group&&x.group.id===draft.group);
    const last=g[g.length-1];
    const b=el('button','btn pri wide',`+ ${T.extend} ${g.length} · ${draft.reps} reps`);
    b.style.marginTop='10px';
    b.onclick=()=>logSet(slot,idx,'straight',true);
    p.appendChild(b);
    const done=el('button','btn ghost wide','End the cluster');
    done.style.marginTop='7px';
    done.onclick=()=>{ draft.group=null; seedDraft(slot); renderWork(); };
    p.appendChild(done);
    return p;
  }

  // warmup ramp, only before the first working set
  if(!slot.sets.length){
    const ramp=warmupRamp(slot, draft.unit==='kg'?draft.weight*LB:draft.weight);
    if(ramp.length){
      const wu=el('div',''); wu.style.marginTop='11px';
      wu.appendChild(el('div','field','Suggested warmup'));
      ramp.forEach((r,i)=>{
        const b=el('button','row between sm');
        b.style.cssText='width:100%;text-align:left;padding:7px 0;border-top:1px solid var(--line)';
        b.innerHTML=`<span class="muted">${r.bar?'Bar':'Set '+(i+1)}</span>
          <span style="font-weight:600">${fmt(r.lb,0)} lb × ${r.reps}</span>`;
        b.onclick=()=>logSet(slot,idx,'warmup',false,{weight:r.lb,unit:'lb',reps:r.reps});
        wu.appendChild(b);
      });
      wu.appendChild(el('div','dim tiny','Tap one to log it. Skip them if you\'re already warm.'));
      p.appendChild(wu);
    }
  }

  const act=el('div','row'); act.style.marginTop='11px';
  const log=el('button','btn pri grow',T.extend?`Log top set`:'Log set');
  log.onclick=()=>logSet(slot,idx,'straight');
  const warm=el('button','btn s','Warmup'); warm.onclick=()=>logSet(slot,idx,'warmup');
  act.append(log,warm);
  // a custom exercise can pin its display to one unit; only offer the
  // toggle when it's actually free to switch
  if((ex.unitPref||'both')==='both'){
    const un=el('button','btn s',draft.unit);
    un.onclick=()=>{
      // remember the value we came from, so toggling back is lossless rather
      // than re-rounding and drifting a little further every time
      const from={w:draft.weight,u:draft.unit};
      if(draft.alt&&draft.alt.u!==draft.unit){ draft.weight=draft.alt.w; draft.unit=draft.alt.u; }
      else{
        draft.unit=draft.unit==='lb'?'kg':'lb';
        draft.weight=draft.unit==='kg'?Math.round(draft.weight/LB*2)/2:Math.round(draft.weight*LB/5)*5;
      }
      draft.alt=from; renderWork(); };
    act.append(un);
  }
  p.appendChild(act);

  if(slot.sets.length){
    const r=session.ratings[slot.ex];
    if(r){ const d=el('div','dim tiny',`Rated · stimulus ${r.stimulus}/5 · enjoyment ${r.enjoyment}/5`);
      d.style.marginTop='11px'; p.appendChild(d); }
    else { const b=el('button','btn s','Rate this exercise');
      b.style.marginTop='11px'; b.onclick=()=>openRating(slot.ex); p.appendChild(b); }
  }
  return p;
}

/* Target line in the set panel, with a this-session-only rep range edit.
   Changes the live session slot only — never CFG, never the exercise. */
const SESSION_RANGE_OPEN=new Set();
function sessionRangeEl(slot){
  const w=el('div','');
  const draw=()=>{
    w.innerHTML='';
    const row=el('div','row between');
    row.appendChild(el('span','dim tiny','Target '+fmtRange(slot.reps)+' reps @ RPE '+slot.rpe+(slot.repSrc==='session'?' · this session only':'')));
    const b=el('button','',SESSION_RANGE_OPEN.has(slot)?'Done':'Change range for today');
    b.style.cssText='font-size:12px;color:var(--dim);text-decoration:underline';
    b.onclick=()=>{ if(SESSION_RANGE_OPEN.has(slot)) SESSION_RANGE_OPEN.delete(slot); else SESSION_RANGE_OPEN.add(slot); draw(); };
    row.appendChild(b); w.appendChild(row);
    if(!SESSION_RANGE_OPEN.has(slot)) return;
    let lo=slot.reps[0], hi=slot.reps[1];
    const g=el('div',''); g.style.cssText='display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:6px';
    const commit=()=>{
      if(slot.repSrc!=='session'){ slot.repDefault={reps:slot.reps.slice(),src:slot.repSrc,muscle:slot.repMuscle,capped:slot.repCapped}; }
      slot.reps=[lo,hi]; slot.repSrc='session';
      saveSession(); seedDraft(slot); renderWork();
    };
    g.appendChild(stepper('lowest',lo,1,v=>{lo=Math.max(1,Math.min(v,hi));commit();}));
    g.appendChild(stepper('highest',hi,1,v=>{hi=Math.max(lo,Math.min(v,30));commit();}));
    w.appendChild(g);
    w.appendChild(el('div','dim tiny','For this session only. The exercise\'s default (its info sheet) is unchanged.')).style.marginTop='4px';
    if(slot.repSrc==='session'&&slot.repDefault){
      const r=el('button','btn s','Back to '+fmtRange(slot.repDefault.reps)); r.style.marginTop='6px';
      r.onclick=()=>{ const d=slot.repDefault; slot.reps=d.reps.slice(); slot.repSrc=d.src; slot.repMuscle=d.muscle; slot.repCapped=d.capped; delete slot.repDefault;
        saveSession(); seedDraft(slot); renderWork(); };
      w.appendChild(r);
    }
  };
  draw(); return w;
}
/* Edit a logged set. Never rewrites the original event — appends a

function openEditSet(slot,j){ openEditEvent(slot,slot.sets[j],'Set '+(j+1)); }
/* A warmup is a logged set like any other: same sheet, same correction events.
   It just isn't held in slot.sets, so it is re-read from the log on render. */
function openEditWarmup(slot,w){ openEditEvent(slot,w,'Warmup'); }
function openEditEvent(slot,orig,title){
  const st={weight:orig.weight.value, unit:orig.weight.unit, reps:orig.reps, rpe:orig.rpe??8};
  const isWarm=orig.set_kind==='warmup';
  sheet(`<h2 style="font-size:20px;margin-bottom:3px">${title}</h2>
    <div class="muted tiny" style="margin-bottom:15px">${esc(exById[slot.ex].name)} · logged ${new Date(orig.ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</div>
    <div id="ed"></div>
    <div class="row" style="gap:8px;margin-top:4px">
      <button class="btn ghost grow" id="edel">Delete set</button>
      <button class="btn pri grow" id="esave">Save changes</button>
    </div>
    <button class="btn ghost wide" id="ecancel" style="margin-top:8px">Cancel</button>`);

  const host=$('#ed');
  const draw=()=>{
    host.innerHTML='';
    // weight on its own row, reps/RPE beneath — the same layout as the set
    // panel. Three steppers across a phone-width sheet squeezed the numbers out.
    host.appendChild(stepper('Weight',st.weight,exById[slot.ex].inc,v=>{st.weight=Math.max(0,v);draw();},st.unit,{wide:true}));
    const g=el('div',isWarm?'':'stepgrid'); g.style.cssText='margin:8px 0 12px';
    g.appendChild(stepper('Reps',st.reps,1,v=>{st.reps=Math.max(1,v);draw();}));
    if(!isWarm) g.appendChild(stepper('RPE',st.rpe,.5,v=>{st.rpe=Math.min(10,Math.max(5,v));draw();}));
    host.appendChild(g);
    const est=e1rm(st.unit==='kg'?st.weight*LB:st.weight, st.reps);
    if(est&&!isWarm) host.appendChild(el('div','muted tiny',`Estimated 1RM ${fmt(est,0)} lb · ${conf(st.reps)} confidence`));
  };
  draw();

  $('#ecancel').onclick=()=>$('#dlg').close();
  $('#edel').onclick=()=>{
    // deleting a cluster's top set would orphan its extensions — void the group
    const grp=(orig.group&&orig.group.pos===0)
      ? slot.sets.filter(x=>x.group&&x.group.id===orig.group.id) : [orig];
    const msg=grp.length>1
      ? `Delete this set and its ${grp.length-1} extension${grp.length>2?'s':''}?`
      : isWarm?'Delete this warmup? It stays in the log as a voided entry.':'Delete this set? It stays in the log as a voided entry.';
    if(!confirm(msg)) return;
    grp.forEach(x=>append({type:'correction', target_id:x.id, patch:null, reason:'deleted in app'}));
    grp.forEach(x=>{ const k=slot.sets.indexOf(x); if(k>-1) slot.sets.splice(k,1); });
    saveSession();
    $('#dlg').close(); renderWork(); toast(grp.length>1?'Cluster deleted':isWarm?'Warmup deleted':'Set deleted');
  };
  $('#esave').onclick=()=>{
    const p={};
    if(st.weight!==orig.weight.value||st.unit!==orig.weight.unit) p.weight={value:st.weight,unit:st.unit};
    if(st.reps!==orig.reps) p.reps=st.reps;
    if(!isWarm&&st.rpe!==orig.rpe) p.rpe=st.rpe;
    if(!Object.keys(p).length){ $('#dlg').close(); return; }
    append({type:'correction', target_id:orig.id, patch:p, reason:'edited in app'});
    const k=slot.sets.indexOf(orig); if(k>-1) Object.assign(slot.sets[k], p);
    saveSession();
    $('#dlg').close(); renderWork(); toast(isWarm?'Warmup updated':'Set updated');
  };
}

/* Warmup ramp toward a working weight. Percentages are convention, not
   evidence — they're a starting point you can ignore. Ramps are longer when
   readiness is low, which is the one place the readiness score earns its keep. */
/* Ramp length tracks the actual readiness score continuously, not just the
   discrete load-adjustment tier. A score of 0.50 gets a longer ramp than 0.68
   even though neither necessarily triggered a load cut — the two questions
   ("how hard should I load today" and "how long should I warm up") don't need
   the same threshold, and warming up longer costs nothing. Joint-ladder level
   3+ on this pattern also extends the ramp, on top of readiness. */
function warmupRamp(slot, workingLb){
  const ex=exById[slot.ex];
  if(!workingLb||ex.load==='bodyweight'||isStackLike(ex)) return [];
  const score = session&&session.score!=null ? session.score : 0.7;
  const jointExtend = slot.joint&&slot.joint.level>=2;
  let steps;
  if(score<0.45 || jointExtend&&score<0.65)      steps=[[0.25,8],[0.40,6],[0.55,5],[0.70,3],[0.82,2]];
  else if(score<0.65 || jointExtend)             steps=[[0.35,6],[0.55,5],[0.70,3],[0.82,2]];
  else if(score<0.85)                            steps=[[0.40,5],[0.60,4],[0.80,2]];
  else                                            steps=[[0.50,4],[0.75,2]];   // feeling great — short and sufficient
  // Light loads don't need the full ramp, but a reduced-readiness day still
  // needs to actually be longer than normal — otherwise the readiness banner
  // promises an extended warmup this override quietly doesn't deliver.
  if(workingLb<95){
    const reduced=score<0.65||jointExtend;
    // A smaller shift when keeping a 3rd rung, so it doesn't collide with
    // the 0.85 cap the way a flat +0.15 would on these particular tables.
    steps=steps.slice(-(reduced?3:2)).map(([p,r])=>[Math.min(0.85,p+(reduced?0.10:0.15)),r]);
  }
  const out=[];
  if(ex.bar) out.push({lb:ex.bar, reps:8, bar:true});
  steps.forEach(([p,r])=>{
    const lb=loadable(slot, workingLb*p);
    if(lb&&(!out.length||lb>out[out.length-1].lb)) out.push({lb,reps:r});
  });
  return out;
}

/* opts: {wide, typeable, suggested, min, max} */
function stepper(label,val,inc,onChange,unit,opts){
  opts=opts||{};
  const s=el('div','step'+(opts.wide?' wide':'')+(opts.suggested?' suggested':''));
  const dn=el('button','','−'), up=el('button','','+');
  dn.setAttribute('aria-label','Decrease '+label); up.setAttribute('aria-label','Increase '+label);
  const clamp=v=>{
    v=Math.round(v*100)/100;
    if(opts.min!=null) v=Math.max(opts.min,v);
    if(opts.max!=null) v=Math.min(opts.max,v);
    return v;
  };
  const valBox=el('div','val');
  if(opts.typeable){
    // tap the number to type an exact value — the stepper is for nudging,
    // typing is for "I know it's 227.5"
    valBox.innerHTML=`<input class="numin" id="" type="number" inputmode="decimal" step="any"
      value="${fmt(val)}" aria-label="${esc(label)}"><div class="lab">${esc(label)}${unit?' ('+unit+')':''}</div>`;
    const inp=valBox.querySelector('input');
    inp.onfocus=()=>{ try{inp.select();}catch{} };
    const commit=()=>{ const n=parseFloat(inp.value);
      if(!isNaN(n)) onChange(clamp(n)); else inp.value=fmt(val); };
    inp.onblur=commit;
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } };
  }else{
    valBox.innerHTML=`<div class="num">${fmt(val)}</div><div class="lab">${esc(label)}${unit?' ('+unit+')':''}</div>`;
  }
  s.append(dn, valBox, up);
  dn.onclick=()=>onChange(clamp(val-inc));
  up.onclick=()=>onChange(clamp(val+inc));
  return s;
}
function barSVG(sol){
  const W=520,H=70,mid=H/2; let x=150,parts='';
  if(sol) for(const p of sol.plates){
    const h=13+(p/45)*45, w=Math.max(6,5+p/6);
    parts+=`<rect x="${x}" y="${mid-h/2}" width="${w-1.5}" height="${h}" rx="2" fill="var(--steel)" opacity="${.5+(p/45)*.5}"/>`;
    x+=w;
  }
  const b=el('div','');
  b.innerHTML=`<svg class="bar" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet" aria-hidden="true">
    <rect x="8" y="${mid-3}" width="${Math.max(x+40,200)}" height="6" rx="3" fill="var(--line)"/>
    <rect x="140" y="${mid-9}" width="9" height="18" rx="2" fill="var(--dim)"/>
    ${parts}<rect x="${x+2}" y="${mid-10}" width="7" height="20" rx="2" fill="var(--dim)"/></svg>`;
  return b;
}

function startSession(day){
  session={id:ulid(),dayId:day.id,dayName:day.name,soreGroups:soreGroupsFor(day),
    prep:buildPrep(day,null).map(m=>({...m,done:false})),readiness:null,
    openIdx:0,ratings:{},adj:null,score:null,
    slots:day.slots.map(s=>({...s,sets_target:s.sets,sets:[]}))};
  session.startedAt=Date.now(); saveSession(); seedDraft(session.slots[0]); openCheckin();
}
/* Plain-language account of how a prescribed number was reached: the block,
   where the load came from, and each adjustment that actually applied. */
const BLOCK_NAME={hyp:'hypertrophy',str:'strength',peak:'peak',deload:'deload'};
const fmtRange=r=>r[0]===r[1]?String(r[0]):r[0]+'–'+r[1];
function explainRx(slot, pr, o){
  o=o||{};
  const p=currentPhase(), bn=BLOCK_NAME[p.type]||p.type;
  const parts=[], detail=[];
  // 1. which block, and where the rep range came from
  if(slot.repSrc==='muscle'){
    const mn=(ML[slot.repMuscle]||slot.repMuscle).toLowerCase();
    parts.push(fmtRange(slot.reps)+' reps · '+mn+' default');
    detail.push('Rep range '+fmtRange(slot.reps)+' is a default for '+mn+' work, not the '+bn+" block's range. It is a judgement default (Grade D) — practical, not an evidence claim."
      +(slot.repCapped?' Capped at '+COARSE_REP_CAP+' because this machine steps in '+(exById[slot.ex].inc)+' lb jumps.':''));
  }else if(slot.repSrc==='session'){
    parts.push(fmtRange(slot.reps)+' reps · changed for this session');
    detail.push('Rep range '+fmtRange(slot.reps)+' was changed for this session only'+(slot.repDefault?' (default '+fmtRange(slot.repDefault.reps)+')':'')+'. The exercise\'s default is unchanged.');
  }else if(slot.repSrc==='exercise'){
    parts.push(fmtRange(slot.reps)+' reps · set for this exercise');
    detail.push('Rep range '+fmtRange(slot.reps)+" was set on this exercise, overriding the block's range.");
  }else{
    parts.push(bn+' block');
    detail.push('Rep range '+fmtRange(slot.reps)+' at RPE '+slot.rpe+' comes from the '+bn+' block'+(p.weeks?' (week '+p.week+' of '+p.weeks+')':'')+' for '+(slot.role==='accessory'?'an accessory':'a '+(slot.role||'working'))+' lift.');
  }
  // 2. where the number came from
  if(pr.src) parts.push(pr.src==='last session'?'from your last set':pr.src);
  else parts.push('no history yet');
  if(pr.note) detail.push(pr.note);
  // within-session fatigue, from your own history
  if(pr.fatigue){
    const f=pr.fatigue;
    if(f.applied) parts.push('fatigue −'+f.rise+' RPE · '+f.n+' pairs, '+f.sessions+' sessions');
    else detail.push('Fatigue adjustment: none yet. '+f.n+' of '+FATIGUE_MIN_PAIRS+' same-load set pairs across '+f.sessions+' of '+FATIGUE_MIN_SESSIONS+' sessions logged for this exercise'
      +(f.n>=FATIGUE_MIN_PAIRS&&f.sessions>=FATIGUE_MIN_SESSIONS?' — enough data, but your later sets do not run harder on average.':'.'));
  }
  // 3. readiness
  if(o.adj){
    const cut=Math.round((1-o.adj.load)*100), sc=Math.round(session.score*100), got=o.adjApplied||0;
    parts.push('readiness '+sc+' · '+(got>0?'load −'+got+'%':'no load change'));
    detail.push('Readiness '+sc+' out of 100 ('+o.adj.label.toLowerCase()+'): today\'s starting loads are cut '+cut+'%'+(session.adjReason?', driven by '+session.adjReason:'')+'. '
      +(got===cut?'':got>0?'Rounded to this machine\'s '+exById[slot.ex].inc+' lb steps, the actual change is −'+got+'%.'
        :'That rounds back to the same load on this machine ('+exById[slot.ex].inc+' lb steps), so the load does not change.'));
  }
  if(session&&session.adj&&session.adj.sets&&o.idx!=null&&o.idx>=0&&o.idx<2&&o.fresh!==false){
    const n=Math.abs(session.adj.sets);
    detail.push('Readiness also removed '+n+' set'+(n>1?'s':'')+' from the first two exercises.');
  }
  if(o.fresh===false) detail.push("Based on the set you just logged, which already reflects today's readiness adjustment.");
  // 4. joint — named on every set of an affected exercise, not just the first
  if(slot.joint){
    const jn=slot.joint.joint, lv=slot.joint.level, t=jointTrend(jn,6), ji=slot.joint.info||{};
    const pick=(k)=>ji[k]!=null?ji[k]:t[k];
    const base=pick('base'), src=ji.baseSrc||t.baseSrc, last=pick('last');
    const usual=src==='set'?'your usual is '+jointSevLabel(base)+' (you set it)'
      :src==='median'?'your usual is '+jointSevLabel(base)+' (from your recent sessions)'
      :'no usual yet (too few rated sessions), so any rating counts';
    // short reason for the line, full one for the detail
    const short=ji.painStop?'last session ended with pain'
      :pick('recentBad')?'rated bad recently'
      :pick('xscore')>0?'above your usual in '+pick('above')+' of '+t.n
      :'at your usual';
    const why=jn.charAt(0).toUpperCase()+jn.slice(1)+' was '+jointSevLabel(last||0)+' last session; '+usual+'. '
      +(short==='at your usual'?'Ratings at your usual never change load.'
        :ji.painStop?'Your last session ended early with pain here.'
        :short==='rated bad recently'?'A bad rating in the last 3 sessions counts whatever your usual.'
        :'Above your usual in '+pick('above')+' of your last '+t.n+' sessions.')
      +' (Ladder level '+lv+'; its thresholds are judgement defaults.)';
    if(o.jointCut){
      const gj=o.jointApplied||0;
      parts.push(jn+': '+(gj>0?'load −'+gj+'%':'load reduced')+' — '+short);
      detail.push(why+' So the starting load on this pattern is cut 10%'
        +(gj===10?'':gj>0?' — rounded to this exercise\'s steps the actual change is −'+gj+'%':', which rounds back to the same load on this exercise\'s '+exById[slot.ex].inc+' lb steps')
        +', and there is one set fewer.');
    }else{
      parts.push(jn+': '+(lv>=3?(lv>=5?'no progression':'load held'):'longer warmup')+' — '+short);
      detail.push(why+' '+(lv>=5?'No load or rep increases on this pattern.'
        :lv>=3?(o.jointHeld?'The engine wanted more load here; it is held at your last weight instead.':'Load will not go up on this pattern until it settles.')
        :'Warmup ramp is longer; load is not changed.'));
    }
  }
  // 5. easing off after a pain-ended session
  if(lastEarlyPain()){
    parts.push('easing off after last session');
    detail.push('Your last session ended early with pain, so every exercise today has one set fewer.');
  }
  return {line:parts.join(' · '), detail};
}
/* One expandable line: tap for the full reasoning. */
const WHY_OPEN=new Set();
function whyEl(exp, key, cls){
  const w=el('div',cls||'why');
  const draw=()=>{
    const open=WHY_OPEN.has(key);
    w.innerHTML='<button type="button" class="whyline" aria-expanded="'+open+'">'+esc(exp.line)+' <span class="dim">'+(open?'▾':'▸')+'</span></button>'
      +(open?'<div class="whydetail">'+exp.detail.map(d=>'<div>'+esc(d)+'</div>').join('')+'</div>':'');
    w.querySelector('button').onclick=e=>{ e.stopPropagation(); if(WHY_OPEN.has(key)) WHY_OPEN.delete(key); else WHY_OPEN.add(key); draw(); };
  };
  draw(); return w;
}
/* The suggestion for a slot. Readiness and joint cuts apply only to the first
   set of an exercise: once a set is logged today, the next suggestion is priced
   from what you actually lifted, which already reflects them. Applying them
   again would compound the cut set after set. */
function suggestFor(slot){
  let pr=nextPrescription(slot);
  const o={idx:session?session.slots.indexOf(slot):null, fresh:!slot.sets.length};
  // Stagnation probe only on the first set of a session, and only on the
  // chart-free path — the chart path already has its own override-damping
  // and probe logic (overrideStreak/lastWasProbe), and layering both would
  // fight over the same exercise.
  if(o.fresh&&isChartFree(exById[slot.ex])){
    const probe=stagnationProbe(slot);
    if(probe) pr={...pr, ...probe};
  }
  // Joint ladder level 3+: no load increase on this exercise, every set —
  // repeat the last logged load. Level 5: no rep increase either.
  const j=slot.joint, lastJ=(j&&j.level>=3&&pr.lb!=null)?lastSetFor(slot.ex):null;
  if(lastJ){
    const L0=toLb(lastJ.weight);
    if(pr.lb>L0+1e-6){ pr={...pr, lb:L0, reps:lastJ.reps}; o.jointHeld=true; }
    if(j.level>=5&&pr.lb>=L0-1e-6&&pr.reps>lastJ.reps){ pr={...pr, reps:lastJ.reps}; o.jointHeld=true; }
  }
  let lb=pr.lb;
  const pct=(a,b)=>a>0?Math.round((1-b/a)*100):0;    // what the cut actually did after rounding to the machine's steps
  if(lb!=null&&o.fresh&&session&&session.adj){ const b=lb; lb=loadable(slot, lb*session.adj.load); o.adj=session.adj; o.adjApplied=pct(b,lb); }
  if(lb!=null&&o.fresh&&slot.joint&&slot.joint.level>=4){ const b=lb; lb=loadable(slot, lb*0.9); o.jointCut=true; o.jointApplied=pct(b,lb); }
  return {pr, lb, why:explainRx(slot,pr,o), o};
}
/* What the engine actually recommended for this set, independent of whether
   the lifter followed it. Additive-only logging (see logSet): never read by
   any prescription or display code, so a set logged before this field
   existed just doesn't have one, and nothing about prescribing, logging or
   showing a set changes. This is what lets "is the engine improving?" become
   a measurable trend later (tests/backtest.js). */
function recordedSuggestion(slot, rec){
  if(!rec||rec.pr.lb==null) return undefined;
  const {pr,lb,o}=rec;
  return {
    lb, shown:shownLoad(slot, lb), reps:pr.reps, target_rpe:slot.rpe, basis:pr.src,
    readiness:o.adj?{score:Math.round(session.score*100),cut_pct:Math.round((1-o.adj.load)*100),applied_pct:o.adjApplied||0}:null,
    joint:slot.joint?{joint:slot.joint.joint,level:slot.joint.level,applied_pct:o.jointApplied||0,held:!!o.jointHeld}:null,
    fatigue:(pr.fatigue&&pr.fatigue.applied)?{rise:pr.fatigue.rise,pairs:pr.fatigue.n,sessions:pr.fatigue.sessions}:null,
    rep_range:slot.repSrc!=='block'?{src:slot.repSrc,muscle:slot.repMuscle||null,capped:!!slot.repCapped}:null
  };
}
/* The load as the set card shows it: kg machines in half-kg steps, everything
   else in lb. seedDraft() and the stored suggestion both use this, so what's
   recorded is what was shown. */
function shownLoad(slot, lb){
  const ex=exById[slot.ex];
  const fixedUnit=ex&&ex.unitPref&&ex.unitPref!=='both'?ex.unitPref:null;
  return fixedUnit==='kg'?{value:Math.round(lb/LB*2)/2, unit:'kg'}:{value:lb, unit:'lb'};
}
function seedDraft(slot){
  const ex=exById[slot.ex];
  const {pr,lb,why}=suggestFor(slot);
  const fixedUnit=ex.unitPref&&ex.unitPref!=='both'?ex.unitPref:null;
  if(lb!=null){
    const sh=shownLoad(slot, lb); draft.weight=sh.value; draft.unit=sh.unit;
  }else{ draft.weight=isBW(ex)?0:(ex.bar||50); draft.unit=fixedUnit||CFG.units||'lb'; }
  draft.reps=pr.reps??slot.reps[0]; draft.rpe=slot.rpe; draft.group=null; draft.alt=null;
  draft.suggestedLb=lb; draft.suggestedReps=draft.reps; draft.suggested=lb!=null; draft.why=why;
}
function logSet(slot,idx,kind,extend,over){
  const ex=exById[slot.ex];
  // over: {weight,unit,reps} — a warmup rung logs its own numbers and leaves
  // the working-set draft (and its suggestion) exactly as it was
  const W=over||draft;
  const T=TECHNIQUES[draft.tech];
  let group=null, setKind=kind;
  if(kind!=='warmup'&&draft.tech!=='straight'){
    if(extend&&draft.group){
      const n=slot.sets.filter(x=>x.group&&x.group.id===draft.group).length;
      group={id:draft.group,kind:draft.tech,pos:n};
      setKind=draft.tech==='drop'?'drop':draft.tech==='myo'?'myo':'cluster';
    }else{
      const gid=ulid(); draft.group=gid;
      group={id:gid,kind:draft.tech,pos:0};
      setKind=draft.tech==='drop'?'drop':draft.tech==='myo'?'myo':'cluster';
    }
  }
  if(!session.startedAt) session.startedAt=Date.now();
  // The suggestion shown before this set was edited, if any — stamped once
  // so future sessions can tell what was suggested vs. what you actually
  // logged, without ever rewriting the event later.
  const stampSuggestion=kind!=='warmup'&&!group&&slot.sets.length===0;
  const rec=(kind!=='warmup'&&!group)?suggestFor(slot):null;
  const suggestion=recordedSuggestion(slot,rec);
  const candidate={type:'set',session_id:session.id,slot:slot.ex,exercise_id:ex.id,
    weight:{value:W.weight,unit:W.unit}, bar:ex.bar?{value:ex.bar,unit:W.unit}:null,
    reps:W.reps, rpe:kind==='warmup'?null:draft.rpe, set_kind:setKind, group,
    target:{reps:slot.reps,rpe:slot.rpe},
    suggested_lb:stampSuggestion?(draft.suggestedLb??null):null,
    ...(suggestion&&{suggestion})};
  // PR must be decided BEFORE the event is written, or the flag never persists
  const pr=kind==='warmup'?null:isPR(ex.id,candidate);
  if(pr) candidate.pr=true;
  const ev=append(candidate);
  if(!ev) return;
  if(kind!=='warmup') slot.sets.push(ev);
  // after a top set of a technique, pre-fill the extension
  if(group&&group.pos===0){
    draft.reps=T.repHint(draft.reps);
    if(T.loadMul!==1) draft.weight=Math.max(ex.inc,Math.round(draft.weight*T.loadMul/ex.inc)*ex.inc);
  }
  /* Suggest the next set from what THIS set actually cost you — same
     nextPrescription() the next session/exercise-open uses, since the log
     (and lastSetFor()) already reflects the set just appended above. This
     is only a pre-fill: whatever the steppers show when Log Set is tapped
     is what gets logged, exactly like every other set. */
  if(kind!=='warmup'&&!group){
    const next=suggestFor(slot);
    if(next.lb!=null){
      draft.weight = draft.unit==='kg' ? Math.round(next.lb/LB*2)/2 : next.lb;
      draft.reps=next.pr.reps; draft.suggestedLb=next.lb; draft.suggestedReps=next.pr.reps;
      draft.suggested=true; draft.alt=null; draft.why=next.why;
    }
  }
  saveSession();
  if(pr){ toast(`New best on ${ex.name} · +${fmt(pr.gain,0)} lb`); if(navigator.vibrate) navigator.vibrate(80); }
  else toast(kind==='warmup'?'Warmup logged':group?`${group.pos===0?'Top set':TECHNIQUES[draft.tech].extend} logged`:`Set ${slot.sets.length} logged`);
  if(kind!=='warmup'){
    const rest=draft.group?45:(REST_BY_ROLE[slot.role]||120);
    startRest(rest, draft.group?'Cluster rest':`Rest · ${exById[slot.ex].name}`);
  }
  advanceIfDone(slot,idx);
  renderWork();
}

/* Move to the next unfinished exercise once this one is complete. Used by both
   logging a set and skipping one, so the two can't drift apart. */
function advanceIfDone(slot,idx){
  if(draft.group) return;                       // never jump mid-cluster
  if(slot.sets.length<slot.sets_target) return;
  if(session.openIdx!==idx) return;
  const nx=session.slots.findIndex((s,j)=>j>idx&&s.sets.length<s.sets_target);
  if(nx>-1){ session.openIdx=nx; seedDraft(session.slots[nx]); }
  else session.openIdx=-1;                      // everything done — collapse
}

/* Tap a joint to flag it (moderate by default), then say how bad if it isn't
   moderate. Stored as 1 mild / 2 moderate / 3 bad — events carrying these get
   joint_scale:3 so older tap-only events stay distinguishable. */
function jointChips(hostSel,store){
  const host=$(hostSel);

  const drawSev=()=>{

        c.setAttribute('aria-pressed',store[j]===v?'true':'false');

/* Was the last session cut short by pain? Then ease the next one. */
const EASE_OFF_DAYS=10;
function lastEarlyPain(){
  for(let i=LOG.length-1;i>=0;i--){
    const e=LOG[i];
    if(e.type!=='session_end') continue;
    if(!(e.ended_early&&e.reason==='pain')) return null;   // only the most recent counts
    // a pain stop from weeks ago says nothing about today
    return (Date.now()-new Date(e.ts) <= EASE_OFF_DAYS*864e5) ? e : null;
  }
  return null;
}

  return [...g];
}

/* ═══ ROADMAP EDITOR ═══
   Phases are ordered intents. No phase stores a date — dates come from
   anchor + order + durations, so extending one block shifts everything
   downstream for free. */

function roadmapWeeks(){ return ROADMAP.reduce((a,b)=>a+blockLen(b),0); }

/* Linter: warnings only, never blocks. A linter that stops you training
   is worse than no linter. */
function lintRoadmap(){
  const w=[];
  if(!ROADMAP.length) return [{sev:'warn',msg:'No blocks yet. Add at least one.'}];
  ROADMAP.forEach((b,i)=>{
    const prev=ROADMAP[i-1];
    if(b.type==='peak'&&(!prev||prev.type!=='str'))
      w.push({sev:'warn',msg:`Block ${i+1}: peaking with no strength block before it.`});
    if(b.type==='str'&&(!prev||(prev.type!=='hyp'&&prev.type!=='deload')))
      w.push({sev:'warn',msg:`Block ${i+1}: strength with no accumulation before it.`});
    const lim={hyp:[3,7],str:[2,6],peak:[1,3],deload:[1,2]}[b.type];
    if(b.weeks<lim[0]||b.weeks>lim[1])
      w.push({sev:'info',msg:`Block ${i+1}: ${b.weeks} weeks is outside the usual ${lim[0]}–${lim[1]} for ${TYPE_NAME[b.type].toLowerCase()}.`});
    if(b.emphasis==='high'&&Math.max(...b.vol)>=20)
      w.push({sev:'warn',msg:`Block ${i+1}: high emphasis peaks at ${Math.max(...b.vol)} sets/muscle, at or past MRV for most groups.`});
    if((b.hyp||[]).length>3)
      w.push({sev:'warn',msg:`Block ${i+1}: ${b.hyp.length} priority muscles. Total volume is bounded — 3 is the cap.`});
    weekCoverage(splitFor(b).week).forEach(m=>w.push({sev:'info',msg:'Block '+(i+1)+': '+m}));
    // compare the days themselves: a preset and the same week as a list are one shape
    if(prev&&splitFor(prev).week.join()!==splitFor(b).week.join())
      w.push({sev:'warn',msg:`Block ${i+1}: switches from ${splitFor(prev).name} to ${splitFor(b).name}. The day rotation restarts at day 1, and weekly volume per muscle shifts with the new shape.`});
  });
  let run=0;
  ROADMAP.forEach((b,i)=>{
    if(b.type==='deload'){ run=0; } else { run+=b.weeks; if(b.deload) run=0; }
    if(run>9){ w.push({sev:'warn',fixAt:i,msg:`${run} weeks without a deload by block ${i+1}.`}); run=0; }
  });
  if(CFG.target&&CFG.start){
    const avail=weeksAvailable(CFG.start,CFG.target,programSplitSpec());
    const diff=avail-roadmapWeeks();
    if(Math.abs(diff)>1) w.push({sev:'info',
      msg:`Blocks total ${roadmapWeeks()} weeks but at your recent pace there are ${avail} to your target — ${diff>0?diff+' spare':Math.abs(diff)+' over'}.`});
  }
  return w;
}

/* Extending is additive and safe, so it happens automatically. Trimming
   deletes blocks you configured, so that stays a deliberate tap. */
function fillToTarget(draft, startDate, targetDate, splitKey){
  if(!startDate||!targetDate) return 0;
  const avail=weeksAvailable(startDate,targetDate,splitKey||programSplitSpec());
  let have=draft.reduce((a,b)=>a+blockLen(b),0), added=0, guard=0;
  while(avail-have>=4 && guard++<40){
    const last=draft[draft.length-1];
    const next=(!last||last.type==='str')?'hyp':'str';
    const weeks=next==='hyp'?5:4;
    if(avail-have < weeks+1) break;
    draft.push(applyShape({type:next,label:TYPE_NAME[next],weeks,hyp:[],deload:true}));
    have+=weeks+1; added++;
  }
  // if a peaking block fits in what's left, finish on one
  if(avail-have>=2 && avail-have<=4 && draft.length && draft[draft.length-1].type!=='peak'){
    draft.push(applyShape({type:'peak',label:'Peaking',weeks:Math.min(3,avail-have),hyp:[],deload:false}));
    added++;
  }
  return added;
}

/* ═══ PROGRESS ═══ */
function sparkline(series, color){
  if(series.length<2) return null;
  const W=600,H=90,pad=6;
  const vs=series.map(p=>p.v), min=Math.min(...vs), max=Math.max(...vs);
  const span=(max-min)||1;
  const pts=series.map((p,i)=>[
    pad+(i/(series.length-1))*(W-pad*2),
    pad+(1-(p.v-min)/span)*(H-pad*2)
  ]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`;
  const box=el('div','');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:90px;display:block" aria-hidden="true">
    <path d="${area}" fill="${color}" opacity=".13"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="4" fill="${color}"/>
  </svg>`;
  return box;
}

/* Total weight moved on working sets (warmups excluded), as logged —
   bodyweight lifts count the added load only. */
function sessionTonnage(sessionId){
  return sets().filter(x=>x.session_id===sessionId&&x.set_kind!=='warmup')
    .reduce((a,x)=>a+(toLb(x.weight)||0)*(x.reps||0),0);
}
/* Each exercise's best working set in a session, by estimated 1RM. */
function sessionTopSets(sessionId){
  const m={};
  sets().filter(x=>x.session_id===sessionId&&x.set_kind!=='warmup'&&!(x.group&&x.group.pos>0)).forEach(x=>{
    const v=setE1RM(x)||0; if(!m[x.exercise_id]||v>m[x.exercise_id].v) m[x.exercise_id]={v,s:x}; });
  return m;
}
/* The payoff screen after a finished session: what you did, what moved, and
   how it compares with the last time you trained this day. One tap to close. */
function openSessionSummary(endEv, score){
  const ss=sets().filter(x=>x.session_id===endEv.session_id&&x.set_kind!=='warmup');
  const ton=sessionTonnage(endEv.session_id);
  const prs=[...new Set(ss.filter(x=>isPRSet(x.id)).map(x=>(exById[x.exercise_id]||{name:x.exercise_id}).name))];
  const prev=LOG.filter(e=>e.type==='session_end'&&e.id!==endEv.id&&e.day_name===endEv.day_name
    &&countsAsTrained(e)&&new Date(e.ts)<new Date(endEv.ts)).pop();
  const fs=x=>fmt(x.weight.value)+(x.weight.unit==='kg'?' kg':'')+' × '+x.reps;
  let cmp='<div class="muted sm">First time you\'ve trained '+esc(endEv.day_name||'this day')+' — nothing to compare yet.</div>';
  if(prev){
    const pt=sessionTonnage(prev.session_id), d=ton-pt, pct=pt?Math.round(d/pt*100):0;
    const a=sessionTopSets(endEv.session_id), b=sessionTopSets(prev.session_id);
    const moved=Object.keys(a).filter(id=>b[id]&&(a[id].s.reps!==b[id].s.reps||Math.abs(toLb(a[id].s.weight)-toLb(b[id].s.weight))>0.01))
      .map(id=>{ const up=a[id].v>=b[id].v;
        return `<div class="row between sm" style="padding:3px 0"><span class="grow">${esc((exById[id]||{name:id}).name)}</span>
          <span style="flex:none;color:${up?'var(--accent)':'var(--muted)'}">${fs(b[id].s)} → ${fs(a[id].s)} ${up?'↑':'↓'}</span></div>`; }).join('');
    cmp=`<div class="row between sm"><span class="muted">Tonnage vs ${new Date(prev.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>
        <span style="font-weight:600">${d>=0?'+':''}${Math.round(d).toLocaleString()} lb${pt?' ('+(pct>=0?'+':'')+pct+'%)':''}</span></div>
      ${moved||`<div class="dim tiny" style="margin-top:4px">${Object.keys(a).some(id=>b[id])?'Same top sets as last time.':'No lifts in common with last time.'}</div>`}`;
  }
  sheet(`<h2 style="font-size:24px;margin-bottom:2px">${esc(endEv.day_name||'Session')} done</h2>
    <div class="muted tiny" style="margin-bottom:14px">${new Date(endEv.ts).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div>
    <div class="sgrid" style="border-radius:10px;overflow:hidden;margin-bottom:12px">
      <div class="scell"><div class="snum">${ss.length}</div><div class="slab">${ss.length===1?'set':'sets'}</div></div>
      <div class="scell"><div class="snum">${ton?Math.round(ton).toLocaleString():'—'}</div><div class="slab">lb moved</div></div>
      <div class="scell"><div class="snum">${endEv.duration_s!=null?(endEv.duration_s<60?'<1 min':Math.round(endEv.duration_s/60)+' min'):'—'}</div><div class="slab">time</div></div>
    </div>
    ${prs.length?`<div class="qblock" style="border-left:3px solid var(--accent)"><div class="qlab" style="color:var(--accent)">New best${prs.length>1?'s':''}</div>
      ${prs.map(n=>`<div class="sm">${esc(n)}</div>`).join('')}</div>`:''}
    <div class="qblock"><div class="qlab">Compared with last time</div>${cmp}</div>
    <div class="qblock"><div class="row between sm"><span class="muted">Readiness today</span>
      <span style="font-weight:600">${score!=null?Math.round(score*100)+' / 100 · '+esc(readinessLabel(score)):'No check-in this session'}</span></div></div>
    <button class="btn go wide" id="sumok">Done</button>`);
  $('#sumok').onclick=()=>{ $('#dlg').close(); render(); };
}
function openSessionDetail(endEv){
  const ss=sets().filter(s=>s.session_id===endEv.session_id);
  const byEx={};
  ss.forEach(s=>{ (byEx[s.exercise_id]=byEx[s.exercise_id]||[]).push(s); });
  const tonnage=sessionTonnage(endEv.session_id);
  const dur=endEv.duration_s?`${Math.round(endEv.duration_s/60)} min`:null;
  let html=`<h2 style="font-size:21px;margin-bottom:2px">${esc(endEv.day_name||'Session')}</h2>
    <div class="muted tiny" style="margin-bottom:6px">${new Date(endEv.ts).toLocaleString(undefined,{weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>
    <div class="row" style="gap:14px;margin-bottom:14px;flex-wrap:wrap">
      ${endEv.session_rpe?`<span class="sm"><span class="dim">RPE</span> <b>${endEv.session_rpe}</b></span>`:''}
      ${dur?`<span class="sm"><span class="dim">Time</span> <b>${dur}</b></span>`:''}
      ${tonnage?`<span class="sm"><span class="dim">Tonnage</span> <b>${Math.round(tonnage).toLocaleString()} lb</b></span>`:''}
      ${endEv.ended_early?`<span class="sm" style="color:var(--warn)">ended early · ${esc(endEv.reason)}</span>`:''}
    </div>`;
  Object.entries(byEx).forEach(([id,list])=>{
    const ex=exById[id];
    html+=`<div class="qblock"><div class="qlab" style="margin-bottom:7px">${esc(ex?ex.name:id)}</div>`;
    list.forEach((s,i)=>{
      const est=e1rm(toLb(s.weight),s.reps);
      html+=`<div class="row between sm" style="padding:3px 0">
        <span class="muted">${s.set_kind==='warmup'?'warmup':s.group&&s.group.pos>0?TECHNIQUES[s.group.kind].extend:'set '+(i+1)}</span>
        <span>${fmt(s.weight.value)} ${s.weight.unit} × ${s.reps}${s.rpe?` @ ${s.rpe}`:''}${est&&s.set_kind!=='warmup'?` · ${fmt(est,0)}`:''}</span></div>`;
    });
    html+=`</div>`;
  });
  if(!ss.length) html+=`<div class="empty">No sets recorded for this session.</div>`;
  html+=`<button class="btn ghost wide" id="sdclose">Close</button>`;
  sheet(html);
  $('#sdclose').onclick=()=>$('#dlg').close();
}
