/* Settings are edited in a module-level draft that OUTLIVES a single call to
   openSettings(). Without this, navigating into the goal-lift picker and back
   used to reset every in-progress edit — and worse, the picker rebuilt the
   dialog's HTML from a raw string snapshot, which orphaned the settings
   screen's own DOM node so later edits landed on a detached element the user
   could no longer see. That was the "goal lifts never change" bug. Now the
   picker is just another screen over the same persistent draft, and Save or
   Cancel is what clears it. */
let SETTINGS_DRAFT=null;
/* First-run setup. Every step is skippable and everything it sets is
   changeable later in Edit program — the goal is a usable program in about a
   minute, not an interrogation. Runs once; CFG.onboarded gates it. */
let ONB=null;
function needsOnboarding(){ return !CFG.onboarded && !LOG.some(e=>e.type==='set'); }
function openOnboarding(step){
  if(!ONB) ONB={units:CFG.units||'lb', week:splitOf(programSplitSpec()).week,
    goals:[...(CFG.goals||[])], weeks:16, conds:[...(CFG.conditions||[])], est:{}, name:CFG.testerName||''};
  const O=ONB;
  step=step==null?0:step;
  // steps: 0 welcome, 1 units, 2 split, 3 goal lifts, 4 starting estimates
  // (only with goal lifts), 5 conditions, 6 name (only when notes go to the
  // person who set this up). Counted from the steps that apply.
  const ask=k=>k===4?O.goals.length>0:k===6?!!(CFG.feedbackUrl||'').trim():true;
  const STEPS=[0,1,2,3,4,5,6].filter(ask);
  // the counter treats estimates as part of the goal-lift step, so the total
  // doesn't change when goal lifts are picked or cleared
  const SHOWN=STEPS.filter(k=>k!==4), N=SHOWN.length, stepNo=k=>SHOWN.indexOf(k===4?3:k)+1;
  const next=k=>{ const i=STEPS.indexOf(k); return i<0?null:STEPS[i+1]; };
  const prev=k=>{ const i=STEPS.indexOf(k); return i>0?STEPS[i-1]:null; };
  const finish=()=>{
    const t=new Date(); t.setDate(t.getDate()+O.weeks*7);
    CFG.units=O.units; CFG.week=O.week; CFG.goals=O.goals; CFG.conditions=O.conds;
    if(O.name.trim()) CFG.testerName=O.name.trim().slice(0,40);
    CFG.start=new Date().toISOString().slice(0,10);
    CFG.target=t.toISOString().slice(0,10);
    ROADMAP=[applyShape({type:'hyp',label:'Hypertrophy',weeks:5,hyp:[],deload:true,
      lead:O.goals[0]||null,emphasis:'moderate'})];
    fillToTarget(ROADMAP,CFG.start,CFG.target);
    CFG.roadmap=ROADMAP; CFG.onboarded=true; saveCfg();
    // starting estimates: only the goal lifts you gave a number for
    Object.entries(O.est).forEach(([id,v])=>{ if(v>0&&O.goals.includes(id))
      append({type:'e1rm_estimate',exercise_id:id,lb:O.units==='kg'?Math.round(v*LB*10)/10:v}); });
    ONB=null; $('#dlg').close(); TAB='dash'; render();
    if(!CFG.introSeen) setTimeout(()=>openIntro(),250);
  };

  const shell=(title,sub,bodyId,backStep,nextLabel,onNext,skipStep)=>{
    sheet(`<div class="dim tiny" style="margin-bottom:8px">Step ${stepNo(step)} of ${N}</div>
      <h2 style="font-size:22px;margin-bottom:3px">${esc(title)}</h2>
      <div class="muted tiny" style="margin-bottom:15px">${esc(sub)}</div>
      <div id="${bodyId}"></div>
      <div class="row" style="gap:8px;margin-top:4px">
        ${backStep!=null?'<button class="btn ghost grow" id="obBack">Back</button>':''}
        <button class="btn pri grow" id="obNext">${esc(nextLabel)}</button>
      </div>
      ${skipStep!=null?'<button class="btn ghost wide" id="obSkip" style="margin-top:8px">Skip this</button>':''}`);
    if(backStep!=null) $('#obBack').onclick=()=>openOnboarding(backStep);
    $('#obNext').onclick=onNext;
    if(skipStep!=null) $('#obSkip').onclick=()=>openOnboarding(skipStep);
  };
  const chips=(host,opts,isOn,onPick)=>{
    const c=el('div','chips');
    opts.forEach(o=>{ const b=el('button','chip',esc(o.label));
      b.style.cssText='font-size:13px;padding:7px 12px';
      b.setAttribute('aria-pressed',isOn(o)?'true':'false');
      b.onclick=()=>onPick(o); c.appendChild(b); });
    host.appendChild(c);
  };

  if(step===0){
    shell('Welcome','This builds and adapts a training program from what you actually log. About a minute to set up.',
      'ob0',null,'Get started',()=>openOnboarding(next(0)));
    $('#ob0').innerHTML=`<div class="qblock">
      <div class="muted sm" style="line-height:1.55">
        Your data stays on this device. Nothing is sent anywhere unless you set up a backup.<br><br>
        Everything here can be changed later — nothing you pick now is permanent.
      </div></div>`;
    return;
  }

  if(step===1){
    shell('Units','Which do you think in? You can switch per-set later too.',
      'ob1',prev(1),'Next',()=>openOnboarding(next(1)));
    chips($('#ob1'),[{label:'Pounds (lb)',v:'lb'},{label:'Kilograms (kg)',v:'kg'}],
      o=>O.units===o.v,o=>{O.units=o.v;openOnboarding(1);});
    return;
  }

  if(step===2){
    shell('How do you train?','Pick how many days a week, then the kind of days. Sessions are generated from this.',
      'ob2',prev(2),'Next',()=>openOnboarding(next(2)));
    $('#ob2').appendChild(weekPicker(O.week, w=>{ O.week=w; openOnboarding(2); }));
    return;
  }

  if(step===3){
    shell('Pick up to three lifts to build around',
      'These get priority in every session. Skip if you just want general training.',
      'ob3',prev(3),'Next',()=>openOnboarding(next(3)),5);
    const host=$('#ob3');
    O.goals.forEach((g,i)=>{
      const ex=exById[g]; const r=el('div','row between sm');
      r.style.cssText='padding:9px 0;border-top:1px solid var(--line)';
      r.innerHTML=`<span><span class="sidx done" style="width:22px;height:22px;font-size:11px">${i+1}</span>
        <span style="margin-left:9px">${esc(ex?ex.name:g)}</span></span>`;
      const x=el('button','iconbtn','✕'); x.style.color='var(--skip)';
      x.onclick=()=>{ O.goals.splice(i,1); openOnboarding(3); };
      r.appendChild(x); host.appendChild(r);
    });
    if(O.goals.length<3){
      const add=el('button','btn wide','Add a lift'); add.style.marginTop='11px';
      add.onclick=()=>exPicker('Pick a lift to build around',
        e=>!O.goals.includes(e.id), e=>{ O.goals.push(e.id); openOnboarding(3); });
      host.appendChild(add);
    }
    return;
  }

  if(step===4){
    shell('Roughly what could you do for one all-out rep?',
      'Only for the lifts you picked, so your first session has loads instead of dashes. A rough guess is fine — your logged sets take over from the first session.',
      'ob4',prev(4),'Next',()=>openOnboarding(next(4)),next(4));
    $('#obSkip').onclick=()=>{ O.est={}; openOnboarding(next(4)); };   // skipping saves none of them
    const host=$('#ob4');
    O.goals.forEach(id=>{
      const ex=exById[id]; if(!ex) return;
      const blk=el('div','qblock'); blk.appendChild(el('div','qlab',esc(ex.name)));
      const h=el('div','');
      const draw=()=>{ h.innerHTML=''; const v=O.est[id];
        h.appendChild(stepper(isBW(ex)?'added '+O.units:O.units, v==null?(isBW(ex)?0:(O.units==='kg'?60:135)):v, O.units==='kg'?2.5:5,
          nv=>{ O.est[id]=Math.max(0,nv); draw(); }, null, {typeable:true,min:0}));
        h.appendChild(el('div','dim tiny',v==null?'Not set yet — the number above is only a starting point for the buttons. Leave it untouched and this lift starts blank.':'Saved as your starting estimate.')).style.marginTop='4px'; };
      draw(); blk.appendChild(h); host.appendChild(blk);
    });
    return;
  }

  if(step===5){
    const last=next(5)==null;
    shell('Anything you\u2019re working around?',
      'Flags exercises that load an at-risk position. It only ever warns, never blocks.',
      'ob5',prev(5),last?'Build my program':'Next',last?finish:()=>openOnboarding(next(5)));
    const host=$('#ob5');
    chips(host,Object.entries(CONDITIONS).map(([k,v])=>({label:v.name,v:k})),
      o=>O.conds.includes(o.v),
      o=>{ O.conds=O.conds.includes(o.v)?O.conds.filter(x=>x!==o.v):O.conds.concat(o.v); openOnboarding(5); });
    host.appendChild(el('div','anchor','Leave blank if nothing applies.'));
    return;
  }

  if(step===6){
    shell('What should we call you?',
      'Notes you write in the app go to the person who set it up for you, signed with this name. Nothing else is sent.',
      'ob6',prev(6),'Build my program',finish);
    $('#ob6').innerHTML='<input type="text" id="obname" placeholder="First name is fine" style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit;margin-bottom:12px">';
    const inp=$('#obname'); inp.value=O.name; inp.oninput=e=>{ O.name=e.target.value; };
    return;
  }
}

/* One screen, not a tour: the five things a new user needs that the app
   doesn't otherwise say. Shown once after setup; reachable from the Lifts tab. */

  const fb=!!(CFG.feedbackUrl||'').trim(), sync=!!(CFG.syncUrl||'').trim();
  const item=(t,b)=>`<div class="qblock"><div class="qlab">${t}</div><div class="muted sm" style="line-height:1.5">${b}</div></div>`;
  sheet(`<h2 style="font-size:22px;margin-bottom:12px">How this works</h2>
    ${item('The check-in shapes the session','Before each workout it asks how you slept and how you feel. Answer honestly — 3 is a normal day. It can lighten a session; it never adds to one.')}
    ${item('Suggested weights are suggestions','Change any number before you log the set. What you log is what counts, and the suggestions learn from it.')}
    ${item('RPE','How hard a set was: 10 means nothing left, 8 means about two more reps were possible.')}
    ${item('Notes','The ✎ at the top right writes a note — something broke, something confusing, an idea. '+(fb?'Notes go to the person who gave you this app.':'Notes are saved in your log.'))}
    ${item('Your data','It lives only on this phone. '+(sync?'It\'s also backed up to a sheet after each session.':'If you care about keeping it, save a backup from the Lifts tab now and then.'))}
    <button class="btn go wide" id="introok">Got it</button>`);

/* Wipe everything back to a true first-run state. For testing the new-user
   flow, and for handing the app to someone else on a shared device. */
function resetToFresh(){
  // the named keys, plus anything else under the trainlog. prefix — so a key
  // added later can't survive a reset just because nobody updated this list
  const keys=new Set([LS_KEY,LS_CFG,LS_SESS,LS_PEND,LS_REST,LS_WEEK,'trainlog.lastExport','trainlog.lastSync']);
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('trainlog.')) keys.add(k); } }catch{}
  keys.forEach(k=>{ try{ localStorage.removeItem(k); }catch{} });
  location.reload();
}

function openSettings(){
  if(!SETTINGS_DRAFT){
    SETTINGS_DRAFT={
      draft: ROADMAP.map(b=>({...b,hyp:[...(b.hyp||[])]})),
      goals: [...(CFG.goals||[])],
      tgt: CFG.target, srt: CFG.start, fixed: !!CFG.targetFixed,
      split: (s=>Array.isArray(s)?[...s]:s)(programSplitSpec()), syncUrl: CFG.syncUrl||'', feedbackUrl: CFG.feedbackUrl||'', testerName: CFG.testerName||'',
      energy: CFG.energy||'maintenance', conds: [...(CFG.conditions||[])],
      jointUsual: {...(CFG.jointUsual||{})}
    };
  }
  const S=SETTINGS_DRAFT;

  sheet(`<h2 style="font-size:22px;margin-bottom:3px">Your program</h2>
    <div class="muted tiny" style="margin-bottom:15px">Blocks are an order, not dates. Change a length and everything after it shifts.</div>
    <div id="rm"></div>
    <button class="btn pri wide" id="rmsave" style="margin-top:4px">Save program</button>
    <button class="btn ghost wide" id="rmclose" style="margin-top:8px">Cancel</button>`);

  const host=$('#rm');
  const draw=()=>{
    host.innerHTML='';

    const dates=el('div','qblock');
    const availW = weeksAvailable(S.srt,S.tgt,S.split);
    const haveW  = S.draft.reduce((a,b)=>a+blockLen(b),0);
    dates.innerHTML=`<div class="qlab">Dates</div>
      <div class="field">Target</div><input type="date" id="td" value="${S.tgt||''}">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:8px">
        <input type="checkbox" id="tfix"${S.fixed?' checked':''}>
        <span class="sm">This date is fixed</span></label>
      <div class="anchor">${S.fixed?'If you fall behind, the app offers to shorten the remaining blocks to hit it — never below each block type\'s minimum, never dropping a deload.':'If you fall behind, the app offers to move this date to match your pace. Blocks keep their length.'}</div>
      <div class="field" style="margin-top:10px">Start</div><input type="date" id="sd" value="${S.srt||''}">
      <div class="anchor">${availW!=null?`${haveW} weeks of blocks against ${availW} weeks available at your pace`:'Set both dates to size your blocks'}</div>`;
    host.appendChild(dates);
    $('#tfix').onchange=e=>{ S.fixed=e.target.checked; draw(); };
    $('#td').onchange=e=>{
      S.tgt=e.target.value;
      const n=fillToTarget(S.draft,S.srt,S.tgt,S.split);
      if(n) toast(`Added ${n} block${n>1?'s':''} to reach that date`);
      draw();
    };
    $('#sd').onchange=e=>{S.srt=e.target.value;draw();};
    if(availW!=null&&haveW-availW>1){
      const trim=el('button','btn s',`Trim ${haveW-availW} weeks to fit`);
      trim.style.marginTop='9px';
      trim.onclick=()=>{

/* The one week picker: setup, the program's week, and a block's own week all
   use it. Days per week, a suggested style, then every day editable and
   reorderable. Calls onChange(newWeek); the caller redraws. */
function weekPicker(week, onChange){
  const w=validWeek(week)?[...week]:splitOf(week).week, style=styleOfWeek(w);
  const box=el('div','');
  box.appendChild(el('div','field','Days per week'));
  const dc=el('div','chips');
  for(let n=WEEK_MIN;n<=WEEK_MAX;n++){
    const c=el('button','chip',String(n)); c.setAttribute('aria-pressed',w.length===n?'true':'false');
    c.onclick=()=>{ if(n===w.length) return;
      const st=WEEK_STYLES.find(x=>x.k===style&&(x.min||WEEK_MIN)<=n)||WEEK_STYLES[0];
      onChange(st.make(n)); };
    dc.appendChild(c);
  }
  box.appendChild(dc);
  box.appendChild(el('div','field','Style · a starting point, change any day below')).style.marginTop='12px';
  const sc=el('div','chips');
  WEEK_STYLES.filter(x=>(x.min||WEEK_MIN)<=w.length).forEach(x=>{
    const c=el('button','chip',esc(x.label)); c.setAttribute('aria-pressed',style===x.k?'true':'false');
    c.onclick=()=>onChange(x.make(w.length)); sc.appendChild(c);
  });
  if(style==='custom'){ const c=el('button','chip','Custom'); c.setAttribute('aria-pressed','true'); sc.appendChild(c); }
  box.appendChild(sc);
  box.appendChild(el('div','field','Your week, in order')).style.marginTop='12px';
  const names=weekTemplate(w);
  w.forEach((t,i)=>{
    const r=el('div','row'); r.style.cssText='gap:6px;margin-bottom:6px';
    r.appendChild(el('span','dim tiny','Day '+(i+1))).style.cssText='width:40px;flex:none';
    const sel=el('select','wsel'); sel.setAttribute('aria-label','Day '+(i+1)+' type');
    sel.innerHTML=DAY_TYPE_ORDER.map(k=>`<option value="${k}"${k===t?' selected':''}>${esc(DAY_TYPES[k].label)}</option>`).join('');
    sel.onchange=()=>{ const nw=[...w]; nw[i]=sel.value; onChange(nw); };
    r.appendChild(sel);
    r.appendChild(el('span','dim tiny',esc(names[i].name))).style.cssText='width:64px;flex:none;text-align:right';
    const up=el('button','iconbtn','↑'); up.setAttribute('aria-label','Move day '+(i+1)+' earlier');
    if(i===0) up.style.opacity='.25'; else up.onclick=()=>{ const nw=[...w]; [nw[i-1],nw[i]]=[nw[i],nw[i-1]]; onChange(nw); };
    const dn=el('button','iconbtn','↓'); dn.setAttribute('aria-label','Move day '+(i+1)+' later');
    if(i===w.length-1) dn.style.opacity='.25'; else dn.onclick=()=>{ const nw=[...w]; [nw[i+1],nw[i]]=[nw[i],nw[i+1]]; onChange(nw); };
    r.append(up,dn); box.appendChild(r);
  });
  box.appendChild(el('div','anchor','Days run in this order, then repeat. A missed day just waits — the program counts sessions, not dates.'));
  weekCoverage(w).forEach(m=>box.appendChild(el('div','tiny',esc(m))).style.cssText='color:var(--warn);margin-top:6px');
  return box;
}

/* iOS and other browsers may evict script-writable storage. Asking for
   persistence is the only in-browser mitigation; regular exports are the
   real one. */
async function requestPersistence(){
  try{
    if(!navigator.storage||!navigator.storage.persist) return null;
    if(await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  }catch{ return null; }
}
async function storageInfo(){
  const out={persisted:null, usage:null, quota:null,
             logBytes:(localStorage.getItem(LS_KEY)||'').length};
  try{
    if(navigator.storage){
      if(navigator.storage.persisted) out.persisted=await navigator.storage.persisted();
      if(navigator.storage.estimate){ const e=await navigator.storage.estimate();
        out.usage=e.usage; out.quota=e.quota; }
    }
  }catch{}
  return out;
}
const sessionsSinceExport=()=>{
  const last=Number(localStorage.getItem('trainlog.lastExport')||0);
  return LOG.filter(e=>e.type==='session_end'&&new Date(e.ts).getTime()>last).length;
};

/* A backup is the log PLUS the program. Exporting sets alone would restore
   your history but lose your roadmap, goals and split. */
function backupText(){
  const header=JSON.stringify({v:SCHEMA_V,type:'config_snapshot',
    app_version:APP_VERSION, exported_at:new Date().toISOString(), cfg:CFG});
  return [header, ...LOG.map(e=>JSON.stringify(e))].join('\n');
}
function exportLog(){
  const blob=new Blob([backupText()],{type:'application/x-ndjson'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`trainlog-backup-${new Date().toISOString().slice(0,10)}.jsonl`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  localStorage.setItem('trainlog.lastExport', String(Date.now()));
  toast('Backup downloaded'); render();
}

/* ── Automatic off-device backup ──────────────────────────────────────
   Posts the whole backup to a Google Apps Script web app, which writes it
   into a Sheet. Sending everything each time makes it idempotent and
   self-healing: a missed sync repairs itself on the next one.

   The browser sends this no-cors, so the response can't be read and delivery
   can't be confirmed from here. Check the Sheet occasionally. */
async function syncNow(silent){
  const url=(CFG.syncUrl||'').trim();
  if(!url){ if(!silent) toast('No sync URL set'); return false; }
  try{
    await fetch(url,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body:backupText()});
    localStorage.setItem('trainlog.lastSync', String(Date.now()));
    if(!silent) toast('Sent to your sheet');
    return true;
  }catch(e){ if(!silent) toast('Sync failed — check the URL'); return false; }
}
const lastSyncAt=()=>Number(localStorage.getItem('trainlog.lastSync')||0);

/* One tap into iCloud Drive rather than a download that lands in Downloads.
   Falls back to a normal download where sharing files isn't supported. */
async function shareBackup(){
  const name=`trainlog-backup-${new Date().toISOString().slice(0,10)}.jsonl`;
  try{
    const file=new File([backupText()],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Trainlog backup'});
      localStorage.setItem('trainlog.lastExport',String(Date.now()));
      render(); return;
    }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  exportLog();
}

/* Import MERGES by event id — importing the same file twice is harmless,
   and importing an older backup never deletes newer events. */
function importBackup(text){
  const lines=text.split('\n').filter(Boolean);
  let cfgIn=null; const incoming=[];
  for(const l of lines){
    let o; try{ o=JSON.parse(l); }catch{ continue; }
    if(o.type==='config_snapshot'){ cfgIn=o.cfg; continue; }
    incoming.push(o);
  }
  const have=new Set(LOG.map(e=>e.id||JSON.stringify(e)));
  const added=incoming.filter(e=>!have.has(e.id||JSON.stringify(e)));
  if(!added.length&&!cfgIn) return {added:0,cfg:false};
  const merged=[...LOG,...added].sort((a,b)=>(a.ts||'')<(b.ts||'')?-1:1);
  try{ localStorage.setItem(LS_KEY, merged.map(e=>JSON.stringify(e)).join('\n')); }
  catch{ alert('Not enough space to import that backup.'); return {added:0,cfg:false}; }
  LOG=merged;
  return {added:added.length, cfg:!!cfgIn, cfgData:cfgIn};
}

/* Shared tail end of both restore paths (file + sheet): offer to restore the
   program config, then report what changed. */
function finishImport(res){
  if(res.cfg&&confirm('This backup contains a program (roadmap, goals, split). Restore it too?\n\nYour current program will be replaced.')){
    CFG={...CFG,...res.cfgData}; ROADMAP=(CFG.roadmap&&CFG.roadmap.length)?CFG.roadmap:ROADMAP;
    ROADMAP.forEach(b=>{ if(!b.vol||!b.vol.length) applyShape(b); });
    mergeCustom();
    applySetupLink(); saveCfg();
  }
  render();
  alert(res.added?`Restored ${res.added} new event${res.added>1?'s':''}.`:'Nothing new in that backup — your log already had everything in it.');
}

/* Fetches a script.google.com exec URL via JSONP. A plain cross-origin fetch()
   can't read the response body from these URLs, but a <script> tag isn't
   subject to CORS at all, so this works regardless. */
function jsonpFetch(url){
  return new Promise((resolve,reject)=>{
    const cb='trainlogJsonp'+Date.now()+Math.floor(Math.random()*1e6);
    const script=document.createElement('script');
    let done=false;
    const cleanup=()=>{ delete window[cb]; script.remove(); clearTimeout(timer); };
    const timer=setTimeout(()=>{ if(done) return; done=true; cleanup(); reject(new Error('timeout')); },15000);
    window[cb]=data=>{ if(done) return; done=true; cleanup(); resolve(data); };
    script.onerror=()=>{ if(done) return; done=true; cleanup(); reject(new Error('network')); };
    script.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.head.appendChild(script);
  });
}

/* Recovery path for when local data is gone: pulls the Raw backup tab
   straight from the sheet instead of requiring a manual copy-paste into a
   .jsonl file. Feeds the same importBackup() merge used by the file restore
   — no separate import/merge logic. */
async function restoreFromSheet(){
  const url=(CFG.syncUrl||'').trim();
  if(!url) return;
  if(session&&!confirm('You have a session in progress. Restoring now will replace your log underneath it.\n\nFinish or end that session first. Continue anyway?')) return;
  let text;
  try{ text=await jsonpFetch(url+'?action=fetch'); }
  catch(e){ alert('Could not reach your sheet — check your connection. Your local log was not modified.'); return; }
  if(typeof text!=='string'||!text.trim()){ alert('No backup found on the sheet yet. Your local log was not modified.'); return; }
  const lines=text.split('\n').filter(Boolean);
  const parseable=lines.filter(l=>{ try{ JSON.parse(l); return true; }catch{ return false; } });
  if(!parseable.length){ alert('That backup looked malformed and could not be read. Your local log was not modified.'); return; }
  const res=importBackup(text);
  finishImport(res);
}

/* Self-update. A new build on the host is noticed on launch and hourly, but
   never installs itself mid-session — you tap when you're ready. */
let waitingSW=null;
function showUpdate(reg){
  waitingSW=reg.waiting||reg.installing;
  $('#upd').classList.add('on'); document.body.classList.add('updating');
}
$('#updgo').onclick=()=>{
  if(session&&!confirm('You have a session in progress. Sets you logged are already saved, but updating will reload the app.\n\nUpdate now?')) return;
  $('#upd').classList.remove('on'); document.body.classList.remove('updating');
  if(waitingSW) waitingSW.postMessage({type:'SKIP_WAITING'});
  else location.reload();
};
$('#updno').onclick=()=>{ $('#upd').classList.remove('on'); document.body.classList.remove('updating'); };

function initUpdates(){
  if(!('serviceWorker' in navigator)||!location.protocol.startsWith('http')) return;
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller) showUpdate(reg);
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing; if(!nw) return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller) showUpdate(reg);
      });
    });
    // check on launch, when you come back to the app, and hourly
    const check=()=>reg.update().catch(()=>{});
    check();
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) check(); });
    setInterval(check, 3600e3);
  }).catch(()=>{});
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading) return; reloading=true; location.reload();
  });
}

function sheet(html){
  try{
    $('#dlgBody').innerHTML=html;
    const d=$('#dlg'); if(!d.open) d.showModal();
  }catch(err){
    console.error('sheet failed', err);
    $('#dlgBody').innerHTML=`<div style="text-align:center;padding:10px">
      <div style="font-weight:650;margin-bottom:10px">This popup hit a problem</div>
      <button class="btn pri wide" id="dlgRecover">Close</button></div>`;
    const rb=document.getElementById('dlgRecover');
    if(rb) rb.onclick=()=>{ try{$('#dlg').close();}catch{} };
  }
}
/* Short beep via WebAudio — no audio file needed, works offline, and iOS
   allows it here because it fires from code already running inside a user
   gesture chain (the tap that started the rest timer). */
let _actx=null;
function beep(){
  try{
    _actx = _actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=_actx.createOscillator(), g=_actx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,_actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,_actx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,_actx.currentTime+0.35);
    o.connect(g); g.connect(_actx.destination);
    o.start(); o.stop(_actx.currentTime+0.36);
  }catch{}
}
/* rest timer */
const REST_BY_ROLE={primary:180, secondary:120, accessory:90};
const LS_REST='trainlog.rest.v1';
const LS_PEND='trainlog.pending.v1';
const LS_WEEK='trainlog.weekedits.v1';
/* Wall-clock based, not a tick counter. iOS throttles setInterval when the
   screen locks — which is exactly when you're resting — so the remaining
   time is always derived from an end timestamp instead of counted down. */
let rest={endsAt:0,total:0,label:'',fired:false}, restIv=null, restHide=null;
function saveRest(){ try{ rest.endsAt?localStorage.setItem(LS_REST,JSON.stringify(rest))
  :localStorage.removeItem(LS_REST); }catch{} }
function startRest(sec,label){
  rest={endsAt:Date.now()+sec*1000, total:sec, label:label||'Rest', fired:false};
  saveRest(); showRest();
}
function showRest(){
  $('#restl').textContent=rest.label;
  $('#rest').classList.add('on');
  document.body.classList.add('resting');
  clearInterval(restIv); tickRest();
  restIv=setInterval(tickRest,250);
}
function restLeftSec(){ return Math.max(0, Math.round((rest.endsAt-Date.now())/1000)); }
function tickRest(){
  const left=restLeftSec();
  const m=Math.floor(left/60), ss=left%60;
  $('#restt').textContent=`${m}:${String(ss).padStart(2,'0')}`;
  $('#restbar').style.width=(rest.total?100-left/rest.total*100:100)+'%';
  if(left<=0&&!rest.fired){
    rest.fired=true;
    toast('Rest done'); beep(); if(navigator.vibrate) navigator.vibrate([120,60,120]);
    clearTimeout(restHide); restHide=setTimeout(stopRest,1200);
  }
}
function stopRest(){ clearInterval(restIv); restIv=null; clearTimeout(restHide); restHide=null;
  document.body.classList.remove('resting'); rest={endsAt:0,total:0,label:'',fired:false};
  saveRest(); $('#rest').classList.remove('on'); }
function restoreRest(){
  try{ const r=JSON.parse(localStorage.getItem(LS_REST)||'null');
    if(r&&r.endsAt>Date.now()){ rest=r; showRest(); } else localStorage.removeItem(LS_REST);
  }catch{}
}
$('#rest30').onclick=()=>{ clearTimeout(restHide); restHide=null;
  rest.endsAt=Math.max(rest.endsAt,Date.now())+30000; rest.total+=30; rest.fired=false; saveRest(); tickRest(); };
$('#restx').onclick=stopRest;
// resync the moment the screen comes back
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  try{ if(rest.endsAt) tickRest(); }catch(err){ console.error('tick resync failed',err); }
  try{ render(); }catch(err){ console.error('resync render failed',err); }
});

let tT; function toast(m){ const t=$('#toast'); t.textContent=themeToast(m); t.classList.add('on');
  clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('on'),1500); }

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();});
$('#noteBtn').onclick=()=>openNote();
$('#skipTop').onclick=()=>openAbandon();

/* Two genuinely different intentions, so they're two options rather than one
   ambiguous button:
     Leave  — walk away, keep what you logged (it happened, it counts)
     Cancel — this session was a mistake, void the sets too                */
function openAbandon(){
  const n=session?session.slots.reduce((a,x)=>a+x.sets.length,0):0;
  sheet(`<h2 style="font-size:21px;margin-bottom:3px">Leave this workout?</h2>
    <div class="muted tiny" style="margin-bottom:15px">${n} set${n===1?'':'s'} logged so far.</div>
    <div class="stack" id="ab"></div>
    <button class="btn ghost wide" id="abback" style="margin-top:10px">Keep training</button>`);
  const mk=(title,desc,fn,danger)=>{
    const b=el('button','btn wide'); b.style.cssText='text-align:left';
    b.innerHTML=`<div${danger?' style="color:var(--skip)"':''}>${esc(title)}</div>
      <div class="dim tiny" style="font-weight:400;margin-top:2px">${esc(desc)}</div>`;
    b.onclick=fn; $('#ab').appendChild(b);
  };
  mk('Leave and keep my sets','Ends the session. Everything you logged stays in your history.',()=>{
    $('#dlg').close(); openEndEarly();
  });
  mk('Cancel the whole workout','Voids the '+n+' set'+(n===1?'':'s')+' logged in this session. Use this if you started it by mistake.',()=>{
    if(!confirm('Cancel this workout and void '+n+' logged set'+(n===1?'':'s')+'?\n\nThey stay in the log as voided entries and stop counting toward anything.')) return;
    session.slots.forEach(sl=>sl.sets.forEach(x=>
      append({type:'correction',target_id:x.id,patch:null,reason:'workout cancelled'})));
    append({type:'session_end',session_id:session.id,day_name:session.dayName,
      session_rpe:null,cancelled:true,sets_done:0,sets_planned:session.slots.reduce((a,x)=>a+x.sets_target,0)});
    session=null; saveSession(); stopRest(); $('#dlg').close(); TAB='dash'; render();
    toast('Workout cancelled');
  },true);
  $('#abback').onclick=()=>$('#dlg').close();
}
$('#dlg').addEventListener('cancel',e=>e.preventDefault());
$('#fileIn').onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    if(session&&!confirm('You have a session in progress. Restoring now will replace your log underneath it.\n\nFinish or end that session first. Continue anyway?')){ return; }
    const res=importBackup(String(r.result));
    finishImport(res);
  };
  r.onerror=()=>alert('Could not read that file.');
  r.readAsText(f); e.target.value='';
};

loadAll(); applyTheme(); loadPending(); loadWeekEdits(); restoreSession();
if(session&&session.slots&&session.slots[session.openIdx]) seedDraft(session.slots[session.openIdx]);
restoreRest(); render(); initUpdates();
if(needsOnboarding()) setTimeout(()=>openOnboarding(0),250);
requestPersistence();
</script>
