/* FAST progression for a main lift's first set of the session (the top set
   where there is one): last exposure's load plus one step, same reps — as
   long as that exposure hit its target. After a miss the normal engine
   decides; a second miss in a row demotes the lift (rateState). Any lift on
   standard never reaches the override: its prescription is untouched. */
function fastRx(slot, pr, o){
  if(!o||!o.fresh||pr.lb==null||!isMainLift(slot.ex)||slotTrack(slot).sig) return pr;
  const rs=rateState(slotTrack(slot).ex);
  if(rs.rate!=='fast') return pr;
  // like with like: the last exposure of the same kind of set (top vs working)
  // prescribed for the same rep range. A lift trained several ways a week
  // (Monday's 3–5 top set, Wednesday's 8–12) must not carry one into the other —
  // that raised load AND reps together (found by tests/simulate.js)
  const lo=slot.reps[0], hi=slot.reps[1], cls=priceClass(slot);
  const same=[...rs.exs].reverse().find(e=>inClass(e.set,cls)&&e.set.target&&e.set.target.reps[0]===lo&&e.set.target.reps[1]===hi);
  if(!same||same.miss) return pr;
  const L0=same.load, R=Math.max(lo,Math.min(hi,same.set.reps));
  return {...pr, lb:stepUp(slot,L0), reps:R, src:'adding load each session', fast:true,
    note:'Last time '+fmt(L0,0)+' × '+same.set.reps+(same.set.rpe!=null?' @ RPE '+same.set.rpe:'')+' hit its target, so the load goes up one step at '+R+' reps. This lift keeps adding load each session until it misses twice in a row, then it moves to the normal progression on its own. (Judgement default: one step, two misses.)'};
}

/* ---------- Fatigue-triggered deloads (spec §3.6) ----------
   Proposed as a card, never imposed (B against fixed deloads as a growth
   tool; the fixed per-block toggle stays for anyone who wants it). Triggers,
   any of — JUDGEMENT DEFAULT thresholds, Grade D:
   - readiness falling three sessions running;
   - RPE up ≥1 at a matched load (±2.5%) versus 2–3 weeks ago, on a main lift
     or on two other exercises;
   - a joint at ladder level 3+;
   - 10+ weeks of sessions without a deload (a soft note only).
   Neutral readiness can't trigger it — a flat line isn't a trend. Accepting
   records 'deload_start' {sessions}: the next week of sessions (your days per
   week) is a deload in place of a normal week. */
/* Sessions trained after a given log entry — by position, since the log is
   append-only (timestamps can tie). */
function trainedAfterIndex(i){ let n=0; for(let k=i+1;k<LOG.length;k++) if(countsAsTrained(LOG[k])) n++; return n; }
let _ovCache=null, _ovLen=-1;
function deloadOverlay(){
  if(_ovLen===LOG.length) return _ovCache;
  _ovLen=LOG.length; _ovCache=null;
  for(let i=LOG.length-1;i>=0;i--){ const e=LOG[i];
    if(e.type==='deload_start'){ const done=trainedAfterIndex(i); if(done<(e.sessions||5)) _ovCache={ev:e, done, sessions:e.sessions||5}; break; } }
  return _ovCache;
}
function readinessFalling(){
  const r=readinessSeries().slice(-4).map(x=>x.v);
  return r.length===4&&r[1]<r[0]&&r[2]<r[1]&&r[3]<r[2];
}
/* RPE at a matched load now vs 14–28 days ago, per exercise (working sets):
   the AVERAGE RPE at a load (±2.5%) over the last week against the average
   at that load back then, at least two sessions on each side. Comparing single
   sets picked out reporting wobble — RPE is rated in half points, so two
   honest ratings of the same effort can differ by 1 — and the simulator
   showed the deload card on almost every week of every persona. Reps must
   match too (±1), and only each session's first set counts. */
const DRIFT_MIN_SETS=2;
function rpeDrift(exId){
  // each session's FIRST working set only: later sets are tired by design, and
  // when a hard set drops the load, a tired third set lands on the same weight
  // as a fresh first set from weeks before — that read as "feels harder"
  const firsts=new Map();
  for(const st of sets()){ if(st.set_kind==='warmup'||st.rpe==null||!onTrack(st,exId,'')||!inClass(st,'work')) continue; if(!firsts.has(st.session_id)) firsts.set(st.session_id,st); }
  const ss=[...firsts.values()];
  if(ss.length<2*DRIFT_MIN_SETS) return null;
  const now=Date.now(), age=st=>(now-new Date(st.ts))/864e5;
  const recent=ss.filter(st=>age(st)<=7), old=ss.filter(st=>age(st)>=14&&age(st)<=28);
  const mean=a=>a.reduce((t,x)=>t+x.rpe,0)/a.length;
  let best=null;
  recent.forEach(r=>{ const L=toLb(r.weight); if(!L) return;
    // matched load AND matched reps (±1): the effort ramp asks for more reps at a
    // load later in a block, and that higher RPE is the plan, not fatigue
    const near=x=>Math.abs(toLb(x.weight)-L)/L<=0.025&&Math.abs(x.reps-r.reps)<=1;
    const rn=recent.filter(near), on=old.filter(near);
    if(rn.length<DRIFT_MIN_SETS||on.length<DRIFT_MIN_SETS) return;
    const d=mean(rn)-mean(on); if(best==null||d>best) best=d; });

}
function weeksWithoutDeload(){
  const dpw=sessionsPerWeek()||5;
  let lastTs=null, lastIdx=-1;
  for(let i=LOG.length-1;i>=0;i--){ const e=LOG[i]; if(e.type==='deload_start'){ lastTs=e.ts; lastIdx=i; break; } }
  // counted from the END of the last deload, not its start
  const n=lastIdx>=0?Math.max(0,trainedAfterIndex(lastIdx)-(LOG[lastIdx].sessions||dpw)):LOG.filter(e=>countsAsTrained(e)&&e.ts>(CFG.start?CFG.start+'T00:00':'')).length;
  // a scheduled block deload also resets the count
  const ph=currentPhase(); if(ph&&ph.onDeload) return 0;
  const pos=ROADMAP.length?programPosition():null;
  if(pos&&!lastTs){
    // weeks trained since the last deload week actually reached (a block's
    // planned deload only counts once you're past it)
    let w=0;
    for(let i=0;i<=pos.idx;i++){ const b=ROADMAP[i];
      if(b.type==='deload'){ if(i<pos.idx) w=0; continue; }
      w+=i<pos.idx?b.weeks:Math.min(b.weeks,pos.week-1);
      if(i<pos.idx&&b.deload) w=0; }
    return w;
  }
  return Math.floor(n/dpw);
}
function deloadSignals(){
  const out=[];
  if(readinessFalling()) out.push({k:'readiness', strong:true, text:'your readiness has dropped three sessions running'});
  const goals=[...new Set(CFG.goals||[])].filter(id=>exById[id]);
  // a main lift drifting, or at least a third of the exercises that have enough
  // data: real fatigue shows up broadly; with ~15 accessories, two drifting by
  // chance in a normal week was routine (tests/simulate.js). Judgement default.
  const measured=EX.filter(ex=>!ex.rehab).map(ex=>({ex, d:rpeDrift(ex.id)})).filter(x=>x.d!=null);
  const drifted=measured.filter(x=>x.d>=1);
  if(drifted.some(x=>goals.includes(x.ex.id))||(drifted.length>=2&&drifted.length>=Math.ceil(measured.length/3)))
    out.push({k:'rpe', strong:true, text:'the same weights feel at least 1 RPE harder than 2–3 weeks ago ('+drifted.slice(0,3).map(x=>x.ex.name).join(', ')+')'});
  const hot=JOINTS.filter(j=>jointLevel(jointTrend(j,6))>=3);
  if(hot.length) out.push({k:'joint', strong:true, text:'your '+hot.join(' and ')+' '+(hot.length>1?'are':'is')+' at ladder level 3 or higher'});
  if(weeksWithoutDeload()>=10) out.push({k:'weeks', strong:false, text:'it has been 10 or more weeks since a deload'});
  return out;
}
PROPOSAL_SOURCES.push(()=>{
  const ph=currentPhase(); if(!ph||ph.onDeload||!ROADMAP.length) return null;
  const sig=deloadSignals(); if(!sig.length) return null;
  const strong=sig.some(x=>x.strong);
  const dpw=sessionsPerWeek()||5;
  return {id:'deload', snoozeDays:strong?7:14, title:strong?'Take a deload week?':'Due for a deload?',
    body:'Because '+sig.map(x=>x.text).join('; ')+'. A deload is '+dpw+' lighter sessions — fewer sets, easier loads — in place of a normal week, then the block carries on. '
      +(strong?'':'This one is just the calendar, so skip it if you feel fine. ')+'The thresholds are judgement defaults.',
    accept:{label:'Deload this week', fn:()=>{ append({type:'deload_start',sessions:dpw,reasons:sig.map(x=>x.k)}); toast('Deload week on — the next '+dpw+' sessions are lighter'); }},
    decline:{label:'Not now'}};
});

/* ---------- Training max and realization (spec §2.3–2.4) ----------
   The training max (TM) is a PLANNING number per main lift, separate from the
   live e1RM the per-set engine prices with. It changes only by recorded
   decisions — a 'tm_update' event — never by an ordinary session's top set:
   - initial: 90% of your e1RM, recorded when a strength-block session with
     that lift starts (Grade D convention);
   - realization: the AMRAP at the end of a strength block → 90% of its e1RM,
     capped at +5% per block; short of the block's rep target → −5%.
   JUDGEMENT DEFAULTS, GRADE D: 90%, +5% cap, −5% on a short AMRAP, and the
   AMRAP loads by rep focus (8+ reps 75%, 5–7 85%, ≤4 90% of TM). */
const TM_OF_E1=0.9, TM_CAP_UP=1.05, TM_SHORT=0.95;
function tmFor(exId){
  // fast lift: the TM tracks behind the latest top set — 90% of what it shows, no cap
  if(isMainLift(exId)){
    const rs=rateState(exId);
    const e1At=e=>e?(setE1RM(e.set)||(e.set.rpe!=null?impliedE1(e.load+bwOffset(exById[exId]),e.set.reps,e.set.rpe):null)):null;
    if(rs.rate==='fast'){ const v=e1At(rs.last); if(v) return {tm:v*TM_OF_E1, src:'fast'}; }
    else if(rs.demoted){
      // demoted: the TM at that moment is the base the normal caps work from,
      // until a recorded update comes after it
      const di=LOG.findIndex(e=>e.id===rs.demoted.set.id);
      let after=null; for(let i=LOG.length-1;i>di;i--){ const e=LOG[i]; if(e.type==='tm_update'&&e.exercise_id===exId&&e.tm_lb>0){ after=e; break; } }
      if(after) return {tm:after.tm_lb, src:'logged', ev:after};
      const v=e1At(rs.demoted); if(v) return {tm:v*TM_OF_E1, src:'demoted'};
    }
  }
  for(let i=LOG.length-1;i>=0;i--){ const e=LOG[i]; if(e.type==='tm_update'&&e.exercise_id===exId&&e.tm_lb>0) return {tm:e.tm_lb, src:'logged', ev:e}; }
  const b=bestE1RM(exId);

}
/* Recorded at a deliberate moment (session start), so it can't drift with every set. */
function ensureInitialTM(exId){
  const t=tmFor(exId);
  if(!t||t.src==='logged'||t.src==='fast'||t.src==='demoted') return null;
  return append({type:'tm_update',exercise_id:exId,tm_lb:t.tm,prev_lb:null,reason:'initial'});
}
const amrapPct=reps=>reps[1]>=8?0.75:reps[1]>=5?0.85:0.90;
/* The last training week of a strength block (before its deload, if any). */
const isRealizationWeek=ph=>!!ph&&ph.type==='str'&&!ph.taper&&ph.realize!==false&&!ph.onDeload&&ph.week===(ph.deload?ph.weeks-1:ph.weeks);
function amrapRx(slot){
  const ex=exById[slot.ex], t=tmFor(slotTrack(slot).ex), pct=amrapPct(slot.reps), off=bwOffset(ex);
  if(!t) return {lb:null, reps:slot.reps[1], src:null, note:'No training max yet — log a few sets of this lift first. Pick a load you could do for well over '+slot.reps[1]+' reps.'};
  const lb=gridFloor(slot, Math.max(0,t.tm*pct-off));
  return {lb, reps:slot.reps[1], src:'realization AMRAP · '+Math.round(pct*100)+'% of your training max', amrap:true,
    note:'Last week of the strength block: one set of as many reps as you can at '+Math.round(pct*100)+'% of your training max ('+fmt(t.tm,0)+(t.src==='initial'?', 90% of your e1RM':'')+'). '
      +'Aim for at least '+slot.reps[1]+'. It updates your training max: 90% of what it shows, at most +5%; short of '+slot.reps[1]+' drops it 5%. These percentages are judgement defaults.'};
}
/* After the AMRAP is logged: the one place a TM moves up or down. */
function tmFromAmrap(slot, ev){
  const ex=exById[slot.ex], exId=slotTrack(slot).ex, cur=tmFor(exId); if(!cur) return null;
  const prev=cur.tm, target=slot.reps[1], off=bwOffset(ex), L=toLb(ev.weight)+off;
  let tm, reason;
  if(ev.reps<target){ tm=prev*TM_SHORT; reason='short'; }
  else{
    const e1=impliedE1(L,ev.reps,ev.rpe!=null?ev.rpe:10)||e1rm(L,ev.reps);
    // the +5% cap applies once the lift is on standard progression
    const capped=rateOf(exId)!=='fast';
    tm=e1?(capped?Math.min(e1*TM_OF_E1,prev*TM_CAP_UP):e1*TM_OF_E1):prev*TM_CAP_UP; reason='realization';
  }
  return append({type:'tm_update',exercise_id:exId,tm_lb:tm,prev_lb:prev,reason,set_id:ev.id,target_reps:target});
}

/* ---------- Technique layer (spec §6.1–6.3) ----------
   The app can't see the lift; it can make setup consistent, prompt video and

   where the session has no top set (hypertrophy blocks until batch B), its
   first working set. */
const isMainLift=exId=>(CFG.goals||[]).includes(exId);
function techFirstSet(slot){

}
/* §6.1 — your own setup note first, then up to three library setup cues. */
function checklistItems(exId){

  const cue=CUES[exId];

    :(EXERCISE_TIPS[exId]||[]);

/* §6.2 — every 3–4 weeks per main lift (21 days; judgement default, Grade D).

const VIDEO_EVERY_DAYS=21;
function lastVideoPrompt(exId){

  return null;
}
function videoDue(exId, now){

}
/* §6.3 — after a main lift's top set / AMRAP (or first set, see above) that

const STICK_LABEL={bottom:'At the bottom',off_chest:'Off the chest',off_floor:'Off the floor',mid:'Mid-range',

function stickingPending(slot){

  const st=slot.sets.find(x=>x.role==='top'||x.role==='amrap')||(isTopBack(slot)||isMaint(slot)||slot.structure==='amrap'?null:slot.sets[0]);
  if(!st||!(st.failed||(st.rpe!=null&&st.rpe>=9.5))) return null;
  if((session.stickSkip||{})[slot.ex]) return null;
  if(LOG.some(e=>e.type==='sticking_report'&&e.session_id===session.id&&e.exercise_id===slot.ex)) return null;
  return {set:st, options:FAMILY_STICKING[fam].concat('nowhere')};
}
function techniqueBlock(slot){
  const box=el('div',''); if(!session) return box;
  const ex=exById[slot.ex], main=isMainLift(slot.ex), first=techFirstSet(slot);
  session.checklist=session.checklist||{}; session.video=session.video||{};
  // §6.1 setup checklist

    const items=checklistItems(slot.ex);
    if(items.length){
      const c=el('div','qblock'); c.style.cssText='margin:10px 0 0;border-left:3px solid var(--accent)';
      c.innerHTML='<div class="qlab">Before your '+(isTopBack(slot)||slot.structure==='amrap'?'top set':'first set')+'</div>';
      items.forEach(it=>{ const r=el('label',''); r.style.cssText='display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer';
        r.innerHTML='<input type="checkbox" style="margin-top:3px"><span class="sm'+(it.own?'':' muted')+'">'+esc(it.text)+'</span>'; c.appendChild(r); });
      const row=el('div','row'); row.style.cssText='gap:6px;margin-top:6px';
      const ok=el('button','btn s','Done'); ok.onclick=()=>{ session.checklist[slot.ex]=true; saveSession(); renderWork(); };
      const off=el('button','btn s ghost','Don\'t show for this exercise'); off.onclick=()=>{ CFG.checklistOff=CFG.checklistOff||{}; CFG.checklistOff[slot.ex]=true; saveCfg(); renderWork(); };
      row.append(ok,off); c.appendChild(row);
      if(!exNote(slot.ex,'setup')) c.appendChild(el('div','dim tiny','Add your own setup — seat, pin, stance — on the exercise\'s info sheet; it shows first here.')).style.marginTop='6px';
      box.appendChild(c);
    }
  }
  // §6.2 video prompt
  if(main&&first&&!session.video[slot.ex]&&videoDue(slot.ex)){
    const last=lastVideoPrompt(slot.ex), lastDone=[...LOG].reverse().find(e=>e.type==='video_prompt'&&e.exercise_id===slot.ex&&e.done);
    const v=el('div','qblock'); v.style.cssText='margin:10px 0 0';
    v.innerHTML='<div class="qlab">Film this set</div><div class="muted sm">Side view, whole body in frame. The app doesn\'t keep the video — it just reminds you.'
      +(lastDone?' Compare with the one from '+esc(new Date(lastDone.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}))+'.':'')+'</div>';
    const row=el('div','row'); row.style.cssText='gap:6px;margin-top:8px';
    const rec=done=>{ append({type:'video_prompt',exercise_id:slot.ex,session_id:session.id,done,trigger:'scheduled'}); session.video[slot.ex]=true; saveSession(); renderWork(); };
    const y=el('button','btn s','I\'ll film it'); y.onclick=()=>rec(true);
    const n=el('button','btn s ghost','Skip this time'); n.onclick=()=>rec(false);
    row.append(y,n); v.appendChild(row); box.appendChild(v);
  }
  // §6.3 sticking point
  const sp=stickingPending(slot);
  if(sp){
    const q=el('div','qblock'); q.style.cssText='margin:10px 0 0;border-left:3px solid var(--warn)';
    q.innerHTML='<div class="qlab">Where did it slow down?</div><div class="dim tiny">That set was '+(sp.set.failed?'a missed rep':'RPE '+sp.set.rpe)+'. One tap — it helps work out what to change if this lift stalls.</div>';
    const ch=el('div','chips'); ch.style.marginTop='8px';
    sp.options.forEach(o=>{ const b=el('button','chip',esc(STICK_LABEL[o]||o)); b.style.cssText='font-size:12.5px;padding:6px 10px';
      b.onclick=()=>{ append({type:'sticking_report',exercise_id:slot.ex,session_id:session.id,set_id:sp.set.id,region:o,
        signature:modSig(sp.set.modifiers)||undefined}); renderWork(); toast('Noted'); };
      ch.appendChild(b); });
    q.appendChild(ch);
    const sk=el('button','btn s ghost','Not now'); sk.style.marginTop='8px';
    sk.onclick=()=>{ session.stickSkip=session.stickSkip||{}; session.stickSkip[slot.ex]=true; saveSession(); renderWork(); };
    q.appendChild(sk); box.appendChild(q);
  }
  return box;
}

/* What the engine actually recommended for this set, independent of whether
   the lifter followed it. Additive-only logging (see logSet): never read by
   any prescription or display code, so a set logged before this field
   existed just doesn't have one, and nothing about prescribing, logging or
   showing a set changes. This is what lets "is the engine improving?" become
   a measurable trend later (tests/backtest.js). */
function recordedSuggestion(slot, rec){
  if(!rec||rec.pr.lb==null) return undefined;
  const {pr,lb,o}=rec;
  return {
    lb, shown:shownLoad(slot, lb), reps:pr.reps, target_rpe:slot.rpe, basis:pr.src,
    readiness:o.adj?{score:Math.round(session.score*100),cut_pct:Math.round((1-o.adj.load)*100),applied_pct:o.adjApplied||0}:null,
    joint:slot.joint?{joint:slot.joint.joint,level:slot.joint.level,applied_pct:o.jointApplied||0,held:!!o.jointHeld}:null,
    fatigue:(pr.fatigue&&pr.fatigue.applied)?{rise:pr.fatigue.rise,pairs:pr.fatigue.n,sessions:pr.fatigue.sessions}:null,
    rep_range:slot.repSrc!=='block'?{src:slot.repSrc,muscle:slot.repMuscle||null,capped:!!slot.repCapped}:null
  };
}
/* The load as the set card shows it, in the unit you lift it in: a kg-only
   machine, or an exercise you last logged in kg, in half-kg steps; everything
   else in lb. The engine works in lb, so a 93 kg set came back as 205.03 lb —
   shown, nudged to 207.53 and loggable as a raw conversion. seedDraft() and
   the stored suggestion both use this, so what's recorded is what was shown. */
function shownLoad(slot, lb){
  const ex=exById[slot.ex];
  const fixedUnit=ex&&ex.unitPref&&ex.unitPref!=='both'?ex.unitPref:null;
  const last=fixedUnit?null:(lastSetFor(slotTrack(slot).ex,slotTrack(slot).sig)||lastSetFor(slot.ex));
  const unit=fixedUnit||(last&&last.weight&&last.weight.unit==='kg'?'kg':'lb');
  return unit==='kg'?{value:Math.round(lb/LB*2)/2, unit:'kg'}:{value:lb, unit:'lb'};
}
function seedDraft(slot, keepLocks){
  const ex=exById[slot.ex];
  // a re-seed of the same exercise (range change, card reopened) keeps what
  // you've typed: locked fields survive until the set is logged
  const prev=keepLocks&&draft.lockEx===slot.ex&&draftLocked()
    ?{w:draft.weight,u:draft.unit,r:draft.reps,rpe:draft.rpe,lock:{...draft.lock}}:null;
  const {pr,lb,why}=suggestFor(slot);
  const fixedUnit=ex.unitPref&&ex.unitPref!=='both'?ex.unitPref:null;
  if(lb!=null){
    const sh=shownLoad(slot, lb); draft.weight=sh.value; draft.unit=sh.unit;
  }else{ draft.weight=isBW(ex)?0:(ex.bar||50); draft.unit=fixedUnit||CFG.units||'lb'; }
  draft.reps=pr.reps??slot.reps[0]; draft.rpe=slot.rpe; draft.group=null; draft.alt=null;
  draft.suggestedLb=lb; draft.suggestedReps=draft.reps; draft.suggested=lb!=null; draft.why=why;
  draft.lock={}; draft.lockEx=slot.ex; draft.sugW=draft.sugR=lb!=null; draft.rebal=null;
  if(slot.structure==='amrap'&&!slot.sets.length) draft.rpe=10;
  if(slot.calib&&slot.sets.length===slot.sets_target-1&&slot.sets.length>0) draft.rpe=10;
  if(prev){
    draft.lock=prev.lock;
    if(prev.lock.w){ draft.weight=prev.w; draft.unit=prev.u; }
    if(prev.lock.r) draft.reps=prev.r;
    if(prev.lock.rpe) draft.rpe=prev.rpe;
    rebalanceDraft(slot);
  }
}
function logSet(slot,idx,kind,extend,over){
  const ex=exById[slot.ex];
  // over: {weight,unit,reps} — a warmup rung logs its own numbers and leaves
  // the working-set draft (and its suggestion) exactly as it was
  const W=over||draft;
  const T=TECHNIQUES[draft.tech];
  let group=null, setKind=kind;
  if(kind!=='warmup'&&draft.tech!=='straight'){
    if(extend&&draft.group){
      const n=slot.sets.filter(x=>x.group&&x.group.id===draft.group).length;
      group={id:draft.group,kind:draft.tech,pos:n};
      setKind=draft.tech==='drop'?'drop':draft.tech==='myo'?'myo':'cluster';
    }else{
      const gid=ulid(); draft.group=gid;
      group={id:gid,kind:draft.tech,pos:0};
      setKind=draft.tech==='drop'?'drop':draft.tech==='myo'?'myo':'cluster';
    }
  }
  if(!session.startedAt) session.startedAt=Date.now();
  // The suggestion shown before this set was edited, if any — stamped once
  // so future sessions can tell what was suggested vs. what you actually
  // logged, without ever rewriting the event later.
  const stampSuggestion=kind!=='warmup'&&!group&&slot.sets.length===0;
  const rec=(kind!=='warmup'&&!group)?suggestFor(slot):null;
  const suggestion=recordedSuggestion(slot,rec);
  const candidate={type:'set',session_id:session.id,slot:slot.ex,exercise_id:ex.id,
    weight:{value:W.weight,unit:W.unit}, bar:ex.bar?{value:ex.bar,unit:'lb'}:null,
    reps:W.reps, rpe:kind==='warmup'?null:draft.rpe, set_kind:setKind, group,
    ...(kind!=='warmup'&&cleanMods(slot.modifiers)?{modifiers:cleanMods(slot.modifiers)}:{}),
    ...(kind!=='warmup'?{role:group?'straight':(slot.structure==='amrap'&&!slot.sets.length)||(slot.calib&&slot.sets.length===slot.sets_target-1&&slot.sets.length>0)?'amrap':isTopBack(slot)?(topSetOf(slot)?'backoff':'top'):isMaint(slot)&&!topSetOf(slot)?'top':'straight'}:{}),
    ...(kind!=='warmup'&&draft.failed?{failed:true}:{}),
    // the target this set was actually prescribed against: a maintenance slot's
    // weekly top set is 3–5 @ RPE 7.5, not the slot's hypertrophy range
    target:(kind!=='warmup'&&!group&&isMaint(slot)&&!topSetOf(slot))?{reps:MAINT_TOP.reps.slice(),rpe:MAINT_TOP.rpe}:{reps:slot.reps,rpe:slot.rpe},
    suggested_lb:stampSuggestion?(draft.suggestedLb??null):null,
    ...(suggestion&&{suggestion})};
  // PR must be decided BEFORE the event is written, or the flag never persists
  const pr=kind==='warmup'?null:isPR(ex.id,candidate);
  if(pr) candidate.pr=true;
  const ev=append(candidate);
  if(!ev) return;
  if(kind!=='warmup'){ slot.sets.push(ev); draft.failed=false; }
  let tmMsg=null;
  if(ev.role==='amrap'){ const t=tmFromAmrap(slot,ev); if(t) tmMsg='Training max '+fmt(t.prev_lb,0)+' → '+fmt(t.tm_lb,0)+(t.reason==='short'?' (short of '+t.target_reps+')':''); }
  // fatigue-stop back-offs: done when one feels as hard as the top set, or at N+2
  if(ev.role==='backoff'&&backoffCfg().mode==='fatigue'){
    const top=topSetOf(slot), n=(slot.backoff&&slot.backoff.n)||1, done=slot.sets.filter(x=>x.role==='backoff').length;
    const reached=top&&top.rpe!=null&&ev.rpe!=null&&ev.rpe>=top.rpe;
    slot.sets_target=(reached||done>=n+2)?slot.sets.length:Math.max(slot.sets_target,slot.sets.length+1);
  }
  // after a top set of a technique, pre-fill the extension
  if(group&&group.pos===0){
    draft.reps=T.repHint(draft.reps);
    if(T.loadMul!==1) draft.weight=Math.max(ex.inc,Math.round(draft.weight*T.loadMul/ex.inc)*ex.inc);
  }
  /* Suggest the next set from what THIS set actually cost you — same
     nextPrescription() the next session/exercise-open uses, since the log
     (and lastSetFor()) already reflects the set just appended above. This
     is only a pre-fill: whatever the steppers show when Log Set is tapped
     is what gets logged, exactly like every other set. */
  if(kind!=='warmup'&&!group){
    const next=suggestFor(slot);
    if(next.lb!=null){
      draft.weight = draft.unit==='kg' ? Math.round(next.lb/LB*2)/2 : next.lb;
      draft.reps=next.pr.reps; draft.suggestedLb=next.lb; draft.suggestedReps=next.pr.reps;
      draft.suggested=true; draft.alt=null; draft.why=next.why;
      if(next.pr.calibAmrap) draft.rpe=10;
    }
    // the set is logged: locks clear, both numbers are the suggestion again
    draft.lock={}; draft.lockEx=slot.ex; draft.sugW=draft.sugR=next.lb!=null; draft.rebal=null;
  }
  saveSession();
  if(tmMsg) toast(tmMsg);
  else if(pr){ toast(`New best on ${ex.name} · +${fmt(pr.gain,0)} lb`); if(navigator.vibrate) navigator.vibrate(80); }
  else toast(kind==='warmup'?'Warmup logged':group?`${group.pos===0?'Top set':TECHNIQUES[draft.tech].extend} logged`:`Set ${slot.sets.length} logged`);
  if(kind!=='warmup'){
    const rest=draft.group?45:(REST_BY_ROLE[slot.role]||120);
    startRest(rest, draft.group?'Cluster rest':`Rest · ${exById[slot.ex].name}`);
  }
  advanceIfDone(slot,idx);
  renderWork();
}

/* Move to the next unfinished exercise once this one is complete. Used by both
   logging a set and skipping one, so the two can't drift apart. */
function advanceIfDone(slot,idx){
  if(draft.group) return;                       // never jump mid-cluster
  if(slot.sets.length<slot.sets_target) return;
  if(session.openIdx!==idx) return;
  const nx=session.slots.findIndex((s,j)=>j>idx&&s.sets.length<s.sets_target);
  if(nx>-1){ session.openIdx=nx; seedDraft(session.slots[nx]); }
  else session.openIdx=-1;                      // everything done — collapse
}

/* 1–5 segmented control with a fixed descriptor under the chosen value */
function scaleBlock(label,anchors,initial,onPick,bare){
  const b=el('div',bare?'':'qblock');
  b.innerHTML=`<div class="qlab">${esc(label)}</div><div class="seg"></div><div class="anchor"></div>`;
  const seg=b.querySelector('.seg'), anc=b.querySelector('.anchor');
  let cur=initial;
  const paint=()=>{ seg.querySelectorAll('button').forEach((x,i)=>
      x.setAttribute('aria-pressed',i+1===cur?'true':'false'));
    anc.textContent=anchors[cur-1]||''; };
  for(let i=1;i<=5;i++){ const x=el('button','',String(i));
    x.onclick=()=>{cur=i;onPick(i);paint();}; seg.appendChild(x); }
  onPick(initial); paint(); return b;
}
/* Tap a joint to flag it (moderate by default), then say how bad if it isn't
   moderate. Stored as 1 mild / 2 moderate / 3 bad — events carrying these get
   joint_scale:3 so older tap-only events stay distinguishable. */
function jointChips(hostSel,store){
  const host=$(hostSel);
  const sevHost=el('div',''); sevHost.style.cssText='width:100%;margin-top:6px';
  const drawSev=()=>{
    sevHost.innerHTML='';
    Object.keys(store).forEach(j=>{
      const row=el('div','row'); row.style.cssText='gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap';
      row.appendChild(el('span','dim tiny',esc(j)+':'));
      [1,2,3].forEach(v=>{
        const c=el('button','chip',JOINT_SEV_LABEL[v]); c.style.cssText='font-size:12px;padding:4px 9px';
        c.setAttribute('aria-pressed',store[j]===v?'true':'false');
        c.onclick=()=>{ store[j]=v; drawSev(); };
        row.appendChild(c);
      });
      sevHost.appendChild(row);
    });
  };
  JOINTS.forEach(o=>{
    const b=el('button','chip warn',esc(o)); b.setAttribute('aria-pressed','false');
    b.onclick=()=>{ const on=b.getAttribute('aria-pressed')==='true';
      b.setAttribute('aria-pressed',on?'false':'true');
      if(on) delete store[o]; else store[o]=2;
      drawSev(); };
    host.appendChild(b);
  });
  host.appendChild(sevHost);
}

    session.readiness={sleep:st.sleep,motivation:st.motivation,recovery:st.recovery,sore:st.sore,joints:st.joints};
    const score=readinessScore(st, session.soreGroups);
    const adj=physicalCut(st, session.soreGroups);
    session.score=score; session.adj=adj;
    // today's joint flags are in the log now, so re-run the ladder for each
    // exercise: affected patterns only, never a session-wide cut
    session.slots.forEach(sl=>{

      if(sl.joint&&sl.joint.level>=4&&!(before&&before.level>=4)&&!sl.sets.length&&sl.sets_target>2) sl.sets_target--;
    });
    if(adj){
      session.adjReason=adj.signal;
      // fewer sets on the main work only — accessories keep their volume
      session.slots.slice(0,2).forEach(s=>
        s.sets_target=Math.max(1, s.sets_target+adj.sets));
    }
    session.prep=buildPrep({slots:session.slots}, session.readiness).map(m=>({...m,done:false}));
    seedDraft(session.slots[0]); saveSession();
    $('#dlg').close(); render();
  };
}

/* Was the last session cut short by pain? Then ease the next one. */
const EASE_OFF_DAYS=10;
function lastEarlyPain(){
  for(let i=LOG.length-1;i>=0;i--){
    const e=LOG[i];
    if(e.type!=='session_end') continue;
    if(!(e.ended_early&&e.reason==='pain')) return null;   // only the most recent counts
    // a pain stop from weeks ago says nothing about today
    return (Date.now()-new Date(e.ts) <= EASE_OFF_DAYS*864e5) ? e : null;
  }
  return null;
}

/* The groups actually loaded this session, for the post-workout check —
   not the whole soreGroupsFor(day) set, which includes patterns that only
   got indirect work. */
function trainedGroupsThisSession(){
  const g=new Set();
  session.slots.forEach(sl=>{ const ex=exById[sl.ex]; if(!ex) return;
    Object.entries(ex.vol).forEach(([m,w])=>{ if(w>=1&&MUSCLE_GROUP[m]) g.add(MUSCLE_GROUP[m]); }); });
  return [...g];
}
const GROUP_LABEL={push:'Chest / shoulders / triceps',pull:'Back / biceps',

  if(unrated.length){

    unrated.forEach(exId=>{

/* ═══ ROADMAP EDITOR ═══
   Phases are ordered intents. No phase stores a date — dates come from
   anchor + order + durations, so extending one block shifts everything
   downstream for free. */

function roadmapWeeks(){ return ROADMAP.reduce((a,b)=>a+blockLen(b),0); }

/* Linter: warnings only, never blocks. A linter that stops you training
   is worse than no linter. */
function lintRoadmap(){
  const w=[];
  if(!ROADMAP.length) return [{sev:'warn',msg:'No blocks yet. Add at least one.'}];
  ROADMAP.forEach((b,i)=>{
    const prev=ROADMAP[i-1];
    if(b.taper&&(!prev||prev.type!=='str'))
      w.push({sev:'warn',msg:`Block ${i+1}: a taper with no strength block before it.`});
    if(b.taper&&!CFG.targetFixed&&!CFG.testDate)
      w.push({sev:'info',msg:`Block ${i+1}: a taper only makes sense before a fixed target date or a test date — neither is set.`});
    if(b.type==='str'&&(!prev||(prev.type!=='hyp'&&prev.type!=='deload')))
      w.push({sev:'warn',msg:`Block ${i+1}: strength with no accumulation before it.`});
    const lim=b.taper?[1,3]:{hyp:[3,10],str:[2,6],deload:[1,2]}[b.type]||[1,10];
    if(b.weeks<lim[0]||b.weeks>lim[1])
      w.push({sev:'info',msg:`Block ${i+1}: ${b.weeks} weeks is outside the usual ${lim[0]}–${lim[1]} for ${TYPE_NAME[b.type].toLowerCase()}.`});
    if(b.emphasis==='high'&&Math.max(...b.vol)>=20)
      w.push({sev:'warn',msg:`Block ${i+1}: high emphasis peaks at ${Math.max(...b.vol)} sets/muscle, at or past MRV for most groups.`});
    if((b.hyp||[]).length>3)
      w.push({sev:'warn',msg:`Block ${i+1}: ${b.hyp.length} priority muscles. Total volume is bounded — 3 is the cap.`});
    weekCoverage(splitFor(b).week).forEach(m=>w.push({sev:'info',msg:'Block '+(i+1)+': '+m}));
    // compare the days themselves: a preset and the same week as a list are one shape
    if(prev&&splitFor(prev).week.join()!==splitFor(b).week.join())
      w.push({sev:'warn',msg:`Block ${i+1}: switches from ${splitFor(prev).name} to ${splitFor(b).name}. The day rotation restarts at day 1, and weekly volume per muscle shifts with the new shape.`});
  });
  let run=0;
  ROADMAP.forEach((b,i)=>{
    if(b.type==='deload'){ run=0; } else { run+=b.weeks; if(b.deload) run=0; }
    if(run>9){ w.push({sev:'info',fixAt:i,msg:`${run} weeks without a scheduled deload by block ${i+1}. The app proposes one when your readiness or effort says you need it; add one here if you prefer them fixed.`}); run=0; }
  });
  if(CFG.target&&CFG.start){
    const avail=weeksAvailable(CFG.start,CFG.target,programSplitSpec());
    const diff=avail-roadmapWeeks();
    if(Math.abs(diff)>1) w.push({sev:'info',
      msg:`Blocks total ${roadmapWeeks()} weeks but at your recent pace there are ${avail} to your target — ${diff>0?diff+' spare':Math.abs(diff)+' over'}.`});
  }
  return w;
}

/* Extending is additive and safe, so it happens automatically. Trimming
   deletes blocks you configured, so that stays a deliberate tap. */
function fillToTarget(draft, startDate, targetDate, splitKey){
  if(!startDate||!targetDate) return 0;
  const avail=weeksAvailable(startDate,targetDate,splitKey||programSplitSpec());
  let have=draft.reduce((a,b)=>a+blockLen(b),0), added=0, guard=0;
  while(avail-have>=4 && guard++<40){
    const last=draft[draft.length-1];
    const next=(!last||last.type==='str')?'hyp':'str';
    const weeks=next==='hyp'?5:4;
    if(avail-have < weeks+1) break;
    draft.push(applyShape({type:next,label:TYPE_NAME[next],weeks,hyp:[],deload:true,refined:true}));
    have+=weeks+1; added++;
  }
  // peaks are no longer appended here: a taper goes only before a fixed
  // target or a test date, and the builder (sequenceBlocks) places it
  return added;
}

/* ═══ PROGRESS ═══ */
function sparkline(series, color){
  if(series.length<2) return null;
  const W=600,H=90,pad=6;
  const vs=series.map(p=>p.v), min=Math.min(...vs), max=Math.max(...vs);
  const span=(max-min)||1;
  const pts=series.map((p,i)=>[
    pad+(i/(series.length-1))*(W-pad*2),
    pad+(1-(p.v-min)/span)*(H-pad*2)
  ]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`;
  const box=el('div','');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:90px;display:block" aria-hidden="true">
    <path d="${area}" fill="${color}" opacity=".13"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="4" fill="${color}"/>
  </svg>`;
  return box;
}

    cj.appendChild(el('div','dim tiny','Thresholds here are judgement defaults, not evidence. The app tracks and adjusts — it does not assess.'))
      .style.marginTop='9px';
  }
  v.appendChild(cj);

  // notes
  const rep=notesReport();
  const cn=el('div','card pad');
  cn.appendChild(el('div','row between',
    `<span style="font-weight:650">Notes</span><span class="dim tiny">${rep?rep.count+' open':'none open'}</span>`));
  if(!rep){
    cn.appendChild(el('div','empty','Tap the ✎ button any time to jot something down.<br>Notes sync to your backup sheet automatically.'));
  }else{
    const open=openFeedbackNotes().reverse();
    // newest 8 first; the rest one tap away — the copy below holds exactly this list
    (NOTES_SHOW_ALL?open:open.slice(0,8)).forEach(n=>{
      const t=NOTE_TAGS.find(x=>x.id===n.tag);
      const r=el('div',''); r.style.cssText='padding:9px 0;border-top:1px solid var(--line)';
      r.innerHTML=`<div class="row between">
          <span class="grow"><div class="sm">${esc(n.text)}</div>
            <div class="dim tiny" style="margin-top:2px">${esc(t?t.label:n.tag)} · ${
              new Date(n.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}${
              n.app_version?' · v'+n.app_version:''}${n.screen?' · '+esc(n.screen):''}</div></span></div>`;
      // Done is the owner's triage. A tester's notes went to the owner, so
      // they just see that it's been sent (or saved, if sending is off).
      if(CFG.testerName){
        r.appendChild(el('span','sbadge',(CFG.feedbackUrl||'').trim()?'Sent':'Saved')).style.cssText='display:inline-block;margin-top:7px;margin-left:0';
      }else{
        const done=el('button','btn s','Done'); done.style.marginTop='7px';
        done.onclick=()=>{ append({type:'note_resolved',target_id:n.id}); render(); toast('Marked done'); };
        r.appendChild(done);
      }
      cn.appendChild(r);
    });
    if(open.length>8){
      const more=el('button','btn ghost wide',NOTES_SHOW_ALL?'Show only the newest 8':'Show '+(open.length-8)+' older');
      more.style.marginTop='10px'; more.onclick=()=>{ NOTES_SHOW_ALL=!NOTES_SHOW_ALL; render(); };
      cn.appendChild(more);
    }
    const cp=el('button','btn pri wide','Copy all for Claude Code');
    cp.style.marginTop='12px'; if(CFG.testerName) cp.hidden=true;
    cp.onclick=async()=>{
      const r=notesReport(); if(!r) return;
      try{ await navigator.clipboard.writeText(r.text); toast(`${r.count} notes copied`); }
      catch{
        sheet(`<h2 style="font-size:19px;margin-bottom:10px">Copy this</h2>
          <textarea readonly rows="14" style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit;font-size:12.5px">${esc(r.text)}</textarea>
          <button class="btn ghost wide" id="cpc" style="margin-top:10px">Close</button>`);
        $('#cpc').onclick=()=>$('#dlg').close();
      }
    };
    cn.appendChild(cp);
    if(!CFG.testerName) cn.appendChild(el('div','dim tiny','Formatted and ready to paste into Claude Code.'))
      .style.marginTop='7px';
  }
  v.appendChild(cn);

  // diary
  const dAll=diaryEntries();
  if(dAll.length){
    const cd=el('div','card pad');
    cd.appendChild(el('div','row between',`<span style="font-weight:650">Diary</span><span class="dim tiny">${dAll.length} entr${dAll.length===1?'y':'ies'}</span>`));
    cd.appendChild(diaryRows(DIARY_ALL?dAll:dAll.slice(0,5)));
    if(dAll.length>5){ const m=el('button','btn s',DIARY_ALL?'Show recent only':'Show all '+dAll.length); m.style.marginTop='8px';
      m.onclick=()=>{ DIARY_ALL=!DIARY_ALL; render(); }; cd.appendChild(m); }
    v.appendChild(cd);
  }

  // session history
  const ends=LOG.filter(e=>e.type==='session_end').slice(-30).reverse();
  const cs=el('div','card');
  cs.appendChild(el('div','srowlab',`Sessions · ${LOG.filter(e=>e.type==='session_end').length} logged`));
  if(!ends.length) cs.appendChild(el('div','empty','No finished sessions yet.'));
  ends.forEach(e=>{
    const n=sets().filter(s=>s.session_id===e.session_id&&s.set_kind!=='warmup').length;
    const b=el('button','');
    b.style.cssText='width:100%;text-align:left;padding:11px 15px;border-top:1px solid var(--line)';

      <span class="grow"><div style="font-weight:600">${esc(e.day_name||'Session')}</div>
        <div class="dim tiny">${new Date(e.ts).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${n} sets${e.session_rpe?' · RPE '+e.session_rpe:''}${e.duration_s?' · '+Math.round(e.duration_s/60)+' min':''}</div>

      <span class="dim">›</span></div>`;
    b.onclick=()=>openSessionDetail(e);
    cs.appendChild(b);
  });
  v.appendChild(cs);
}

/* Total weight moved on working sets (warmups excluded), as logged —
   bodyweight lifts count the added load only. */
function sessionTonnage(sessionId){
  return sets().filter(x=>x.session_id===sessionId&&x.set_kind!=='warmup')
    .reduce((a,x)=>a+(toLb(x.weight)||0)*(x.reps||0),0);
}
/* Each exercise's best working set in a session, by estimated 1RM. */
function sessionTopSets(sessionId){
  const m={};
  sets().filter(x=>x.session_id===sessionId&&x.set_kind!=='warmup'&&!(x.group&&x.group.pos>0)).forEach(x=>{
    const v=setE1RM(x)||0; if(!m[x.exercise_id]||v>m[x.exercise_id].v) m[x.exercise_id]={v,s:x}; });
  return m;
}
/* The payoff screen after a finished session: what you did, what moved, and
   how it compares with the last time you trained this day. One tap to close. */
function openSessionSummary(endEv, score){
  const ss=sets().filter(x=>x.session_id===endEv.session_id&&x.set_kind!=='warmup');
  const ton=sessionTonnage(endEv.session_id);
  const prs=[...new Set(ss.filter(x=>isPRSet(x.id)).map(x=>(exById[x.exercise_id]||{name:x.exercise_id}).name))];
  const prev=LOG.filter(e=>e.type==='session_end'&&e.id!==endEv.id&&e.day_name===endEv.day_name
    &&countsAsTrained(e)&&new Date(e.ts)<new Date(endEv.ts)).pop();
  const fs=x=>fmt(x.weight.value)+(x.weight.unit==='kg'?' kg':'')+' × '+x.reps;
  let cmp='<div class="muted sm">First time you\'ve trained '+esc(endEv.day_name||'this day')+' — nothing to compare yet.</div>';
  if(prev){
    const pt=sessionTonnage(prev.session_id), d=ton-pt, pct=pt?Math.round(d/pt*100):0;
    const a=sessionTopSets(endEv.session_id), b=sessionTopSets(prev.session_id);
    const moved=Object.keys(a).filter(id=>b[id]&&(a[id].s.reps!==b[id].s.reps||Math.abs(toLb(a[id].s.weight)-toLb(b[id].s.weight))>0.01))
      .map(id=>{ const up=a[id].v>=b[id].v;
        return `<div class="row between sm" style="padding:3px 0"><span class="grow">${esc((exById[id]||{name:id}).name)}</span>
          <span style="flex:none;color:${up?'var(--accent)':'var(--muted)'}">${fs(b[id].s)} → ${fs(a[id].s)} ${up?'↑':'↓'}</span></div>`; }).join('');
    cmp=`<div class="row between sm"><span class="muted">Tonnage vs ${new Date(prev.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>
        <span style="font-weight:600">${d>=0?'+':''}${Math.round(d).toLocaleString()} lb${pt?' ('+(pct>=0?'+':'')+pct+'%)':''}</span></div>
      ${moved||`<div class="dim tiny" style="margin-top:4px">${Object.keys(a).some(id=>b[id])?'Same top sets as last time.':'No lifts in common with last time.'}</div>`}`;
  }
  sheet(`<h2 style="font-size:24px;margin-bottom:2px">${esc(endEv.day_name||'Session')} done</h2>
    <div class="muted tiny" style="margin-bottom:14px">${new Date(endEv.ts).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div>
    <div class="sgrid" style="border-radius:10px;overflow:hidden;margin-bottom:12px">
      <div class="scell"><div class="snum">${ss.length}</div><div class="slab">${ss.length===1?'set':'sets'}</div></div>
      <div class="scell"><div class="snum">${ton?Math.round(ton).toLocaleString():'—'}</div><div class="slab">lb moved</div></div>
      <div class="scell"><div class="snum">${endEv.duration_s!=null?(endEv.duration_s<60?'<1 min':Math.round(endEv.duration_s/60)+' min'):'—'}</div><div class="slab">time</div></div>
    </div>
    ${prs.length?`<div class="qblock" style="border-left:3px solid var(--accent)"><div class="qlab" style="color:var(--accent)">New best${prs.length>1?'s':''}</div>
      ${prs.map(n=>`<div class="sm">${esc(n)}</div>`).join('')}</div>`:''}
    <div class="qblock"><div class="qlab">Compared with last time</div>${cmp}</div>
    <div class="qblock"><div class="row between sm"><span class="muted">Readiness today</span>
      <span style="font-weight:600">${score!=null?Math.round(score*100)+' / 100 · '+esc(readinessLabel(score)):'No check-in this session'}</span></div></div>
    <button class="btn go wide" id="sumok">Done</button>`);
  $('#sumok').onclick=()=>{ $('#dlg').close(); render(); };
}
function openSessionDetail(endEv){
  const ss=sets().filter(s=>s.session_id===endEv.session_id);
  const byEx={};
  ss.forEach(s=>{ (byEx[s.exercise_id]=byEx[s.exercise_id]||[]).push(s); });
  const tonnage=sessionTonnage(endEv.session_id);
  const dur=endEv.duration_s?`${Math.round(endEv.duration_s/60)} min`:null;
  let html=`<h2 style="font-size:21px;margin-bottom:2px">${esc(endEv.day_name||'Session')}</h2>
    <div class="muted tiny" style="margin-bottom:6px">${new Date(endEv.ts).toLocaleString(undefined,{weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>
    <div class="row" style="gap:14px;margin-bottom:14px;flex-wrap:wrap">
      ${endEv.session_rpe?`<span class="sm"><span class="dim">RPE</span> <b>${endEv.session_rpe}</b></span>`:''}
      ${dur?`<span class="sm"><span class="dim">Time</span> <b>${dur}</b></span>`:''}
      ${tonnage?`<span class="sm"><span class="dim">Tonnage</span> <b>${Math.round(tonnage).toLocaleString()} lb</b></span>`:''}
      ${endEv.ended_early?`<span class="sm" style="color:var(--warn)">ended early · ${esc(endEv.reason)}</span>`:''}
    </div>`;
  Object.entries(byEx).forEach(([id,list])=>{
    const ex=exById[id];
    html+=`<div class="qblock"><div class="qlab" style="margin-bottom:7px">${esc(ex?ex.name:id)}</div>`;
    list.forEach((s,i)=>{
      const est=e1rm(toLb(s.weight),s.reps);
      html+=`<div class="row between sm" style="padding:3px 0">
        <span class="muted">${s.set_kind==='warmup'?'warmup':s.group&&s.group.pos>0?TECHNIQUES[s.group.kind].extend:'set '+(i+1)}</span>
        <span>${fmt(s.weight.value)} ${s.weight.unit} × ${s.reps}${s.rpe?` @ ${s.rpe}`:''}${est&&s.set_kind!=='warmup'?` · ${fmt(est,0)}`:''}${modLabel(s.modifiers)?`<span class="dim tiny"> · ${esc(modLabel(s.modifiers))}</span>`:''}</span></div>`;
    });
    html+=`</div>`;
  });
  if(!ss.length) html+=`<div class="empty">No sets recorded for this session.</div>`;
  const sd=diaryEntries({sessionId:endEv.session_id});
  if(sd.length) html+=`<div class="qblock" id="sddiary"><div class="qlab">Diary</div></div>`;
  html+=`<button class="btn ghost wide" id="sdclose">Close</button>`;
  sheet(html);
  if(sd.length) $('#sddiary').appendChild(diaryRows(sd));
  $('#sdclose').onclick=()=>$('#dlg').close();
}

/* Settings are edited in a module-level draft that OUTLIVES a single call to
   openSettings(). Without this, navigating into the goal-lift picker and back
   used to reset every in-progress edit — and worse, the picker rebuilt the
   dialog's HTML from a raw string snapshot, which orphaned the settings
   screen's own DOM node so later edits landed on a detached element the user
   could no longer see. That was the "goal lifts never change" bug. Now the
   picker is just another screen over the same persistent draft, and Save or
   Cancel is what clears it. */
let SETTINGS_DRAFT=null;
/* First-run setup. Every step is skippable and everything it sets is
   changeable later in Edit program — the goal is a usable program in about a
   minute, not an interrogation. Runs once; CFG.onboarded gates it. */
function needsOnboarding(){ return !CFG.onboarded && !LOG.some(e=>e.type==='set'); }

/* ---------- Program builder (spec §4.2) ----------
   Rerunnable. Quick setup (goal → days → main lifts → review) or full setup
   (goal, experience, schedule, main lifts, equipment, dates, constraints,
   review). Every step skippable. BUILDER is a module-level draft (the
   SETTINGS_DRAFT pattern) so the exercise picker can come and go without
   losing what you've chosen. Nothing changes until "Use this program"; a
   rerun keeps finished blocks and the one you're in, shows before/after, and
   never touches logged history. */
let BUILDER=null;
const BUILDER_QUICK=['path','goal','schedule','lifts','review'];
const BUILDER_FULL=['path','goal','experience','schedule','lifts','equipment','dates','constraints','review'];
const BUILDER_DEFAULT_WEEKS=24;   // when there's no target date — judgement default
function builderDefaults(rerun){
  return {rerun:!!rerun, path:rerun?'full':null, i:0, units:CFG.units||'lb',
    profile:CFG.profile||'even_mix', params:{...(CFG.profileParams||{})}, customise:false,
    experience:rerun?(CFG.experience||null):null, week:splitOf(programSplitSpec()).week, sessionLen:CFG.sessionLen||60,
    goals:[...new Set(CFG.goals||[])].filter(id=>exById[id]), est:{}, equipment:CFG.equipment||'mixed',
    // a fresh install's target is a placeholder made at load, not a date you chose
    target:CFG.onboarded?(CFG.target||''):'', targetFixed:CFG.onboarded&&!!CFG.targetFixed, testDate:CFG.testDate||'', conds:[...(CFG.conditions||[])],
    name:CFG.testerName||''};
}
const builderSteps=B=>B.path==='quick'?BUILDER_QUICK:BUILDER_FULL;
function builderParams(B){
  const base=PROFILES[B.profile]||PROFILES.even_mix, o=B.params||{};
  return {...base, ...['ratio','testEvery','peaks','specificity'].reduce((a,k)=>(o[k]!=null?{...a,[k]:o[k]}:a),{})};
}
const isoToday=()=>new Date().toISOString().slice(0,10);
const weeksBetween=(a,b)=>Math.max(0,Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5/7));
/* The plan the review shows. Pure: reads the draft and, for a rerun, where you are. */
function builderPlan(B){
  const from=B.rerun?isoToday():isoToday();
  const weeks=B.target?Math.max(SEQ.hyp[0],weeksBetween(from,B.target)):BUILDER_DEFAULT_WEEKS;
  const testWeek=B.testDate?weeksBetween(from,B.testDate):null;
  const o={params:builderParams(B), experience:B.experience, weeks, testWeek, targetFixed:!!(B.target&&B.targetFixed), goals:B.goals};
  if(B.rerun){
    const r=planFromNow(o);
    // kept blocks keep the week they had, if the program week is changing
    const oldWeek=splitOf(programSplitSpec()).week;
    if(oldWeek.join()!==B.week.join())
      r.blocks.slice(0,r.kept).forEach(b=>{ if(!validWeek(b.week)&&!(b.split&&SPLITS[b.split])) b.week=[...oldWeek]; });
    return {...r, weeks};
  }
  const g=sequenceBlocks(o);
  return {kept:0, blocks:g.blocks, reasons:g.reasons, leftover:g.leftover, weeks};
}
/* Accept: settings from the draft, roadmap from the plan. History untouched. */
function applyBuilder(B, plan){
  CFG.units=B.units; CFG.profile=B.profile; CFG.profileParams={...(B.params||{})}; CFG.experience=B.experience;
  // the experience answer only seeds each main lift's starting progression rate,
  // and only for a new setup — a rerun leaves rates to the log (rateState)
  if(!B.rerun) CFG.rateSeed={at:0, dflt:(B.experience==='intermediate'||B.experience==='advanced')?'standard':'fast', lifts:{}};
  // how long without a new best counts as a stall on standard progression
  CFG.stallWeeks=B.experience==='advanced'?6:4;
  // only when it actually changed — rewriting the same days as a list changes the
  // program's key and would drop pre-workout edits for nothing
  if(splitOf(programSplitSpec()).week.join()!==B.week.join()) CFG.week=[...B.week];
  CFG.sessionLen=B.sessionLen; CFG.goals=[...new Set(B.goals)]; CFG.equipment=B.equipment;
  CFG.conditions=[...B.conds]; CFG.testDate=B.testDate||null;
  if(!B.rerun) CFG.start=isoToday();
  if(B.target){ CFG.target=B.target; CFG.targetFixed=!!B.targetFixed; }
  else{ const t=new Date(); t.setDate(t.getDate()+plan.weeks*7); CFG.target=t.toISOString().slice(0,10); CFG.targetFixed=false; }
  if(B.name&&B.name.trim()) CFG.testerName=B.name.trim().slice(0,40);
  ROADMAP=plan.blocks.map(b=>({...b})); CFG.roadmap=ROADMAP; CFG.onboarded=true; saveCfg();
  // rough strength for main lifts: stated estimates, never fake sets
  Object.entries(B.est||{}).forEach(([id,v])=>{ if(v>0&&B.goals.includes(id))
    append({type:'e1rm_estimate',exercise_id:id,lb:B.units==='kg'?Math.round(v*LB*10)/10:v}); });
}
function openBuilder(rerun){
  try{ return drawBuilder(rerun); }
  catch(err){
    console.error('builder failed', err);
    sheet(`<h2 style="font-size:20px;margin-bottom:8px">This step hit a problem</h2>
      <div class="muted sm" style="margin-bottom:6px">Nothing was changed — your program and your log are exactly as they were.</div>
      <div class="dim tiny" style="margin-bottom:14px">${esc(String(err&&err.message||err))}</div>
      <div class="row" style="gap:8px"><button class="btn ghost grow" id="bfback">Back a step</button><button class="btn pri grow" id="bfclose">Close</button></div>`);
    $('#bfback').onclick=()=>{ if(BUILDER&&BUILDER.i>1) BUILDER.i--; else if(BUILDER){ BUILDER.path=null; BUILDER.i=0; } openBuilder(); };
    $('#bfclose').onclick=()=>{ BUILDER=null; $('#dlg').close(); };
  }
}
function drawBuilder(rerun){
  if(!BUILDER) BUILDER=builderDefaults(rerun);
  const B=BUILDER, steps=builderSteps(B), step=B.path?steps[B.i]:'path';
  const N=steps.length, n=Math.max(1,B.i+1);
  const go=d=>{ B.i=Math.max(0,Math.min(steps.length-1,B.i+d)); openBuilder(); };
  const titles={path:B.rerun?'Rebuild your program':'Set up your program', goal:'What are you training for?', experience:'How are your lifts going?',
    schedule:'How do you train?', lifts:'Your main lifts', equipment:'What equipment do you have?', dates:'Any dates?',
    constraints:'Anything you\'re working around?', review:B.rerun?'Before and after':'Your program'};
  const subs={path:B.rerun?'Builds the rest of your program from where you are. Finished blocks and the one you\'re in stay as they are. Nothing changes until you accept.':'About a minute. Every step can be skipped and changed later.',
    goal:'Sets the balance of strength and size blocks, and how often you test.', experience:'Sets how fast your main lifts start progressing. The program itself is the same either way.',
    schedule:'Days per week and the kind of days.', lifts:'Up to three. They get priority and their own strength tracking.',
    equipment:'Picks exercises you can actually do.', dates:'Optional. A fixed date or a test date shapes the end of the plan.',
    constraints:'Flags exercises that load an at-risk position. It warns, never blocks.', review:'One line per block on why it\'s there.'};
  sheet(`${B.path?`<div class="dim tiny" style="margin-bottom:8px">Step ${n} of ${N}</div>`:''}
    <h2 style="font-size:22px;margin-bottom:3px">${esc(titles[step])}</h2>
    <div class="muted tiny" style="margin-bottom:14px">${esc(subs[step])}</div>
    <div id="bld"></div>
    <div class="row bldnav" id="bldnav"></div>`);
  const host=$('#bld'), nav=$('#bldnav');
  const navBtn=(label,cls,fn)=>{ const b=el('button','btn '+cls+' grow',esc(label)); b.onclick=fn; nav.appendChild(b); return b; };
  const card=(on,title,sub,fn)=>{ const b=el('button','qblock'); b.style.cssText='display:block;width:100%;text-align:left;'+(on?'outline:2px solid var(--accent);':'');
    b.innerHTML=`<div style="font-weight:650">${esc(title)}</div>${sub?`<div class="muted tiny" style="margin-top:2px">${esc(sub)}</div>`:''}`; b.onclick=fn; host.appendChild(b); };
  const chipsRow=(opts,on,fn,label)=>{ const w=el('div','qblock'); if(label) w.innerHTML=`<div class="qlab">${esc(label)}</div>`;
    const c=el('div','chips'); opts.forEach(([v,l])=>{ const x=el('button','chip',esc(l)); x.setAttribute('aria-pressed',on(v)?'true':'false'); x.onclick=()=>{ fn(v); openBuilder(); }; c.appendChild(x); });
    w.appendChild(c); host.appendChild(w); return w; };

  if(step==='path'){
    card(false,'Quick setup','Goal, days per week, main lifts. Everything else on sensible defaults.',()=>{ B.path='quick'; B.i=1; openBuilder(); });
    card(false,'Full setup','Also experience, equipment, dates and anything you\'re working around.',()=>{ B.path='full'; B.i=1; openBuilder(); });
    if(!B.rerun) chipsRow([['lb','Pounds'],['kg','Kilograms']],v=>B.units===v,v=>{ B.units=v; },'Units');
    navBtn(B.rerun?'Cancel':'Skip setup','ghost',()=>{ if(B.rerun){ BUILDER=null; $('#dlg').close(); return; }
      B.path='quick'; const plan=builderPlan(B); applyBuilder(B,plan); BUILDER=null; $('#dlg').close(); TAB='dash'; render(); if(!CFG.introSeen) setTimeout(()=>openTutorial(0),250); });
    return;
  }
  if(step==='goal'){
    PROFILE_ORDER.forEach(k=>card(B.profile===k,PROFILES[k].label,PROFILES[k].blurb,()=>{ B.profile=k; B.params={}; openBuilder(); }));
    const cz=el('button','warmtog',(B.customise?'Hide':'Customise')+' the four settings ▸'); cz.onclick=()=>{ B.customise=!B.customise; openBuilder(); }; host.appendChild(cz);
    if(B.customise){
      const P=builderParams(B), cw=el('div','qblock');
      cw.innerHTML='<div class="qlab">Strength : size</div>';
      cw.appendChild(stepper('% strength',Math.round(P.ratio*100),5,v=>{ B.params.ratio=Math.max(0,Math.min(80,v))/100; openBuilder(); }));
      host.appendChild(cw);
      chipsRow([[0,'Never'],[1,'Every block'],[2,'Every 2nd'],[3,'Every 3rd']],v=>P.testEvery===v,v=>{ B.params.testEvery=v; },'Test strength');
      chipsRow([['yes','Before a fixed date or test'],['before_tests','Only before a test'],['no','Never']],v=>P.peaks===v,v=>{ B.params.peaks=v; },'Taper (peak)');
      chipsRow([['high','High'],['medium','Medium'],['low','Low']],v=>P.specificity===v,v=>{ B.params.specificity=v; },'How much to favour the main lifts themselves');
    }
  }
  if(step==='experience'){
    Object.entries(EXPERIENCE).forEach(([k,e])=>card(B.experience===k,e.label,null,()=>{ B.experience=k; openBuilder(); }));
    if(B.experience){
      const wk=B.experience==='advanced'?6:4;
      const why=B.experience==='novice'
        ?'You\'ll likely keep adding weight almost every session for a while. Each main lift stays on this faster progression until it stalls two sessions in a row, then it switches to the normal block progression on its own. You don\'t need to do anything.'
        :'Your main lifts start on the normal progression: reps build up across each lift\'s range, then the load goes up. If a lift goes about '+wk+' weeks without a new best while you\'re training it every week, that\'s a stall — the dashboard will say so, and the program will need changing. If a lift starts climbing quickly again, it moves to adding load each session on its own at the start of the next block.';
      host.appendChild(el('div','qblock','<div class="sm" style="line-height:1.55">'+esc(why)+'</div>'));
    }
  }
  if(step==='schedule'){
    host.appendChild(weekPicker(B.week,w=>{ B.week=w; openBuilder(); }));
    if(B.path==='full') chipsRow([[45,'45 min'],[60,'1 hour'],[75,'75 min'],[90,'90 min']],v=>B.sessionLen===v,v=>{ B.sessionLen=v; },'Rough session length');
  }
  if(step==='lifts'){
    B.goals.forEach((id,i)=>{
      const ex=exById[id]; if(!ex) return;
      const r=el('div','qblock');
      r.innerHTML=`<div class="row between"><span style="font-weight:600">${i+1}. ${esc(ex.name)}</span></div>`;
      const x=el('button','iconbtn','✕'); x.setAttribute('aria-label','Remove'); x.style.color='var(--skip)';
      x.onclick=()=>{ B.goals.splice(i,1); delete B.est[id]; openBuilder(); }; r.firstChild.appendChild(x);
      const known=bestE1RM(id);
      if(known&&!known.stated){
        // logged sets beat a guess: a stated estimate is ignored once a lift has sets, so don't ask for one
        r.appendChild(el('div','field','Estimated one-rep max from your log: <b>'+fmt(known.v,0)+' lb</b> (from a set of '+known.reps+'). Your logged sets set the loads, so there is nothing to guess here.')).style.marginTop='8px';
      }else{
        r.appendChild(el('div','field','Rough one-rep max (optional) — so the first session has loads')).style.marginTop='8px';
        const v=B.est[id];
        r.appendChild(stepper(isBW(ex)?'added '+B.units:B.units, v==null?(isBW(ex)?0:(B.units==='kg'?60:135)):v, B.units==='kg'?2.5:5,
          nv=>{ B.est[id]=Math.max(0,nv); openBuilder(); }, null, {typeable:true,min:0}));
        r.appendChild(el('div','dim tiny',v==null?(known?'You already entered '+fmt(known.v,0)+' lb. Leave it to keep that, or set a new number.':'Not set yet — the number is only where the buttons start.'):'Saved as your starting estimate.')).style.marginTop='4px';
      }
      host.appendChild(r);
    });
    if(B.goals.length<3){ const add=el('button','btn wide',B.goals.length?'Add another':'Pick a main lift');
      add.onclick=()=>exPicker('Pick a main lift', e=>!B.goals.includes(e.id)&&mainEligible(e), e=>{ B.goals.push(e.id); openBuilder(); }, {keepOpen:true,onCancel:()=>openBuilder()});
      host.appendChild(add); }
  }
  if(step==='equipment') chipsRow(Object.entries(EQUIPMENT),v=>B.equipment===v,v=>{ B.equipment=v; });
  if(step==='dates'){
    const d=el('div','qblock');
    d.innerHTML=`<div class="qlab">Target date</div><input type="date" id="bdt" value="${esc(B.target)}">
      <label style="display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" id="bdf"${B.targetFixed?' checked':''}><span class="sm">Fixed — the plan has to end on it</span></label>
      <div class="qlab" style="margin-top:14px">Test or meet date <span class="dim tiny" style="font-weight:400">· optional</span></div><input type="date" id="bdx" value="${esc(B.testDate)}">`;
    host.appendChild(d);
    $('#bdt').onchange=e=>{ B.target=e.target.value; }; $('#bdf').onchange=e=>{ B.targetFixed=e.target.checked; }; $('#bdx').onchange=e=>{ B.testDate=e.target.value; };
  }
  if(step==='constraints') chipsRow(Object.entries(CONDITIONS).map(([k,c])=>[k,c.name]),v=>B.conds.includes(v),v=>{ B.conds=B.conds.includes(v)?B.conds.filter(x=>x!==v):B.conds.concat(v); });
  if(step==='review'){
    const plan=builderPlan(B), list=el('div','qblock');
    const row=(b,i,dim)=>`<div style="padding:7px 0;border-top:1px solid var(--line);${dim?'opacity:.6':''}">
      <div class="row between sm"><span style="font-weight:650;color:${blockColor(b)}">${i+1}. ${esc(blockName(b))}</span><span class="dim tiny">${b.weeks} week${b.weeks>1?'s':''}${b.realize?' · tests':''}${b.deload?' + deload':''}</span></div>
      <div class="muted tiny" style="margin-top:2px">${esc(plan.reasons[i]||'')}</div></div>`;
    list.innerHTML=`<div class="qlab">${B.rerun?'New':'Your blocks'} · ${plan.blocks.reduce((a,b)=>a+blockLen(b),0)} weeks</div>`+plan.blocks.map((b,i)=>row(b,i,i<plan.kept)).join('');
    if(B.rerun){
      const pos=ROADMAP.length?programPosition():null, before=el('div','qblock');
      before.innerHTML='<div class="qlab">Now</div>'+ROADMAP.map((b,i)=>`<div class="sm" style="padding:4px 0;${pos&&i<=pos.idx?'opacity:.6':''}"><span style="color:${blockColor(b)}">${i+1}. ${esc(blockName(b))}</span> <span class="dim tiny">· ${b.weeks} wk${b.deload?' + deload':''}</span></div>`).join('');
      host.appendChild(before);
    }
    host.appendChild(list);
    if(plan.leftover) host.appendChild(el('div','anchor',plan.leftover+' week'+(plan.leftover>1?'s':'')+' left over at the end. Move the target date, or the last block runs a little long.')).style.color='var(--warn)';
    const P=builderParams(B);
    host.appendChild(el('div','dim tiny',PROFILES[B.profile].label+' · '+splitOf(B.week).name+' '+B.week.length+' days · '
      +(B.goals.map(id=>exById[id]&&exById[id].name).filter(Boolean).join(', ')||'no main lifts')+(P.ratio>0.55?' · strength-heavy profiles repeat strength blocks to reach their share':''))).style.marginTop='6px';
    if((CFG.feedbackUrl||'').trim()&&!CFG.testerName){
      const nm=el('div','qblock'); nm.innerHTML='<div class="qlab">What should we call you?</div><div class="field">Notes you write go to the person who set this up, signed with this name.</div><input type="text" id="bnm" placeholder="First name is fine" style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit">';
      host.appendChild(nm); $('#bnm').value=B.name; $('#bnm').oninput=e=>{ B.name=e.target.value; };
    }
    navBtn('Back','ghost',()=>go(-1));
    navBtn(B.rerun?'Replace the rest of my program':'Use this program','pri',()=>{
      applyBuilder(B,plan); BUILDER=null; SETTINGS_DRAFT=null; $('#dlg').close(); TAB='dash'; render();
      toast(B.rerun?'Program rebuilt — your logged history is unchanged':'Program ready');
      if(!CFG.introSeen) setTimeout(()=>openTutorial(0),250);
    });
    return;
  }
  navBtn('Back','ghost',()=>{ if(B.i<=1){ B.path=null; B.i=0; openBuilder(); } else go(-1); });
  navBtn('Skip','ghost',()=>go(1));
  navBtn('Next','pri',()=>go(1));
}

/* ---------- Tutorial (spec §4.1) — six short cards, once, reachable from Lifts ---------- */
function openTutorial(i){
  const fb=!!(CFG.feedbackUrl||'').trim(), sync=!!(CFG.syncUrl||'').trim();
  const cards=[
    ['The check-in adjusts today\'s session','Before each workout it asks how you slept and how you feel. 3 means normal. It can lighten a session; it never adds to one.'],
    ['Amber numbers are suggestions','Change anything before logging. Change the weight and the reps recompute, or the other way round — what you set turns white.'],
    ['RPE','How hard a set was: 10 = nothing left, 8 = about two reps in reserve.'],
    ['Every number explains itself','The line under each set says why it says what it says. Tap it for the detail.'],
    ['Notes, setup and cues','The ✎ at the top sends feedback'+(fb?' to the person who gave you this app':'')+'. Setup notes and your own cues live in each exercise\'s info — they show on the card.'],
    ['Your data stays on this device',sync?'It\'s also backed up to your sheet after each session.':'Back it up from the Lifts tab now and then — if the phone goes, so does the log.']];
  const k=Math.max(0,Math.min(cards.length-1,i||0)), [t,b]=cards[k];
  sheet(`<div class="dim tiny" style="margin-bottom:8px">${k+1} of ${cards.length}</div>
    <h2 style="font-size:22px;margin-bottom:8px">${esc(t)}</h2>
    <div class="muted sm" style="line-height:1.55;margin-bottom:16px">${esc(b)}</div>
    <div class="row" style="gap:8px">
      ${k?'<button class="btn ghost grow" id="tutb">Back</button>':'<button class="btn ghost grow" id="tuts">Skip</button>'}
      <button class="btn ${k===cards.length-1?'go':'pri'} grow" id="tutn">${k===cards.length-1?'Got it':'Next'}</button></div>`);
  const done=()=>{ CFG.introSeen=true; saveCfg(); $('#dlg').close(); render(); };
  if($('#tutb')) $('#tutb').onclick=()=>openTutorial(k-1);
  if($('#tuts')) $('#tuts').onclick=done;
  $('#tutn').onclick=()=>k===cards.length-1?done():openTutorial(k+1);
}
/* Wipe everything back to a true first-run state. For testing the new-user
   flow, and for handing the app to someone else on a shared device. */
function resetToFresh(){
  // the named keys, plus anything else under the trainlog. prefix — so a key
  // added later can't survive a reset just because nobody updated this list
  const keys=new Set([LS_KEY,LS_CFG,LS_SESS,LS_PEND,LS_REST,LS_WEEK,'trainlog.lastExport','trainlog.lastSync']);
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('trainlog.')) keys.add(k); } }catch{}
  keys.forEach(k=>{ try{ localStorage.removeItem(k); }catch{} });
  location.reload();
}

function openSettings(){
  if(!SETTINGS_DRAFT){
    SETTINGS_DRAFT={
      draft: ROADMAP.map(b=>({...b,hyp:[...(b.hyp||[])]})),
      goals: [...(CFG.goals||[])],
      tgt: CFG.target, srt: CFG.start, fixed: !!CFG.targetFixed,
      split: (s=>Array.isArray(s)?[...s]:s)(programSplitSpec()), syncUrl: CFG.syncUrl||'', feedbackUrl: CFG.feedbackUrl||'', testerName: CFG.testerName||'',
      energy: CFG.energy||'maintenance', conds: [...(CFG.conditions||[])],
      jointUsual: {...(CFG.jointUsual||{})},
      backoff: {...backoffCfg()}
    };
  }
  const S=SETTINGS_DRAFT;

  sheet(`<h2 style="font-size:22px;margin-bottom:3px">Your program</h2>
    <div class="muted tiny" style="margin-bottom:15px">Blocks are an order, not dates. Change a length and everything after it shifts.</div>
    <div id="rm"></div>
    <button class="btn pri wide" id="rmsave" style="margin-top:4px">Save program</button>
    <button class="btn ghost wide" id="rmclose" style="margin-top:8px">Cancel</button>`);

  const host=$('#rm');
  const draw=()=>{
    host.innerHTML='';

    const dates=el('div','qblock');
    const availW = weeksAvailable(S.srt,S.tgt,S.split);
    const haveW  = S.draft.reduce((a,b)=>a+blockLen(b),0);
    dates.innerHTML=`<div class="qlab">Dates</div>
      <div class="field">Target</div><input type="date" id="td" value="${S.tgt||''}">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:8px">
        <input type="checkbox" id="tfix"${S.fixed?' checked':''}>
        <span class="sm">This date is fixed</span></label>
      <div class="anchor">${S.fixed?'If you fall behind, the app offers to shorten the remaining blocks to hit it — never below each block type\'s minimum, never dropping a deload.':'If you fall behind, the app offers to move this date to match your pace. Blocks keep their length.'}</div>
      <div class="field" style="margin-top:10px">Start</div><input type="date" id="sd" value="${S.srt||''}">
      <div class="anchor">${availW!=null?`${haveW} weeks of blocks against ${availW} weeks available at your pace`:'Set both dates to size your blocks'}</div>`;
    host.appendChild(dates);
    $('#tfix').onchange=e=>{ S.fixed=e.target.checked; draw(); };
    $('#td').onchange=e=>{
      S.tgt=e.target.value;
      const n=fillToTarget(S.draft,S.srt,S.tgt,S.split);
      if(n) toast(`Added ${n} block${n>1?'s':''} to reach that date`);
      draw();
    };
    $('#sd').onchange=e=>{S.srt=e.target.value;draw();};
    if(availW!=null&&haveW-availW>1){
      const trim=el('button','btn s',`Trim ${haveW-availW} weeks to fit`);
      trim.style.marginTop='9px';
      trim.onclick=()=>{
        // same rules as the dashboard's compress: minimums, deloads and
        // weeks already trained are never cut
        const r=compressRoadmap(S.draft, haveW-availW, S.srt===CFG.start?currentPhase():null);
        S.draft=r.draft;
        if(r.shortBy) toast(`${r.shortBy} week${r.shortBy>1?'s':''} still over — blocks are at their minimums`);
        draw();
      };
      dates.appendChild(trim);
    }

    const sp0=el('div','qblock');
    sp0.innerHTML=`<div class="qlab">Your week · ${esc(splitOf(S.split).name)}</div>
      <div class="field">Sessions are built from this. Changing it does not touch your logged history. A block can have its own week below.</div>`;
    sp0.appendChild(weekPicker(S.split, w=>{ S.split=w; draw(); }));
    host.appendChild(sp0);
    const rb=el('button','btn ghost wide','Rebuild the rest with the program builder'); rb.style.marginBottom='11px';
    rb.onclick=()=>{ SETTINGS_DRAFT=null; BUILDER=null; openBuilder(true); };
    host.appendChild(rb);

    const gl=el('div','qblock');
    gl.innerHTML=`<div class="qlab">Goal lifts, ranked</div>
      <div class="field">Only the first holds primary status in any block. Rotate it across blocks rather than chasing all three.</div>`;
    S.goals.forEach((g,i)=>{
      const ex=exById[g], r=el('div','row between sm'), dup=S.goals.indexOf(g)!==i;
      r.style.cssText='padding:8px 0;border-top:1px solid var(--line)';
      r.innerHTML=`<span><span class="sidx done" style="width:22px;height:22px;font-size:11px">${i+1}</span>
        <span style="margin-left:9px">${esc(ex?ex.name:g)}</span>${dup?'<span class="tiny" style="color:var(--warn)"> · listed twice — pick another</span>':''}</span>`;
      const btns=el('span','row'); btns.style.gap='4px';
      if(i>0){ const u=el('button','iconbtn','↑');
        u.onclick=()=>{[S.goals[i-1],S.goals[i]]=[S.goals[i],S.goals[i-1]];draw();}; btns.appendChild(u); }
      const c=el('button','iconbtn','⇄');
      c.setAttribute('aria-label','Change lift');
      c.onclick=()=>exPicker('Pick a goal lift', e=>!S.goals.includes(e.id)&&mainEligible(e), e=>{ S.goals[i]=e.id; openSettings(); });
      btns.appendChild(c); r.appendChild(btns); gl.appendChild(r);
    });
    host.appendChild(gl);

    const bl=el('div','qblock');
    bl.innerHTML=`<div class="qlab">Blocks <span class="dim tiny" style="font-weight:400">· ${S.draft.reduce((a,b)=>a+blockLen(b),0)} weeks total</span></div>`;
    S.draft.forEach((b,i)=>{
      const row=el('div',''); row.style.cssText='padding:12px 0;border-top:1px solid var(--line)';

      const top=el('div','row between'); top.style.marginBottom='9px';
      const types=el('div','row'); types.style.cssText='gap:5px;flex-wrap:wrap;min-width:0';
      (b.type==='deload'?['deload']:['hyp','str']).forEach(t=>{
        const on=b.type===t;
        const c=el('button','chip',TYPE_NAME[t]);
        c.style.cssText='font-size:12.5px;padding:6px 10px';

/* The one week picker: setup, the program's week, and a block's own week all
   use it. Days per week, a suggested style, then every day editable and
   reorderable. Calls onChange(newWeek); the caller redraws. */
function weekPicker(week, onChange){
  const w=validWeek(week)?[...week]:splitOf(week).week, style=styleOfWeek(w);
  const box=el('div','');
  box.appendChild(el('div','field','Days per week'));
  const dc=el('div','chips');
  for(let n=WEEK_MIN;n<=WEEK_MAX;n++){
    const c=el('button','chip',String(n)); c.setAttribute('aria-pressed',w.length===n?'true':'false');
    c.onclick=()=>{ if(n===w.length) return;
      const st=WEEK_STYLES.find(x=>x.k===style&&(x.min||WEEK_MIN)<=n)||WEEK_STYLES[0];
      onChange(st.make(n)); };
    dc.appendChild(c);
  }
  box.appendChild(dc);
  box.appendChild(el('div','field','Style · a starting point, change any day below')).style.marginTop='12px';
  const sc=el('div','chips');
  WEEK_STYLES.filter(x=>(x.min||WEEK_MIN)<=w.length).forEach(x=>{
    const c=el('button','chip',esc(x.label)); c.setAttribute('aria-pressed',style===x.k?'true':'false');
    c.onclick=()=>onChange(x.make(w.length)); sc.appendChild(c);
  });
  if(style==='custom'){ const c=el('button','chip','Custom'); c.setAttribute('aria-pressed','true'); sc.appendChild(c); }
  box.appendChild(sc);
  box.appendChild(el('div','field','Your week, in order')).style.marginTop='12px';
  const names=weekTemplate(w);
  w.forEach((t,i)=>{
    const r=el('div','row'); r.style.cssText='gap:6px;margin-bottom:6px';
    r.appendChild(el('span','dim tiny','Day '+(i+1))).style.cssText='width:40px;flex:none';
    const sel=el('select','wsel'); sel.setAttribute('aria-label','Day '+(i+1)+' type');
    sel.innerHTML=DAY_TYPE_ORDER.map(k=>`<option value="${k}"${k===t?' selected':''}>${esc(DAY_TYPES[k].label)}</option>`).join('');
    sel.onchange=()=>{ const nw=[...w]; nw[i]=sel.value; onChange(nw); };
    r.appendChild(sel);
    r.appendChild(el('span','dim tiny',esc(names[i].name))).style.cssText='width:64px;flex:none;text-align:right';
    const up=el('button','iconbtn','↑'); up.setAttribute('aria-label','Move day '+(i+1)+' earlier');
    if(i===0) up.style.opacity='.25'; else up.onclick=()=>{ const nw=[...w]; [nw[i-1],nw[i]]=[nw[i],nw[i-1]]; onChange(nw); };
    const dn=el('button','iconbtn','↓'); dn.setAttribute('aria-label','Move day '+(i+1)+' later');
    if(i===w.length-1) dn.style.opacity='.25'; else dn.onclick=()=>{ const nw=[...w]; [nw[i+1],nw[i]]=[nw[i],nw[i+1]]; onChange(nw); };
    r.append(up,dn); box.appendChild(r);
  });
  box.appendChild(el('div','anchor','Days run in this order, then repeat. A missed day just waits — the program counts sessions, not dates.'));
  weekCoverage(w).forEach(m=>box.appendChild(el('div','tiny',esc(m))).style.cssText='color:var(--warn);margin-top:6px');
  return box;
}
