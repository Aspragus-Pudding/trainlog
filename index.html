<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0D12">
<title>Trainlog</title>
<style>
:root{
  --bg:#0B0D12; --card:#16191F; --card-2:#1F232B; --line:#2A2F39;
  --ink:#F2F4F8; --muted:#8E95A3; --dim:#5B6370;
  /* semantic: block type. these carry meaning, not decoration */
  --hyp:#4C8DFF; --str:#E8A33D; --peak:#E8546B; --deload:#6B7280;
  --go:#2FA84F; --skip:#FF453A; --steel:#6E7787; --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body.resting main{padding-bottom:64px}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:750;letter-spacing:-0.022em}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:20;background:rgba(11,13,18,.95);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.ctx{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0 11px}
.phase{font-size:13px;font-weight:650}
.phase.hyp{color:var(--hyp)} .phase.str{color:var(--str)}
.phase.peak{color:var(--peak)} .phase.deload{color:var(--deload)}
.wk{font-size:13.5px;color:var(--muted);margin-top:-1px}
.day{font-size:22px;font-weight:780;letter-spacing:-.03em;margin-top:1px}
.skipbtn{color:var(--skip);font-size:15px;font-weight:600;align-self:center}
.ctxbtns{display:flex;align-items:center;gap:14px;flex:none}
.notebtn{color:var(--dim);font-size:19px;align-self:center;line-height:1}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,13,18,.97);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);display:flex}
nav button{flex:1;padding:10px 0 11px;font-size:11.5px;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:550}
nav button .ic{width:21px;height:21px}
nav button[aria-current="page"]{color:var(--hyp)}
nav button:focus-visible{outline:2px solid var(--hyp);outline-offset:-3px}

section{display:none;padding-top:14px} section.on{display:block}
.card{background:var(--card);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.pad{padding:15px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .tiny{font-size:12.5px} .sm{font-size:13.5px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.grow{flex:1;min-width:0} .hr{height:1px;background:var(--line);margin:13px 0}
.stack{display:flex;flex-direction:column;gap:9px}

.btn{background:var(--card-2);border-radius:10px;padding:12px 15px;font-size:15px;font-weight:600}
.btn:active{background:var(--line)}
.btn.go{background:var(--go);color:#fff} .btn.pri{background:var(--hyp);color:#fff}
.btn.wide{width:100%;text-align:center} .btn.s{padding:8px 12px;font-size:13.5px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--hyp);outline-offset:2px}

.seg{display:flex;border:1.5px solid var(--hyp);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:10px 0;font-size:15px;font-weight:600;color:var(--hyp);border-right:1.5px solid var(--hyp)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--hyp);color:#fff}
.anchor{font-size:12.5px;color:var(--muted);margin-top:7px;min-height:17px}
.qblock{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:11px}
.qlab{font-size:15px;font-weight:600;margin-bottom:10px;line-height:1.35}

.legend{display:flex;gap:14px;font-size:11.5px;margin-top:9px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px;color:var(--muted)}
.sw{width:9px;height:9px;border-radius:2px;display:block}
.count{font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.countsub{font-size:13.5px;color:var(--muted);margin-top:2px}

.ex{background:var(--card);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.exhead{display:flex;align-items:flex-start;gap:10px;padding:14px 15px 11px;width:100%;text-align:left}
.exname{font-size:17px;font-weight:700;letter-spacing:-.018em}
.exmeta{font-size:13px;color:var(--muted);margin-top:2px}
.exicons{display:flex;gap:4px;flex:none}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:7px}
.exbody{padding:0 15px 15px}

.srow{display:flex;align-items:center;gap:11px;padding:7px 0}
.sidx{width:26px;height:26px;border-radius:50%;background:var(--card-2);color:var(--muted);
  display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none}
.sidx.done{background:var(--hyp);color:#fff}
.sload{font-size:14.5px;font-weight:600;color:var(--hyp)}
.sload.empty{color:var(--dim);font-weight:500}
.sbadge{margin-left:auto;background:var(--card-2);color:var(--muted);border-radius:7px;
  padding:5px 10px;font-size:12px;font-weight:600;flex:none}
.sbadge.on{background:rgba(76,141,255,.16);color:var(--hyp)}
.del{color:var(--dim);padding:3px 5px;font-size:17px;flex:none}

.step{display:flex;align-items:stretch;background:var(--card-2);border-radius:10px;overflow:hidden}
.step button{width:44px;min-width:38px;font-size:22px;color:var(--muted);flex:0 0 auto}
.step button:active{background:var(--line);color:var(--ink)}
.step .val{flex:1;min-width:0;text-align:center;padding:9px 2px}
.step .num{font-size:23px;font-weight:750;letter-spacing:-.028em;line-height:1.12;
  white-space:nowrap;overflow:hidden}
.step.wide .num{font-size:28px}
.stepgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.numin{width:100%;background:transparent;border:none;color:var(--ink);text-align:center;
  font:inherit;font-size:23px;font-weight:750;letter-spacing:-.028em;padding:0;
  -moz-appearance:textfield}
.numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numin:focus{outline:none}
.suggested .num,.suggested .numin{color:var(--str)}
.sugnote{font-size:11.5px;color:var(--str);margin-top:5px}
.why{margin-top:3px}
.whyline{font-size:12px;color:var(--muted);text-align:left;padding:2px 0;line-height:1.4}
.whydetail{font-size:12px;color:var(--dim);margin:3px 0 2px;padding-left:9px;border-left:2px solid var(--line);line-height:1.45}
.whydetail div+div{margin-top:4px}
.step .lab{font-size:11px;color:var(--dim)}
.bar{width:100%;height:70px;display:block;margin:4px 0 3px}
.plates{font-size:12.5px;color:var(--muted)}
.warnline{font-size:12.5px;color:var(--str)}

.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.scell{background:var(--card);padding:11px 9px;text-align:center}
.snum{font-size:17px;font-weight:720;letter-spacing:-.02em}
.slab{font-size:10.5px;margin-top:2px;font-weight:600}
.slab.hyp{color:var(--hyp)} .slab.str{color:var(--str)} .slab.peak{color:var(--peak)}
.srowlab{font-size:12.5px;color:var(--muted);padding:10px 12px 5px;background:var(--card)}

.vol{display:flex;align-items:center;gap:10px;padding:6px 0}
.volname{width:88px;font-size:13px;flex:none}
.track{flex:1;height:20px;background:var(--card-2);border-radius:4px;position:relative;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px 0 0 4px;background:var(--steel)}
.fill.under{background:var(--dim)} .fill.good{background:var(--hyp)} .fill.over{background:var(--peak)}
.mark{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.4}
.volnum{width:52px;text-align:right;font-size:12.5px;color:var(--muted);flex:none}

dialog{border:none;padding:0;background:transparent;max-width:540px;width:calc(100% - 20px);color:var(--ink)}
dialog::backdrop{background:rgba(6,8,12,.78)}
.sheet{background:var(--card);border-radius:16px;padding:17px;max-height:84vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.hdrnote{color:var(--muted);font-size:17px;padding:4px 8px;align-self:center}
.hdrnote:active{color:var(--ink)}
.rest{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));z-index:40;
  background:var(--card-2);border-top:1px solid var(--line);display:none;
  padding:10px 14px calc(10px);align-items:center;gap:12px}
.rest.on{display:flex}
.rest .t{font-size:26px;font-weight:760;letter-spacing:-.03em;min-width:76px}
.rest .lbl{font-size:12.5px;color:var(--muted);flex:1}
.rest .pbar{position:absolute;left:0;top:0;height:2px;background:var(--hyp);transition:width 1s linear}
.pr{background:var(--str);color:#111;border-radius:6px;padding:2px 7px;font-size:10.5px;
  font-weight:700;letter-spacing:.02em;margin-left:7px}
.upd{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));
  z-index:55;background:var(--hyp);color:#fff;border-radius:12px;padding:12px 14px;
  display:none;align-items:center;gap:12px;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.upd.on{display:flex}
.upd .t{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.upd button{background:rgba(255,255,255,.22);border-radius:8px;padding:8px 13px;
  font-size:13.5px;font-weight:650;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--card-2);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .16s}
.toast.on{opacity:1}
.empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:14px;line-height:1.65}
.field{font-size:12.5px;color:var(--dim);margin-bottom:7px}
.chip{border:1px solid var(--line);background:var(--card-2);border-radius:999px;
  padding:7px 13px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--hyp);color:#fff;border-color:var(--hyp);font-weight:600}
.chip.warn[aria-pressed="true"]{background:var(--peak);border-color:var(--peak)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
input[type=date]{width:100%;background:var(--card-2);border:none;border-radius:9px;
  color:var(--ink);padding:11px;font:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap ctx">
    <div>
      <div class="phase hyp" id="ph">Hypertrophy</div>
      <div class="wk" id="wk">Week 1</div>
      <div class="day" id="dy">Dashboard</div>
    </div>
    <div class="ctxbtns">
      <button class="notebtn" id="noteBtn" aria-label="Quick note">✎</button>
      <button class="skipbtn" id="skipTop" hidden>Leave ›</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="v-dash" class="on"></section>
  <section id="v-work"></section>
  <section id="v-lifts"></section>
  <section id="v-hist"></section>
</main>

<nav>
  <button data-tab="dash" aria-current="page">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Dashboard</button>
  <button data-tab="work">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/></svg>
    Workout</button>
  <button data-tab="lifts">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4" stroke-linecap="round"/></svg>
    Lifts</button>
  <button data-tab="hist">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>
    Progress</button>
</nav>

<dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>
<div class="rest" id="rest">
  <span class="pbar" id="restbar"></span>
  <span class="t" id="restt">0:00</span>
  <span class="lbl" id="restl">Rest</span>
  <button class="btn s" id="rest30">+30s</button>
  <button class="btn s" id="restx">Skip</button>
</div>
<input type="file" id="fileIn" accept=".jsonl,.json,.txt,application/json" hidden>
<div class="upd" id="upd">
  <span class="t">New version ready</span>
  <button id="updgo">Update</button>
  <button id="updno" style="background:transparent;opacity:.75">Later</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   TRAINLOG v2 — shell rebuilt on Juggernaut-derived patterns
   · semantic block colours (hypertrophy / strength / peaking)
   · persistent phase-week-day context header
   · macrocycle chart: volume as bars, intensity as overlaid line
   · anchored 1–5 scales — a descriptor per value kills rating drift
   Event-sourced log unchanged. Derived state computed on read.
   ══════════════════════════════════════════════════════════ */
const APP_VERSION='1.11.0';
const LS_KEY='trainlog.jsonl.v1', LS_CFG='trainlog.cfg.v1', LS_SESS='trainlog.session.v1', SCHEMA_V=1;

const PCT={1:100,2:95.5,3:92.2,4:89.2,5:86.3,6:83.7,7:81.1,8:78.6,9:76.2,
           10:73.9,11:70.7,12:68.0,13:65.3,14:62.6,15:59.9,16:57.4};
function pct1RM(n){ if(n<1||n>16) return null;
  const lo=Math.floor(n),hi=Math.ceil(n);
  return lo===hi?PCT[lo]:PCT[lo]+(PCT[hi]-PCT[lo])*(n-lo); }
function e1rm(w,reps){ if(!w||!reps||reps<1||reps>15) return null;
  return (w*(1+reps/30) + w*36/(37-reps) + w*100/(48.8+53.8*Math.exp(-0.075*reps)))/3; }
const conf=r=> r<=5?'high':r<=10?'medium':r<=15?'low':'none';

/* Load you could carry for a given rep count at a true max effort (RPE 10),
   derived from e1RM through the same chart everything else uses. */
function repMax(e1, reps){
  const pct=pct1RM(reps);            // reps to failure == reps at RPE 10
  return (e1==null||pct==null)?null:e1*pct/100;
}
/* Separate e1RM estimates from low-rep vs high-rep work. If these disagree
   consistently, that's a real property of the lifter, not noise — and it's
   exactly what the personal rep/percentage calibration would later fit. */
function repProfile(id){
  let lo=null, hi=null, loN=0, hiN=0;
  for(const st of sets()){
    if(st.exercise_id!==id||st.set_kind==='warmup'||st.rpe==null) continue;
    const v=setE1RM(st); if(v==null) continue;
    if(st.reps<=5){ lo=Math.max(lo??0,v); loN++; }
    else if(st.reps<=12){ hi=Math.max(hi??0,v); hiN++; }
  }
  if(lo==null||hi==null||loN<3||hiN<3) return null;
  return {lo,hi,loN,hiN,gapPct:(hi-lo)/lo*100};
}

const PLATE_SETS={main_lb:{unit:'lb',plates:[45,35,25,10,5,2.5],micro:[]} /* confirmed: 2.5s present, no micro plates */,
                  main_kg:{unit:'kg',plates:[25,20,15,10,5,2.5],micro:[1.25]}};
function solvePlates(total,bar,setId){
  const ps=PLATE_SETS[setId]; if(!ps||total==null||bar==null) return null;
  let per=(total-bar)/2; if(per<0) return {plates:[],achieved:bar,exact:total===bar};
  const out=[];
  for(const p of [...ps.plates,...ps.micro].sort((a,b)=>b-a)){ while(per>=p-1e-9){out.push(p);per-=p;} }
  const achieved=bar+2*out.reduce((a,b)=>a+b,0);
  return {plates:out,achieved,exact:Math.abs(achieved-total)<1e-6};
}

const LANDMARKS={chest:{MEV:10,MRV:20},front_delts:{MEV:6,MRV:14},side_delts:{MEV:10,MRV:24},
 rear_delts:{MEV:10,MRV:24},lats:{MEV:10,MRV:20},upper_back:{MEV:10,MRV:20},traps:{MEV:8,MRV:24},
 biceps:{MEV:10,MRV:24},triceps:{MEV:10,MRV:24},forearms:{MEV:8,MRV:24},quads:{MEV:8,MRV:16},
 hamstrings:{MEV:8,MRV:16},glutes:{MEV:8,MRV:16},calves:{MEV:10,MRV:24},abs:{MEV:6,MRV:24},abductors:{MEV:6,MRV:16},adductors:{MEV:6,MRV:16}};
const ML={chest:'Chest',front_delts:'Front delts',side_delts:'Side delts',rear_delts:'Rear delts',
 lats:'Lats',upper_back:'Upper back',traps:'Traps',biceps:'Biceps',triceps:'Triceps',
 forearms:'Forearms',quads:'Quads',hamstrings:'Hamstrings',glutes:'Glutes',calves:'Calves',abs:'Abs',abductors:'Abductors',adductors:'Adductors'};
/* Set techniques. A technique set is logged as a GROUP: the first entry is
   the activation/top set, subsequent entries are extensions of it. */
const TECHNIQUES={
  straight:{name:'Straight', extend:null},
  myo:     {name:'Myo-reps', extend:'Mini-set',  repHint:s=>Math.max(3,Math.round(s*0.33)), loadMul:1},
  rest_pause:{name:'Rest-pause', extend:'Burst', repHint:s=>Math.max(2,Math.round(s*0.4)), loadMul:1},
  drop:    {name:'Drop set', extend:'Drop', repHint:s=>s, loadMul:0.8}
};
/* Volume: the top set counts 1.0, each extension 0.5. Grade D — no study
   establishes an equivalence for cluster work. Exposed so it can change. */
const EXTENSION_SET_VALUE=0.5;
/* General prep — bodyweight and band work chosen from how you answered the
   check-in. Sore groups and flagged joints pull in targeted movements; low
   readiness lengthens everything. None of it counts toward training volume. */
const PREP=[
 {id:'p_catcow',   name:'Cat-cow',                 tgt:['lowback'],        dose:'8 slow reps'},
 {id:'p_birddog',  name:'Bird dog',                tgt:['lowback'],        dose:'6 each side'},
 {id:'p_hip90',    name:'90/90 hip switch',        tgt:['post','quads'],   dose:'8 each side'},
 {id:'p_swings',   name:'Leg swings',              tgt:['post','quads'],   dose:'10 each way'},
 {id:'p_bridge',   name:'Glute bridge',            tgt:['post'],           dose:'12 reps'},
 {id:'p_bwsquat',  name:'Bodyweight squat',        tgt:['quads'],          dose:'15 reps'},
 {id:'p_cossack',  name:'Cossack squat',           tgt:['quads','post'],   dose:'6 each side'},
 {id:'p_ankle',    name:'Ankle rocks against a wall',tgt:['quads'],        joint:'ankle', dose:'10 each side'},
 {id:'p_pullapart',name:'Band pull-apart',         tgt:['pull','push','upperback'],    dose:'20 reps'},
 {id:'p_scappush', name:'Scapular push-up',        tgt:['push'],           dose:'12 reps'},
 {id:'p_wallslide',name:'Wall slide, below shoulder',tgt:['push','pull'],  joint:'shoulder', dose:'10 reps'},
 {id:'p_er_band',  name:'Band external rotation at side',tgt:['push','pull'], joint:'shoulder', dose:'15 each side'},
 {id:'p_serratus', name:'Serratus wall punch',     tgt:['push'],           joint:'shoulder', dose:'12 reps'},
 {id:'p_wrist',    name:'Wrist extension prep',    tgt:['push'],           joint:'wrist', dose:'10 each way'},
 {id:'p_elbow',    name:'Light band curl and extension',tgt:['pull','push'], joint:'elbow', dose:'15 reps'},
 {id:'p_thoracic', name:'Thoracic extension over a roller',tgt:['pull','push','upperback'], dose:'60 seconds'},
 {id:'p_kneeext',  name:'Terminal knee extension, band',tgt:['quads'],     joint:'knee', dose:'15 each side'},
 {id:'p_hipair',   name:'Hip airplane',            tgt:['post'],           joint:'hip', dose:'5 each side'}
];
/* Prep that puts a declared condition's joint at risk is never suggested. */
const PREP_UNSAFE={shoulder_instability:['p_dislocate','p_hang']};

function buildPrep(day, rd){
  const groups=soreGroupsFor(day);
  const sore=new Set(), joints=new Set();
  if(rd){
    Object.entries(rd.sore||{}).forEach(([g,v])=>{ if(v<=2) sore.add(g); });
    Object.keys(rd.joints||{}).forEach(j=>joints.add(j));
  }
  // joints already trending badly get prep even without a tap today
  JOINTS.forEach(j=>{ if(jointLevel(jointTrend(j,6))>=2) joints.add(j); });
  (CFG.conditions||[]).forEach(c=>{ const cd=CONDITIONS[c]; if(cd&&cd.joint) joints.add(cd.joint); });

  const banned=new Set();
  (CFG.conditions||[]).forEach(c=>(PREP_UNSAFE[c]||[]).forEach(x=>banned.add(x)));

  const pick=[], seen=new Set();
  const add=(m,why)=>{ if(!m||seen.has(m.id)||banned.has(m.id)) return;
    seen.add(m.id); pick.push({...m, why}); };

  // 1. anything aimed at a joint you flagged or that is trending
  PREP.filter(m=>m.joint&&joints.has(m.joint)).forEach(m=>add(m, m.joint));
  // 2. anything aimed at a group you said was sore
  PREP.filter(m=>!m.joint&&m.tgt.some(t=>sore.has(t))).forEach(m=>add(m,'sore'));
  // 3. general coverage of what you're training today
  PREP.filter(m=>!m.joint&&m.tgt.some(t=>groups.includes(t))).forEach(m=>add(m,null));

  // low readiness earns a longer prep; feeling good earns a short one
  const score=rd?readinessScore(rd,groups):0.7;
  const cap = score<0.45 ? 7 : score<0.65 ? 5 : 3;
  return pick.slice(0,cap);
}

function shapeFor(type,weeks){
  const base=TYPE_SHAPE[type], out={vol:[],int:[]};
  for(let i=0;i<weeks;i++){
    const t=weeks===1?0:i/(weeks-1);
    const src=base.vol.length===1?0:t*(base.vol.length-1);
    const lo=Math.floor(src),hi=Math.min(base.vol.length-1,Math.ceil(src)),f=src-lo;
    out.vol.push(Math.round(base.vol[lo]+(base.vol[hi]-base.vol[lo])*f));
    out.int.push(Math.round(base.int[lo]+(base.int[hi]-base.int[lo])*f));
  }

}

/* set/rep/RPE scheme by slot role and block type */
/* Default rep ranges for non-primary work, by the exercise's primary muscle.
   JUDGEMENT DEFAULTS, GRADE D. Hypertrophy is driven far more by proximity to
   failure than by rep range; these are practical choices (coarse load steps on
   light isolation work, joint comfort, stabiliser limits), not an evidence
   claim. Override one movement with a `repRange:[lo,hi]` field on its EX entry
   (or custom exercise). Deload blocks keep their own fixed reps. */
const MUSCLE_REP_RANGE={biceps:[8,15],triceps:[8,15],forearms:[8,15],
  side_delts:[10,20],rear_delts:[10,20],calves:[10,20],abs:[10,20]};
const primaryMuscle=ex=>{ const e=Object.entries((ex&&ex.vol)||{}).find(([,w])=>w===1); return e?e[0]:null; };
/* Which rep range applies, and why: exercise override > muscle default (non-primary
   slots only) > the block/role table. Returns null to mean "use the table". */
function repRangeOverride(ex, role, blockType){
  if(!ex||blockType==='deload') return null;
  if(ex.repRange) return {reps:ex.repRange.slice(), src:'exercise'};
  if(role!=='primary'){
    const m=primaryMuscle(ex);
    if(m&&MUSCLE_REP_RANGE[m]) return {reps:MUSCLE_REP_RANGE[m].slice(), src:'muscle', muscle:m};
  }
  return null;
}
function schemeFor(role, blockType, weekOfBlock, blockWeeks, ex){
  const T={
    hyp:{primary:[4,[6,8],8],   secondary:[3,[8,12],8], accessory:[3,[10,15],9]},
    str:{primary:[4,[3,5],8],   secondary:[3,[5,8],8],  accessory:[3,[8,12],9]},
    peak:{primary:[3,[1,3],9],  secondary:[3,[3,5],8],  accessory:[2,[8,12],8]},
    deload:{primary:[2,[5,5],6],secondary:[2,[8,8],6],  accessory:[2,[10,10],6]}
  }[blockType]||{};
  const [sets,reps,rpe]=T[role]||[3,[8,12],8];
  // volume ramps across an accumulation block, descends through intensification
  let s=sets;
  if(blockType==='hyp'&&blockWeeks>2) s=sets+Math.floor((weekOfBlock-1)/2);
  if(blockType==='str'&&blockWeeks>2) s=Math.max(2,sets-Math.floor((weekOfBlock-1)/2));
  const ov=repRangeOverride(ex,role,blockType);
  return {sets:s, reps:ov?ov.reps:reps, rpe, repSrc:ov?ov.src:'block', repMuscle:ov&&ov.muscle||null};
}

function newSlotFor(ex, role){

  const p=currentPhase(), sc=schemeFor(role,p.type,p.week,p.weeks,ex);

/* Pick an exercise for a pattern+role. Goal lifts win a primary slot;
   otherwise rank by your own ratings, then by what you've actually used. */
function resolveEx(pattern, role, used){
  const pool=EX.filter(e=>e.pattern===pattern&&!used.has(e.id));
  if(!pool.length) return null;
  if(role==='primary'){
    const goal=pool.find(e=>(CFG.goals||[]).includes(e.id));
    if(goal) return goal;
  }
  // rehab movements are prescribed deliberately, never auto-selected
  const avail=pool.filter(e=>!e.rehab);
  if(avail.length) pool.length=0, pool.push(...avail);
  const score=e=>{
    const f=flagFor(e.id);
    if(f&&f.level==='red') return -1000;
    if(f&&f.level==='yellow') return -50;
    const rs=LOG.filter(x=>x.type==='exercise_rating'&&x.exercise_id===e.id);
    if(rs.length>=3) return 100+rs.reduce((a,r)=>a+r.stimulus*2+r.enjoyment,0)/rs.length;
    return exposureCount(e.id);
  };
  return pool.sort((a,b)=>score(b)-score(a))[0];
}

/* Materialise one day from the split shape against the current block */
function buildDay(tpl, phase){
  const used=new Set(), slots=[];
  // the phase's lead lift gets first claim on a primary slot
  const lead=phase&&phase.lead&&exById[phase.lead]?phase.lead:null;
  const easeOff=!!lastEarlyPain();
  tpl.slots.forEach(([pattern,role])=>{
    let ex=null;
    if(lead&&role==='primary'&&!used.has(lead)&&exById[lead].pattern===pattern) ex=exById[lead];
    if(!ex) ex=resolveEx(pattern,role,used);
    if(!ex) return;
    used.add(ex.id);
    const sc=schemeFor(role,phase.type,phase.week,phase.weeks,ex);
    const k=VOL_EMPHASIS[phase.emphasis||'moderate'];
    const ek=energyCfg().vol;
    sc.sets=Math.max(2,Math.round(sc.sets*k*ek));
    // joint ladder: targeted at movement patterns, free at the lower rungs
    let jl=1, jname=null;
    JOINTS.forEach(j=>{
      if(!(JOINT_PATTERNS[j]||[]).includes(pattern)) return;
      const L=jointLevel(jointTrend(j,6));
      if(L>jl){ jl=L; jname=j; }
    });
    const ep=lastEarlyPain();
    if(ep&&Object.keys(ep.joints||{}).some(j=>(JOINT_PATTERNS[j]||[]).includes(pattern))){
      jl=Math.max(jl,3);
      jname=jname||Object.keys(ep.joints)[0];
    }
    let jointNote=null;
    if(jl===2) jointNote={level:2,joint:jname,msg:'longer warmup'};
    if(jl===3) jointNote={level:3,joint:jname,msg:'load held'};
    if(jl>=4){ sc.sets=Math.max(2,sc.sets-1); jointNote={level:jl,joint:jname,msg:jl===5?'progression stopped':'load reduced'}; }
    // priority muscles get an extra set on non-primary work
    const prio=(phase.hyp||[]).some(m=>ex.vol[m]>=1);
    if(easeOff) sc.sets=Math.max(2,sc.sets-1);
    slots.push({ex:ex.id, role, sets:sc.sets+(prio&&role!=='primary'?1:0),
                reps:sc.reps, rpe:sc.rpe, prio, joint:jointNote, repSrc:sc.repSrc, repMuscle:sc.repMuscle});
  });
  const id=tpl.name.toLowerCase().replace(/\s+/g,'_');
  // A permanently-saved edit to this day (see the preview's "also save to my
  // preset" toggle) replaces the generated slots outright; WEEKEDITS/PENDING
  // still layer temporary changes on top of whichever base this returns.
  const override=(CFG.dayOverrides||{})[id];
  return {id, name:tpl.name, slots:override?JSON.parse(JSON.stringify(override.slots)):slots};
}

/* sets() replays corrections over the raw log. A correction with patch:null
   voids the event entirely. The log itself stays append-only — nothing is
   ever rewritten, so history and sync safety are preserved. */
let _setsCache=null, _setsLen=-1;
function sets(){
  if(_setsCache&&_setsLen===LOG.length) return _setsCache;
  const patch={};
  for(const e of LOG) if(e.type==='correction') patch[e.target_id]=e;
  const out=[];
  for(const e of LOG){
    if(e.type!=='set') continue;
    const p=patch[e.id];
    if(!p){ out.push(e); continue; }
    if(p.patch===null) continue;          // voided
    out.push({...e, ...p.patch});
  }
  _setsCache=out; _setsLen=LOG.length; return out;
}

function weeklyVolumeSeries(weeks){
  const out=[], now=weekStart(new Date());
  for(let i=weeks-1;i>=0;i--){
    const from=new Date(now); from.setDate(from.getDate()-i*7);
    const to=new Date(from); to.setDate(to.getDate()+7);
    let total=0;
    for(const st of sets()){

      const t=new Date(st.ts);
      if(t<from||t>=to) continue;
      const ex=exById[st.exercise_id]; if(!ex) continue;

let _jointCache={}, _jointLen=-1;

    const e=LOG[i];

  }

  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;

  const older=vals.slice(half).length?vals.slice(half).reduce((a,b)=>a+b,0)/vals.slice(half).length:recent;

/* exposure = how many SESSIONS have contained this exercise, not how many sets */
const exposureCount=id=>new Set(sets().filter(s=>s.exercise_id===id).map(s=>s.session_id)).size;

/* ─── schedule ─── */
/* Which day of the rotation is next: derived from completed sessions,

const countsAsTrained=e=>{

/* ─── prescription ─── */
/* Judgement defaults, not derived from any study — kept as plain constants
   so behavior can be predicted by reading this block. No curve fitting:
   a running override count and a trailing average, nothing fancier. */
const NOVELTY_SESSIONS=3;    // first sessions on an exercise show unrepresentative gains
const RATE_WINDOW=8;         // trailing sessions considered when fitting the load-progression rate
const OVERRIDE_TRIGGER=3;    // consecutive overridden SESSIONS before suggestions back off
const OVERRIDE_MARGIN=0.975; // logged weight must be at least this far below suggestion to count as an override
const PROBE_INCREMENT_LB=2.5;
const UNFAMILIAR_EXPOSURE=6, UNFAMILIAR_CAP=1.025, ESTABLISHED_CAP=1.10;

/* Reprice a set to the load that would cost the target effort at the target
   REP COUNT. Both reps and RPE are converted to reps-to-failure and read off
   the same %1RM chart everything else uses. The rep count priced here must be
   the rep count that is then prescribed: an earlier version held the last
   set's reps fixed but prescribed the bottom of the range, so 170 x 11 @ 7.5
   came back as roughly 170 x 6 — a weight priced for 11 reps paired with 6. */
function repriceTo(actualLb, actualReps, actualRpe, targetReps, targetRpe){
  if(actualRpe==null) return actualLb;
  const pctActual=pct1RM(actualReps+(10-actualRpe));
  const pctTarget=pct1RM(targetReps+(10-targetRpe));
  if(!pctActual||!pctTarget) return actualLb;
  return (actualLb/(pctActual/100))*pctTarget/100;
}
/* One entry per session a top set was logged for this exercise, oldest
   first, carrying whatever suggestion was live when that top set was
   logged (stamped once at log time in logSet(), never rewritten). */
function exerciseSessionHistory(exId){
  const bySession=new Map();
  for(const st of sets()){
    if(st.exercise_id!==exId||st.set_kind==='warmup') continue;
    if(st.group&&st.group.pos>0) continue;               // top set only
    const w=toLb(st.weight);
    const cur=bySession.get(st.session_id);
    if(!cur||w>cur.topLb)
      bySession.set(st.session_id,{session_id:st.session_id,ts:st.ts,
        topLb:w,reps:st.reps,rpe:st.rpe,suggestedLb:st.suggested_lb??null});
  }
  return [...bySession.values()].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
}
/* Your actual trailing rate of accepted load increase on this exercise, lb
   per session — excluding the first few sessions (novelty gains that won't
   continue) and a recent window only. Null when there isn't enough
   seasoned history yet. */
function progressionRate(exId){
  const seasoned=exerciseSessionHistory(exId).slice(NOVELTY_SESSIONS);
  const recent=seasoned.slice(-RATE_WINDOW);
  if(recent.length<2) return null;
  return (recent[recent.length-1].topLb-recent[0].topLb)/(recent.length-1);
}
/* How many recent sessions in a row you've logged meaningfully below what
   was suggested. Resets the moment a suggestion is accepted. */
function overrideStreak(exId){
  const hist=exerciseSessionHistory(exId);
  let n=0;
  for(let i=hist.length-1;i>=0;i--){
    const h=hist[i];
    if(h.suggestedLb==null) break;
    if(h.topLb<h.suggestedLb*OVERRIDE_MARGIN) n++; else break;
  }
  return n;
}
/* True if the most recent session's suggestion was itself a small "probe"
   bump above the session before it — so the next qualifying session won't
   probe twice in a row. */
function lastWasProbe(exId){
  const hist=exerciseSessionHistory(exId);
  if(hist.length<2) return false;
  const [prev,last]=hist.slice(-2);
  return last.suggestedLb!=null && last.suggestedLb>prev.topLb+1e-6;
}
/* Cap a proposed increase — tighter while the exercise is still unfamiliar,
   the standard ±10% once it's established — applied before loadable()
   rounds, then rechecked after so rounding can't push the result past the
   cap by a whole increment (barbell/plate lifts can't overshoot; fixed-
   increment lifts can, since Math.round() rounds up past the halfway mark). */
function capIncrease(slot, fromLb, rawLb){
  const ex=exById[slot.ex];
  // for bodyweight+added lifts the cap is a % of TOTAL load, so 0 added can still progress
  const off=bwOffset(ex);
  const cap=(fromLb+off)*(exposureCount(slot.ex)<UNFAMILIAR_EXPOSURE?UNFAMILIAR_CAP:ESTABLISHED_CAP)-off;
  const capped=Math.min(rawLb,cap);
  const rounded=loadable(slot,capped);
  return rounded>cap ? Math.floor(capped/ex.inc)*ex.inc : rounded;
}

/* The one place a "what next" weight/reps suggestion comes from — used both
   when a slot is opened fresh (seedDraft, cross-session) and right after
   logging a working set (logSet, same session), since lastSetFor() always
   reflects whatever was most recently appended either way. Direction always
   follows effort (harder → less, easier → more, same → hold); load and reps
   never move in the same step; suggestions back off if you keep overriding
   them downward, and recover the moment one is accepted. Returns null lb
   when there's no history — the UI shows a dash rather than inventing a
   number. */
function nextPrescription(slot){
  const ex=exById[slot.ex];
  const last=lastSetFor(slot.ex);
  const off=bwOffset(ex);                 // bodyweight added to the logged load (bodyweight+added lifts only)
  const noBw=bwMissing(ex)?' Priced on added weight only — no bodyweight logged yet.':'';
  const fmtR=r=>r[0]===r[1]?String(r[0]):r[0]+'–'+r[1];
  if(!last){
    const b=bestE1RM(slot.ex);
    if(b){
      const p=pct1RM(slot.reps[1]+(10-slot.rpe))||70;
      return {lb:loadable(slot,Math.max(0,b.v*p/100-off)), reps:slot.reps[0], src:b.stated?'from your estimate':'from e1RM',
        note:`No sets logged yet, so the load is ${fmt(p,0)}% of your ${b.stated?'stated':'estimated'} max (${fmt(b.v,0)}), the usual figure for ${slot.reps[1]} reps at RPE ${slot.rpe}.`+noBw};
    }
    return {lb:null, reps:slot.reps[0], src:null, note:'No sets logged and no starting estimate, so there is nothing to base a load on.'};
  }
  const actualLb=toLb(last.weight), lastReps=last.reps, lastRpe=last.rpe;
  const lastTxt=`${fmt(actualLb,0)} × ${lastReps}${lastRpe!=null?' @ RPE '+lastRpe:''}`;
  const atCeiling=lastReps>=slot.reps[1];
  const readyToLoad=atCeiling&&lastRpe!=null&&lastRpe<=7.5;
  const reprice=(tReps)=>Math.max(0,repriceTo(actualLb+off,lastReps,lastRpe,tReps,slot.rpe)-off);

  // Double progression's "add load" trigger is a hard priority gate — it
  // always fires ahead of the override back-off logic below.
  if(readyToLoad){
    const rate=progressionRate(ex.id);
    const useRate=rate!=null&&rate>0;   // a flat or falling trailing rate is no reason to hold back a load increase
    const rawLb=useRate?actualLb+rate:reprice(slot.reps[0]);
    const lb=capIncrease(slot,actualLb,rawLb), stuck=lb<=actualLb+1e-6;
    const capTxt=exposureCount(slot.ex)<UNFAMILIAR_EXPOSURE?'2.5%':'10%';
    return {lb, reps:stuck?slot.reps[1]:slot.reps[0],
      src:stuck?'load held · step too small':useRate?'from your recent rate':'from e1RM',
      note:`Last set ${lastTxt} hit the top of the ${fmtR(slot.reps)} range at RPE ${lastRpe}. `
        +(stuck?`A single step is capped at ${capTxt} of the load, which is less than this exercise's smallest jump (${ex.inc} lb), so the load holds and reps stay at the top of the range rather than resetting.`
          :(`Load goes up and reps restart at ${slot.reps[0]}. `
            +(useRate?`Increase follows your recent rate (${rate>=0?'+':''}${fmt(rate,1)} lb per session).`
              :`Load is what ${slot.reps[0]} reps at RPE ${slot.rpe} would take, given that set.`)
            +` A single step is capped at ${capTxt}.`))+noBw};
  }

  if(overrideStreak(ex.id)>=OVERRIDE_TRIGGER){
    if(!lastWasProbe(ex.id)){
      if(lastReps<slot.reps[1])
        return {lb:loadable(slot,actualLb), reps:lastReps+1, src:'probe · +1 rep',
          note:`You've logged below the last few suggestions, so this holds ${fmt(actualLb,0)} and adds one rep to test it.`};
      return {lb:capIncrease(slot,actualLb,actualLb+PROBE_INCREMENT_LB), reps:slot.reps[0], src:'probe · small bump',
        note:`You've logged below the last few suggestions, so this tries a small ${PROBE_INCREMENT_LB} lb bump rather than a full step.`};
    }
    return {lb:loadable(slot,actualLb), reps:lastReps, src:'holding at what you\'ve set',
      note:`You've logged below the last few suggestions and the last one was already a probe, so this holds ${lastTxt}.`};
  }

  if(lastRpe==null) return {lb:loadable(slot,actualLb), reps:lastReps, src:'last session',
    note:`Last set ${lastTxt} had no RPE, so it repeats.`};
  if(lastRpe<slot.rpe){
    if(!atCeiling) return {lb:loadable(slot,actualLb), reps:lastReps+1, src:'last session',
      note:`Last set ${lastTxt} was easier than RPE ${slot.rpe} and below the ${slot.reps[1]}-rep ceiling, so same load, one more rep.`};
    const lb=capIncrease(slot,actualLb,reprice(slot.reps[0])), stuck=lb<=actualLb+1e-6;
    return {lb, reps:stuck?slot.reps[1]:slot.reps[0], src:stuck?'load held · step too small':'from e1RM',
      note:`Last set ${lastTxt} was easier than RPE ${slot.rpe} at the top of the range. `
        +(stuck?`The capped step is less than this exercise's smallest jump (${ex.inc} lb), so the load holds and reps stay at the top of the range.`
          :`Load goes up and reps restart at ${slot.reps[0]}.`)+noBw};
  }
  if(lastRpe>slot.rpe)
    return {lb:loadable(slot,reprice(slot.reps[0])), reps:slot.reps[0], src:'from e1RM',
      note:`Last set ${lastTxt} was harder than RPE ${slot.rpe}, so load is what ${slot.reps[0]} reps at RPE ${slot.rpe} would take.`+noBw};
  return {lb:loadable(slot,actualLb), reps:lastReps, src:'last session',
    note:`Last set ${lastTxt} was right on target, so it repeats.`};
}
/* Round to something actually loadable */
function loadable(slot, lb){
  if(lb==null) return null;
  const ex=exById[slot.ex];
  if(ex.load==='barbell'&&ex.plateSet&&PLATE_SETS[ex.plateSet].unit==='lb'){
    const s=solvePlates(lb,ex.bar,ex.plateSet);
    return s?s.achieved:lb;
  }
  return Math.round(lb/ex.inc)*ex.inc;
}

/* ─── readiness ─── */
/* Which soreness groups actually bear on today's session */
/* Which soreness groups bear on a session, derived from the muscles it trains */
const MUSCLE_GROUP={chest:'push',front_delts:'push',side_delts:'push',triceps:'push',
  lats:'pull',upper_back:'upperback',rear_delts:'pull',traps:'pull',biceps:'pull',forearms:'pull',
  quads:'quads',hamstrings:'post',glutes:'post',calves:'post',abs:'lowback'};
function soreGroupsFor(day){
  const g=new Set();
  (day.slots||[]).forEach(s=>{ const ex=exById[s.ex]; if(!ex) return;
    Object.entries(ex.vol).forEach(([m,w])=>{ if(w>=1&&MUSCLE_GROUP[m]) g.add(MUSCLE_GROUP[m]); }); });
  if(g.size<3) g.add('lowback');
  return [...g];
}

function readinessScore(st, groups){
  const norm=v=>(v-1)/4;                       // 1–5 → 0–1, higher is better
  const vals=(groups||[]).map(g=>st.sore[g]).filter(v=>v!=null);
  const sore=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:3;
  return norm(st.sleep)*0.30 + norm(st.motivation)*0.20 + norm(sore)*0.50 + energyCfg().ready;
}
/* Same formula, replayed straight from a logged 'readiness' event instead
   of the live check-in form — works retroactively on every readiness event
   already in the log, since nothing about the score is ever stored, only
   derived. Averages whichever soreness groups happen to be on the event
   (it doesn't record which ones applied that day), which is an
   approximation for old data but exact for the live in-session score. */
function readinessScoreFromEvent(ev){
  const norm=v=>(v-1)/4;
  const vals=Object.values(ev.soreness||{}).filter(v=>v!=null);
  const sore=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:3;
  return norm(ev.sleep_quality)*0.30 + norm(ev.motivation)*0.20 + norm(sore)*0.50 + energyCfg().ready;
}
/* One set of bands, reused everywhere a readiness score needs a plain-
   language label — the two low bands are the same thresholds adjustment()
   already uses, so there's no second copy to drift out of sync. */
function readinessLabel(score){
  if(score>=0.85) return 'Feeling great';
  if(score>=0.65) return 'Normal';
  const adj=adjustment(score);
  return adj?adj.label:'Normal';
}
/* Downward only. The 'normal' band is deliberately wide — most days
   should produce no change at all, because the underlying effect sizes
   are small (see engine-constants readiness.effect_size_context). */
function adjustment(score){
  if(score>=0.65) return null;
  // Warmup length isn't set here — warmupRamp() reads session.score directly
  // and lengthens the ramp on its own thresholds, so there's one source of
  // truth for "how long is the warmup" instead of two that can drift apart.
  if(score>=0.45) return {load:0.95, sets:-1, label:'Slightly reduced'};
  return {load:0.90, sets:-2, label:'Reduced'};
}
function adjReason(st,groups){
  const out=[];
  if(st.sleep<=2) out.push('sleep');
  if((groups||[]).some(g=>(st.sore[g]??3)<=2)) out.push('soreness');
  if(st.motivation<=2) out.push('motivation');
  return out.length?out.join(' and '):'your check-in';
}

/* volume as bars coloured by block type, intensity as an overlaid line */
function phaseChart(cur){
  if(!ROADMAP.length) return el('div','empty','No blocks yet — open Edit program to build one.');
  const W=600,H=132,padL=2,padB=16,top=8;
  const weeks=[];
  ROADMAP.forEach(b=>b.vol.forEach((vv,wi)=>weeks.push({
    type:(b.deload&&wi>=b.weeks)?'deload':b.type, vol:vv, int:b.int[wi]})));
  const n=weeks.length,bw=(W-padL*2)/n,maxV=Math.max(...weeks.map(w=>w.vol)),plotH=H-padB-top;
  let elapsed=0; ROADMAP.slice(0,cur.idx).forEach(b=>elapsed+=b.weeks);
  const curIdx=elapsed+cur.week-1;

  let bars='',labels='',pts=[];
  weeks.forEach((w,i)=>{
    const h=(w.vol/maxV)*plotH*.82, x=padL+i*bw, y=top+plotH-h, on=i===curIdx;
    if(on) bars+=`<rect x="${x+1}" y="${top}" width="${bw-2}" height="${plotH}" rx="2" fill="#fff" opacity=".055"/>`;
    bars+=`<rect x="${x+1}" y="${y}" width="${bw-2}" height="${h}" rx="1.5" fill="${TYPE_COLOR[w.type]}" opacity="${on?1:.52}"/>`;
    pts.push([x+bw/2, top+plotH-(w.int/100)*plotH*.94]);
  });
  let acc=0;
  ROADMAP.forEach(b=>{
    const L=blockLen(b);
    labels+=`<text x="${padL+(acc+L/2)*bw}" y="${H-4}" fill="${TYPE_COLOR[b.type]}"
             font-size="9.5" text-anchor="middle" opacity=".8">${L}w</text>`;
    acc+=L;
    if(acc<n) labels+=`<line x1="${padL+acc*bw}" y1="${top}" x2="${padL+acc*bw}" y2="${top+plotH}" stroke="var(--line)"/>`;
  });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const box=el('div','');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:132px;display:block" aria-hidden="true">
    ${bars}${labels}<path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linejoin="round" opacity=".85"/></svg>`;
  return box;
}

/* ─── post-session rehab / prehab ───
   Chosen from the same inputs buildPrep() reads — declared conditions and
   joint trends — plus what today's session showed. Tick-only: never appended to
   the log, so it can't reach volume accounting. Doses are judgement defaults. */
const REHAB_PATTERN={shoulder:'rehab_shoulder',knee:'prehab_knee',wrist:'prehab_wrist',
  elbow:'prehab_elbow','low back':'prehab_lowback'};
/* Rehab movements that load a declared condition's risk position. Checked in
   addition to flagFor(). prone_t is abduction with external rotation. */
const REHAB_UNSAFE={shoulder_instability:['prone_t']};
function rehabUnsafe(exId){
  if(flagFor(exId)) return true;
  return (CFG.conditions||[]).some(c=>(REHAB_UNSAFE[c]||[]).includes(exId));
}
function buildRehab(){
  const flagged=new Set(), active=[];
  const addJ=(j,isFlag)=>{ if(!REHAB_PATTERN[j]) return; if(!active.includes(j)) active.push(j); if(isFlag) flagged.add(j); };
  Object.keys((session.readiness&&session.readiness.joints)||{}).forEach(j=>addJ(j,true));
  session.slots.forEach(sl=>{ if(sl.joint&&sl.joint.level>=3) addJ(sl.joint.joint,true); });
  const ep=lastEarlyPain();
  if(ep) Object.keys(ep.joints||{}).forEach(j=>addJ(j,true));
  JOINTS.forEach(j=>{ const lv=jointLevel(jointTrend(j,6)); if(lv>=2) addJ(j,lv>=3); });
  (CFG.conditions||[]).forEach(c=>{ const cd=CONDITIONS[c]; if(cd&&cd.joint) addJ(cd.joint,false); });
  if(!active.length) return [];
  // joints flagged today first
  active.sort((a,b)=>(flagged.has(b)?1:0)-(flagged.has(a)?1:0));
  // heavy work through a joint earns a longer block
  const heavy=new Set();
  active.forEach(j=>{
    const pats=JOINT_PATTERNS[j]||[];
    const n=session.slots.reduce((a,sl)=>a+(pats.includes(exById[sl.ex].pattern)?sl.sets.length:0),0);
    if(n>=8) heavy.add(j);
  });
  const n=Math.min(5, 2+(flagged.size?1:0)+(heavy.size?1:0));
  const pools=active.map(j=>{
    const list=EX.filter(e=>e.rehab&&e.pattern===REHAB_PATTERN[j]&&!rehabUnsafe(e.id));
    const rot=list.length?completedCount()%list.length:0;   // vary between sessions
    return {j,list:list.slice(rot).concat(list.slice(0,rot))};
  }).filter(p=>p.list.length);
  const out=[];
  for(let round=0; out.length<n; round++){
    let added=false;
    for(const p of pools){
      if(out.length>=n) break;
      const e=p.list[round]; if(!e) continue;
      added=true;
      out.push({ex:e.id,name:e.name,joint:p.j,done:false,
        why:flagged.has(p.j)?'flagged today':heavy.has(p.j)?'heavy '+p.j+' work today':'your '+p.j,
        dose:isBW(e)?'2 sets, slow reps or holds':'2 × 12–15, light'});
    }
    if(!added) break;
  }
  return out;
}

        const r=el('button','srow'); r.style.cssText='width:100%;text-align:left';
        r.innerHTML=`<span class="sidx ${m.done?'done':''}">${m.done?'✓':i+1}</span>
          <span class="grow"><div style="font-size:14.5px;font-weight:${m.done?'400':'600'};${m.done?'opacity:.55':''}">${esc(m.name)}</div>
            <div class="dim tiny">${esc(m.dose)}${m.why?' · for your '+esc(m.why):''}</div></span>`;
        r.onclick=()=>{ m.done=!m.done; saveSession(); renderWork(); };
        b.appendChild(r);
      });
      b.appendChild(el('div','dim tiny','Chosen from your check-in. Doesn\'t count toward training volume.'))
       .style.marginTop='7px';
      c.appendChild(b);
    }
    v.appendChild(c);
  }

  const doneSets=session.slots.reduce((a,s)=>a+s.sets.length,0);
  const allSets=session.slots.reduce((a,s)=>a+s.sets_target,0);
  const doneEx=session.slots.filter(s=>s.sets.length>=s.sets_target).length;
  const prog=el('div','card pad'); prog.style.padding='12px 15px';
  prog.innerHTML=`<div class="row between sm" style="margin-bottom:7px">
      <span class="muted">${doneEx} of ${session.slots.length} exercises</span>
      <span style="font-weight:600">${doneSets} / ${allSets} sets</span></div>
    <div style="height:5px;background:var(--card-2);border-radius:3px;overflow:hidden">
      <div style="height:100%;width:${allSets?Math.round(doneSets/allSets*100):0}%;background:var(--hyp);border-radius:3px"></div></div>`;
  v.appendChild(prog);

  session.slots.forEach((slot,i)=>{
    const ex=exById[slot.ex], open=session.openIdx===i;
    const {box,head,nameBtn,body}=exCard(slot,{button:true});
    const order=el('div','row'); order.style.cssText='gap:3px;flex:none';
    const canMove=!slot.sets.length;   // reordering after logging would orphan set history to the wrong slot
    const mv=(lab,aria,fn)=>{ const b=el('button','iconbtn',lab); b.setAttribute('aria-label',aria);
      b.style.opacity=canMove?'1':'.25'; if(canMove) b.onclick=(e)=>{e.stopPropagation();fn();}; return b; };
    if(i>0) order.appendChild(mv('↑','Move earlier',()=>{
      [session.slots[i-1],session.slots[i]]=[session.slots[i],session.slots[i-1]];
      if(session.openIdx===i)session.openIdx=i-1; else if(session.openIdx===i-1)session.openIdx=i;
      saveSession(); renderWork(); }));
    if(i<session.slots.length-1) order.appendChild(mv('↓','Move later',()=>{
      [session.slots[i+1],session.slots[i]]=[session.slots[i],session.slots[i+1]];
      if(session.openIdx===i)session.openIdx=i+1; else if(session.openIdx===i+1)session.openIdx=i;
      saveSession(); renderWork(); }));
    const needsRate = slot.sets.length>0 && slot.sets.length>=slot.sets_target && !session.ratings[slot.ex];
    nameBtn.onclick=()=>{session.openIdx=open?-1:i; if(!open) seedDraft(slot); renderWork();};
    const icons=el('div','exicons');
    if(needsRate){
      const rateBtn=el('button','iconbtn','<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--str)" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6L12 16.5 6.6 19.3l1.3-6-4.6-4.1 6.1-.6z"/></svg>');
      rateBtn.setAttribute('aria-label','Rate '+ex.name);
      rateBtn.onclick=(e)=>{ e.stopPropagation(); openRating(slot.ex); };
      icons.appendChild(rateBtn);
    }
    const info=el('button','iconbtn','<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01" stroke-linecap="round"/></svg>');
    info.setAttribute('aria-label','Exercise details'); info.onclick=()=>openInfo(slot.ex);
    const swap=el('button','iconbtn','<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>');
    swap.setAttribute('aria-label','Swap exercise'); swap.onclick=()=>openSwap(slot,i);
    icons.append(info,swap); head.append(order,icons);

    const warms=sets().filter(s=>s.session_id===session.id&&s.exercise_id===slot.ex&&s.set_kind==='warmup');
    warms.forEach(w=>body.appendChild(srowEl({warm:true,empty:true,badge:'warmup',
      load:fmt(w.weight.value)+' '+w.weight.unit+' × '+w.reps})));
    for(let j=0;j<Math.max(slot.sets_target,slot.sets.length);j++){
      const s=slot.sets[j];
      body.appendChild(srowEl({idx:j+1, done:!!s, empty:!s,
        load:s?fmt(s.weight.value)+' '+s.weight.unit+' × '+s.reps:'—',
        pr:s&&isPRSet(s.id),
        badge:s?(s.group&&s.group.pos>0?TECHNIQUES[s.group.kind].extend:(s.rpe?'RPE '+s.rpe:'warmup')):'RPE '+slot.rpe,
        badgeOn:!!s, chev:!!s,
        onclick:s?()=>openEditSet(slot,j):null, aria:s?'Edit set '+(j+1):null}));
    }
    if(open) body.appendChild(entryPanel(slot,i));
    v.appendChild(box);
  });
  const addEx=el('button','btn ghost wide','Add an exercise'); addEx.style.marginTop='8px';
  addEx.onclick=openSessionAdd; v.appendChild(addEx);
  renderRehab(v);
  const fin=el('button','btn go wide','Finish session'); fin.onclick=openPost; v.appendChild(fin);
  const ee=el('button','btn ghost wide','End early'); ee.style.marginTop='8px';
  ee.onclick=openEndEarly; v.appendChild(ee);
}

/* Today's session, already chosen, shown with its prescribed numbers
   BEFORE the check-in. The check-in then adjusts it, visibly. */
/* The whole week at a glance, so you can see and fix the shape before you
   start rather than discovering it on day four. */
/* The whole week, fully editable — every day, every exercise, sets and reps.
   Opens on one day at a time so it stays usable on a phone. */
function openWeekPreview(openDayId){
  const p=currentPhase();
  const days=generatedDays().map(weekPlanFor);
  const active = openDayId || days[0].id;

  const vol={};
  days.forEach(d=>d.slots.forEach(sl=>{
    const ex=exById[sl.ex]; if(!ex) return;
    Object.entries(ex.vol).forEach(([m,w])=>vol[m]=(vol[m]||0)+w*sl.sets);
  }));

  let html=`<h2 style="font-size:21px;margin-bottom:2px">Your week</h2>
    <div class="muted tiny" style="margin-bottom:11px">${esc(p.label)} · week ${p.week} of ${p.weeks} · ${activeSplit().name}</div>
    <div class="chips" id="wkdays" style="margin-bottom:12px"></div>
    <div id="wkbody"></div>
    <div class="qblock" id="wkvol"></div>
    <button class="btn ghost wide" id="wpclose">Close</button>`;
  sheet(html);

  days.forEach(d=>{
    const c=el('button','chip',esc(d.name)+(d.edited?' ·':''));
    c.style.cssText='font-size:12.5px;padding:6px 11px';
    c.setAttribute('aria-pressed', d.id===active?'true':'false');
    c.onclick=()=>openWeekPreview(d.id);
    $('#wkdays').appendChild(c);
  });

  const rawDays=generatedDays();
  const rawDay=rawDays.find(x=>x.id===active)||rawDays[0];
  const day=weekPlanFor(rawDay);
  const body=$('#wkbody');

  const hdr=el('div','row between'); hdr.style.cssText='margin-bottom:8px';
  hdr.innerHTML=`<span style="font-weight:650">${esc(day.name)}</span>
    <span class="dim tiny">${day.slots.reduce((a,x)=>a+x.sets,0)} sets</span>`;
  if(day.edited){
    const rs=el('button','btn s','Reset day');
    rs.onclick=()=>{ delete WEEKEDITS[rawDay.id]; saveWeekEdits(); openWeekPreview(active); };
    hdr.appendChild(rs);
  }
  body.appendChild(hdr);

  day.slots.forEach((sl,i)=>{
    const ex=exById[sl.ex], f=flagFor(sl.ex);
    const row=el('div',''); row.style.cssText='padding:10px 0;border-top:1px solid var(--line)';
    row.innerHTML=`<div class="row between">
        <span class="grow"><div style="font-weight:600;font-size:14.5px">${esc(ex?ex.name:sl.ex)}${
          f?`<span style="color:${f.level==='red'?'var(--peak)':'var(--str)'}"> ${f.level==='red'?'▲':'●'}</span>`:''}</div>
          <div class="dim tiny">${sl.sets} × ${sl.reps[0]===sl.reps[1]?sl.reps[0]:sl.reps[0]+'–'+sl.reps[1]} @ RPE ${sl.rpe}${sl.role?' · '+sl.role:''}</div></span>
      </div>`;
    const ctl=el('div','row'); ctl.style.cssText='gap:6px;margin-top:8px';
    const mk=(lab,aria,fn)=>{ const b=el('button','btn s',lab); b.setAttribute('aria-label',aria); b.onclick=fn; return b; };
    ctl.appendChild(mk('−','One set fewer',()=>{ editWeekDay(rawDay,d=>{ if(d.slots[i].sets>1) d.slots[i].sets--; }); openWeekPreview(active); }));
    ctl.appendChild(mk('+','One set more',()=>{ editWeekDay(rawDay,d=>{ d.slots[i].sets++; }); openWeekPreview(active); }));
    if(i>0) ctl.appendChild(mk('↑','Move earlier',()=>{ editWeekDay(rawDay,d=>{ [d.slots[i-1],d.slots[i]]=[d.slots[i],d.slots[i-1]]; }); openWeekPreview(active); }));
    if(i<day.slots.length-1) ctl.appendChild(mk('↓','Move later',()=>{ editWeekDay(rawDay,d=>{ [d.slots[i+1],d.slots[i]]=[d.slots[i],d.slots[i+1]]; }); openWeekPreview(active); }));
    ctl.appendChild(mk('Swap','Swap exercise',()=>{
      const cur=exById[sl.ex];
      exPicker('Swap '+(cur?cur.name:''), e=>e.id!==sl.ex, e=>{
        editWeekDay(rawDay,d=>{ d.slots[i].ex=e.id; d.slots[i].swapped=true; });
        openWeekPreview(active);
      });
    }));
    const rm=mk('✕','Remove exercise',()=>{ editWeekDay(rawDay,d=>{ d.slots.splice(i,1); }); openWeekPreview(active); });
    rm.style.color='var(--skip)'; ctl.appendChild(rm);
    row.appendChild(ctl);
    body.appendChild(row);
  });

  const addB=el('button','btn wide','Add an exercise to '+day.name);
  addB.style.marginTop='11px';
  addB.onclick=()=>exPicker('Add an exercise',()=>true,e=>{
    editWeekDay(rawDay,d=>{ d.slots.push(newSlotFor(e)); });
    openWeekPreview(active);
  });
  body.appendChild(addB);

  const vh=$('#wkvol');
  vh.innerHTML='<div class="qlab">Weekly volume against your landmarks</div>';
  Object.keys(vol).sort((a,b)=>vol[b]-vol[a]).forEach(m=>{
    const L=LANDMARKS[m]; if(!L) return;
    const v=vol[m], col=v<L.MEV?'var(--dim)':v>L.MRV?'var(--peak)':'var(--ok,#4ADE80)';
    vh.appendChild(el('div','row between sm',
      `<span class="muted">${esc(ML[m])}</span>
       <span style="color:${col}">${fmt(v)} <span class="dim">/ ${L.MEV}–${L.MRV}</span></span>`))
      .style.padding='3px 0';
  });

  $('#wpclose').onclick=()=>{ $('#dlg').close(); render(); };
}

/* Edits to today's plan live here until you start. Generated fresh otherwise. */
let PENDING=null;
function loadPending(){ try{ PENDING=JSON.parse(localStorage.getItem(LS_PEND)||'null'); }catch{ PENDING=null; } }
function savePending(){ try{ PENDING?localStorage.setItem(LS_PEND,JSON.stringify(PENDING)):localStorage.removeItem(LS_PEND); }catch{} }

/* Edits to ANY day of the week, keyed by day id and stamped to the current
   phase/week so they expire naturally when the program moves on. */
let WEEKEDITS={};
function loadWeekEdits(){ try{ WEEKEDITS=JSON.parse(localStorage.getItem(LS_WEEK)||'{}')||{}; }catch{ WEEKEDITS={}; } }
function saveWeekEdits(){ try{ localStorage.setItem(LS_WEEK,JSON.stringify(WEEKEDITS)); }catch{} }
function weekPlanFor(day){
  const w=WEEKEDITS[day.id];
  if(w&&w.stamp===planStamp()) return {...day,slots:w.slots,edited:true};
  return day;
}
function editWeekDay(day,fn){
  const base=weekPlanFor(day);
  const copy={stamp:planStamp(),slots:JSON.parse(JSON.stringify(base.slots))};
  fn(copy); WEEKEDITS[day.id]=copy; saveWeekEdits();
}
function planFor(day){
  if(PENDING&&PENDING.id===day.id&&PENDING.stamp===planStamp()) return PENDING;
  return weekPlanFor(day);
}
const planStamp=()=>{ const p=currentPhase(); return `${p.idx}:${p.week}:${CFG.split}:${completedCount()}`; };
// Off by default: edits apply only to this occurrence (PENDING), same as
// always. On, the same edit is also written into CFG.dayOverrides so it
// becomes the new generated baseline going forward — a plain checkbox read
// at save time, no popup, no change-detection.
let SAVE_TO_PRESET=false;
function editPlan(day,fn){
  const base=planFor(day);
  PENDING={id:day.id,name:base.name,stamp:planStamp(),
    slots:JSON.parse(JSON.stringify(base.slots)),edited:true};
  fn(PENDING); savePending();
  if(SAVE_TO_PRESET){
    CFG.dayOverrides=CFG.dayOverrides||{};
    CFG.dayOverrides[day.id]={slots:JSON.parse(JSON.stringify(PENDING.slots))};
    saveCfg();
  }
  render();
}

/* Judgement estimate, not measured: setup+work time per working set, plus
   its rest, plus a flat estimate per warmup rung. */
const SET_TIME_S=45, WARMUP_RUNG_S=40;
function estSessionLength(day){
  let secs=0;
  day.slots.forEach(slot=>{
    const lb=nextPrescription(slot).lb;
    secs+=warmupRamp(slot,lb||0).length*WARMUP_RUNG_S;
    secs+=slot.sets*(SET_TIME_S+(REST_BY_ROLE[slot.role]||120));
  });
  return Math.round(secs/60);
}
function renderPreview(v){
  const rawDay=todayDay(), day=planFor(rawDay), p=currentPhase();

  const ep=lastEarlyPain();
  if(ep){
    const b=el('div','card pad');
    b.style.cssText='background:rgba(232,163,61,.1);border-left:3px solid var(--str)';
    b.innerHTML=`<div style="font-weight:650;color:var(--str);font-size:14.5px">Easing off today</div>
      <div class="muted tiny" style="margin-top:3px">Your last session ended early with ${esc(Object.keys(ep.joints||{}).join(' and ')||'joint pain')}. One less set across the board, and affected patterns held. The check-in will ask how it feels now.</div>`;
    v.appendChild(b);
  }
  const head=el('div','card pad');
  head.innerHTML=`<div class="phase ${p.type}">${esc(p.label)} · Week ${p.week}</div>
    <div style="font-size:27px;font-weight:790;letter-spacing:-.03em;margin:1px 0 2px">${esc(day.name)}</div>
    <div class="muted sm">${day.slots.length} exercises · ${day.slots.reduce((a,s)=>a+s.sets,0)} working sets${day.slots.length?' · ~'+estSessionLength(day)+' min (estimate)':''}</div>
    <div class="dim tiny" style="margin-top:5px">Based on how things stand now — the check-in may adjust this.</div>`;
  const go=el('button','btn go wide', day.slots.length?'Start training  →':'No exercises — check your split');
  go.style.marginTop='13px';
  if(day.slots.length) go.onclick=()=>{ startSession(day); PENDING=null; savePending(); }; else go.disabled=true;
  head.appendChild(go);
  if(day.slots.length){
    const pv=el('button','btn ghost wide','Preview workout');
    pv.style.marginTop='8px'; pv.onclick=()=>openWorkoutPreview(rawDay); head.appendChild(pv);
  }
  const wk=el('button','btn ghost wide','See the whole week');
  wk.style.marginTop='8px'; wk.onclick=openWeekPreview; head.appendChild(wk);
  const alt=el('button','btn ghost wide','Train a different day');
  alt.style.marginTop='8px';
  alt.onclick=()=>{
    sheet(`<h2 style="font-size:20px;margin-bottom:13px">Pick a session</h2><div class="stack" id="pk2"></div>`);
    generatedDays().forEach(d=>{ const b=el('button','btn wide',
      `${esc(d.name)} <span class="dim tiny">· ${d.slots.length} exercises</span>`);
      b.onclick=()=>{$('#dlg').close(); startSession(d);}; $('#pk2').appendChild(b); });
  };
  head.appendChild(alt);
  v.appendChild(head);

  const lab=el('div','row between'); lab.style.cssText='padding:4px 4px 2px';
  lab.innerHTML=`<span class="muted tiny">Planned work${day.edited?' · edited':''}</span>`;
  if(day.edited){
    const rs=el('button','btn s','Reset');
    rs.onclick=()=>{ PENDING=null; savePending(); render(); toast('Back to the generated plan'); };
    lab.appendChild(rs);
  }
  v.appendChild(lab);
  day.slots.forEach(slot=>{
    const ex=exById[slot.ex];
    const pr=nextPrescription(slot), lb=pr.lb;
    const loadTxt=isBW(ex)?(lb?'+'+fmt(lb,0)+' lb':'bodyweight'):(lb!=null?fmt(lb,0)+' lb':'—');
    const {box,body}=exCard(slot);
    for(let j=0;j<slot.sets;j++)
      body.appendChild(srowEl({idx:j+1, load:loadTxt+' × '+fmtRange(slot.reps), badge:'RPE '+slot.rpe}));
    const f=flagFor(slot.ex);
    if(f) body.appendChild(el('div','tiny',(f.level==='red'?'▲ ':'● ')+esc(f.why))).style.cssText='color:'+(f.level==='red'?'var(--peak)':'var(--str)')+';margin-top:6px';
    const pct=pctOfBest(slot,lb);
    if(pct) body.appendChild(el('div','dim tiny',esc(pct))).style.marginTop='4px';
    body.appendChild(whyEl(explainRx(slot,pr,{idx:null,fresh:true}),'p:'+slot.ex));
    v.appendChild(box);
  });
  v.appendChild(el('div','dim tiny','Loads come from your logged history. The check-in adjusts them if it needs to.'))
   .style.padding='4px 4px 10px';
  if(day.slots.some(sl=>nextPrescription(sl).lb==null)){
    const seed=el('button','btn ghost wide','Set starting estimates');
    seed.onclick=openEstimates; v.appendChild(seed);
  }

  const recent=LOG.filter(e=>e.type==='session_end').slice(-4).reverse();
  if(recent.length){
    const r=el('div','card pad'); r.appendChild(el('div','field','Recent'));
    recent.forEach(x=>r.appendChild(el('div','row between sm',
      `<span>${esc(x.day_name||'Session')}</span><span class="dim tiny">${new Date(x.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}${x.session_rpe?' · RPE '+x.session_rpe:''}</span>`)));
    v.appendChild(r);
  }
}

/* The full numbers behind the plan — warmup ramp, every working set,
   editing — one tap away from the lean pre-training screen rather than
   shown unconditionally every time that screen renders. */
function openWorkoutPreview(rawDay){
  const day=planFor(rawDay), p=currentPhase();
  let html=`<h2 style="font-size:20px;margin-bottom:2px">${esc(day.name)}</h2>
    <div class="muted tiny" style="margin-bottom:2px">${esc(p.label)} · ${day.slots.length} exercises · ${day.slots.reduce((a,s)=>a+s.sets,0)} working sets${day.slots.length?' · ~'+estSessionLength(day)+' min (estimate)':''}</div>
    <div class="dim tiny" style="margin-bottom:13px">Based on how things stand now — the check-in may adjust this.</div>`;
  if((CFG.dayOverrides||{})[rawDay.id]){
    html+=`<div class="qblock"><span class="dim tiny">This day has a saved preset. </span>
      <button class="btn s" id="wpreset">Reset to generated plan</button></div>`;
  }
  html+=`<div class="qblock">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="savePreset"${SAVE_TO_PRESET?' checked':''}>
        <span class="dim tiny">Also save changes below to my preset</span></label>
    </div>
    <div id="wpbody"></div>
    <button class="btn ghost wide" id="wpadd" style="margin-top:4px">Add an exercise</button>
    <div class="dim tiny" style="margin:10px 0">Loads come from your logged history. The check-in adjusts them if it needs to.</div>
    <button class="btn ghost wide" id="wpclose">Close</button>`;
  sheet(html);
  if($('#wpreset')) $('#wpreset').onclick=()=>{

  };
  $('#savePreset').onchange=e=>{ SAVE_TO_PRESET=e.target.checked; };
  const body=$('#wpbody');
  day.slots.forEach((slot,i)=>{
    const ex=exById[slot.ex];
    const pr=nextPrescription(slot), lb=pr.lb;
    const reps=fmtRange(slot.reps);
    const loadTxt=isBW(ex)?(lb?'+'+fmt(lb,0)+' lb':'bodyweight'):(lb!=null?fmt(lb,0)+' lb':'—');
    const setLines=Array.from({length:slot.sets},(_,si)=>
      `<div class="dim tiny">Set ${si+1}: ${loadTxt} × ${reps} @ RPE ${slot.rpe}</div>`).join('');
    const ramp=lb!=null?warmupRamp(slot,lb):[];
    const rampTxt=ramp.length?ramp.map(r=>`${fmt(r.lb,0)}×${r.reps}`).join(' → '):null;
    const r=el('div',''); r.style.cssText='padding:11px 0'+(i?';border-top:1px solid var(--line)':'');
    r.innerHTML=`<div class="row between">
        <span class="grow"><div style="font-weight:620;font-size:15px">${esc(ex.name)}${
          slot.role==='primary'?' <span class="tiny" style="color:var(--str);font-weight:650">· Lead lift</span>':''}</div>
          <div class="exmeta">${slot.role?slot.role:''}${slot.prio?' · priority':''}${slot.joint?` · <span style="color:var(--str)">${esc(slot.joint.joint)}: ${esc(slot.joint.msg)}</span>`:''}</div>
          ${(()=>{const f=flagFor(slot.ex); return f?`<div class="tiny" style="color:${f.level==='red'?'var(--peak)':'var(--str)'};margin-top:3px">${f.level==='red'?'▲':'●'} ${esc(f.why)}</div>`:'';})()}</span>
        <span style="text-align:right;flex:none">
          <div class="dim tiny">${esc(pctOfBest(slot,lb)||pr.src||'no estimate yet')}</div></span>
      </div>
      <div style="margin-top:6px">${rampTxt?`<div class="dim tiny">Warmup: ${esc(rampTxt)}</div>`:(ex.load!=='bodyweight'&&!isStackLike(ex)?'<div class="dim tiny">Warmup: no estimate yet</div>':'')}
      ${setLines}</div>`;
    r.appendChild(whyEl(explainRx(slot,pr,{idx:null,fresh:true}),'w:'+slot.ex));
    const ctl=el('div','row'); ctl.style.cssText='gap:6px;margin-top:8px';
    const mk=(label,aria,fn)=>{ const b=el('button','btn s',label); b.setAttribute('aria-label',aria); b.onclick=fn; return b; };
    ctl.appendChild(mk('−','One set fewer',()=>{ editPlan(rawDay,d=>{ if(d.slots[i].sets>1) d.slots[i].sets--; }); openWorkoutPreview(rawDay); }));
    ctl.appendChild(mk('+','One set more',()=>{ editPlan(rawDay,d=>{ d.slots[i].sets++; }); openWorkoutPreview(rawDay); }));
    ctl.appendChild(mk('Swap','Swap exercise',()=>openPlanSwap(rawDay,i)));
    const rm=mk('✕','Remove exercise',()=>{ editPlan(rawDay,d=>{ d.slots.splice(i,1); }); openWorkoutPreview(rawDay); });
    rm.style.color='var(--skip)'; ctl.appendChild(rm);
    r.appendChild(ctl);
    body.appendChild(r);
  });
  $('#wpadd').onclick=()=>openPlanAdd(rawDay);

/* Stated starting maxes, so the first session isn't a row of dashes.
   Logged as their own event type — never as fake sets. */
function openEstimates(){
  const ids=[...new Set((CFG.goals||[]).concat(
    generatedDays().flatMap(d=>d.slots.map(s=>s.ex))))].filter(id=>exById[id]);
  const vals={};
  sheet(`<h2 style="font-size:21px;margin-bottom:3px">Starting estimates</h2>
    <div class="muted tiny" style="margin-bottom:15px">Roughly what you could do for one all-out rep today. Skip anything you're unsure of — the app will learn it from your first few sessions either way.</div>
    <div id="es"></div>
    <div class="row" style="gap:8px">
      <button class="btn ghost grow" id="esskip">Done</button>
      <button class="btn pri grow" id="essave">Save</button></div>`);
  const host=$('#es');
  ids.forEach(id=>{
    const ex=exById[id], cur=bestE1RM(id);
    let val=cur?Math.round(Math.max(0,cur.v-bwOffset(ex))):(isBW(ex)?0:100);
    vals[id]=null;
    const blk=el('div','qblock');
    blk.innerHTML=`<div class="qlab">${esc(ex.name)}</div>`;
    const h=el('div','');
    const drawS=()=>{ h.innerHTML=''; h.appendChild(stepper(
      isBW(ex)?'added lb':'lb', val, ex.inc, nv=>{val=Math.max(0,nv);vals[id]=val;drawS();})); };
    drawS(); blk.appendChild(h);

    host.appendChild(blk);
  });
  $('#esskip').onclick=()=>$('#dlg').close();
  $('#essave').onclick=()=>{
    let n=0;
    Object.entries(vals).forEach(([id,v])=>{ if(v!=null&&v>0){ append({type:'e1rm_estimate',exercise_id:id,lb:v}); n++; } });
    $('#dlg').close(); render(); toast(n?`${n} estimate${n>1?'s':''} saved`:'Nothing changed');
  };
}

/* Create an exercise. Two required fields; everything else has a sane default
   so this stays a 20-second job when a machine isn't in the list. */
/* Browse, search, inspect and manage the whole library. */
function openLibrary(){
  let q='', only=null;
  const draw=()=>{
    const list=EX.filter(e=>!q||e.name.toLowerCase().includes(q.toLowerCase())||e.pattern.includes(q.toLowerCase().replace(/ /g,'_')))
      .filter(e=>only==='custom'?e.custom:only==='rehab'?e.rehab:only==='flagged'?flagFor(e.id):true)
      .sort((a,b)=>a.pattern===b.pattern?a.name.localeCompare(b.name):a.pattern.localeCompare(b.pattern));
    sheet(`<h2 style="font-size:21px;margin-bottom:3px">Exercise library</h2>
      <div class="muted tiny" style="margin-bottom:11px">${EX.length} exercises · ${list.length} shown</div>
      <input type="text" id="lq" value="${esc(q)}" placeholder="Search name or movement pattern"
       style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit;margin-bottom:10px">
      <div class="chips" id="lf" style="margin-bottom:11px"></div>
      <div id="ll" style="max-height:46vh;overflow-y:auto"></div>
      <button class="btn pri wide" id="lnew" style="margin-top:11px">Add a custom exercise</button>
      <button class="btn ghost wide" id="lc" style="margin-top:8px">Close</button>`);
    $('#lq').oninput=e=>{ q=e.target.value; draw(); setTimeout(()=>{const n=$('#lq'); if(n) n.focus();},0); };
    [['All',null],['Mine','custom'],['Rehab','rehab'],['Flagged','flagged']].forEach(([label,k])=>{
      const c=el('button','chip',label); c.style.cssText='font-size:12.5px;padding:6px 11px';
      c.setAttribute('aria-pressed',only===k?'true':'false');
      c.onclick=()=>{ only=k; draw(); }; $('#lf').appendChild(c);
    });
    let lastPat=null;
    list.forEach(e=>{
      if(e.pattern!==lastPat){ lastPat=e.pattern;
        $('#ll').appendChild(el('div','srowlab',e.pattern.replace(/_/g,' '))); }
      const f=flagFor(e.id), b=el('button','row between sm');
      b.style.cssText='width:100%;text-align:left;padding:9px 2px;border-top:1px solid var(--line)';
      b.innerHTML=`<span class="grow"><div style="font-weight:600">${esc(e.name)}${
          f?`<span style="color:${f.level==='red'?'var(--peak)':'var(--str)'}"> ${f.level==='red'?'▲':'●'}</span>`:''}</div>
        <div class="dim tiny">${esc(loadName(e.load))}${e.custom?' · yours':''}${e.rehab?' · rehab':''} · ${
          Object.entries(e.vol).filter(([,w])=>w>=1).map(([m])=>ML[m]||m).join(', ')||'support'}</div></span>
        <span class="dim">›</span>`;
      b.onclick=()=>{ $('#dlg').close(); openInfo(e.id); };
      $('#ll').appendChild(b);
    });
    if(!list.length) $('#ll').appendChild(el('div','empty','Nothing matches that.'));
    $('#lnew').onclick=()=>openCustomEx(()=>openLibrary());
    $('#lc').onclick=()=>$('#dlg').close();
  };
  draw();
}

/* Case-insensitive exact-name collision check, used as a plain warning on
   create/rename — never a block, per the app's flag-don't-refuse ethos. */
function exerciseNameTaken(name, excludeId){
  const n=name.trim().toLowerCase();
  return EX.some(e=>e.id!==excludeId&&e.name.trim().toLowerCase()===n);
}
/* How an exercise is loaded decides three things: whether the plate solver runs,
   whether its e1RM can be compared across equipment, and which progression
   model applies. Chosen explicitly rather than guessed. */
const LOADING_TYPES=[
  {load:'barbell',label:'Barbell',prog:'percentage',plate:true,comparable:true,inc:5,bar:45,
    hint:'Plate solver applies. Comparable across gyms.'},
  {load:'machine',label:'Plate-loaded machine',prog:'double',comparable:false,inc:10,
    hint:'Not comparable across machines — valid against itself only.'},
  {load:'stack',label:'Pin/stack machine',prog:'double',comparable:false,inc:10,
    hint:'Not comparable across machines — valid against itself only.'},
  {load:'cable',label:'Cable',prog:'double',comparable:false,inc:5,
    hint:'Not comparable — pulley ratios and stacks differ between stations.'},
  {load:'dumbbell',label:'Dumbbell',prog:'double',comparable:true,inc:5,
    hint:'Comparable across gyms.'},
  {load:'bodyweight',label:'Bodyweight',prog:'rep',comparable:true,inc:5,
    hint:'Progresses by reps. No added load.'},
  {load:'bodyweight_plus',label:'Bodyweight + added weight',prog:'double',comparable:true,inc:2.5,
    hint:'Log the weight you add, not the total. Estimated 1RM uses your latest logged bodyweight plus the added weight.'}
];
const loadingType=load=>LOADING_TYPES.find(t=>t.load===load)||LOADING_TYPES[1];
function openCustomEx(onCreate, editingEx){
  const st=editingEx?{name:editingEx.name,pattern:editingEx.pattern,load:editingEx.load,
      primary:Object.entries(editingEx.vol).find(([,w])=>w===1)?.[0]||'chest',
      secondary:Object.entries(editingEx.vol).filter(([,w])=>w<1).map(([m])=>m),
      inc:editingEx.inc,bar:editingEx.bar||0,unitPref:editingEx.unitPref||'both'}
    :{name:'',pattern:'horizontal_press',load:'machine',primary:'chest',  // horizontal_press = 'Chest press' in the picker above
      secondary:[],inc:10,bar:0,unitPref:'both'};
  /* Plain-English movement types, shown instead of raw pattern ids. Order
   roughly matches how someone would describe the exercise out loud. */
const MOVEMENT_TYPES=[
  {label:'Chest press (bench, machine press, push-up)', pattern:'horizontal_press'},
  {label:'Shoulder press (overhead, landmine)', pattern:'vertical_press'},
  {label:'Squat (any bar, machine, or bodyweight)', pattern:'squat'},
  {label:'Hip hinge / deadlift-style', pattern:'hinge'},
  {label:'Pull-down or pull-up (vertical pulling)', pattern:'vertical_pull'},
  {label:'Row (horizontal pulling)', pattern:'horizontal_pull'},
  {label:'Bicep curl', pattern:'elbow_flexion'},
  {label:'Tricep extension / pushdown', pattern:'elbow_extension'},
  {label:'Side/rear raise (shoulder)', pattern:'abduction'},
  {label:'Leg extension (knee, quad-focused)', pattern:'knee_extension'},
  {label:'Leg curl (hamstring-focused)', pattern:'knee_flexion'},
  {label:'Calf raise', pattern:'calf_raise'},
  {label:'Hip abduction (outer thigh machine)', pattern:'hip_abduction'},
  {label:'Hip adduction (inner thigh machine)', pattern:'hip_adduction'},
  {label:'Shrug', pattern:'shrug'},
  {label:'Ab / core', pattern:'trunk'},
  {label:'Wrist', pattern:'wrist'},
  {label:'Grip / carry', pattern:'grip'},
  {label:"Something else / not sure", pattern:'other'},
];
  sheet(`<h2 style="font-size:21px;margin-bottom:3px">${editingEx?'Edit exercise':'New exercise'}</h2>
    <div class="muted tiny" style="margin-bottom:15px">Saved to your library permanently and included in every backup.</div>
    <div id="cx"></div>
    <div class="row" style="gap:8px">
      <button class="btn ghost grow" id="cxcancel">Cancel</button>

  const host=$('#cx');
  const draw=()=>{
    host.innerHTML='';
    const nm=el('div','qblock');
    nm.innerHTML=`<div class="qlab">Name</div>
      <input type="text" id="cxn" value="${esc(st.name)}" placeholder="e.g. Hammer Strength incline press"
       style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit">
      <div class="tiny" id="cxdupe" style="color:var(--str);margin-top:5px"></div>`;
    host.appendChild(nm);
    const dupe=()=>{ $('#cxdupe').textContent=
      (st.name.trim()&&exerciseNameTaken(st.name,editingEx?editingEx.id:null))
        ?'An exercise named "'+st.name.trim()+'" already exists.':''; };
    $('#cxn').oninput=e=>{st.name=e.target.value; dupe();};
    dupe();

    const mk=(label,opts,cur,set,fmtL)=>{
      const b=el('div','qblock'); b.innerHTML=`<div class="qlab">${esc(label)}</div>`;
      const c=el('div','chips');
      opts.forEach(o=>{ const x=el('button','chip',esc(fmtL?fmtL(o):o));
        x.style.cssText='font-size:12.5px;padding:6px 10px';
        x.setAttribute('aria-pressed',cur===o?'true':'false');
        x.onclick=()=>{set(o);draw();}; c.appendChild(x); });
      b.appendChild(c); host.appendChild(b);
    };
    const mtBlock=el('div','qblock');
    mtBlock.innerHTML='<div class="qlab">What kind of movement is it?</div>';
    const mtc=el('div','chips');
    MOVEMENT_TYPES.forEach(mt=>{
      const c=el('button','chip',esc(mt.label)); c.style.cssText='font-size:12.5px;padding:6px 10px';
      c.setAttribute('aria-pressed',st.pattern===mt.pattern?'true':'false');
      c.onclick=()=>{ st.pattern=mt.pattern; draw(); };
      mtc.appendChild(c);
    });
    mtBlock.appendChild(mtc);
    if(st.pattern==='other') mtBlock.appendChild(el('div','anchor',
      "Fine to pick this — it just means the app won't be able to suggest swap alternatives for it later."));
    host.appendChild(mtBlock);

    mk('How is it loaded?',LOADING_TYPES.map(t=>t.load),st.load,v=>{
      const t=loadingType(v); st.load=v; st.inc=t.inc; st.bar=t.bar||0; },v=>loadingType(v).label);
    host.lastChild.appendChild(el('div','anchor',esc(loadingType(st.load).hint)));
    mk('Main muscle',Object.keys(LANDMARKS),st.primary,v=>st.primary=v,v=>ML[v]);

    const sec=el('div','qblock');
    sec.innerHTML='<div class="qlab">Also works <span class="dim tiny" style="font-weight:400">· counts at half a set</span></div>';
    const sc=el('div','chips');
    Object.keys(LANDMARKS).filter(m=>m!==st.primary).forEach(m=>{
      const on=st.secondary.includes(m);
