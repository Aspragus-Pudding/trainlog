<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0D12">
<title>Trainlog</title>
<style>
:root{
  --bg:#0B0D12; --card:#16191F; --card-2:#1F232B; --line:#2A2F39;
  --ink:#F2F4F8; --muted:#8E95A3; --dim:#5B6370;
  /* semantic: block type. these carry meaning, not decoration */
  --hyp:#4C8DFF; --str:#E8A33D; --peak:#E8546B; --deload:#6B7280; --on-block:#fff;
  /* interface accent (buttons, selection, charts) — separate from the block
     colours so a theme can change one without the other */
  --accent:#4C8DFF; --on-accent:#fff; --accent-soft:rgba(76,141,255,.16);
  /* warnings and danger: joint flags, ease-off, backup nags. must always read
     as warnings, whatever the theme */
  --warn:#E8A33D; --warn-soft:rgba(232,163,61,.1); --danger:#E8546B; --sug:var(--warn);
  --go:#2FA84F; --skip:#FF453A; --ok:#4ADE80; --steel:#6E7787;
  --pr:#E8A33D; --on-pr:#111;
  --bar:rgba(11,13,18,.95); --backdrop:rgba(6,8,12,.78); --r:12px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body.resting main{padding-bottom:64px}
body.updating main{padding-bottom:84px}
body{font-family:var(--font);
  font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:750;letter-spacing:-0.022em}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:20;background:var(--bar);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.ctx{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0 11px}
.phase{font-size:13px;font-weight:650}
.phase.hyp{color:var(--hyp)} .phase.str{color:var(--str)}
.phase.peak{color:var(--peak)} .phase.deload{color:var(--deload)}
.wk{font-size:13.5px;color:var(--muted);margin-top:-1px}
.day{font-size:22px;font-weight:780;letter-spacing:-.03em;margin-top:1px}
.skipbtn{color:var(--skip);font-size:15px;font-weight:600;align-self:center}
.ctxbtns{display:flex;align-items:center;gap:14px;flex:none}
.notebtn{color:var(--dim);font-size:19px;align-self:center;line-height:1}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);display:flex}
nav button{flex:1;padding:10px 0 11px;font-size:11.5px;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:550}
nav button .ic{width:21px;height:21px}
nav button[aria-current="page"]{color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

section{display:none;padding-top:14px} section.on{display:block}
.card{background:var(--card);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.pad{padding:15px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .tiny{font-size:12.5px} .sm{font-size:13.5px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.grow{flex:1;min-width:0} .hr{height:1px;background:var(--line);margin:13px 0}
.stack{display:flex;flex-direction:column;gap:9px}

.btn{background:var(--card-2);border-radius:10px;padding:12px 15px;font-size:15px;font-weight:600}
.btn:active{background:var(--line)}
.btn.go{background:var(--go);color:var(--on-accent)} .btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.wide{width:100%;text-align:center} .btn.s{padding:8px 12px;font-size:13.5px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.seg{display:flex;border:1.5px solid var(--accent);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:10px 0;font-size:15px;font-weight:600;color:var(--accent);border-right:1.5px solid var(--accent)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.anchor{font-size:12.5px;color:var(--muted);margin-top:7px;min-height:17px}
.qblock{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:11px}
.qlab{font-size:15px;font-weight:600;margin-bottom:10px;line-height:1.35}

.legend{display:flex;gap:14px;font-size:11.5px;margin-top:9px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px;color:var(--muted)}
.sw{width:9px;height:9px;border-radius:2px;display:block}
.count{font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.countsub{font-size:13.5px;color:var(--muted);margin-top:2px}

.ex{background:var(--card);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.exhead{display:flex;align-items:flex-start;gap:10px;padding:14px 15px 11px;width:100%;text-align:left}
.exname{font-size:17px;font-weight:700;letter-spacing:-.018em}
.exmeta{font-size:13px;color:var(--muted);margin-top:2px}
.exicons{display:flex;gap:4px;flex:none}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:7px}
.exbody{padding:0 15px 15px}

.srow{display:flex;align-items:center;gap:11px;padding:7px 0}
.sidx{width:26px;height:26px;border-radius:50%;background:var(--card-2);color:var(--muted);
  display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none}
.sidx.done{background:var(--accent);color:var(--on-accent)}
.sload{font-size:14.5px;font-weight:600;color:var(--accent)}
.sload.empty{color:var(--dim);font-weight:500}
.sbadge{margin-left:auto;background:var(--card-2);color:var(--muted);border-radius:7px;
  padding:5px 10px;font-size:12px;font-weight:600;flex:none}
.sbadge.on{background:var(--accent-soft);color:var(--accent)}
.del{color:var(--dim);padding:3px 5px;font-size:17px;flex:none}

.step{display:flex;align-items:stretch;background:var(--card-2);border-radius:10px;overflow:hidden}
.step button{width:44px;min-width:38px;font-size:22px;color:var(--muted);flex:0 0 auto}
.step button:active{background:var(--line);color:var(--ink)}
.step .val{flex:1;min-width:0;text-align:center;padding:9px 2px}
.step .num{font-size:23px;font-weight:750;letter-spacing:-.028em;line-height:1.12;
  white-space:nowrap;overflow:hidden}
.step.wide .num{font-size:28px}
.stepgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.numin{width:100%;background:transparent;border:none;color:var(--ink);text-align:center;
  font:inherit;font-size:23px;font-weight:750;letter-spacing:-.028em;padding:0;
  -moz-appearance:textfield}
.numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numin:focus{outline:none}
.suggested .num,.suggested .numin{color:var(--sug)}
.lasttime{font-size:12.5px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.lastarrow{color:var(--accent);font-weight:600}
.leadbadge{font-size:11.5px;color:var(--sug);font-weight:650;white-space:nowrap}
.warmtog{font-size:12.5px;color:var(--muted);padding:6px 0;text-align:left;width:100%}
.sugnote{font-size:11.5px;color:var(--sug);margin-top:5px}
.why{margin-top:3px}
.whyline{font-size:12px;color:var(--muted);text-align:left;padding:2px 0;line-height:1.4}
.whydetail{font-size:12px;color:var(--dim);margin:3px 0 2px;padding-left:9px;border-left:2px solid var(--line);line-height:1.45}
.whydetail div+div{margin-top:4px}
.step .lab{font-size:11px;color:var(--dim)}
.bar{width:100%;height:70px;display:block;margin:4px 0 3px}
.plates{font-size:12.5px;color:var(--muted)}
.warnline{font-size:12.5px;color:var(--warn)}

.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
.scell{background:var(--card);padding:11px 9px;text-align:center}
.snum{font-size:17px;font-weight:720;letter-spacing:-.02em}
.slab{font-size:10.5px;margin-top:2px;font-weight:600}
.slab.hyp{color:var(--hyp)} .slab.str{color:var(--str)} .slab.peak{color:var(--peak)}
.srowlab{font-size:12.5px;color:var(--muted);padding:10px 12px 5px;background:var(--card)}

.vol{display:flex;align-items:center;gap:10px;padding:6px 0}
.volname{width:88px;font-size:13px;flex:none}
.track{flex:1;height:20px;background:var(--card-2);border-radius:4px;position:relative;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px 0 0 4px;background:var(--steel)}
.fill.under{background:var(--dim)} .fill.good{background:var(--accent)} .fill.over{background:var(--danger)}
.mark{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.4}
.volnum{width:52px;text-align:right;font-size:12.5px;color:var(--muted);flex:none}

dialog{border:none;padding:0;background:transparent;max-width:540px;width:calc(100% - 20px);color:var(--ink)}
dialog::backdrop{background:var(--backdrop,rgba(6,8,12,.78))}
.sheet{background:var(--card);border-radius:16px;padding:17px;max-height:84vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.hdrnote{color:var(--muted);font-size:17px;padding:4px 8px;align-self:center}
.hdrnote:active{color:var(--ink)}
.rest{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));z-index:40;
  background:var(--card-2);border-top:1px solid var(--line);display:none;
  padding:10px 14px calc(10px);align-items:center;gap:12px}
.rest.on{display:flex}
.rest .t{font-size:26px;font-weight:760;letter-spacing:-.03em;min-width:76px}
.rest .lbl{font-size:12.5px;color:var(--muted);flex:1}
.rest .pbar{position:absolute;left:0;top:0;height:2px;background:var(--accent);transition:width 1s linear}
.pr{background:var(--pr);color:var(--on-pr);border-radius:6px;padding:2px 7px;font-size:10.5px;
  font-weight:700;letter-spacing:.02em;margin-left:7px}
.upd{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));
  z-index:55;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:12px 14px;
  display:none;align-items:center;gap:12px;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.upd.on{display:flex}
.upd .t{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.upd button{background:rgba(255,255,255,.22);border-radius:8px;padding:8px 13px;
  font-size:13.5px;font-weight:650;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--card-2);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .16s}
.toast.on{opacity:1}
.empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:14px;line-height:1.65}
.field{font-size:12.5px;color:var(--dim);margin-bottom:7px}
.chip{border:1px solid var(--line);background:var(--card-2);border-radius:999px;
  padding:7px 13px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.chip.warn[aria-pressed="true"]{background:var(--danger);border-color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
input[type=date]{width:100%;background:var(--card-2);border:none;border-radius:9px;
  color:var(--ink);padding:11px;font:inherit}
.wsel{flex:1;min-width:0;background:var(--card-2);color:var(--ink);border:none;border-radius:9px;padding:9px 10px;font:inherit;font-size:15px}
.thsw{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);width:100%;text-align:left}
.thsw .dots{display:flex;gap:3px;padding:4px;border-radius:7px;flex:none}
.thsw .dots i{width:12px;height:12px;border-radius:50%;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap ctx">
    <div>
      <div class="phase hyp" id="ph">Hypertrophy</div>
      <div class="wk" id="wk">Week 1</div>
      <div class="day" id="dy">Dashboard</div>
    </div>
    <div class="ctxbtns">
      <button class="notebtn" id="noteBtn" aria-label="Quick note">✎</button>
      <button class="skipbtn" id="skipTop" hidden>Leave ›</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="v-dash" class="on"></section>
  <section id="v-work"></section>
  <section id="v-lifts"></section>
  <section id="v-hist"></section>
</main>

<nav>
  <button data-tab="dash" aria-current="page">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Dashboard</button>
  <button data-tab="work">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/></svg>
    Workout</button>
  <button data-tab="lifts">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4" stroke-linecap="round"/></svg>
    Lifts</button>
  <button data-tab="hist">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>
    Progress</button>
</nav>

<dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>
<div class="rest" id="rest">
  <span class="pbar" id="restbar"></span>
  <span class="t" id="restt">0:00</span>
  <span class="lbl" id="restl">Rest</span>
  <button class="btn s" id="rest30">+30s</button>
  <button class="btn s" id="restx">Skip</button>
</div>
<input type="file" id="fileIn" accept=".jsonl,.json,.txt,application/json" hidden>
<div class="upd" id="upd">
  <span class="t">New version ready</span>
  <button id="updgo">Update</button>
  <button id="updno" style="background:transparent;opacity:.75">Later</button>
</div>
<div class="toast" id="toast"></div>

<!-- Coaching cues. docs/coaching-cues.json is the editable source; this is a
     byte-for-byte copy of it, and tests/prescription-invariants.js fails if they
     ever differ. Edit the JSON, then paste it here unchanged. -->
<script type="application/json" id="coaching-cues">[
  {
    "id": "bench",
    "name": "Barbell bench press",
    "setup": "Shoulder blades pulled back and down — 'into your back pockets'. Feet flat, driving into the floor.",
    "execution": "Elbows roughly under the bar, wrist stacked over elbow. Touch around nipple line. Press slightly back toward the rack.",
    "faults": "Shoulder blades letting go mid-set. Elbows flaring to 90° at the bottom. Touching too high on the chest.",
    "shoulder": "Keep the touch point low and elbows tucked to about 45°. Never let elbows drift behind the torso line at the bottom. Floor press is the safest variant.",
    "sources": [
      "Baraki",
      "Nuckols"
    ]
  },
  {
    "id": "incline_machine",
    "name": "Incline machine chest press",
    "setup": "Seat height so handles sit at mid-to-lower chest. Shoulder blades back and down against the pad before the first rep.",
    "execution": "Press through the full range, controlled lowering to a deep but comfortable stretch. Keep ribs down.",
    "faults": "Shoulders rolling forward at lockout. Rushing the lowering phase. Seat too low, pushing the handles upward instead of forward.",
    "shoulder": "Stop the lowering where your elbows reach the plane of your torso — don't let them travel behind it. A neutral or semi-neutral grip is safer than a wide pronated one.",
    "sources": [
      "Israetel"
    ]
  },
  {
    "id": "pin_chest_press",
    "name": "Pin-loaded machine chest press",
    "setup": "Handles level with mid-chest. Back flat against the pad, shoulder blades retracted.",
    "execution": "Push through the handles with elbows at about 45°. Full extension without locking hard. Controlled return.",
    "faults": "Elbows flaring wide. Shrugging the shoulders toward the ears. Letting the weight stack touch down between reps.",
    "shoulder": "Keep elbows from passing the torso line on the return. Neutral grip if the machine offers it.",
    "sources": [
      "Israetel"
    ]
  },
  {
    "id": "ln_pl_press",
    "name": "Lying neutral-grip plate-loaded chest press",
    "setup": "Lie back, neutral grip, shoulder blades pulled together and down into the pad.",
    "execution": "Press straight up, elbows staying at about 45°. Lower under control to a comfortable depth.",
    "faults": "Losing scapular retraction at the top. Letting elbows drift wide.",
    "shoulder": "This is one of the better pressing options for anterior instability — neutral grip, fixed path. Still stop where elbows reach the torso line.",
    "sources": [
      "Israetel",
      "Cavaliere"
    ]
  },
  {
    "id": "ohp",
    "name": "Overhead press",
    "setup": "Grip just outside shoulder width. Bar on the front delts, elbows slightly ahead of the bar. Glutes and core braced.",
    "execution": "Press up and slightly back. Head moves back as the bar passes, then through so the bar finishes over the crown.",
    "faults": "Ribcage flaring and lower back arching. Bar drifting forward. Not finishing with the bar over the head.",
    "shoulder": "Overhead work is tolerable for most with anterior instability if the elbows stay in front of the body. Never behind-the-neck. If it pinches at the top, use a landmine press instead.",
    "sources": [
      "Baraki",
      "Thrall"
    ]
  },
  {
    "id": "squat",
    "name": "Back squat",
    "setup": "Bar on the upper back, hands as close as shoulders allow. Feet about shoulder width, toes slightly out. Big brace.",
    "execution": "Break at hips and knees together. Knees track over toes. Depth to at least parallel. Drive up through the mid-foot.",
    "faults": "Knees caving in. Weight shifting to the toes. Chest dropping and hips shooting up first.",
    "shoulder": "Low-bar position needs shoulder external rotation that may aggravate instability. Use a high-bar position, a wider grip, or the Transformer/safety bar which removes the issue entirely.",
    "sources": [
      "Baraki",
      "Nuckols",
      "Thrall"
    ]
  },
  {
    "id": "ssb_squat",
    "name": "Transformer bar squat",
    "setup": "Pads on the traps, hands on the handles — not gripping hard. Feet set as for a back squat.",
    "execution": "Same squat mechanics. The forward-loading pulls you forward; fight it by keeping the chest up and bracing hard.",
    "faults": "Letting the bar tip you forward. Using the handles to pull yourself up.",
    "shoulder": "The reason to use this bar — no shoulder rotation required. Fully safe for anterior instability.",
    "sources": [
      "Thrall",
      "Nuckols"
    ]
  },
  {
    "id": "front_squat",
    "name": "Front squat",
    "setup": "Bar across the front delts, elbows high. Clean grip or cross-arm — whichever keeps elbows up.",
    "execution": "Stay upright. Knees travel forward and out. Elbows stay high throughout or the bar rolls forward.",
    "faults": "Elbows dropping. Rounding the upper back. Hips rising faster than the chest.",
    "shoulder": "Clean grip requires wrist and shoulder mobility that may be uncomfortable. Cross-arm or straps on the bar are fine alternatives.",
    "sources": [
      "Baraki",
      "Nippard"
    ]
  },
  {
    "id": "pendulum",
    "name": "Pendulum squat",
    "setup": "Feet mid-to-high on the platform. Back flat against the pad. Shoulders under the pads.",
    "execution": "Descend as deep as your hips allow without the lower back rounding. Drive through the whole foot.",
    "faults": "Lower back lifting off the pad at the bottom. Knees caving. Bouncing out of the hole.",
    "sources": [
      "Israetel"
    ]
  },
  {
    "id": "leg_press",
    "name": "Leg press",
    "setup": "Feet shoulder width on the platform, mid-height. Back and hips stay on the pad.",
    "execution": "Lower until the knees are near 90° or deeper if the hips stay down. Press without locking out hard.",
    "faults": "Hips rolling up off the seat at the bottom — the lower back is now loaded. Locking knees. Partial reps with excessive weight.",
    "sources": [
      "Israetel",
      "Nippard"
    ]
  },
  {
    "id": "hack",
    "name": "Hack squat",
    "setup": "Feet slightly forward on the platform. Back flat on the pad. Shoulders under the pads.",
    "execution": "Descend to full depth, knees tracking over toes. Drive through the whole foot.",
    "faults": "Heels lifting. Knees caving. Cutting depth as it gets heavy.",
    "sources": [
      "Israetel"
    ]
  },
  {
    "id": "deadlift",
    "name": "Deadlift",
    "setup": "Bar over mid-foot. Shins touch the bar as you hinge down. Lats set — 'bend the bar around your shins'. Big brace.",

const PCT={1:100,2:95.5,3:92.2,4:89.2,5:86.3,6:83.7,7:81.1,8:78.6,9:76.2,

function pct1RM(n){ if(n<1||n>16) return null;
  const lo=Math.floor(n),hi=Math.ceil(n);
  return lo===hi?PCT[lo]:PCT[lo]+(PCT[hi]-PCT[lo])*(n-lo); }
function e1rm(w,reps){ if(!w||!reps||reps<1||reps>15) return null;
  return (w*(1+reps/30) + w*36/(37-reps) + w*100/(48.8+53.8*Math.exp(-0.075*reps)))/3; }
const conf=r=> r<=5?'high':r<=10?'medium':r<=15?'low':'none';

/* Load you could carry for a given rep count at a true max effort (RPE 10),
   derived from e1RM through the same chart everything else uses. */
function repMax(e1, reps){
  const pct=pct1RM(reps);            // reps to failure == reps at RPE 10
  return (e1==null||pct==null)?null:e1*pct/100;
}
/* Separate e1RM estimates from low-rep vs high-rep work. If these disagree
   consistently, that's a real property of the lifter, not noise — and it's
   exactly what the personal rep/percentage calibration would later fit. */
function repProfile(id){
  let lo=null, hi=null, loN=0, hiN=0;
  for(const st of sets()){
    if(st.exercise_id!==id||st.set_kind==='warmup'||st.rpe==null) continue;
    const v=setE1RM(st); if(v==null) continue;
    if(st.reps<=5){ lo=Math.max(lo??0,v); loN++; }
    else if(st.reps<=12){ hi=Math.max(hi??0,v); hiN++; }
  }
  if(lo==null||hi==null||loN<3||hiN<3) return null;
  return {lo,hi,loN,hiN,gapPct:(hi-lo)/lo*100};
}

const PLATE_SETS={main_lb:{unit:'lb',plates:[45,35,25,10,5,2.5],micro:[]} /* confirmed: 2.5s present, no micro plates */,
                  main_kg:{unit:'kg',plates:[25,20,15,10,5,2.5],micro:[1.25]}};
function solvePlates(total,bar,setId){
  const ps=PLATE_SETS[setId]; if(!ps||total==null||bar==null) return null;
  let per=(total-bar)/2; if(per<0) return {plates:[],achieved:bar,exact:total===bar};
  const out=[];
  for(const p of [...ps.plates,...ps.micro].sort((a,b)=>b-a)){ while(per>=p-1e-9){out.push(p);per-=p;} }
  const achieved=bar+2*out.reduce((a,b)=>a+b,0);
  return {plates:out,achieved,exact:Math.abs(achieved-total)<1e-6};
}

/* Prep that puts a declared condition's joint at risk is never suggested. */
const PREP_UNSAFE={shoulder_instability:['p_dislocate','p_hang']};

function buildPrep(day, rd){
  const groups=soreGroupsFor(day);
  const sore=new Set(), joints=new Set();
  if(rd){
    Object.entries(rd.sore||{}).forEach(([g,v])=>{ if(fromNeutral(v,'soreness')<=-0.5) sore.add(g); });
    Object.keys(rd.joints||{}).forEach(j=>joints.add(j));
  }
  // joints already trending badly get prep even without a tap today
  JOINTS.forEach(j=>{ if(jointLevel(jointTrend(j,6))>=2) joints.add(j); });
  (CFG.conditions||[]).forEach(c=>{ const cd=CONDITIONS[c]; if(cd&&cd.joint) joints.add(cd.joint); });

  const banned=new Set();
  (CFG.conditions||[]).forEach(c=>(PREP_UNSAFE[c]||[]).forEach(x=>banned.add(x)));

  const pick=[], seen=new Set();
  const add=(m,why)=>{ if(!m||seen.has(m.id)||banned.has(m.id)) return;
    seen.add(m.id); pick.push({...m, why}); };

  // 1. anything aimed at a joint you flagged or that is trending
  PREP.filter(m=>m.joint&&joints.has(m.joint)).forEach(m=>add(m, m.joint));
  // 2. anything aimed at a group you said was sore
  PREP.filter(m=>!m.joint&&m.tgt.some(t=>sore.has(t))).forEach(m=>add(m,'sore'));
  // 3. general coverage of what you're training today
  PREP.filter(m=>!m.joint&&m.tgt.some(t=>groups.includes(t))).forEach(m=>add(m,null));

  // low readiness earns a longer prep; feeling good earns a short one
  const score=rd?readinessScore(rd,groups):0.7;
  const cap = score<0.45 ? 7 : score<0.65 ? 5 : 3;
  return pick.slice(0,cap);
}

    if(f.red&&f.red[exId]) return {level:'red',cond:c,why:f.red[exId]};

}

  side_delts:[10,20],rear_delts:[10,20],calves:[10,20],abs:[10,20],

  if(set) return {reps:set.slice(), src:'exercise'};
  if(role!=='primary'){
    const m=primaryMuscle(ex);

  // rehab movements are prescribed deliberately, never auto-selected
  const avail=pool.filter(e=>!e.rehab);
  if(avail.length) pool.length=0, pool.push(...avail);
  const score=e=>{
    const f=flagFor(e.id);
    if(f&&f.level==='red') return -1000;
    if(f&&f.level==='yellow') return -50;
    const rs=LOG.filter(x=>x.type==='exercise_rating'&&x.exercise_id===e.id);
    if(rs.length>=3) return 100+rs.reduce((a,r)=>a+r.stimulus*2+r.enjoyment,0)/rs.length;
    return exposureCount(e.id);
  };
  return pool.sort((a,b)=>score(b)-score(a))[0];
}

/* Materialise one day from the split shape against the current block */
function buildDay(tpl, phase){
  const used=new Set(), slots=[];
  // the phase's lead lift gets first claim on a primary slot
  const lead=phase&&phase.lead&&exById[phase.lead]?phase.lead:null;
  const easeOff=!!lastEarlyPain();
  tpl.slots.forEach(([pattern,role])=>{
    let ex=null;
    if(lead&&role==='primary'&&!used.has(lead)&&exById[lead].pattern===pattern) ex=exById[lead];
    if(!ex) ex=resolveEx(pattern,role,used);
    if(!ex) return;
    used.add(ex.id);
    const sc=schemeFor(role,phase.type,phase.week,phase.weeks,ex);
    const k=VOL_EMPHASIS[phase.emphasis||'moderate'];
    const ek=energyCfg().vol;
    sc.sets=Math.max(2,Math.round(sc.sets*k*ek));
    // joint ladder: targeted at movement patterns, free at the lower rungs
    const jointNote=jointNoteFor(pattern);
    if(jointNote&&jointNote.level>=4) sc.sets=Math.max(2,sc.sets-1);
    // priority muscles get an extra set on non-primary work
    const prio=(phase.hyp||[]).some(m=>ex.vol[m]>=1);
    if(easeOff) sc.sets=Math.max(2,sc.sets-1);
    slots.push({ex:ex.id, role, sets:sc.sets+(prio&&role!=='primary'?1:0),
                reps:sc.reps, rpe:sc.rpe, prio, joint:jointNote, repSrc:sc.repSrc, repMuscle:sc.repMuscle, repCapped:sc.repCapped});
  });
  const id=tpl.name.toLowerCase().replace(/\s+/g,'_');
  // A permanently-saved edit to this day (see the preview's "also save to my
  // preset" toggle) replaces the generated slots outright; WEEKEDITS/PENDING
  // still layer temporary changes on top of whichever base this returns.
  const override=(CFG.dayOverrides||{})[id];
  return {id, name:tpl.name, slots:override?JSON.parse(JSON.stringify(override.slots)):slots};
}

const splitFor=b=>splitOf(blockSplitSpec(b));

  const phase=currentPhase();

}

   weights ({value,unit}) are stored as entered and never touched. */

}
/* One entry per session a top set was logged for this exercise, oldest
   first, carrying whatever suggestion was live when that top set was
   logged (stamped once at log time in logSet(), never rewritten). */
function exerciseSessionHistory(exId){
  const bySession=new Map();
  for(const st of sets()){
    if(st.exercise_id!==exId||st.set_kind==='warmup') continue;
    if(st.group&&st.group.pos>0) continue;               // top set only
    const w=toLb(st.weight);
    const cur=bySession.get(st.session_id);
    if(!cur||w>cur.topLb)
      bySession.set(st.session_id,{session_id:st.session_id,ts:st.ts,
        topLb:w,reps:st.reps,rpe:st.rpe,suggestedLb:st.suggested_lb??null,suggestion:st.suggestion??null});
  }
  return [...bySession.values()].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
}
/* Your actual trailing rate of accepted load increase on this exercise, lb
   per session — excluding the first few sessions (novelty gains that won't
   continue) and a recent window only. Null when there isn't enough
   seasoned history yet. */
function progressionRate(exId){
  const seasoned=exerciseSessionHistory(exId).slice(NOVELTY_SESSIONS);
  const recent=seasoned.slice(-RATE_WINDOW);
  if(recent.length<2) return null;
  return (recent[recent.length-1].topLb-recent[0].topLb)/(recent.length-1);
}
/* How many recent sessions in a row you've logged meaningfully below what
   was suggested. Resets the moment a suggestion is accepted. */
function overrideStreak(exId){
  const hist=exerciseSessionHistory(exId);
  let n=0;
  for(let i=hist.length-1;i>=0;i--){
    const h=hist[i];
    if(h.suggestedLb==null) break;
    if(h.topLb<h.suggestedLb*OVERRIDE_MARGIN) n++; else break;
  }
  return n;
}
/* True if the most recent session's suggestion was itself a small "probe"
   bump above the session before it — so the next qualifying session won't
   probe twice in a row. */
function lastWasProbe(exId){
  const hist=exerciseSessionHistory(exId);
  if(hist.length<2) return false;
  const [prev,last]=hist.slice(-2);
  return last.suggestedLb!=null && last.suggestedLb>prev.topLb+1e-6;
}
/* Highest load a single step may reach — tighter while the exercise is still
   unfamiliar, the standard 10% once it's established. A % of TOTAL load for
   bodyweight+added lifts, so 0 added can still progress. */
function capLimit(slot, L0){
  const off=bwOffset(exById[slot.ex]);
  return (L0+off)*(exposureCount(slot.ex)<UNFAMILIAR_EXPOSURE?UNFAMILIAR_CAP:ESTABLISHED_CAP)-off;
}
/* Loadable values. gridFloor is the largest loadable at or below lb (plate
   solving already floors); stepUp / stepDown move exactly one step from a load
   that may itself be off the grid, e.g. a 55 lb set on a 10 lb machine. */
function gridFloor(slot, lb){
  const ex=exById[slot.ex];
  if(ex.load==='barbell'&&ex.plateSet&&PLATE_SETS[ex.plateSet].unit==='lb') return loadable(slot,lb);
  return Math.floor(lb/ex.inc+1e-9)*ex.inc;
}
function stepUp(slot, lb){
  const inc=exById[slot.ex].inc;
  let x=gridFloor(slot,lb+inc);
  if(x<=lb+1e-6) x=gridFloor(slot,lb+2*inc);
  return x;
}
function stepDown(slot, lb){ return gridFloor(slot,lb-1e-6); }

/* Direct RPE-delta stepping for machines/stack/cable — see isChartFree(). RPE
   is used by its own definition (one point = one rep in reserve) instead of
   being converted through the %1RM chart, so there is no reps-to-failure
   ceiling to run past. Same invariants as the chart path (checked by
   tests/prescription-invariants.js): the reps a load is priced for are the
   reps returned; load and reps never move in the same step; on-target holds
   exactly. Judgement default, Grade D: RPE_HOLD_TOL is a tolerance, not a
   measured value. */
const RPE_HOLD_TOL=0.5;
function rpeDeltaStep(slot, L0, R0, RPE0, T){
  const lo=slot.reps[0], hi=slot.reps[1];
  const lastTxt=`${fmt(L0,0)} × ${R0} @ RPE ${RPE0}`;
  const delta=T-RPE0;                          // >0 easier than aimed, <0 harder
  if(Math.abs(delta)<=RPE_HOLD_TOL){
    // "hold" means repeat the last set — landing exactly at the ceiling at
    // target RPE is a normal, correctly-dosed top set, not a signal on its
    // own (see tests/backtest.js: firing here on every at-ceiling set was
    // more aggressive than this lifter's actual practice warranted, and
    // raised backtest error). Only strictly PAST the ceiling overrides —
    // sitting at it is what the stagnation probe is for.
    if(R0<=hi) return {lb:L0, reps:R0, src:'last session', note:`Last set ${lastTxt} was right on target, so it repeats.`};
    return {lb:stepUp(slot,L0), reps:lo, src:'hit top of range · load up',
      note:`Last set ${lastTxt} was right on target but already past the top of the ${lo}–${hi} range, so load goes up one step and reps restart at ${lo}.`};
  }
  if(delta>0){
    const g=Math.max(1,Math.round(delta)), proposed=R0+g;
    if(proposed<=hi) return {lb:L0, reps:proposed, src:'reps in reserve',
      note:`Last set ${lastTxt} — about ${g} rep${g===1?'':'s'} in reserve left against target RPE ${T}, so same load, ${proposed} reps.`};
    return {lb:stepUp(slot,L0), reps:lo, src:'hit top of range · load up',
      note:`Last set ${lastTxt} — hit the top of the ${lo}–${hi} range with reserve left, so load goes up one step and reps restart at ${lo}.`};
  }
  const g=Math.max(1,Math.round(-delta)), proposed=R0-g;
  if(proposed>=lo) return {lb:L0, reps:proposed, src:'harder than aimed',
    note:`Last set ${lastTxt} was harder than target RPE ${T}, so same load, ${proposed} reps.`};
  return {lb:stepDown(slot,L0), reps:lo, src:'harder than aimed · load down',
    note:`Last set ${lastTxt} was harder than target RPE ${T}, and ${lo} is already the floor of the range, so load drops one step and reps reset to ${lo}.`};
}
/* RPE-delta stepping already reacts to any drop in RPE, so it covers most
   progress on its own — a flat suggestion only happens when nothing actually
   changed. The one gap: three sessions running with the exact same load,
   reps AND an RPE that's still at or under target is genuine stagnation, not
   a correctly-held plateau. Suggest one small step; back off for
   STAGNATION_SUPPRESS sessions if it's declined (logged numbers didn't match
   what was probed), so it never nags every session. Chart-free exercises
   only — the chart path already has its own override-damping/probe logic.
   Judgement defaults, Grade D. */
const STAGNATION_SESSIONS=3, STAGNATION_SUPPRESS=2;
function stagnationProbe(slot){
  const ex=exById[slot.ex];
  const hist=exerciseSessionHistory(ex.id);
  if(hist.length<STAGNATION_SESSIONS) return null;
  const recent=hist.slice(-STAGNATION_SESSIONS);
  const flat=recent.every(h=>Math.abs(h.topLb-recent[0].topLb)<1e-6 && h.reps===recent[0].reps);
  if(!flat) return null;
  const last=recent[recent.length-1];
  if(last.rpe==null||last.rpe>slot.rpe) return null;
  const priorProbes=hist.filter(h=>h.suggestion&&h.suggestion.basis==='stagnation probe');
  if(priorProbes.length){
    const lastProbe=priorProbes[priorProbes.length-1];
    const sessionsSince=hist.length-1-hist.indexOf(lastProbe);
    const accepted=Math.abs(lastProbe.topLb-lastProbe.suggestion.lb)<1e-6 && lastProbe.reps===lastProbe.suggestion.reps;
    if(!accepted&&sessionsSince<STAGNATION_SUPPRESS) return null;
  }
  const lo=slot.reps[0], hi=slot.reps[1];
  const tag=`Same ${fmt(last.topLb,0)} × ${last.reps} for ${STAGNATION_SESSIONS} sessions running`;
  if(last.reps<hi) return {lb:last.topLb, reps:last.reps+1, src:'stagnation probe',
    note:`${tag} — small push: one more rep.`};
  return {lb:stepUp(slot,last.topLb), reps:lo, src:'stagnation probe',
    note:`${tag}, already at the top of the range — small push: one load step up, reps back to ${lo}.`};
}

/* Within-session fatigue, measured from YOUR log rather than assumed: the mean
   RPE rise between consecutive working sets of one exercise at the same load
   (reps within 2), across sessions. Used only once there is enough of it.
   JUDGEMENT DEFAULTS, GRADE D: 10 pairs from 4 sessions, most recent 30 pairs. */
const FATIGUE_MIN_PAIRS=10, FATIGUE_MIN_SESSIONS=4, FATIGUE_WINDOW=30;
let _fatCache={}, _fatLen=-1;
function fatigueRise(exId){
  if(_fatLen!==LOG.length){ _fatCache={}; _fatLen=LOG.length; }
  if(_fatCache[exId]) return _fatCache[exId];
  const bySess=new Map();
  for(const st of sets()){
    if(st.exercise_id!==exId||st.set_kind==='warmup'||st.group) continue;
    if(!bySess.has(st.session_id)) bySess.set(st.session_id,[]);
    bySess.get(st.session_id).push(st);
  }
  let pairs=[];
  for(const [sid,arr] of bySess) for(let i=1;i<arr.length;i++){
    const a=arr[i-1], b=arr[i];
    if(a.rpe==null||b.rpe==null) continue;
    if(Math.abs(toLb(a.weight)-toLb(b.weight))>0.01||Math.abs(a.reps-b.reps)>2) continue;
    pairs.push({ts:b.ts,sid,d:b.rpe-a.rpe});
  }
  pairs.sort((x,y)=>new Date(x.ts)-new Date(y.ts));
  pairs=pairs.slice(-FATIGUE_WINDOW);
  const n=pairs.length, sessions=new Set(pairs.map(p=>p.sid)).size;
  const mean=n?pairs.reduce((s,p)=>s+p.d,0)/n:0;
  return (_fatCache[exId]={n,sessions,mean,ready:n>=FATIGUE_MIN_PAIRS&&sessions>=FATIGUE_MIN_SESSIONS});
}

/* The one place a "what next" weight/reps suggestion comes from — used both
   when a slot is opened fresh (seedDraft) and right after logging a working set
   (logSet), since lastSetFor() always reflects whatever was most recently
   appended either way. Dispatches to one of two pricing paths (isChartFree):
   the %1RM chart for barbell/dumbbell/bodyweight, or direct RPE-delta
   stepping (rpeDeltaStep) for machine/stack/cable. Both must satisfy:

   Invariants (checked by tests/prescription-invariants.js — run it after any
   change here):
   1. The reps a load is priced for are the reps returned with it.
   2. Direction follows effort. Last set easier than aimed: more load, or one
      more rep mid-range. Harder: less load (or fewer reps at the same load
      when the step is too coarse). On target: hold, exactly, no snapping.
   3. Load and reps never both go up.
   4. Chart path only: a set off the chart (reps-to-failure over 16) is
      reported as too light to price, never silently treated as "no change".
      The RPE-delta path has no chart, so this can't happen there.
   Returns null lb when there's no history — the UI shows a dash rather than
   inventing a number. */
function nextPrescription(slot){
  const ex=exById[slot.ex];
  const last=lastSetFor(slot.ex);
  const off=bwOffset(ex);
  const lo=slot.reps[0], hi=slot.reps[1];
  const noBw=bwMissing(ex)?' Priced on added weight only — no bodyweight logged yet.':'';
  if(!last){
    const b=bestE1RM(slot.ex);
    if(b){
      // priced for the top of the range, so it is prescribed for the top of the range
      const p=pct1RM(hi+(10-slot.rpe))||70;
      return {lb:loadable(slot,Math.max(0,b.v*p/100-off)), reps:hi, src:b.stated?'from your estimate':'from e1RM',
        note:`No sets logged yet, so the load is ${fmt(p,0)}% of your ${b.stated?'stated':'estimated'} max (${fmt(b.v,0)}), the usual figure for ${hi} reps at RPE ${slot.rpe}, and it is prescribed for those ${hi} reps.`+noBw};
    }
    return {lb:null, reps:lo, src:null, note:'No sets logged and no starting estimate, so there is nothing to base a load on.'};
  }
  const L0=toLb(last.weight), R0=last.reps, RPE0=last.rpe;
  const lastTxt=`${fmt(L0,0)} × ${R0}${RPE0!=null?' @ RPE '+RPE0:''}`;

  // Within-session fatigue: only when the last set is from THIS session (we are
  // predicting the next set), and only once your own data supports it.
  const inSession=!!(session&&last.session_id===session.id);
  const fat=inSession?fatigueRise(ex.id):null;
  const rise=fat&&fat.ready&&fat.mean>0?Math.round(fat.mean*2)/2:0;
  const T=slot.rpe-rise;                       // effort to aim the next set at
  const fatigue=fat?{n:fat.n,sessions:fat.sessions,mean:fat.mean,rise,applied:rise>0}:null;
  const fatTxt=rise>0?` Aimed at RPE ${T} rather than ${slot.rpe}: your later sets on this exercise run about ${rise} RPE harder at the same load (${fat.n} same-load set pairs, ${fat.sessions} sessions).`:'';
  const done=o=>({...o, note:(o.note||'')+noBw+fatTxt, fatigue});
  const hold=(src,note)=>done({lb:L0,reps:R0,src,note});     // exactly what was lifted, never snapped to the grid

  if(RPE0==null) return hold('last session',`Last set ${lastTxt} had no RPE, so it repeats.`);

  if(isChartFree(ex)) return done(rpeDeltaStep(slot,L0,R0,RPE0,T));

  const e1=impliedE1(L0+off,R0,RPE0);            // null = this set is off the chart
  const offChart=e1==null;
  const rtf=R0+(10-RPE0);
  const dir=T-RPE0;                              // > 0: last set was easier than aimed
  const atCeiling=R0>=hi;
  const toAdded=v=>Math.max(0,v-off);

  // ── harder than aimed: less load, or fewer reps at the same load if the step is too coarse
  if(dir<0){
    if(!offChart){
      const reps0=Math.min(R0,hi);
      const cands=[];
      let LA=gridFloor(slot,toAdded(loadFor(e1,reps0,T)||0));
      if(LA>=L0-1e-6) LA=stepDown(slot,L0);
      if(LA>=0&&LA<L0-1e-6) cands.push({lb:LA,reps:reps0,kind:'load'});
      const repsB=Math.max(1,Math.min(hi,Math.floor(R0-(RPE0-T)+1e-9)));
      if(repsB<R0) cands.push({lb:L0,reps:repsB,kind:'reps'});
      cands.forEach(c=>{ c.p=predictedRpe(e1,c.lb+off,c.reps); c.gap=c.p==null?99:Math.abs(c.p-T); });
      cands.sort((a,b)=>a.gap-b.gap||(a.kind===b.kind?0:a.kind==='load'?-1:1));
      const c=cands[0];
      if(c) return done({lb:c.lb,reps:c.reps,src:'from e1RM',
        note:`Last set ${lastTxt} was harder than RPE ${T}, so ${c.kind==='load'?`load drops to ${fmt(c.lb,0)} for the same ${c.reps} reps`:`the load holds at ${fmt(L0,0)} and reps drop to ${c.reps}, because one step down (${fmt(stepDown(slot,L0),0)}) would be far too light`}.`});
    }
    return done({lb:L0,reps:Math.max(1,Math.min(R0-1,hi)),src:'harder than aimed · one rep fewer',
      note:`Last set ${lastTxt} was harder than RPE ${T}${offChart?`, and ${fmt(rtf,0)} reps-to-failure is past the ${CHART_MAX_RTF} the chart covers so it can't be priced`:''}. Same load, one rep fewer.`});
  }
  if(dir===0) return hold('last session',`Last set ${lastTxt} was right on target, so it repeats.`);

  // ── easier than aimed
  const overridden=overrideStreak(ex.id)>=OVERRIDE_TRIGGER;
  if(!atCeiling){
    if(overridden&&lastWasProbe(ex.id)) return hold('holding at what you\'ve set',
      `You've logged below the last few suggestions and the last one was already a probe, so this holds ${lastTxt}.`);
    return done({lb:L0,reps:R0+1,src:overridden?'probe · +1 rep':'last session',
      note:`Last set ${lastTxt} was easier than RPE ${T} and below the ${hi}-rep ceiling, so same load, one more rep.`});
  }
  const ready=RPE0<=7.5;
  if(!ready&&overridden){
    if(lastWasProbe(ex.id)) return hold('holding at what you\'ve set',
      `You've logged below the last few suggestions and the last one was already a probe, so this holds ${lastTxt}.`);
    const up=gridFloor(slot,L0+PROBE_INCREMENT_LB);
    if(up>L0+1e-6) return done({lb:up,reps:R0,src:'probe · small bump',
      note:`You've logged below the last few suggestions, so this tries a small ${PROBE_INCREMENT_LB} lb bump at the same ${R0} reps rather than a full step.`});
    return hold('holding · probe smaller than a step',
      `You've logged below the last few suggestions; a ${PROBE_INCREMENT_LB} lb probe is smaller than this exercise's ${ex.inc} lb step, so this holds ${lastTxt}.`);
  }

  // at or past the top of the range and easier than aimed: add load
  const rate=ready?progressionRate(ex.id):null;
  const useRate=rate!=null&&rate>0;              // a flat or falling trailing rate is no reason to hold back
  let raw=null;
  if(useRate) raw=L0+rate;
  else if(!offChart){ const lf=loadFor(e1,lo,T); if(lf!=null) raw=toAdded(lf); }
  const capLb=capLimit(slot,L0);
  const capTxt=exposureCount(slot.ex)<UNFAMILIAR_EXPOSURE?'2.5%':'10%';
  let lb, forced=false;
  if(raw==null){ lb=stepUp(slot,L0); forced=true; }
  else{
    lb=gridFloor(slot,Math.min(raw,capLb));
    if(lb<=L0+1e-6){ lb=stepUp(slot,L0); forced=true; }     // the smallest move is one step
  }
  // reps priced for the load actually returned, clamped to the range: effort-matched, never harder than aimed
  let reps=lo;
  if(!offChart){
    const rt=rtfFromPct((lb+off)/e1*100);
    if(rt!=null) reps=Math.max(lo,Math.min(hi,Math.floor(rt-(10-T)+1e-9)));
  }
  const stepTxt=`${fmt(L0,0)} → ${fmt(lb,0)}`;
  const why=offChart
    ?`Last set ${lastTxt} was too light to price: ${fmt(rtf,0)} reps-to-failure is past the ${CHART_MAX_RTF} the chart covers. Load goes up one step (${stepTxt}) and reps restart at ${reps}.`
    :`Last set ${lastTxt} was easier than RPE ${T} at the top of the range. Load goes to ${fmt(lb,0)} for ${reps} reps`
      +(useRate?`, following your recent rate (+${fmt(rate,1)} lb per session).`:`, the load ${reps===lo?`${lo} reps`:`those ${reps} reps`} at RPE ${T} would take, given that set.`)
      +(forced?` The largest single step allowed (${capTxt} of the load) is smaller than this exercise's smallest jump (${ex.inc} lb), so it takes one step anyway.`:` A single step is capped at ${capTxt}.`);
  return done({lb,reps,
    src:offChart?'last set too light to price · load up one step':forced?'load up one step · cap is smaller than a step':useRate?'from your recent rate':'from e1RM',
    note:why});
}
/* Round to something actually loadable */
function loadable(slot, lb){
  if(lb==null) return null;
  const ex=exById[slot.ex];
  if(ex.load==='barbell'&&ex.plateSet&&PLATE_SETS[ex.plateSet].unit==='lb'){
    const s=solvePlates(lb,ex.bar,ex.plateSet);
    return s?s.achieved:lb;
  }
  return Math.round(lb/ex.inc)*ex.inc;
}

/* ─── readiness ─── */
/* Which soreness groups actually bear on today's session */
/* Which soreness groups bear on a session, derived from the muscles it trains */
const MUSCLE_GROUP={chest:'push',front_delts:'push',side_delts:'push',triceps:'push',
  lats:'pull',upper_back:'upperback',rear_delts:'pull',traps:'pull',biceps:'pull',forearms:'pull',
  quads:'quads',hamstrings:'post',glutes:'post',calves:'post',abs:'lowback',lower_back:'lowback'};
function soreGroupsFor(day){
  const g=new Set();
  (day.slots||[]).forEach(s=>{ const ex=exById[s.ex]; if(!ex) return;
    Object.entries(ex.vol).forEach(([m,w])=>{ if(w>=1&&MUSCLE_GROUP[m]) g.add(MUSCLE_GROUP[m]); }); });
  if(g.size<3) g.add('lowback');
  return [...g];
}

/* ---------- Anchored rating scales: the one place neutral is defined ----------
   Three times a 1–N scale produced a wrong-sized effect because a formula did
   its own arithmetic and put zero in the wrong place (readiness cut load on an
   all-average check-in; the joint ladder cut load on a usual-for-you shoulder).
   Every rating that adjusts anything goes through fromNeutral(): it returns 0
   at the scale's neutral point, -1 at its floor and +1 at its ceiling (each
   side scaled separately, so an off-centre neutral still works). Neutral can
   be overridden per call — the joint ladder passes your personal baseline.
   raw:true returns the plain distance from neutral in the scale's own units.
   Never centre a rating by hand (subtract 3, halve) or compare it to a raw
   threshold (v<=2) anywhere else.
   tests/prescription-invariants.js §19 checks neutral → 0 on every scale. */
const SCALE_SPEC={
  sleep:{min:1,max:5,neutral:3}, motivation:{min:1,max:5,neutral:3},
  soreness:{min:1,max:5,neutral:3}, recovery:{min:1,max:5,neutral:3},
  // joint severity as weighted per session: 0 none, .5 mild, 1 moderate, 2 bad.
  // No fixed neutral — it's your baseline (jointBaseline()).
  joint:{min:0,max:2,neutral:0}
};
function fromNeutral(v, spec, neutral, opt){
  if(typeof spec==='string') spec=SCALE_SPEC[spec];
  if(v==null||typeof v!=='number'||!isFinite(v)) return 0;     // unanswered = neutral
  const n=neutral==null?spec.neutral:neutral, x=Math.max(spec.min,Math.min(spec.max,v));
  if(x===n) return 0;
  if(opt&&opt.raw) return x-n;
  return x<n?(x-n)/((n-spec.min)||1):(x-n)/((spec.max-n)||1);
}
const meanAdj=(key,vals)=>{ const a=vals.filter(v=>v!=null); return a.length?a.reduce((t,v)=>t+fromNeutral(v,key),0)/a.length:0; };

/* Re-centered so a rating of 3 — "about average" on every anchored scale —
   contributes nothing, matching what the descriptors actually say (sleep 3 is
   "6-8 hours of decent sleep", motivation 3 is "neutral, will get it done",
   soreness 3 is "mild to no soreness"). The old norm(v)=(v-1)/4 scored an
   honest all-3s check-in at 0.50 against a 0.65 "normal" cutoff, so a
   completely average day cut load every session (100% of sessions in the
   first backtest — see tests/backtest.js). This score now drives ONLY the
   warmup ramp length, the prep-block length, and the display label — load
   and set cuts are decided separately, by physicalCut(), which sleep and
   motivation never touch. Judgement default, Grade D. */
function readinessScore(st, groups){
  // fromNeutral: 1→-1, 2→-.5, 3→0, 4→.5, 5→1
  const sore=meanAdj('soreness',(groups||[]).map(g=>st.sore[g]));
  // recovery ("rest of life") pulls down with soreness's weight; 4-5 add nothing
  const raw=fromNeutral(st.sleep,'sleep')*0.30 + fromNeutral(st.motivation,'motivation')*0.20 + sore*0.50
    + Math.min(0,fromNeutral(st.recovery,'recovery'))*0.50 + energyCfg().ready;
  return Math.max(0,Math.min(1, 0.7+raw*0.3));  // all-3s -> 0.70, squarely "Normal"
}
/* Same formula, replayed straight from a logged 'readiness' event instead
   of the live check-in form — works retroactively on every readiness event
   already in the log, since nothing about the score is ever stored, only
   derived. Averages whichever soreness groups happen to be on the event
   (it doesn't record which ones applied that day), which is an
   approximation for old data but exact for the live in-session score. */
function readinessScoreFromEvent(ev){
  const sore=meanAdj('soreness',Object.values(ev.soreness||{}));
  const raw=fromNeutral(ev.sleep_quality,'sleep')*0.30 + fromNeutral(ev.motivation,'motivation')*0.20 + sore*0.50
    + Math.min(0,fromNeutral(ev.recovery,'recovery'))*0.50 + energyCfg().ready;
  return Math.max(0,Math.min(1, 0.7+raw*0.3));
}
/* Plain-language label for the display score only. This no longer implies a
   load cut — that's physicalCut()'s call, on a different signal entirely. */
function readinessLabel(score){
  if(score>=0.85) return 'Feeling great';
  if(score>=0.45) return 'Normal';
  return 'Rough day';
}
/* Load and set cuts require a PHYSICAL signal — soreness in a muscle group
   this session actually trains, or a flagged joint whose patterns appear in
   it — never sleep or motivation alone (see docs/calibration-plan.md and the
   readinessScore comment above for why: a blended score cut load on every
   session for an honest "everything's average" check-in). Same magnitudes as
   before, just gated on a direct physical trigger instead of a blended
   score. Judgement defaults, Grade D. */
function physicalCut(st, groups){
  const soreVals=(groups||[]).map(g=>st.sore[g]).filter(v=>v!=null);
  const worstSore=soreVals.length?Math.min(...soreVals):3;
  const soreGroup=soreVals.length?groups.find(g=>st.sore[g]===worstSore):null;
  const soreLabel=soreGroup?(GROUP_LABEL[soreGroup]||soreGroup):null;
  // A flagged joint is handled per exercise by the joint ladder
  // (jointNoteFor), not here: a sore shoulder shouldn't cut calf raises.
  // "Rest of life" (stress, illness, run-down, under-fed) is a whole-session
  // physical signal in the same weight class as soreness. 3 is neutral; 4-5
  // never add load. Judgement default, Grade D.
  const rec=st.recovery??3;
  // floor of the scale: 2; halfway to the floor: 1; neutral or better: 0
  const tier=(v,key)=>{ const a=fromNeutral(v,key); return a<=-1?2:a<=-0.5?1:0; };
  const ts=tier(worstSore,'soreness'), tr=tier(rec,'recovery'), t=Math.max(ts,tr);
  if(!t) return null;
  const sig=[];
  if(ts===t) sig.push('sore '+(soreLabel||'muscles'));
  if(tr===t) sig.push(rec<=1?'run-down':'life stress');
  return t===2?{load:0.90, sets:-2, label:'Reduced', signal:sig.join(' and ')}
              :{load:0.95, sets:-1, label:'Slightly reduced', signal:sig.join(' and ')};
}

/* volume as bars coloured by block type, intensity as an overlaid line */
function phaseChart(cur){
  if(!ROADMAP.length) return el('div','empty','No blocks yet — open Edit program to build one.');
  const W=600,H=132,padL=2,padB=16,top=8;
  const weeks=[];
  ROADMAP.forEach(b=>b.vol.forEach((vv,wi)=>weeks.push({
    type:(b.deload&&wi>=b.weeks)?'deload':b.type, vol:vv, int:b.int[wi]})));
  const n=weeks.length,bw=(W-padL*2)/n,maxV=Math.max(...weeks.map(w=>w.vol)),plotH=H-padB-top;
  let elapsed=0; ROADMAP.slice(0,cur.idx).forEach(b=>elapsed+=b.weeks);
  const curIdx=elapsed+cur.week-1;

  let bars='',labels='',pts=[];
  weeks.forEach((w,i)=>{
    const h=(w.vol/maxV)*plotH*.82, x=padL+i*bw, y=top+plotH-h, on=i===curIdx;
    if(on) bars+=`<rect x="${x+1}" y="${top}" width="${bw-2}" height="${plotH}" rx="2" fill="var(--ink)" opacity=".055"/>`;
    bars+=`<rect x="${x+1}" y="${y}" width="${bw-2}" height="${h}" rx="1.5" fill="${TYPE_COLOR[w.type]}" opacity="${on?1:.52}"/>`;
    pts.push([x+bw/2, top+plotH-(w.int/100)*plotH*.94]);
  });
  let acc=0;
  ROADMAP.forEach(b=>{
    const L=blockLen(b);
    labels+=`<text x="${padL+(acc+L/2)*bw}" y="${H-4}" fill="${TYPE_COLOR[b.type]}"
             font-size="9.5" text-anchor="middle" opacity=".8">${L}w</text>`;
    acc+=L;
    if(acc<n) labels+=`<line x1="${padL+acc*bw}" y1="${top}" x2="${padL+acc*bw}" y2="${top+plotH}" stroke="var(--line)"/>`;
  });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const box=el('div','');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:132px;display:block" aria-hidden="true">
    ${bars}${labels}<path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linejoin="round" opacity=".85"/></svg>`;
  return box;
}

/* "Last time: 170 × 10 @ 8 · 3 days ago", from your previous session of this
   exercise, plus an arrow when today's prescription (rx: {lb, reps}) moves
   from it. Shown on every card, open or collapsed, before you lift. */
function lastTimeHtml(slot, rx){
  const lp=lastPerformance(slot.ex);
  if(!lp) return '<div class="lasttime dim">First time on this lift</div>';
  const st=lp.set, L=toLb(st.weight), w=fmt(st.weight.value)+(st.weight.unit==='kg'?' kg':'');
  let arrow='';
  if(rx&&rx.lb!=null){
    if(rx.lb>L+0.01) arrow='↑ '+fmt(rx.lb,0)+' × '+rx.reps;
    else if(rx.lb<L-0.01) arrow='↓ '+fmt(rx.lb,0)+' × '+rx.reps;
    else if(rx.reps>st.reps) arrow='↑ '+rx.reps+' reps';
    else if(rx.reps<st.reps) arrow='↓ '+rx.reps+' reps';
    else arrow='same again';

  return '<div class="lasttime">Last time: '+w+' × '+st.reps+(st.rpe!=null?' @ '+st.rpe:'')+' · '+esc(lp.when)
    +(arrow?' <span class="lastarrow">· today '+arrow+'</span>':'')+'</div>';
}

/* How the suggested load sits against your best estimate, for the preview. */
function pctOfBest(slot, lb){
  const ex=exById[slot.ex], b=bestE1RM(slot.ex);
  if(lb==null||!b||ex.load==='bodyweight'||(isBW(ex)&&!lb&&!bwOffset(ex))) return '';
  return Math.round((lb+bwOffset(ex))/b.v*100)+'% of '+fmt(b.v,0)+' est. 1RM'

/* Move an exercise one place. The open panel follows the exercise you moved —
   moving one up means "I want to do this next" — unless a cluster is mid-flight,
   where reseeding the draft would break the group. Exercises with logged sets
   stay put, since their history belongs to that slot. */
function moveSlot(i, dir){
  const j=i+dir, sl=session.slots;
  if(j<0||j>=sl.length||sl[i].sets.length) return false;
  const moved=sl[i], wasOpen=session.openIdx===i;
  [sl[i],sl[j]]=[sl[j],sl[i]];
  if(draft.group){
    if(session.openIdx===i) session.openIdx=j; else if(session.openIdx===j) session.openIdx=i;
  }else{
    session.openIdx=j;
    if(!wasOpen) seedDraft(moved);
  }
  saveSession(); return true;
}
/* +/- sets on any exercise, open or not. Never below what is already logged. */
function adjustSets(slot, idx, delta){
  if(delta<0){ if(slot.sets_target<=slot.sets.length) return false; slot.sets_target--; }
  else slot.sets_target++;
  if(session.openIdx===idx) advanceIfDone(slot,idx);
  saveSession(); return true;
}
function openSessionAdd(){
  exPicker('Add an exercise', ()=>true, e=>{

    session.slots.push({...s,sets_target:s.sets,sets:[]});
    if(session.openIdx===-1){ session.openIdx=session.slots.length-1; seedDraft(session.slots[session.openIdx]); }
    saveSession(); renderWork(); toast('Added '+e.name);
  });
}

/* ─── post-session rehab / prehab ───
   Chosen from the same inputs buildPrep() reads — declared conditions and
   joint trends — plus what today's session showed. Tick-only: never appended to
   the log, so it can't reach volume accounting. Doses are judgement defaults. */
const REHAB_PATTERN={shoulder:'rehab_shoulder',knee:'prehab_knee',wrist:'prehab_wrist',
  elbow:'prehab_elbow','low back':'prehab_lowback'};
/* Rehab movements that load a declared condition's risk position. Checked in
   addition to flagFor(). prone_t is abduction with external rotation. */
const REHAB_UNSAFE={shoulder_instability:['prone_t']};
function rehabUnsafe(exId){
  if(flagFor(exId)) return true;
  return (CFG.conditions||[]).some(c=>(REHAB_UNSAFE[c]||[]).includes(exId));
}
function buildRehab(){
  const flagged=new Set(), active=[];
  const addJ=(j,isFlag)=>{ if(!REHAB_PATTERN[j]) return; if(!active.includes(j)) active.push(j); if(isFlag) flagged.add(j); };
  Object.keys((session.readiness&&session.readiness.joints)||{}).forEach(j=>addJ(j,true));
  session.slots.forEach(sl=>{ if(sl.joint&&sl.joint.level>=3) addJ(sl.joint.joint,true); });
  const ep=lastEarlyPain();
  if(ep) Object.keys(ep.joints||{}).forEach(j=>addJ(j,true));
  JOINTS.forEach(j=>{ const lv=jointLevel(jointTrend(j,6)); if(lv>=2) addJ(j,lv>=3); });
  (CFG.conditions||[]).forEach(c=>{ const cd=CONDITIONS[c]; if(cd&&cd.joint) addJ(cd.joint,false); });
  if(!active.length) return [];
  // joints flagged today first
  active.sort((a,b)=>(flagged.has(b)?1:0)-(flagged.has(a)?1:0));
  // heavy work through a joint earns a longer block
  const heavy=new Set();
  active.forEach(j=>{
    const pats=JOINT_PATTERNS[j]||[];
    const n=session.slots.reduce((a,sl)=>a+(pats.includes(exById[sl.ex].pattern)?sl.sets.length:0),0);
    if(n>=8) heavy.add(j);
  });
  const n=Math.min(5, 2+(flagged.size?1:0)+(heavy.size?1:0));
  const pools=active.map(j=>{
    const list=EX.filter(e=>e.rehab&&e.pattern===REHAB_PATTERN[j]&&!rehabUnsafe(e.id));
    const rot=list.length?completedCount()%list.length:0;   // vary between sessions
    return {j,list:list.slice(rot).concat(list.slice(0,rot))};
  }).filter(p=>p.list.length);
  const out=[];
  for(let round=0; out.length<n; round++){
    let added=false;
    for(const p of pools){
      if(out.length>=n) break;
      const e=p.list[round]; if(!e) continue;
      added=true;
      out.push({ex:e.id,name:e.name,joint:p.j,done:false,
        why:flagged.has(p.j)?'flagged today':heavy.has(p.j)?'heavy '+p.j+' work today':'your '+p.j,
        dose:isBW(e)?'2 sets, slow reps or holds':'2 × 12–15, light'});
    }
    if(!added) break;
  }
  return out;
}
function renderRehab(v){

/* Today's session, already chosen, shown with its prescribed numbers
   BEFORE the check-in. The check-in then adjusts it, visibly. */
/* The whole week at a glance, so you can see and fix the shape before you
   start rather than discovering it on day four. */
/* The whole week, fully editable — every day, every exercise, sets and reps.
   Opens on one day at a time so it stays usable on a phone. */
function openWeekPreview(openDayId){
  const p=currentPhase();
  const days=generatedDays().map(weekPlanFor);
  const active = openDayId || days[0].id;

  const vol={};
  days.forEach(d=>d.slots.forEach(sl=>{
    const ex=exById[sl.ex]; if(!ex) return;
    Object.entries(ex.vol).forEach(([m,w])=>vol[m]=(vol[m]||0)+w*sl.sets);
  }));

  let html=`<h2 style="font-size:21px;margin-bottom:2px">Your week</h2>
    <div class="muted tiny" style="margin-bottom:11px">${esc(p.label)} · week ${p.week} of ${p.weeks} · ${activeSplit().name}</div>
    <div class="chips" id="wkdays" style="margin-bottom:12px"></div>
    <div id="wkbody"></div>
    <div class="qblock" id="wkvol"></div>
    <button class="btn ghost wide" id="wpclose">Close</button>`;
  sheet(html);

  days.forEach(d=>{
    const c=el('button','chip',esc(d.name)+(d.edited?' ·':''));
    c.style.cssText='font-size:12.5px;padding:6px 11px';
    c.setAttribute('aria-pressed', d.id===active?'true':'false');
    c.onclick=()=>openWeekPreview(d.id);

  });

  const rawDays=generatedDays();
  const rawDay=rawDays.find(x=>x.id===active)||rawDays[0];
  const day=weekPlanFor(rawDay);
  const body=$('#wkbody');

  const hdr=el('div','row between'); hdr.style.cssText='margin-bottom:8px';
  hdr.innerHTML=`<span style="font-weight:650">${esc(day.name)}</span>
    <span class="dim tiny">${day.slots.reduce((a,x)=>a+x.sets,0)} sets</span>`;
  if(day.edited){
    const rs=el('button','btn s','Reset day');
    rs.onclick=()=>{ delete WEEKEDITS[rawDay.id]; saveWeekEdits(); openWeekPreview(active); };
    hdr.appendChild(rs);
  }
  body.appendChild(hdr);

  day.slots.forEach((sl,i)=>{
    const ex=exById[sl.ex], f=flagFor(sl.ex);
    const row=el('div',''); row.style.cssText='padding:10px 0;border-top:1px solid var(--line)';
    row.innerHTML=`<div class="row between">
        <span class="grow"><div style="font-weight:600;font-size:14.5px">${esc(ex?ex.name:sl.ex)}${
          f?`<span style="color:${f.level==='red'?'var(--danger)':'var(--warn)'}"> ${f.level==='red'?'▲':'●'}</span>`:''}</div>
          <div class="dim tiny">${sl.sets} × ${sl.reps[0]===sl.reps[1]?sl.reps[0]:sl.reps[0]+'–'+sl.reps[1]} @ RPE ${sl.rpe}${sl.role?' · '+sl.role:''}</div></span>
      </div>`;
    const ctl=el('div','row'); ctl.style.cssText='gap:6px;margin-top:8px';
    const mk=(lab,aria,fn)=>{ const b=el('button','btn s',lab); b.setAttribute('aria-label',aria); b.onclick=fn; return b; };
    ctl.appendChild(mk('−','One set fewer',()=>{ editWeekDay(rawDay,d=>{ if(d.slots[i].sets>1) d.slots[i].sets--; }); openWeekPreview(active); }));
    ctl.appendChild(mk('+','One set more',()=>{ editWeekDay(rawDay,d=>{ d.slots[i].sets++; }); openWeekPreview(active); }));
    if(i>0) ctl.appendChild(mk('↑','Move earlier',()=>{ editWeekDay(rawDay,d=>{ [d.slots[i-1],d.slots[i]]=[d.slots[i],d.slots[i-1]]; }); openWeekPreview(active); }));
    if(i<day.slots.length-1) ctl.appendChild(mk('↓','Move later',()=>{ editWeekDay(rawDay,d=>{ [d.slots[i+1],d.slots[i]]=[d.slots[i],d.slots[i+1]]; }); openWeekPreview(active); }));
    ctl.appendChild(mk('Swap','Swap exercise',()=>{
      const cur=exById[sl.ex];
      exPicker('Swap '+(cur?cur.name:''), e=>e.id!==sl.ex, e=>{
        editWeekDay(rawDay,d=>{ d.slots[i].ex=e.id; d.slots[i].swapped=true; });
        openWeekPreview(active);
      });
    }));
    const rm=mk('✕','Remove exercise',()=>{ editWeekDay(rawDay,d=>{ d.slots.splice(i,1); }); openWeekPreview(active); });
    rm.style.color='var(--skip)'; ctl.appendChild(rm);
    row.appendChild(ctl);
    body.appendChild(row);
  });

  const addB=el('button','btn wide','Add an exercise to '+day.name);
  addB.style.marginTop='11px';

    editWeekDay(rawDay,d=>{ d.slots.push(newSlotFor(e)); });

  body.appendChild(addB);

  const vh=$('#wkvol');
  vh.innerHTML='<div class="qlab">Weekly volume against your landmarks</div>';
  Object.keys(vol).sort((a,b)=>vol[b]-vol[a]).forEach(m=>{
    const L=LANDMARKS[m]; if(!L) return;

    vh.appendChild(el('div','row between sm',
      `<span class="muted">${esc(ML[m])}</span>
       <span style="color:${col}">${fmt(v)} <span class="dim">/ ${L.MEV}–${L.MRV}</span></span>`))
      .style.padding='3px 0';
  });

  $('#wpclose').onclick=()=>{ $('#dlg').close(); render(); };
}

/* Edits to today's plan live here until you start. Generated fresh otherwise. */
let PENDING=null;
function loadPending(){ try{ PENDING=JSON.parse(localStorage.getItem(LS_PEND)||'null'); }catch{ PENDING=null; } }
function savePending(){ try{ PENDING?localStorage.setItem(LS_PEND,JSON.stringify(PENDING)):localStorage.removeItem(LS_PEND); }catch{} }

/* Edits to ANY day of the week, keyed by day id and stamped to the current
   phase/week so they expire naturally when the program moves on. */
let WEEKEDITS={};
function loadWeekEdits(){ try{ WEEKEDITS=JSON.parse(localStorage.getItem(LS_WEEK)||'{}')||{}; }catch{ WEEKEDITS={}; } }
function saveWeekEdits(){ try{ localStorage.setItem(LS_WEEK,JSON.stringify(WEEKEDITS)); }catch{} }
function weekPlanFor(day){
  const w=WEEKEDITS[day.id];
  if(w&&w.stamp===planStamp()) return {...day,slots:w.slots,edited:true};
  return day;
}
function editWeekDay(day,fn){
  const base=weekPlanFor(day);
  const copy={stamp:planStamp(),slots:JSON.parse(JSON.stringify(base.slots))};
  fn(copy); WEEKEDITS[day.id]=copy; saveWeekEdits();
}
function planFor(day){
  if(PENDING&&PENDING.id===day.id&&PENDING.stamp===planStamp()) return PENDING;
  return weekPlanFor(day);
}
const planStamp=()=>{ const p=currentPhase(); return `${p.idx}:${p.week}:${splitKeyFor(ROADMAP[p.idx])}:${completedCount()}`; };
// Off by default: edits apply only to this occurrence (PENDING), same as
// always. On, the same edit is also written into CFG.dayOverrides so it
// becomes the new generated baseline going forward — a plain checkbox read
// at save time, no popup, no change-detection.
let SAVE_TO_PRESET=false;
function editPlan(day,fn){
  const base=planFor(day);
  PENDING={id:day.id,name:base.name,stamp:planStamp(),
    slots:JSON.parse(JSON.stringify(base.slots)),edited:true};
  fn(PENDING); savePending();
  if(SAVE_TO_PRESET){
    CFG.dayOverrides=CFG.dayOverrides||{};
    CFG.dayOverrides[day.id]={slots:JSON.parse(JSON.stringify(PENDING.slots))};
    saveCfg();
  }
  render();
}

/* Judgement estimate, not measured: setup+work time per working set, plus
   its rest, plus a flat estimate per warmup rung. */
const SET_TIME_S=45, WARMUP_RUNG_S=40;
function estSessionLength(day){
  let secs=0;
  day.slots.forEach(slot=>{
    const lb=nextPrescription(slot).lb;
    secs+=warmupRamp(slot,lb||0).length*WARMUP_RUNG_S;
    secs+=slot.sets*(SET_TIME_S+(REST_BY_ROLE[slot.role]||120));
  });
  return Math.round(secs/60);
}
/* One exercise in a plan, before the session: the same card and set rows as
   the live session, weight × reps @ RPE on every set, the warmup ramp
   collapsed, and the explanation line. Both the training-tab preview and the
   "Preview workout" sheet call this, so they can't drift apart. */
const WARM_OPEN=new Set();
function planCard(slot, key, controls){
  const ex=exById[slot.ex], pr=nextPrescription(slot), lb=pr.lb;
  const loadTxt=isBW(ex)?(lb?'+'+fmt(lb,0)+' lb':'bodyweight'):(lb!=null?fmt(lb,0)+' lb':'—');
  const reps=lb!=null&&pr.reps!=null?String(pr.reps):fmtRange(slot.reps);
  const {box,body}=exCard(slot,{rx:lb!=null?{lb,reps:pr.reps}:null});
  for(let j=0;j<slot.sets;j++)
    body.appendChild(srowEl({idx:j+1, load:loadTxt+' × '+reps, badge:'RPE '+slot.rpe}));
  const ramp=lb!=null?warmupRamp(slot,lb):[];
  if(ramp.length){
    const wk=key+':'+slot.ex, wrap=el('div','');
    const draw=()=>{
      const open=WARM_OPEN.has(wk);
      wrap.innerHTML='';
      const t=el('button','warmtog','Warmup · '+ramp.length+' set'+(ramp.length>1?'s':'')+' '+(open?'▾':'▸'));
      t.setAttribute('aria-expanded',open?'true':'false');
      t.onclick=()=>{ if(open) WARM_OPEN.delete(wk); else WARM_OPEN.add(wk); draw(); };
      wrap.appendChild(t);
      if(open) ramp.forEach(r=>wrap.appendChild(srowEl({warm:true, empty:true, badge:'warmup',
        load:(r.bar?'Bar ':'')+fmt(r.lb,0)+' lb × '+r.reps})));
    };
    draw(); body.appendChild(wrap);
  }
  const f=flagFor(slot.ex);
  if(f) body.appendChild(el('div','tiny',(f.level==='red'?'▲ ':'● ')+esc(f.why))).style.cssText='color:'+(f.level==='red'?'var(--danger)':'var(--warn)')+';margin-top:6px';
  const pct=pctOfBest(slot,lb);
  if(pct) body.appendChild(el('div','dim tiny',esc(pct))).style.marginTop='4px';
  body.appendChild(whyEl(explainRx(slot,pr,{idx:null,fresh:true}),key+':why:'+slot.ex));
  if(controls) body.appendChild(controls);
  return box;
}
function renderPreview(v){

  }
  const head=el('div','card pad');
  head.innerHTML=`<div class="phase ${p.type}">${esc(p.label)} · Week ${p.week}</div>
    <div style="font-size:27px;font-weight:790;letter-spacing:-.03em;margin:1px 0 2px">${esc(day.name)}</div>
    <div class="muted sm">${day.slots.length} exercises · ${day.slots.reduce((a,s)=>a+s.sets,0)} working sets${day.slots.length?' · ~'+estSessionLength(day)+' min (estimate)':''}</div>
    <div class="dim tiny" style="margin-top:5px">Based on how things stand now — the check-in may adjust this.</div>`;
