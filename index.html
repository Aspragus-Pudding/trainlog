      x.setAttribute('aria-pressed',on?'true':'false');
      x.onclick=()=>{ st.secondary=on?st.secondary.filter(y=>y!==m):st.secondary.concat(m); draw(); };
      sc.appendChild(x);
    });
    sec.appendChild(sc); host.appendChild(sec);

    const nums=el('div','qblock');
    nums.innerHTML='<div class="qlab">Smallest jump'+(st.load==='barbell'?' and bar weight':'')+'</div>';
    const nh=el('div',''); nh.style.cssText='display:grid;grid-template-columns:1fr'+(st.load==='barbell'?' 1fr':'')+';gap:8px';
    nh.appendChild(stepper('increment lb',st.inc,2.5,v=>{st.inc=Math.max(1,v);draw();}));
    if(st.load==='barbell') nh.appendChild(stepper('bar lb',st.bar,5,v=>{st.bar=Math.max(0,v);draw();}));
    nums.appendChild(nh); host.appendChild(nums);

    mk('Display in',['lb','kg','both'],st.unitPref,v=>st.unitPref=v);
  };
  draw();
  $('#cxcancel').onclick=()=>$('#dlg').close();
  $('#cxsave').onclick=()=>{
    const name=(st.name||'').trim();
    if(name.length<2){ toast('Give it a name first'); return; }
    const vol={[st.primary]:1}; st.secondary.forEach(m=>vol[m]=0.5);
    if(editingEx){
      const lt=loadingType(st.load);
      Object.assign(editingEx,{name,pattern:st.pattern,load:st.load,bar:st.bar||0,
        plateSet:lt.plate?'main_lb':null,inc:st.inc,prog:lt.prog,
        comparable:lt.comparable,unitPref:st.unitPref,vol});
      CFG.customEx=(CFG.customEx||[]).map(c=>c.id===editingEx.id?editingEx:c); saveCfg();
      $('#dlg').close(); toast(name+' updated');
      if(onCreate) onCreate(editingEx); else render();
      return;
    }
    const id='cx_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,28)+'_'+Math.random().toString(36).slice(2,5);
    const lt=loadingType(st.load);
    const ex={id,name,pattern:st.pattern,load:st.load,bar:st.bar||0,
      plateSet:lt.plate?'main_lb':null,inc:st.inc,prog:lt.prog,
      comparable:lt.comparable,custom:true,unitPref:st.unitPref,vol};
    CFG.customEx=(CFG.customEx||[]).concat(ex); saveCfg(); mergeCustom();
    $('#dlg').close(); toast(name+' added');
    if(onCreate) onCreate(ex); else render();
  };
}

/* Quick note capture. Notes are ordinary log events, so they export, sync and
   restore with everything else. Tagged by what you were doing when you wrote
   them, which is what makes them actionable later. */
const NOTE_TAGS=[
  {id:'bug',   label:'Something broke'},
  {id:'ux',    label:'Annoying / confusing'},
  {id:'idea',  label:'Idea'},
  {id:'train', label:'Training note'}
];
const TAB_LABEL={dash:'Dashboard',work:'Workout',lifts:'Lifts',hist:'Progress'};
function openNote(prefillTag){
  let tag=prefillTag||'bug';
  /* Auto-context is WHERE YOU WERE when you wrote this, which is not always
     what you're writing about. So it's shown plainly and can be detached —
     silently-wrong metadata is worse than none. */
  const exOpen=session?exById[session.slots[session.openIdx]?.ex]:null;
  const auto={
    screen: TAB_LABEL[TAB]||TAB,
    context: session?[session.dayName, exOpen?exOpen.name:null].filter(Boolean).join(' · '):null
  };
  let attach=true;
  sheet(`<h2 style="font-size:21px;margin-bottom:3px">Quick note</h2>
    <div class="muted tiny" style="margin-bottom:14px">Saved to your log and your backup sheet.</div>
    <div class="qblock"><div class="qlab">What kind?</div><div class="chips" id="ntag"></div></div>
    <div class="qblock">
      <textarea id="ntext" rows="4" placeholder="What happened? Be specific — what you tapped and what it did."
        style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit;font-size:15px;resize:vertical"></textarea>
    </div>
    <div class="qblock" id="nctx"></div>
    <div class="row" style="gap:8px">
      <button class="btn ghost grow" id="ncancel">Cancel</button>
      <button class="btn pri grow" id="nsave">Save note</button>
    </div>`);
  const drawCtx=()=>{
    const bits=[auto.screen+' tab', auto.context, 'v'+APP_VERSION].filter(Boolean);
    $('#nctx').innerHTML=`<div class="qlab">Attach where you are now?</div>
      <div class="muted sm" style="opacity:${attach?1:.4};line-height:1.5">${esc(bits.join(' · '))}</div>
      <div class="dim tiny" style="margin-top:6px">${attach
        ? 'Turn this off if the note is about something else.'
        : 'Only the app version will be saved.'}</div>`;
    const t=el('button','btn s',attach?'Don\'t attach':'Attach');
    t.style.marginTop='9px'; t.onclick=()=>{ attach=!attach; drawCtx(); };
    $('#nctx').appendChild(t);
  };
  drawCtx();
  NOTE_TAGS.forEach(t=>{
    const b=el('button','chip',t.label); b.style.cssText='font-size:12.5px;padding:6px 11px';
    b.setAttribute('aria-pressed',tag===t.id?'true':'false');
    b.onclick=()=>{ tag=t.id; openNoteRetag(tag); };
    $('#ntag').appendChild(b);
  });
  function openNoteRetag(t){
    $('#ntag').querySelectorAll('.chip').forEach((b,i)=>
      b.setAttribute('aria-pressed',NOTE_TAGS[i].id===t?'true':'false'));
  }
  const ta=$('#ntext');
  setTimeout(()=>{ try{ta.focus();}catch{} },100);
  $('#ncancel').onclick=()=>$('#dlg').close();
  $('#nsave').onclick=()=>{
    const v=(ta.value||'').trim();
    if(v.length<2){ toast('Write something first'); return; }
    append({type:'note', tag, text:v, app_version:APP_VERSION,
      context: attach?auto.context:null, screen: attach?auto.screen:null, resolved:false});
    $('#dlg').close(); render(); toast('Note saved');
    if((CFG.syncUrl||'').trim()) syncNow(true);
  };
}

/* Everything still open, formatted for pasting straight into Claude Code. */
function notesReport(){
  const notes=LOG.filter(e=>e.type==='note'&&!e.resolved);
  const resolvedIds=new Set(LOG.filter(e=>e.type==='note_resolved').map(e=>e.target_id));
  const open=notes.filter(n=>!resolvedIds.has(n.id));
  if(!open.length) return null;
  const byTag={};
  open.forEach(n=>{ (byTag[n.tag]=byTag[n.tag]||[]).push(n); });
  let out='Feedback from the last few sessions.\n\n';
  NOTE_TAGS.forEach(t=>{
    const list=byTag[t.id]; if(!list||!list.length) return;
    out+=`## ${t.label}\n`;
    list.forEach(n=>{
      const d=new Date(n.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
      out+=`- ${n.text}`;
      const meta=[d, n.app_version?'v'+n.app_version:null,
        n.screen?n.screen+' tab':null, n.context||null].filter(Boolean).join(' · ');
      out+=`  (${meta})\n`;
    });
    out+='\n';
  });
  out+='Work through these. Plan first, ask if anything is ambiguous, syntax-check index.html, bump APP_VERSION, then commit and push.';
  return {text:out, count:open.length, ids:open.map(n=>n.id)};
}

    ${ex.custom?'<button class="btn ghost wide" id="idel" style="margin-bottom:8px;color:var(--skip)">Delete this custom exercise</button>':''}
    <button class="btn ghost wide" id="iclose">Close</button>`);
  $('#iclose').onclick=()=>$('#dlg').close();
  $('#irename').onclick=()=>openRenameEx(ex);
  if(ex.custom&&$('#iedit')) $('#iedit').onclick=()=>openCustomEx(null,ex);

    $('#dlg').close(); render(); toast('Deleted');
  };
}

/* Swap: same movement pattern, ranked by your own ratings where you have
   at least 3, then unrated options, then one reserved wildcard. */
/* Rating snapshot for one exercise: mean stimulus once it has enough data to
   mean anything (the 3-rating floor matches the rest of the app). */
function ratingSnapshot(id){
  const rs=LOG.filter(x=>x.type==='exercise_rating'&&x.exercise_id===id);
  if(rs.length<3) return null;
  return { st: rs.reduce((a,r)=>a+r.stimulus,0)/rs.length,
           en: rs.reduce((a,r)=>a+r.enjoyment,0)/rs.length, n: rs.length };
}

/* Shared exercise picker: search box + category bar + create-new, used for
   swapping (mid-session and in the preview), adding an accessory, and
   choosing goal lifts — one implementation, so a fix here fixes it everywhere. */
function exPicker(title, filterFn, onPick, opts){
  opts = opts||{};
  const categoryOf = opts.categoryOf || (e=>PATTERN_CATEGORY[e.pattern]||'other');
  let q='', cat=null;
  const draw=()=>{
    let list=EX.filter(e=>!e.rehab).filter(filterFn);
    if(cat) list=list.filter(e=>categoryOf(e)===cat);
    if(q) list=list.filter(e=>e.name.toLowerCase().includes(q.toLowerCase())||e.pattern.includes(q.toLowerCase().replace(/ /g,'_')));
    if(q){
      list=list.sort((a,b)=>a.name.localeCompare(b.name));
    }else{
      // no search yet — surface what's worked for you before, same idea as
      // the substitution ranking: rated-and-liked first, then what you've
      // actually used, then everything else alphabetically
      list=list.sort((a,b)=>{
        const ra=ratingSnapshot(a.id), rb=ratingSnapshot(b.id);
        const sa = ra ? 100+ra.st*2+ra.en : exposureCount(a.id);
        const sb = rb ? 100+rb.st*2+rb.en : exposureCount(b.id);
        return sb-sa || a.name.localeCompare(b.name);
      });
    }
    const cats=[...new Set(EX.filter(e=>!e.rehab).filter(filterFn).map(categoryOf))]
      .sort((a,b)=>(CATEGORY_LABEL[a]||a).localeCompare(CATEGORY_LABEL[b]||b));

    sheet(`<h2 style="font-size:20px;margin-bottom:10px">${esc(title)}</h2>
      <input type="text" id="exq" value="${esc(q)}" placeholder="Search by name or pattern"
       style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit;margin-bottom:10px">
      <div class="chips" id="excat" style="margin-bottom:11px"></div>
      <div class="stack" id="exl" style="max-height:40vh;overflow-y:auto"></div>
      <button class="btn ghost wide" id="exnew" style="margin-top:10px">Create a new exercise</button>
      <button class="btn ghost wide" id="exc" style="margin-top:8px">Cancel</button>`);
    const inp=$('#exq'); inp.oninput=e=>{ q=e.target.value; draw(); setTimeout(()=>{const n=$('#exq'); if(n){n.focus();}},0); };

    const allChip=el('button','chip','All'); allChip.style.cssText='font-size:12.5px;padding:6px 11px';
    allChip.setAttribute('aria-pressed',cat===null?'true':'false');
    allChip.onclick=()=>{cat=null;draw();}; $('#excat').appendChild(allChip);
    cats.forEach(c=>{
      const b=el('button','chip',CATEGORY_LABEL[c]||c); b.style.cssText='font-size:12.5px;padding:6px 11px';
      b.setAttribute('aria-pressed',cat===c?'true':'false');
      b.onclick=()=>{cat=cat===c?null:c;draw();}; $('#excat').appendChild(b);
    });

    list.slice(0,60).forEach(e=>{
      const f=flagFor(e.id), rt=ratingSnapshot(e.id);
      const b=el('button','btn wide'); b.style.cssText='text-align:left';
      b.innerHTML=`<div>${esc(e.name)}${e.custom?' <span class="dim tiny">· custom</span>':''}${
        f?`<span style="color:${f.level==='red'?'var(--peak)':'var(--str)'};font-size:12px"> ${f.level==='red'?'▲':'●'}</span>`:''}</div>
        <div class="dim tiny" style="font-weight:400">${esc(e.pattern.replace(/_/g,' '))} · ${esc(loadName(e.load))}${
          rt?` · stimulus ${rt.st.toFixed(1)}/5 across ${rt.n}`:''}${
          f?` · ${esc(f.why)}`:''}</div>`;
      b.onclick=()=>{ $('#dlg').close(); onPick(e); };
      $('#exl').appendChild(b);
    });
    if(!list.length) $('#exl').appendChild(el('div','empty','Nothing matches. Create one below.'));
    $('#exnew').onclick=()=>openCustomEx(ex=>{ $('#dlg').close(); onPick(ex); });
    $('#exc').onclick=()=>$('#dlg').close();
  };
  draw();
}

    </div>
    <button class="btn ghost wide" id="ecancel" style="margin-top:8px">Cancel</button>`);

  const host=$('#ed');
  const draw=()=>{
    host.innerHTML='';
    const g=el('div','');
    g.style.cssText='display:grid;grid-template-columns:1.35fr 1fr'+(isWarm?'':' 1fr')+';gap:8px;margin-bottom:12px';
    g.appendChild(stepper('Weight',st.weight,exById[slot.ex].inc,v=>{st.weight=Math.max(0,v);draw();},st.unit));
    g.appendChild(stepper('Reps',st.reps,1,v=>{st.reps=Math.max(1,v);draw();}));
    if(!isWarm) g.appendChild(stepper('RPE',st.rpe,.5,v=>{st.rpe=Math.min(10,Math.max(5,v));draw();}));
    host.appendChild(g);
    const est=e1rm(st.unit==='kg'?st.weight*LB:st.weight, st.reps);
    if(est&&!isWarm) host.appendChild(el('div','muted tiny',`Estimated 1RM ${fmt(est,0)} lb · ${conf(st.reps)} confidence`));
  };
  draw();

  $('#ecancel').onclick=()=>$('#dlg').close();
  $('#edel').onclick=()=>{
    // deleting a cluster's top set would orphan its extensions — void the group
    const grp=(orig.group&&orig.group.pos===0)
      ? slot.sets.filter(x=>x.group&&x.group.id===orig.group.id) : [orig];
    const msg=grp.length>1
      ? `Delete this set and its ${grp.length-1} extension${grp.length>2?'s':''}?`
      : 'Delete this set? It stays in the log as a voided entry.';
    if(!confirm(msg)) return;
    grp.forEach(x=>append({type:'correction', target_id:x.id, patch:null, reason:'deleted in app'}));
    grp.forEach(x=>{ const k=slot.sets.indexOf(x); if(k>-1) slot.sets.splice(k,1); });
    saveSession();
    $('#dlg').close(); renderWork(); toast(grp.length>1?'Cluster deleted':'Set deleted');
  };
  $('#esave').onclick=()=>{
    const p={};
    if(st.weight!==orig.weight.value||st.unit!==orig.weight.unit) p.weight={value:st.weight,unit:st.unit};
    if(st.reps!==orig.reps) p.reps=st.reps;
    if(!isWarm&&st.rpe!==orig.rpe) p.rpe=st.rpe;
    if(!Object.keys(p).length){ $('#dlg').close(); return; }
    append({type:'correction', target_id:orig.id, patch:p, reason:'edited in app'});
    Object.assign(slot.sets[j], p); saveSession();
    $('#dlg').close(); renderWork(); toast('Set updated');
  };
}

/* Warmup ramp toward a working weight. Percentages are convention, not
   evidence — they're a starting point you can ignore. Ramps are longer when
   readiness is low, which is the one place the readiness score earns its keep. */
/* Ramp length tracks the actual readiness score continuously, not just the
   discrete load-adjustment tier. A score of 0.50 gets a longer ramp than 0.68
   even though neither necessarily triggered a load cut — the two questions
   ("how hard should I load today" and "how long should I warm up") don't need
   the same threshold, and warming up longer costs nothing. Joint-ladder level
   3+ on this pattern also extends the ramp, on top of readiness. */
function warmupRamp(slot, workingLb){
  const ex=exById[slot.ex];
  if(!workingLb||ex.load==='bodyweight'||isStackLike(ex)) return [];
  const score = session&&session.score!=null ? session.score : 0.7;
  const jointExtend = slot.joint&&slot.joint.level>=2;
  let steps;
  if(score<0.45 || jointExtend&&score<0.65)      steps=[[0.25,8],[0.40,6],[0.55,5],[0.70,3],[0.82,2]];
  else if(score<0.65 || jointExtend)             steps=[[0.35,6],[0.55,5],[0.70,3],[0.82,2]];
  else if(score<0.85)                            steps=[[0.40,5],[0.60,4],[0.80,2]];
  else                                            steps=[[0.50,4],[0.75,2]];   // feeling great — short and sufficient
  // Light loads don't need the full ramp, but a reduced-readiness day still
  // needs to actually be longer than normal — otherwise the readiness banner
  // promises an extended warmup this override quietly doesn't deliver.
  if(workingLb<95){
    const reduced=score<0.65||jointExtend;
    // A smaller shift when keeping a 3rd rung, so it doesn't collide with
    // the 0.85 cap the way a flat +0.15 would on these particular tables.
    steps=steps.slice(-(reduced?3:2)).map(([p,r])=>[Math.min(0.85,p+(reduced?0.10:0.15)),r]);
  }
  const out=[];
  if(ex.bar) out.push({lb:ex.bar, reps:8, bar:true});
  steps.forEach(([p,r])=>{
    const lb=loadable(slot, workingLb*p);
    if(lb&&(!out.length||lb>out[out.length-1].lb)) out.push({lb,reps:r});
  });
  return out;
}

/* opts: {wide, typeable, suggested, min, max} */
function stepper(label,val,inc,onChange,unit,opts){
  opts=opts||{};
  const s=el('div','step'+(opts.wide?' wide':'')+(opts.suggested?' suggested':''));
  const dn=el('button','','−'), up=el('button','','+');
  dn.setAttribute('aria-label','Decrease '+label); up.setAttribute('aria-label','Increase '+label);
  const clamp=v=>{
    v=Math.round(v*100)/100;
    if(opts.min!=null) v=Math.max(opts.min,v);
    if(opts.max!=null) v=Math.min(opts.max,v);
    return v;
  };
  const valBox=el('div','val');
  if(opts.typeable){
    // tap the number to type an exact value — the stepper is for nudging,
    // typing is for "I know it's 227.5"
    valBox.innerHTML=`<input class="numin" id="" type="number" inputmode="decimal" step="any"
      value="${fmt(val)}" aria-label="${esc(label)}"><div class="lab">${esc(label)}${unit?' ('+unit+')':''}</div>`;
    const inp=valBox.querySelector('input');
    inp.onfocus=()=>{ try{inp.select();}catch{} };
    const commit=()=>{ const n=parseFloat(inp.value);
      if(!isNaN(n)) onChange(clamp(n)); else inp.value=fmt(val); };
    inp.onblur=commit;
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } };
  }else{
    valBox.innerHTML=`<div class="num">${fmt(val)}</div><div class="lab">${esc(label)}${unit?' ('+unit+')':''}</div>`;
  }
  s.append(dn, valBox, up);
  dn.onclick=()=>onChange(clamp(val-inc));
  up.onclick=()=>onChange(clamp(val+inc));
  return s;
}
function barSVG(sol){
  const W=520,H=70,mid=H/2; let x=150,parts='';
  if(sol) for(const p of sol.plates){
    const h=13+(p/45)*45, w=Math.max(6,5+p/6);
    parts+=`<rect x="${x}" y="${mid-h/2}" width="${w-1.5}" height="${h}" rx="2" fill="var(--steel)" opacity="${.5+(p/45)*.5}"/>`;
    x+=w;
  }
  const b=el('div','');
  b.innerHTML=`<svg class="bar" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet" aria-hidden="true">
    <rect x="8" y="${mid-3}" width="${Math.max(x+40,200)}" height="6" rx="3" fill="var(--line)"/>
    <rect x="140" y="${mid-9}" width="9" height="18" rx="2" fill="var(--dim)"/>
    ${parts}<rect x="${x+2}" y="${mid-10}" width="7" height="20" rx="2" fill="var(--dim)"/></svg>`;
  return b;
}

/* Plain-language account of how a prescribed number was reached: the block,
   where the load came from, and each adjustment that actually applied. */
const BLOCK_NAME={hyp:'hypertrophy',str:'strength',peak:'peak',deload:'deload'};
const fmtRange=r=>r[0]===r[1]?String(r[0]):r[0]+'–'+r[1];
function explainRx(slot, pr, o){
  o=o||{};
  const p=currentPhase(), bn=BLOCK_NAME[p.type]||p.type;
  const parts=[], detail=[];
  // 1. which block, and where the rep range came from
  if(slot.repSrc==='muscle'){
    const mn=(ML[slot.repMuscle]||slot.repMuscle).toLowerCase();
    parts.push(fmtRange(slot.reps)+' reps · '+mn+' default');
    detail.push('Rep range '+fmtRange(slot.reps)+' is a default for '+mn+' work, not the '+bn+" block's range. It is a judgement default (Grade D) — practical, not an evidence claim.");
  }else if(slot.repSrc==='exercise'){
    parts.push(fmtRange(slot.reps)+' reps · set for this exercise');
    detail.push('Rep range '+fmtRange(slot.reps)+" was set on this exercise, overriding the block's range.");
  }else{
    parts.push(bn+' block');
    detail.push('Rep range '+fmtRange(slot.reps)+' at RPE '+slot.rpe+' comes from the '+bn+' block'+(p.weeks?' (week '+p.week+' of '+p.weeks+')':'')+' for a '+(slot.role||'working')+' lift.');
  }
  // 2. where the number came from
  if(pr.src) parts.push(pr.src==='last session'?'from your last set':pr.src);
  else parts.push('no history yet');
  if(pr.note) detail.push(pr.note);
  // 3. readiness
  if(o.adj){
    const cut=Math.round((1-o.adj.load)*100), sc=Math.round(session.score*100);
    parts.push('readiness '+sc+' · load −'+cut+'%');
    detail.push('Readiness '+sc+' out of 100 ('+o.adj.label.toLowerCase()+'): today\'s starting loads are cut '+cut+'%'+(session.adjReason?', driven by '+session.adjReason:'')+'.');
  }
  if(session&&session.adj&&session.adj.sets&&o.idx!=null&&o.idx>=0&&o.idx<2&&o.fresh!==false){
    const n=Math.abs(session.adj.sets);
    detail.push('Readiness also removed '+n+' set'+(n>1?'s':'')+' from the first two exercises.');
  }
  if(o.fresh===false) detail.push("Based on the set you just logged, which already reflects today's readiness adjustment.");
  // 4. joint
  if(o.jointCut&&slot.joint){
    parts.push(slot.joint.joint+' flare · load −10%');
    detail.push('Your '+slot.joint.joint+' trend is flagged, so the starting load on this pattern is cut 10%.');
  }
  // 5. easing off after a pain-ended session
  if(lastEarlyPain()){
    parts.push('easing off after last session');
    detail.push('Your last session ended early with pain, so every exercise today has one set fewer.');
  }
  return {line:parts.join(' · '), detail};
}
/* One expandable line: tap for the full reasoning. */
const WHY_OPEN=new Set();
function whyEl(exp, key, cls){
  const w=el('div',cls||'why');
  const draw=()=>{
    const open=WHY_OPEN.has(key);
    w.innerHTML='<button type="button" class="whyline" aria-expanded="'+open+'">'+esc(exp.line)+' <span class="dim">'+(open?'▾':'▸')+'</span></button>'
      +(open?'<div class="whydetail">'+exp.detail.map(d=>'<div>'+esc(d)+'</div>').join('')+'</div>':'');
    w.querySelector('button').onclick=e=>{ e.stopPropagation(); if(WHY_OPEN.has(key)) WHY_OPEN.delete(key); else WHY_OPEN.add(key); draw(); };
  };
  draw(); return w;
}
/* The suggestion for a slot. Readiness and joint cuts apply only to the first
   set of an exercise: once a set is logged today, the next suggestion is priced
   from what you actually lifted, which already reflects them. Applying them
   again would compound the cut set after set. */
function suggestFor(slot){
  const pr=nextPrescription(slot);
  const o={idx:session?session.slots.indexOf(slot):null, fresh:!slot.sets.length};
  let lb=pr.lb;
  if(lb!=null&&o.fresh&&session&&session.adj){ lb=loadable(slot, lb*session.adj.load); o.adj=session.adj; }
  if(lb!=null&&o.fresh&&slot.joint&&slot.joint.level>=4){ lb=loadable(slot, lb*0.9); o.jointCut=true; }
  return {pr, lb, why:explainRx(slot,pr,o)};
}
function seedDraft(slot){
  const ex=exById[slot.ex];
  const {pr,lb,why}=suggestFor(slot);
  const fixedUnit=ex.unitPref&&ex.unitPref!=='both'?ex.unitPref:null;
  if(lb!=null){
    if(fixedUnit==='kg'){ draft.weight=Math.round(lb/LB*2)/2; draft.unit='kg'; }
    else{ draft.weight=lb; draft.unit='lb'; }
  }else{ draft.weight=isBW(ex)?0:(ex.bar||50); draft.unit=fixedUnit||CFG.units||'lb'; }
  draft.reps=pr.reps??slot.reps[0]; draft.rpe=slot.rpe; draft.group=null; draft.alt=null;
  draft.suggestedLb=lb; draft.suggestedReps=draft.reps; draft.suggested=lb!=null; draft.why=why;
}
function logSet(slot,idx,kind,extend,over){
  const ex=exById[slot.ex];
  // over: {weight,unit,reps} — a warmup rung logs its own numbers and leaves
  // the working-set draft (and its suggestion) exactly as it was
  const W=over||draft;
  const T=TECHNIQUES[draft.tech];
  let group=null, setKind=kind;
  if(kind!=='warmup'&&draft.tech!=='straight'){
    if(extend&&draft.group){
      const n=slot.sets.filter(x=>x.group&&x.group.id===draft.group).length;
      group={id:draft.group,kind:draft.tech,pos:n};
      setKind=draft.tech==='drop'?'drop':draft.tech==='myo'?'myo':'cluster';
    }else{
      const gid=ulid(); draft.group=gid;
      group={id:gid,kind:draft.tech,pos:0};
      setKind=draft.tech==='drop'?'drop':draft.tech==='myo'?'myo':'cluster';
    }
  }
  if(!session.startedAt) session.startedAt=Date.now();
  // The suggestion shown before this set was edited, if any — stamped once
  // so future sessions can tell what was suggested vs. what you actually
  // logged, without ever rewriting the event later.
  const stampSuggestion=kind!=='warmup'&&!group&&slot.sets.length===0;
  const candidate={type:'set',session_id:session.id,slot:slot.ex,exercise_id:ex.id,
    weight:{value:W.weight,unit:W.unit}, bar:ex.bar?{value:ex.bar,unit:W.unit}:null,
    reps:W.reps, rpe:kind==='warmup'?null:draft.rpe, set_kind:setKind, group,
    target:{reps:slot.reps,rpe:slot.rpe},
    suggested_lb:stampSuggestion?(draft.suggestedLb??null):null};
  // PR must be decided BEFORE the event is written, or the flag never persists
  const pr=kind==='warmup'?null:isPR(ex.id,candidate);
  if(pr) candidate.pr=true;
  const ev=append(candidate);
  if(!ev) return;
  if(kind!=='warmup') slot.sets.push(ev);
  // after a top set of a technique, pre-fill the extension
  if(group&&group.pos===0){
    draft.reps=T.repHint(draft.reps);
    if(T.loadMul!==1) draft.weight=Math.max(ex.inc,Math.round(draft.weight*T.loadMul/ex.inc)*ex.inc);
  }
  /* Suggest the next set from what THIS set actually cost you — same
     nextPrescription() the next session/exercise-open uses, since the log
     (and lastSetFor()) already reflects the set just appended above. This
     is only a pre-fill: whatever the steppers show when Log Set is tapped
     is what gets logged, exactly like every other set. */
  if(kind!=='warmup'&&!group){
    const next=suggestFor(slot);
    if(next.lb!=null){
      draft.weight = draft.unit==='kg' ? Math.round(next.lb/LB*2)/2 : next.lb;
      draft.reps=next.pr.reps; draft.suggestedLb=next.lb; draft.suggestedReps=next.pr.reps;
      draft.suggested=true; draft.alt=null; draft.why=next.why;
    }
  }
  saveSession();
  if(pr){ toast(`New best on ${ex.name} · +${fmt(pr.gain,0)} lb`); if(navigator.vibrate) navigator.vibrate(80); }
  else toast(kind==='warmup'?'Warmup logged':group?`${group.pos===0?'Top set':TECHNIQUES[draft.tech].extend} logged`:`Set ${slot.sets.length} logged`);
  if(kind!=='warmup'){
    const rest=draft.group?45:(REST_BY_ROLE[slot.role]||120);
    startRest(rest, draft.group?'Cluster rest':`Rest · ${exById[slot.ex].name}`);
  }
  advanceIfDone(slot,idx);
  renderWork();
}

/* Move to the next unfinished exercise once this one is complete. Used by both
   logging a set and skipping one, so the two can't drift apart. */
function advanceIfDone(slot,idx){
  if(draft.group) return;                       // never jump mid-cluster
  if(slot.sets.length<slot.sets_target) return;
  if(session.openIdx!==idx) return;
  const nx=session.slots.findIndex((s,j)=>j>idx&&s.sets.length<s.sets_target);
  if(nx>-1){ session.openIdx=nx; seedDraft(session.slots[nx]); }
  else session.openIdx=-1;                      // everything done — collapse
}

/* Was the last session cut short by pain? Then ease the next one. */
const EASE_OFF_DAYS=10;
function lastEarlyPain(){
  for(let i=LOG.length-1;i>=0;i--){
    const e=LOG[i];
    if(e.type!=='session_end') continue;
    if(!(e.ended_early&&e.reason==='pain')) return null;   // only the most recent counts
    // a pain stop from weeks ago says nothing about today
    return (Date.now()-new Date(e.ts) <= EASE_OFF_DAYS*864e5) ? e : null;
  }
  return null;
}

/* ═══ ROADMAP EDITOR ═══
   Phases are ordered intents. No phase stores a date — dates come from
   anchor + order + durations, so extending one block shifts everything
   downstream for free. */

function roadmapWeeks(){ return ROADMAP.reduce((a,b)=>a+blockLen(b),0); }

/* Linter: warnings only, never blocks. A linter that stops you training
   is worse than no linter. */
function lintRoadmap(){
  const w=[];
  if(!ROADMAP.length) return [{sev:'warn',msg:'No blocks yet. Add at least one.'}];
  ROADMAP.forEach((b,i)=>{
    const prev=ROADMAP[i-1];
    if(b.type==='peak'&&(!prev||prev.type!=='str'))
      w.push({sev:'warn',msg:`Block ${i+1}: peaking with no strength block before it.`});
    if(b.type==='str'&&(!prev||(prev.type!=='hyp'&&prev.type!=='deload')))
      w.push({sev:'warn',msg:`Block ${i+1}: strength with no accumulation before it.`});
    const lim={hyp:[3,7],str:[2,6],peak:[1,3],deload:[1,2]}[b.type];
    if(b.weeks<lim[0]||b.weeks>lim[1])
      w.push({sev:'info',msg:`Block ${i+1}: ${b.weeks} weeks is outside the usual ${lim[0]}–${lim[1]} for ${TYPE_NAME[b.type].toLowerCase()}.`});
    if(b.emphasis==='high'&&Math.max(...b.vol)>=20)
      w.push({sev:'warn',msg:`Block ${i+1}: high emphasis peaks at ${Math.max(...b.vol)} sets/muscle, at or past MRV for most groups.`});
    if((b.hyp||[]).length>3)
      w.push({sev:'warn',msg:`Block ${i+1}: ${b.hyp.length} priority muscles. Total volume is bounded — 3 is the cap.`});
  });
  let run=0;
  ROADMAP.forEach((b,i)=>{
    if(b.type==='deload'){ run=0; } else { run+=b.weeks; if(b.deload) run=0; }
    if(run>9){ w.push({sev:'warn',fixAt:i,msg:`${run} weeks without a deload by block ${i+1}.`}); run=0; }
  });
  if(CFG.target&&CFG.start){
    const avail=Math.round((new Date(CFG.target+'T12:00')-new Date(CFG.start+'T12:00'))/864e5/7);
    const diff=avail-roadmapWeeks();
    if(Math.abs(diff)>1) w.push({sev:'info',
      msg:`Blocks total ${roadmapWeeks()} weeks but there are ${avail} to your target — ${diff>0?diff+' spare':Math.abs(diff)+' over'}.`});
  }
  return w;
}

/* Extending is additive and safe, so it happens automatically. Trimming
   deletes blocks you configured, so that stays a deliberate tap. */
function fillToTarget(draft, startDate, targetDate){
  if(!startDate||!targetDate) return 0;
  const avail=Math.round((new Date(targetDate+'T12:00')-new Date(startDate+'T12:00'))/864e5/7);
  let have=draft.reduce((a,b)=>a+blockLen(b),0), added=0, guard=0;
  while(avail-have>=4 && guard++<40){
    const last=draft[draft.length-1];
    const next=(!last||last.type==='str')?'hyp':'str';
    const weeks=next==='hyp'?5:4;
    if(avail-have < weeks+1) break;
    draft.push(applyShape({type:next,label:TYPE_NAME[next],weeks,hyp:[],deload:true}));
    have+=weeks+1; added++;
  }
  // if a peaking block fits in what's left, finish on one
  if(avail-have>=2 && avail-have<=4 && draft.length && draft[draft.length-1].type!=='peak'){
    draft.push(applyShape({type:'peak',label:'Peaking',weeks:Math.min(3,avail-have),hyp:[],deload:false}));
    added++;
  }
  return added;
}

/* ═══ PROGRESS ═══ */
function sparkline(series, color){
  if(series.length<2) return null;
  const W=600,H=90,pad=6;
  const vs=series.map(p=>p.v), min=Math.min(...vs), max=Math.max(...vs);
  const span=(max-min)||1;
  const pts=series.map((p,i)=>[
    pad+(i/(series.length-1))*(W-pad*2),
    pad+(1-(p.v-min)/span)*(H-pad*2)
  ]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`;
  const box=el('div','');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:90px;display:block" aria-hidden="true">
    <path d="${area}" fill="${color}" opacity=".13"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="4" fill="${color}"/>
  </svg>`;
  return box;
}

function openSessionDetail(endEv){
  const ss=sets().filter(s=>s.session_id===endEv.session_id);
  const byEx={};
  ss.forEach(s=>{ (byEx[s.exercise_id]=byEx[s.exercise_id]||[]).push(s); });
  const tonnage=ss.filter(x=>x.set_kind!=='warmup')
    .reduce((a,x)=>a+(toLb(x.weight)||0)*(x.reps||0),0);
  const dur=endEv.duration_s?`${Math.round(endEv.duration_s/60)} min`:null;
  let html=`<h2 style="font-size:21px;margin-bottom:2px">${esc(endEv.day_name||'Session')}</h2>
    <div class="muted tiny" style="margin-bottom:6px">${new Date(endEv.ts).toLocaleString(undefined,{weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>
    <div class="row" style="gap:14px;margin-bottom:14px;flex-wrap:wrap">
      ${endEv.session_rpe?`<span class="sm"><span class="dim">RPE</span> <b>${endEv.session_rpe}</b></span>`:''}
      ${dur?`<span class="sm"><span class="dim">Time</span> <b>${dur}</b></span>`:''}
      ${tonnage?`<span class="sm"><span class="dim">Tonnage</span> <b>${Math.round(tonnage).toLocaleString()} lb</b></span>`:''}
      ${endEv.ended_early?`<span class="sm" style="color:var(--str)">ended early · ${esc(endEv.reason)}</span>`:''}
    </div>`;
  Object.entries(byEx).forEach(([id,list])=>{
    const ex=exById[id];
    html+=`<div class="qblock"><div class="qlab" style="margin-bottom:7px">${esc(ex?ex.name:id)}</div>`;
    list.forEach((s,i)=>{
      const est=e1rm(toLb(s.weight),s.reps);
      html+=`<div class="row between sm" style="padding:3px 0">
        <span class="muted">${s.set_kind==='warmup'?'warmup':s.group&&s.group.pos>0?TECHNIQUES[s.group.kind].extend:'set '+(i+1)}</span>
        <span>${fmt(s.weight.value)} ${s.weight.unit} × ${s.reps}${s.rpe?` @ ${s.rpe}`:''}${est&&s.set_kind!=='warmup'?` · ${fmt(est,0)}`:''}</span></div>`;
    });
    html+=`</div>`;
  });
  if(!ss.length) html+=`<div class="empty">No sets recorded for this session.</div>`;
  html+=`<button class="btn ghost wide" id="sdclose">Close</button>`;
  sheet(html);
  $('#sdclose').onclick=()=>$('#dlg').close();
}

/* Settings are edited in a module-level draft that OUTLIVES a single call to
   openSettings(). Without this, navigating into the goal-lift picker and back
   used to reset every in-progress edit — and worse, the picker rebuilt the
   dialog's HTML from a raw string snapshot, which orphaned the settings
   screen's own DOM node so later edits landed on a detached element the user
   could no longer see. That was the "goal lifts never change" bug. Now the
   picker is just another screen over the same persistent draft, and Save or
   Cancel is what clears it. */
let SETTINGS_DRAFT=null;
/* First-run setup. Every step is skippable and everything it sets is
   changeable later in Edit program — the goal is a usable program in about a
   minute, not an interrogation. Runs once; CFG.onboarded gates it. */
let ONB=null;
function needsOnboarding(){ return !CFG.onboarded && !LOG.some(e=>e.type==='set'); }
function openOnboarding(step){
  if(!ONB) ONB={units:CFG.units||'lb', split:CFG.split||'full5',
    goals:[...(CFG.goals||[])], weeks:16, conds:[...(CFG.conditions||[])]};
  const O=ONB, N=5;
  step=step==null?0:step;

  const shell=(title,sub,bodyId,backStep,nextLabel,onNext,skipStep)=>{
    sheet(`<div class="dim tiny" style="margin-bottom:8px">Step ${step+1} of ${N}</div>
      <h2 style="font-size:22px;margin-bottom:3px">${esc(title)}</h2>
      <div class="muted tiny" style="margin-bottom:15px">${esc(sub)}</div>
      <div id="${bodyId}"></div>
      <div class="row" style="gap:8px;margin-top:4px">
        ${backStep!=null?'<button class="btn ghost grow" id="obBack">Back</button>':''}
        <button class="btn pri grow" id="obNext">${esc(nextLabel)}</button>
      </div>
      ${skipStep!=null?'<button class="btn ghost wide" id="obSkip" style="margin-top:8px">Skip this</button>':''}`);
    if(backStep!=null) $('#obBack').onclick=()=>openOnboarding(backStep);
    $('#obNext').onclick=onNext;
    if(skipStep!=null) $('#obSkip').onclick=()=>openOnboarding(skipStep);
  };
  const chips=(host,opts,isOn,onPick)=>{
    const c=el('div','chips');
    opts.forEach(o=>{ const b=el('button','chip',esc(o.label));
      b.style.cssText='font-size:13px;padding:7px 12px';
      b.setAttribute('aria-pressed',isOn(o)?'true':'false');
      b.onclick=()=>onPick(o); c.appendChild(b); });
    host.appendChild(c);
  };

  if(step===0){
    shell('Welcome','This builds and adapts a training program from what you actually log. About a minute to set up.',
      'ob0',null,'Get started',()=>openOnboarding(1));
    $('#ob0').innerHTML=`<div class="qblock">
      <div class="muted sm" style="line-height:1.55">
        Your data stays on this device. Nothing is sent anywhere unless you set up a backup.<br><br>
        Everything here can be changed later — nothing you pick now is permanent.
      </div></div>`;
    return;
  }

  if(step===1){
    shell('Units','Which do you think in? You can switch per-set later too.',
      'ob1',0,'Next',()=>openOnboarding(2));
    chips($('#ob1'),[{label:'Pounds (lb)',v:'lb'},{label:'Kilograms (kg)',v:'kg'}],
      o=>O.units===o.v,o=>{O.units=o.v;openOnboarding(1);});
    return;
  }

  if(step===2){
    shell('How do you train?','Sessions are generated from this shape.',
      'ob2',1,'Next',()=>openOnboarding(3));
    chips($('#ob2'),Object.entries(SPLITS).map(([k,v])=>({label:`${v.name} · ${v.days} days`,v:k})),
      o=>O.split===o.v,o=>{O.split=o.v;openOnboarding(2);});
    return;
  }

  if(step===3){
    shell('Pick up to three lifts to build around',
      'These get priority in every session. Skip if you just want general training.',
      'ob3',2,'Next',()=>openOnboarding(4),4);
    const host=$('#ob3');
    O.goals.forEach((g,i)=>{
      const ex=exById[g]; const r=el('div','row between sm');
      r.style.cssText='padding:9px 0;border-top:1px solid var(--line)';
      r.innerHTML=`<span><span class="sidx done" style="width:22px;height:22px;font-size:11px">${i+1}</span>
        <span style="margin-left:9px">${esc(ex?ex.name:g)}</span></span>`;
      const x=el('button','iconbtn','✕'); x.style.color='var(--skip)';
      x.onclick=()=>{ O.goals.splice(i,1); openOnboarding(3); };
      r.appendChild(x); host.appendChild(r);
    });
    if(O.goals.length<3){
      const add=el('button','btn wide','Add a lift'); add.style.marginTop='11px';
      add.onclick=()=>exPicker('Pick a lift to build around',
        e=>!O.goals.includes(e.id), e=>{ O.goals.push(e.id); openOnboarding(3); });
      host.appendChild(add);
    }
    return;
  }

  if(step===4){
    shell('Anything you\u2019re working around?',
      'Flags exercises that load an at-risk position. It only ever warns, never blocks.',
      'ob4',3,'Build my program',()=>{
        const t=new Date(); t.setDate(t.getDate()+O.weeks*7);
        CFG.units=O.units; CFG.split=O.split; CFG.goals=O.goals; CFG.conditions=O.conds;
        CFG.start=new Date().toISOString().slice(0,10);
        CFG.target=t.toISOString().slice(0,10);
        ROADMAP=[applyShape({type:'hyp',label:'Hypertrophy',weeks:5,hyp:[],deload:true,
          lead:O.goals[0]||null,emphasis:'moderate'})];
        fillToTarget(ROADMAP,CFG.start,CFG.target);
        CFG.roadmap=ROADMAP; CFG.onboarded=true; saveCfg();
        ONB=null; $('#dlg').close(); TAB='dash'; render();
        setTimeout(()=>toast('Program ready'),400);
      });
    const host=$('#ob4');
    chips(host,Object.entries(CONDITIONS).map(([k,v])=>({label:v.name,v:k})),
      o=>O.conds.includes(o.v),
      o=>{ O.conds=O.conds.includes(o.v)?O.conds.filter(x=>x!==o.v):O.conds.concat(o.v); openOnboarding(4); });
    host.appendChild(el('div','anchor','Leave blank if nothing applies.'));
    return;
  }
}

/* Wipe everything back to a true first-run state. For testing the new-user
   flow, and for handing the app to someone else on a shared device. */
function resetToFresh(){
  [LS_KEY,LS_CFG,LS_SESS,LS_PEND,LS_REST,LS_WEEK,'trainlog.lastExport','trainlog.lastSync']
    .forEach(k=>{ try{ localStorage.removeItem(k); }catch{} });
  location.reload();
}

function openSettings(){
  if(!SETTINGS_DRAFT){
    SETTINGS_DRAFT={
      draft: ROADMAP.map(b=>({...b,hyp:[...(b.hyp||[])]})),
      goals: [...(CFG.goals||[])],
      tgt: CFG.target, srt: CFG.start,
      split: CFG.split||'full5', syncUrl: CFG.syncUrl||'',
      energy: CFG.energy||'maintenance', conds: [...(CFG.conditions||[])]
    };
  }
  const S=SETTINGS_DRAFT;

  sheet(`<h2 style="font-size:22px;margin-bottom:3px">Your program</h2>
    <div class="muted tiny" style="margin-bottom:15px">Blocks are an order, not dates. Change a length and everything after it shifts.</div>
    <div id="rm"></div>
    <button class="btn pri wide" id="rmsave" style="margin-top:4px">Save program</button>
    <button class="btn ghost wide" id="rmclose" style="margin-top:8px">Cancel</button>`);

  const host=$('#rm');
  const draw=()=>{
    host.innerHTML='';

    const dates=el('div','qblock');
    const availW = (S.tgt&&S.srt) ? Math.round((new Date(S.tgt+'T12:00')-new Date(S.srt+'T12:00'))/864e5/7) : null;
    const haveW  = S.draft.reduce((a,b)=>a+blockLen(b),0);
    dates.innerHTML=`<div class="qlab">Dates</div>
      <div class="field">Target</div><input type="date" id="td" value="${S.tgt||''}">
      <div class="field" style="margin-top:10px">Start</div><input type="date" id="sd" value="${S.srt||''}">
      <div class="anchor">${availW!=null?`${haveW} weeks of blocks against ${availW} weeks available`:'Set both dates to size your blocks'}</div>`;
    host.appendChild(dates);
    $('#td').onchange=e=>{
      S.tgt=e.target.value;
      const n=fillToTarget(S.draft,S.srt,S.tgt);
      if(n) toast(`Added ${n} block${n>1?'s':''} to reach that date`);
      draw();
    };
    $('#sd').onchange=e=>{S.srt=e.target.value;draw();};
    if(availW!=null&&haveW-availW>1){
      const trim=el('button','btn s',`Trim ${haveW-availW} weeks to fit`);
      trim.style.marginTop='9px';
      trim.onclick=()=>{
        let over=haveW-availW;
        while(over>0&&S.draft.length>1){
          const last=S.draft[S.draft.length-1];
          if(last.weeks>1){ last.weeks--; applyShape(last); over--; }
          else { over-=blockLen(last); S.draft.pop(); }
        }
        draw();
      };
      dates.appendChild(trim);
    }

    const sp0=el('div','qblock');
    sp0.innerHTML=`<div class="qlab">Split</div>
      <div class="field">Sessions are built from this shape. Changing it does not touch your logged history.</div>`;
    const spc0=el('div','chips');
    Object.entries(SPLITS).forEach(([k,vv])=>{
      const c=el('button','chip',`${esc(vv.name)} · ${vv.days}d`);
      c.setAttribute('aria-pressed',S.split===k?'true':'false');
      c.onclick=()=>{S.split=k;draw();};
      spc0.appendChild(c);
    });
    sp0.appendChild(spc0); host.appendChild(sp0);

    const gl=el('div','qblock');
    gl.innerHTML=`<div class="qlab">Goal lifts, ranked</div>
      <div class="field">Only the first holds primary status in any block. Rotate it across blocks rather than chasing all three.</div>`;
    S.goals.forEach((g,i)=>{
      const ex=exById[g], r=el('div','row between sm');
      r.style.cssText='padding:8px 0;border-top:1px solid var(--line)';
      r.innerHTML=`<span><span class="sidx done" style="width:22px;height:22px;font-size:11px">${i+1}</span>
        <span style="margin-left:9px">${esc(ex?ex.name:g)}</span></span>`;
      const btns=el('span','row'); btns.style.gap='4px';
      if(i>0){ const u=el('button','iconbtn','↑');
        u.onclick=()=>{[S.goals[i-1],S.goals[i]]=[S.goals[i],S.goals[i-1]];draw();}; btns.appendChild(u); }
      const c=el('button','iconbtn','⇄');
      c.setAttribute('aria-label','Change lift');
      c.onclick=()=>exPicker('Pick a goal lift', e=>e.id!==g, e=>{ S.goals[i]=e.id; openSettings(); });
      btns.appendChild(c); r.appendChild(btns); gl.appendChild(r);
    });
    host.appendChild(gl);

    const bl=el('div','qblock');

        if(on) c.style.cssText+=`;background:${TYPE_COLOR[t]};border-color:${TYPE_COLOR[t]};color:#fff;font-weight:600`;

      });
      const move=el('div','row'); move.style.gap='4px';

      <div class="field">Paste the Google Apps Script URL from the setup guide. Every finished session then writes your whole log to that sheet.</div>
      <input type="text" id="syncu" value="${esc(S.syncUrl)}" placeholder="https://script.google.com/macros/s/..."
        style="width:100%;background:var(--card-2);border:none;border-radius:9px;color:var(--ink);padding:11px;font:inherit;font-size:13px">
      <div class="anchor">Leave blank to back up manually instead.</div>`;
    host.appendChild(sy);
    $('#syncu').onchange=e=>{S.syncUrl=e.target.value.trim();};
    if(S.syncUrl){
      const tb=el('button','btn s','Test it now'); tb.style.marginTop='9px';
      tb.onclick=()=>{ CFG.syncUrl=$('#syncu').value.trim(); saveCfg();
        syncNow(false).then(()=>toast('Sent — check your sheet')); };
      sy.appendChild(tb);
    }

    // Linting is done against a COPY, never the live global — a throw inside
    // the linter must never leave ROADMAP pointed at an in-progress edit.
    let issues=[];
    try{
      const saved=ROADMAP;
      try{ ROADMAP=S.draft; issues=lintRoadmap(); }
      finally{ ROADMAP=saved; }
    }catch(err){ console.error('lint failed', err); issues=[]; }
    if(issues.length){
      const lc=el('div','qblock');
      lc.style.cssText='background:rgba(232,163,61,.08);border-left:3px solid var(--str)';
      lc.innerHTML='<div class="qlab" style="color:var(--str)">Worth a look</div>';
      issues.forEach(x=>{
        const line=el('div','muted tiny'); line.style.marginBottom='6px';
        line.textContent=(x.sev==='warn'?'• ':'· ')+x.msg;
        lc.appendChild(line);
        if(x.fixAt!=null){
          const f=el('button','btn s','Add a deload to that block');
          f.style.cssText='margin:2px 0 9px';
          f.onclick=()=>{ S.draft[x.fixAt].deload=true; applyShape(S.draft[x.fixAt]); draw(); };
          lc.appendChild(f);
        }
      });
      lc.appendChild(el('div','dim tiny','These are notes, not rules. Save anyway if you have a reason.'))
        .style.marginTop='7px';
      host.appendChild(lc);
    }
  };
  draw();

  $('#rmclose').onclick=()=>{ SETTINGS_DRAFT=null; $('#dlg').close(); };
  $('#rmsave').onclick=()=>{
    S.draft.forEach(b=>b.label=TYPE_NAME[b.type]);
    CFG.roadmap=S.draft; CFG.goals=S.goals; CFG.target=S.tgt; CFG.start=S.srt;
    CFG.split=S.split; CFG.syncUrl=S.syncUrl; CFG.energy=S.energy; CFG.conditions=S.conds;
    ROADMAP=S.draft; saveCfg(); SETTINGS_DRAFT=null;
    $('#dlg').close(); render(); toast('Program saved');
  };
}

/* iOS and other browsers may evict script-writable storage. Asking for
   persistence is the only in-browser mitigation; regular exports are the
   real one. */
async function requestPersistence(){
  try{
    if(!navigator.storage||!navigator.storage.persist) return null;
    if(await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  }catch{ return null; }
}
async function storageInfo(){
  const out={persisted:null, usage:null, quota:null,
             logBytes:(localStorage.getItem(LS_KEY)||'').length};
  try{
    if(navigator.storage){
      if(navigator.storage.persisted) out.persisted=await navigator.storage.persisted();
      if(navigator.storage.estimate){ const e=await navigator.storage.estimate();
        out.usage=e.usage; out.quota=e.quota; }
    }
  }catch{}
  return out;
}
const sessionsSinceExport=()=>{
  const last=Number(localStorage.getItem('trainlog.lastExport')||0);
  return LOG.filter(e=>e.type==='session_end'&&new Date(e.ts).getTime()>last).length;
};

/* A backup is the log PLUS the program. Exporting sets alone would restore
   your history but lose your roadmap, goals and split. */
function backupText(){
  const header=JSON.stringify({v:SCHEMA_V,type:'config_snapshot',
    app_version:APP_VERSION, exported_at:new Date().toISOString(), cfg:CFG});
  return [header, ...LOG.map(e=>JSON.stringify(e))].join('\n');
}
function exportLog(){
  const blob=new Blob([backupText()],{type:'application/x-ndjson'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`trainlog-backup-${new Date().toISOString().slice(0,10)}.jsonl`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  localStorage.setItem('trainlog.lastExport', String(Date.now()));
  toast('Backup downloaded'); render();
}

/* ── Automatic off-device backup ──────────────────────────────────────
   Posts the whole backup to a Google Apps Script web app, which writes it
   into a Sheet. Sending everything each time makes it idempotent and
   self-healing: a missed sync repairs itself on the next one.

   The browser sends this no-cors, so the response can't be read and delivery
   can't be confirmed from here. Check the Sheet occasionally. */
async function syncNow(silent){
  const url=(CFG.syncUrl||'').trim();
  if(!url){ if(!silent) toast('No sync URL set'); return false; }
  try{
    await fetch(url,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body:backupText()});
    localStorage.setItem('trainlog.lastSync', String(Date.now()));
    if(!silent) toast('Sent to your sheet');
    return true;
  }catch(e){ if(!silent) toast('Sync failed — check the URL'); return false; }
}
const lastSyncAt=()=>Number(localStorage.getItem('trainlog.lastSync')||0);

/* One tap into iCloud Drive rather than a download that lands in Downloads.
   Falls back to a normal download where sharing files isn't supported. */
async function shareBackup(){
  const name=`trainlog-backup-${new Date().toISOString().slice(0,10)}.jsonl`;
  try{
    const file=new File([backupText()],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Trainlog backup'});
      localStorage.setItem('trainlog.lastExport',String(Date.now()));
      render(); return;
    }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  exportLog();
}

/* Import MERGES by event id — importing the same file twice is harmless,
   and importing an older backup never deletes newer events. */
function importBackup(text){
  const lines=text.split('\n').filter(Boolean);
  let cfgIn=null; const incoming=[];
  for(const l of lines){
    let o; try{ o=JSON.parse(l); }catch{ continue; }
    if(o.type==='config_snapshot'){ cfgIn=o.cfg; continue; }
    incoming.push(o);
  }
  const have=new Set(LOG.map(e=>e.id||JSON.stringify(e)));
  const added=incoming.filter(e=>!have.has(e.id||JSON.stringify(e)));
  if(!added.length&&!cfgIn) return {added:0,cfg:false};
  const merged=[...LOG,...added].sort((a,b)=>(a.ts||'')<(b.ts||'')?-1:1);
  try{ localStorage.setItem(LS_KEY, merged.map(e=>JSON.stringify(e)).join('\n')); }
  catch{ alert('Not enough space to import that backup.'); return {added:0,cfg:false}; }
  LOG=merged;
  return {added:added.length, cfg:!!cfgIn, cfgData:cfgIn};
}

/* Shared tail end of both restore paths (file + sheet): offer to restore the
   program config, then report what changed. */
function finishImport(res){
  if(res.cfg&&confirm('This backup contains a program (roadmap, goals, split). Restore it too?\n\nYour current program will be replaced.')){
    CFG={...CFG,...res.cfgData}; ROADMAP=(CFG.roadmap&&CFG.roadmap.length)?CFG.roadmap:ROADMAP;
    ROADMAP.forEach(b=>{ if(!b.vol||!b.vol.length) applyShape(b); });
    mergeCustom();
    applySetupLink(); saveCfg();
  }
  render();
  alert(res.added?`Restored ${res.added} new event${res.added>1?'s':''}.`:'Nothing new in that backup — your log already had everything in it.');
}

/* Fetches a script.google.com exec URL via JSONP. A plain cross-origin fetch()
   can't read the response body from these URLs, but a <script> tag isn't
   subject to CORS at all, so this works regardless. */
function jsonpFetch(url){
  return new Promise((resolve,reject)=>{
    const cb='trainlogJsonp'+Date.now()+Math.floor(Math.random()*1e6);
    const script=document.createElement('script');
    let done=false;
    const cleanup=()=>{ delete window[cb]; script.remove(); clearTimeout(timer); };
    const timer=setTimeout(()=>{ if(done) return; done=true; cleanup(); reject(new Error('timeout')); },15000);
    window[cb]=data=>{ if(done) return; done=true; cleanup(); resolve(data); };
    script.onerror=()=>{ if(done) return; done=true; cleanup(); reject(new Error('network')); };
    script.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.head.appendChild(script);
  });
}

/* Recovery path for when local data is gone: pulls the Raw backup tab
   straight from the sheet instead of requiring a manual copy-paste into a
   .jsonl file. Feeds the same importBackup() merge used by the file restore
   — no separate import/merge logic. */
async function restoreFromSheet(){
  const url=(CFG.syncUrl||'').trim();
  if(!url) return;
  if(session&&!confirm('You have a session in progress. Restoring now will replace your log underneath it.\n\nFinish or end that session first. Continue anyway?')) return;
  let text;
  try{ text=await jsonpFetch(url+'?action=fetch'); }
  catch(e){ alert('Could not reach your sheet — check your connection. Your local log was not modified.'); return; }
  if(typeof text!=='string'||!text.trim()){ alert('No backup found on the sheet yet. Your local log was not modified.'); return; }
  const lines=text.split('\n').filter(Boolean);
  const parseable=lines.filter(l=>{ try{ JSON.parse(l); return true; }catch{ return false; } });
  if(!parseable.length){ alert('That backup looked malformed and could not be read. Your local log was not modified.'); return; }
  const res=importBackup(text);
  finishImport(res);
}

/* Self-update. A new build on the host is noticed on launch and hourly, but
   never installs itself mid-session — you tap when you're ready. */
let waitingSW=null;
function showUpdate(reg){
  waitingSW=reg.waiting||reg.installing;
  $('#upd').classList.add('on');
}
$('#updgo').onclick=()=>{
  if(session&&!confirm('You have a session in progress. Sets you logged are already saved, but updating will reload the app.\n\nUpdate now?')) return;
  $('#upd').classList.remove('on');
  if(waitingSW) waitingSW.postMessage({type:'SKIP_WAITING'});
  else location.reload();
};
$('#updno').onclick=()=>$('#upd').classList.remove('on');

function initUpdates(){
  if(!('serviceWorker' in navigator)||!location.protocol.startsWith('http')) return;
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller) showUpdate(reg);
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing; if(!nw) return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller) showUpdate(reg);
      });
    });
    // check on launch, when you come back to the app, and hourly
    const check=()=>reg.update().catch(()=>{});
    check();
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) check(); });
    setInterval(check, 3600e3);
  }).catch(()=>{});
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading) return; reloading=true; location.reload();
  });
}

function sheet(html){
  try{
    $('#dlgBody').innerHTML=html;
    const d=$('#dlg'); if(!d.open) d.showModal();
  }catch(err){
    console.error('sheet failed', err);
    $('#dlgBody').innerHTML=`<div style="text-align:center;padding:10px">
      <div style="font-weight:650;margin-bottom:10px">This popup hit a problem</div>
      <button class="btn pri wide" id="dlgRecover">Close</button></div>`;
    const rb=document.getElementById('dlgRecover');
    if(rb) rb.onclick=()=>{ try{$('#dlg').close();}catch{} };
  }
}
/* Short beep via WebAudio — no audio file needed, works offline, and iOS
   allows it here because it fires from code already running inside a user
   gesture chain (the tap that started the rest timer). */
let _actx=null;
function beep(){
  try{
    _actx = _actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=_actx.createOscillator(), g=_actx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,_actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,_actx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,_actx.currentTime+0.35);
    o.connect(g); g.connect(_actx.destination);
    o.start(); o.stop(_actx.currentTime+0.36);
  }catch{}
}
/* rest timer */
const REST_BY_ROLE={primary:180, secondary:120, accessory:90};
const LS_REST='trainlog.rest.v1';
const LS_PEND='trainlog.pending.v1';
const LS_WEEK='trainlog.weekedits.v1';
/* Wall-clock based, not a tick counter. iOS throttles setInterval when the
   screen locks — which is exactly when you're resting — so the remaining
   time is always derived from an end timestamp instead of counted down. */
let rest={endsAt:0,total:0,label:'',fired:false}, restIv=null, restHide=null;
function saveRest(){ try{ rest.endsAt?localStorage.setItem(LS_REST,JSON.stringify(rest))
  :localStorage.removeItem(LS_REST); }catch{} }
function startRest(sec,label){
  rest={endsAt:Date.now()+sec*1000, total:sec, label:label||'Rest', fired:false};
  saveRest(); showRest();
}
function showRest(){
  $('#restl').textContent=rest.label;
  $('#rest').classList.add('on');
  document.body.classList.add('resting');
  clearInterval(restIv); tickRest();
  restIv=setInterval(tickRest,250);
}
function restLeftSec(){ return Math.max(0, Math.round((rest.endsAt-Date.now())/1000)); }
function tickRest(){
  const left=restLeftSec();
  const m=Math.floor(left/60), ss=left%60;
  $('#restt').textContent=`${m}:${String(ss).padStart(2,'0')}`;
  $('#restbar').style.width=(rest.total?100-left/rest.total*100:100)+'%';
  if(left<=0&&!rest.fired){
    rest.fired=true;
    toast('Rest done'); beep(); if(navigator.vibrate) navigator.vibrate([120,60,120]);
    clearTimeout(restHide); restHide=setTimeout(stopRest,1200);
  }
}
function stopRest(){ clearInterval(restIv); restIv=null; clearTimeout(restHide); restHide=null;
  document.body.classList.remove('resting'); rest={endsAt:0,total:0,label:'',fired:false};
  saveRest(); $('#rest').classList.remove('on'); }
function restoreRest(){
  try{ const r=JSON.parse(localStorage.getItem(LS_REST)||'null');
    if(r&&r.endsAt>Date.now()){ rest=r; showRest(); } else localStorage.removeItem(LS_REST);
  }catch{}
}
$('#rest30').onclick=()=>{ clearTimeout(restHide); restHide=null;
  rest.endsAt=Math.max(rest.endsAt,Date.now())+30000; rest.total+=30; rest.fired=false; saveRest(); tickRest(); };
$('#restx').onclick=stopRest;
// resync the moment the screen comes back
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  try{ if(rest.endsAt) tickRest(); }catch(err){ console.error('tick resync failed',err); }
  try{ render(); }catch(err){ console.error('resync render failed',err); }
});

let tT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('on'),1500); }

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();});
$('#noteBtn').onclick=()=>openNote();
$('#skipTop').onclick=()=>openAbandon();

/* Two genuinely different intentions, so they're two options rather than one
   ambiguous button:
     Leave  — walk away, keep what you logged (it happened, it counts)
     Cancel — this session was a mistake, void the sets too                */
function openAbandon(){
  const n=session?session.slots.reduce((a,x)=>a+x.sets.length,0):0;
  sheet(`<h2 style="font-size:21px;margin-bottom:3px">Leave this workout?</h2>
    <div class="muted tiny" style="margin-bottom:15px">${n} set${n===1?'':'s'} logged so far.</div>
    <div class="stack" id="ab"></div>
    <button class="btn ghost wide" id="abback" style="margin-top:10px">Keep training</button>`);
  const mk=(title,desc,fn,danger)=>{
    const b=el('button','btn wide'); b.style.cssText='text-align:left';
    b.innerHTML=`<div${danger?' style="color:var(--skip)"':''}>${esc(title)}</div>
      <div class="dim tiny" style="font-weight:400;margin-top:2px">${esc(desc)}</div>`;
    b.onclick=fn; $('#ab').appendChild(b);
  };
  mk('Leave and keep my sets','Ends the session. Everything you logged stays in your history.',()=>{
    $('#dlg').close(); openEndEarly();
  });
  mk('Cancel the whole workout','Voids the '+n+' set'+(n===1?'':'s')+' logged in this session. Use this if you started it by mistake.',()=>{
    if(!confirm('Cancel this workout and void '+n+' logged set'+(n===1?'':'s')+'?\n\nThey stay in the log as voided entries and stop counting toward anything.')) return;
    session.slots.forEach(sl=>sl.sets.forEach(x=>
      append({type:'correction',target_id:x.id,patch:null,reason:'workout cancelled'})));
    append({type:'session_end',session_id:session.id,day_name:session.dayName,
      session_rpe:null,cancelled:true,sets_done:0,sets_planned:session.slots.reduce((a,x)=>a+x.sets_target,0)});
    session=null; saveSession(); stopRest(); $('#dlg').close(); TAB='dash'; render();
    toast('Workout cancelled');
  },true);
  $('#abback').onclick=()=>$('#dlg').close();
}
$('#dlg').addEventListener('cancel',e=>e.preventDefault());
$('#fileIn').onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    if(session&&!confirm('You have a session in progress. Restoring now will replace your log underneath it.\n\nFinish or end that session first. Continue anyway?')){ return; }
    const res=importBackup(String(r.result));
    finishImport(res);
  };
  r.onerror=()=>alert('Could not read that file.');
  r.readAsText(f); e.target.value='';
};

loadAll(); loadPending(); loadWeekEdits(); restoreSession();
if(session&&session.slots&&session.slots[session.openIdx]) seedDraft(session.slots[session.openIdx]);
restoreRest(); render(); initUpdates();
if(needsOnboarding()) setTimeout(()=>openOnboarding(0),250);
requestPersistence();
</script>
